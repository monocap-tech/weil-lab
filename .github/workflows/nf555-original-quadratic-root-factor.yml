name: NF555 original squared-frequency quadratic root factor and source compiler chain

on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaOriginalJ242QuadraticRootFactor.lean"
      - "WeilDefect/Arithmetic/ActualZetaOriginalJ242WeightedCollarGram.lean"
      - "scripts/local_replay/verify_nf555_original_quadratic_root_factorization.py"
      - ".github/workflows/nf555-original-quadratic-root-factor.yml"
      - "lakefile.toml"
      - "lean-toolchain"
  workflow_dispatch:

jobs:
  nf555-symbolic-actual-source-quadratic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact auditor syntax
        run: python3 -m py_compile scripts/local_replay/verify_nf555_original_quadratic_root_factorization.py
      - name: Replay all 67 original oscillator polynomial identities in Q[X,pi]
        run: |
          python3 scripts/local_replay/verify_nf555_original_quadratic_root_factorization.py \
            --output nf555_original_symbolic_quadratic_67_source_receipt.json
      - name: Preserve exact source receipt
        uses: actions/upload-artifact@v4
        with:
          name: nf555-original-67-symbolic-quadratic-source
          path: nf555_original_symbolic_quadratic_67_source_receipt.json
          if-no-files-found: error

  nf555-standalone-quadratic-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        run: lake update
      - name: Restore pinned Mathlib archive
        run: lake exe cache get
      - name: Compile genuine quadratic source node polynomial factorization and cofactor
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalJ242QuadraticRootFactor
      - name: Compile inherited Hermite degree and root multiplicity Lean
        run: |
          lake build WeilDefect.Arithmetic.ActualZetaOriginalJ242HermiteDegreeObstruction
          lake build WeilDefect.Arithmetic.ActualZetaOriginalJ242HermiteDerivativeMultiplicity
      - name: Reject proof holes in actual quadratic candidate
        run: |
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)\b' \
              WeilDefect/Arithmetic/ActualZetaOriginalJ242QuadraticRootFactor.lean; then
            echo "NF555 quadratic root factor proof not closed"
            exit 1
          fi

  nf555-genuine-source-compiler-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        run: lake update
      - name: Restore pinned Mathlib archive
        run: lake exe cache get
      - name: Compile genuine original NF546 full-window physical L2 moments
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalJ242PhysicalMomentMap
      - name: Compile real-to-complex smoothness NF547 repaired source
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalJ242WeightedCollarGram
      - name: Compile genuine original NF548 even cutoff
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalCanonicalEvenCollarCutoff
      - name: Compile NF549 original physical integral
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalCanonicalGramPhysicalIntegral
      - name: Compile NF550 original canonical Gram source gate
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalCanonicalGramSeparationGate
      - name: Compile NF551 original odd parity and analytic local-global identity
        run: |
          lake build WeilDefect.Arithmetic.ActualZetaOriginalJ242OddParity
          lake build WeilDefect.Arithmetic.ActualZetaOriginalJ242AnalyticIdentity
