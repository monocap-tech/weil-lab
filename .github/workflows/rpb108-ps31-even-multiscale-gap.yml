name: RPB108 PS31 original even reflected multiscale graph gap

on:
  pull_request:
    paths:
      - "notes/RPB108_PS31_EVEN_MULTISCALE_GAP_20261018.md"
      - "scripts/validate_rpb108_ps31_even_multiscale_gap.py"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps31-even-multiscale-gap.yml"
  workflow_dispatch:

jobs:
  ps31-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PS31 exact Fraction original-source replay and parity exponential/graph gate
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps31_even_multiscale_gap.py
          python3 scripts/validate_rpb108_ps31_even_multiscale_gap.py
      - name: Keep canonical W-ODD-NEG and physical PS positivity obligations OPEN
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert p["checkpoints"][-1]["id"]=="PS31"
          assert all(flag is False for flag in p["closures"].values())
          PY
