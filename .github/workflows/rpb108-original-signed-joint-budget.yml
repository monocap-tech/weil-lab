name: Original joint signed precision tail and physical frame budget

on:
  push:
    paths:
      - scripts/verify_rpb108_original_signed_frequency_kernel.py
      - scripts/verify_rpb108_original_signed_critical_mixed_block.py
      - scripts/verify_rpb108_original_signed_joint_frame_budget.py
      - scripts/verify_rpb108_original_signed_joint_frame_budget_replay.py
      - .github/workflows/rpb108-original-signed-joint-budget.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bounded-joint-signed-frame-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged open obligation
        run: python scripts/verify_obligation_manifest.py
      - name: Verify accepted original rank custody and EIGHT exact JSONs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:return json.load(r)
          run=get('/actions/runs/40589313965')
          source='15fd8f4889daa84aae40645c76dd1bcff8316fc9'
          digest='0090ef14e06cc70731be2facaa66201fa9c272cf594de89704a85f44525349ee'
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
          artifact=get('/actions/artifacts/12773017942')
          assert artifact['name']=='original-signed-frame-transport' and artifact['expired'] is False
          assert artifact['workflow_run']['id']==40589313965 and artifact['workflow_run']['head_sha']==source
          assert artifact['digest']=='sha256:'+digest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(base+'/actions/artifacts/12773017942/zip',headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # Never forward GitHub authorization to blob storage.
              with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==digest
          archive=zipfile.ZipFile(io.BytesIO(data));Path('artifacts').mkdir(exist_ok=True)
          for filename,sha in [
            ('original_signed_frame_transport.json','e78c29dc930274e5522c665d073044a6de6ac1fee832cac65c13128f57fe80d4'),
            ('original_signed_critical_mixed_block.json','2cb869033f2c6722d356e769f35fc0e1b041ae46a8c11360e66cd7d2c694c548'),
            ('original_signed_kernel_validation.json','6d65f5f3d2338fb98d7f6397f4bcacd6e0c6bb0acb669b918c1fdf08e5e9bd4c'),
            ('original_BS_pruned_rank_bound.json','9b9820a0163e5e8bf08dd1c2525c757ff67214b49a40cb093d00bc611c9ff9e2'),
            ('original_four_mode_critical_block.json','a84b19c1fefc4e680c5c19ea643bbe5badce639374cb0a424211ee980020f922'),
            ('si29_full_J_L2_normalization.json','c9ee487f8abe7b633c47d2ef7d72e2cc4f7289bc794b2d8fc02bb61520b25e60'),
            ('sm40_original_envelope_method_stop.json','19af532b6bbd4a808854696b2a993e7ebd966e04da27fdd5f55e8b736668770b'),
            ('original_BS_infinite_tail_upper.json','931e5c64db19b28201ce96958495a8bfd8337eb7ebe08096466d86db29a1f801')]:
              raw=archive.read(filename);assert hashlib.sha256(raw).hexdigest()==sha
              Path('artifacts',filename).write_bytes(raw)
          print('Accepted run/source/artifact/archive and EIGHT matched JSONs PASS')
          PY
      - name: Replay accepted original reduced rank and complete leakage
        run: python scripts/verify_rpb108_original_BS_pruned_rank_replay.py artifacts/original_BS_pruned_rank_bound.json artifacts/si29_full_J_L2_normalization.json artifacts/sm40_original_envelope_method_stop.json artifacts/original_BS_infinite_tail_upper.json
      - name: Install pinned native arithmetic
        run: python -m pip install python-flint==0.8.0
      - name: Replay accepted signed block and independent validation
        run: python scripts/verify_rpb108_original_signed_critical_mixed_replay.py artifacts/original_signed_critical_mixed_block.json artifacts/original_signed_kernel_validation.json artifacts/original_BS_pruned_rank_bound.json artifacts/original_four_mode_critical_block.json
      - name: Replay accepted frame error ledger
        run: python scripts/verify_rpb108_original_signed_frame_transport_replay.py artifacts/original_signed_frame_transport.json artifacts/original_signed_critical_mixed_block.json artifacts/original_BS_pruned_rank_bound.json
      - name: Backward default precision and tail regression
        run: |
          python scripts/verify_rpb108_original_signed_critical_mixed_block.py --rank artifacts/original_BS_pruned_rank_bound.json --critical artifacts/original_four_mode_critical_block.json --output artifacts/default_signed_block_regression.json
          python - <<'PY'
          import json
          a=json.load(open('artifacts/original_signed_critical_mixed_block.json'))
          b=json.load(open('artifacts/default_signed_block_regression.json'))
          assert all(a[k]==b[k] for k in a if k!='elapsed_seconds')
          assert b['Laplace_tail_exponent']==406
          print('All default mathematical fields unchanged PASS')
          PY
      - name: Compute the SAME 968 couplings with jointly refined precision and tail
        run: python scripts/verify_rpb108_original_signed_critical_mixed_block.py --rank artifacts/original_BS_pruned_rank_bound.json --critical artifacts/original_four_mode_critical_block.json --precision 1024 --laplace-terms 128 --output artifacts/original_signed_refined_critical_block.json
      - name: Transport refined native block through the SAME verified physical frame
        run: python scripts/verify_rpb108_original_signed_joint_frame_budget.py --frame artifacts/original_signed_frame_transport.json --old artifacts/original_signed_critical_mixed_block.json --rank artifacts/original_BS_pruned_rank_bound.json --critical artifacts/original_four_mode_critical_block.json --block artifacts/original_signed_refined_critical_block.json --output artifacts/original_signed_joint_frame_budget.json
      - name: Independent rational tail and full transported error ledger replay
        run: python scripts/verify_rpb108_original_signed_joint_frame_budget_replay.py artifacts/original_signed_joint_frame_budget.json artifacts/original_signed_refined_critical_block.json artifacts/original_signed_frame_transport.json artifacts/original_signed_critical_mixed_block.json artifacts/original_BS_pruned_rank_bound.json artifacts/original_four_mode_critical_block.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-signed-joint-frame-budget
          path: artifacts/*.json
          if-no-files-found: error
