name: mg58-original-physical-adaptive-two-band-2D-strong-moment
on:
  pull_request:
    paths:
      - 'scripts/validate_rpb108_mg58_adaptive_strong_2D.py'
      - 'scripts/validate_rpb108_mg58_independent_adaptive_2D_replay.py'
      - 'notes/RPB108_MG58_TRUE_ORIGINAL_ADAPTIVE_2D_20261023.md'
      - '.github/workflows/rpb108-mg58-original-adaptive-2D-strong-moment.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-24D-two-band-physical-adaptive-strong-moment:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Retrieve accepted original physical MG24 source Gram and true pole
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39378465438
          name: mg24-original-full-frequency-coupled-source-brackets
          github-token: ${{ github.token }}
          path: artifacts/mg24_verified
      - name: Retrieve independently verified MG57 full original 41-cell corrected-action source enclosure
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39897754515
          name: mg57-original-coupled-pole-and-twelve-new-physical-fourier-cells
          github-token: ${{ github.token }}
          path: artifacts/mg57_verified
      - name: Compile both independent full original 24D proof implementations
        run: |
          python -m py_compile scripts/validate_rpb108_mg58_adaptive_strong_2D.py scripts/validate_rpb108_mg58_independent_adaptive_2D_replay.py
          test -s artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json
          test -s artifacts/mg57_verified/mg57_targeted_true_strong_action_refinement.json
      - name: Compute two physical original adaptive Fourier source moment refinements and exact signed index
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg58_adaptive_strong_2D.py --verified-mg24-json artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json --verified-mg57-json artifacts/mg57_verified/mg57_targeted_true_strong_action_refinement.json
      - name: Independently regenerate all new physical source cells and certify full original 24D reverse inertia and conditional 2D Gram
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg58_independent_adaptive_2D_replay.py --verified-mg24-json artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json --verified-mg57-json artifacts/mg57_verified/mg57_targeted_true_strong_action_refinement.json --verified-mg58-json artifacts/mg58_original_targeted_2D_strong_moment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mg58-original-true-adaptive-physical-47-55-cell-2D-strong-moment
          path: artifacts/mg58_original_targeted_2D_strong_moment.json
          if-no-files-found: ignore
