name: RPB108 SM27 C33 full negative-cap surrogate inertia and true continuum

on:
  pull_request:
    paths:
      - "notes/RPB108_SM27_C33_FULL_CAP_SURROGATE_INERTIA_20261018.md"
      - "scripts/validate_rpb108_sm27_c33_full_cap_surrogate_inertia.py"
      - "research/obligations.json"
      - ".github/workflows/rpb108-sm27-c33-full-cap-surrogate-inertia.yml"
  workflow_dispatch:

jobs:
  sm27-full-reference-obstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SM27 original C33 33-source signed packet, full 890-cap, and extra 13-band real continuum
        run: |
          python3 -m py_compile scripts/validate_rpb108_sm27_c33_full_cap_surrogate_inertia.py
          python3 scripts/validate_rpb108_sm27_c33_full_cap_surrogate_inertia.py
      - name: Preserve PS36 O1 O2 complete-operator acceptance and Weil RH OPEN
        run: |
          python3 - <<'PY'
          import json
          g=json.load(open("research/obligations.json"))
          assert g["active_obligation"]=="W-ODD-NEG"
          assert g["objective"]["status"]=="open"
          assert g["governance"]["no_automatic_promotion"] is True
          odd=next(x for x in g["obligations"] if x["id"]=="W-ODD-NEG")
          assert odd["status"]=="open"
          assert "SM25" in odd["evidence"] and "SM26" in odd["evidence"] and "SM27" in odd["evidence"]
          assert "O1/O2" in odd["acceptance"]
          assert "full_cap_reference_nogo" in g["governance"]
          PY
