name: RC327 original signed high interface and full residual
on:
  push:
    branches:
      - research/rpb108-rc327-high-interface-residual
    paths:
      - "scripts/validate_rpb108_rc327_high_interface_residual.py"
      - ".github/workflows/rc327-high-interface-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Certify original native 3-mode cross-to-infinite high and residual
        run: |
          python scripts/validate_rpb108_rc327_high_interface_residual.py --output certificates/rpb108_rc327_high_interface_residual.json
          python scripts/validate_rpb108_rc327_high_interface_residual.py --output certificates/rpb108_rc327_high_interface_residual.json --replay
      - name: Freeze exact rational certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc327_high_interface_residual.json
          if ! git diff --cached --quiet; then
            git commit -m "RC327: freeze native signed cross-to-infinite high residual"
            git fetch origin research/rpb108-rc327-high-interface-residual
            git rebase origin/research/rpb108-rc327-high-interface-residual
            git push origin HEAD:research/rpb108-rc327-high-interface-residual
          fi
