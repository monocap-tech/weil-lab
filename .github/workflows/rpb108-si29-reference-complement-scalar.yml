name: SI29 reference compression and actual energy Schur floor

on:
  push:
    paths:
      - scripts/verify_rpb108_si29_reference_complement_scalar.py
      - .github/workflows/rpb108-si29-reference-complement-scalar.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  accepted-native-witness-exact-rational-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accepted GitHub custody and download exact native witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          from verify_rpb108_si29_L2_dyadic_replay import NATIVE_RUN,NATIVE_COMMIT,NATIVE_ARTIFACT,ARCHIVE_SHA256,JSON_SHA256
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:
                  return json.load(r)
          specs=[
              (NATIVE_RUN,NATIVE_COMMIT,NATIVE_ARTIFACT,'si29-original-full-J-L2-normalization',ARCHIVE_SHA256,JSON_SHA256,'si29_full_J_L2_normalization.json'),
              (40417043904,'0e3321350980247f8cba46cdbb45b717e49ad213',12694539474,'si29-full-trial-preconditioner','e2c6017b35cd85ba404efa8013305d9e7c023d916cc1b2f96dbbcf7a7c8f772a','87d6f3ae24cde489adaf9ab3ac7efa612bc82bd78c6c9e94866802fdc550052f','si29_full_trial_preconditioner.json')]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          Path('artifacts').mkdir(exist_ok=True)
          for run_id,commit,artifact_id,name,archive_sha,json_sha,json_name in specs:
              run=get('/actions/runs/'+str(run_id))
              assert run['conclusion']=='success' and run['head_sha']==commit
              artifact=get('/actions/artifacts/'+str(artifact_id))
              assert artifact['name']==name and artifact['expired'] is False
              assert artifact['workflow_run']['id']==run_id and artifact['workflow_run']['head_sha']==commit
              assert artifact['digest']=='sha256:'+archive_sha
              request=urllib.request.Request(base+'/actions/artifacts/'+str(artifact_id)+'/zip',headers=headers)
              try:
                  with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
              except urllib.error.HTTPError as e:
                  assert e.code in (301,302,303,307,308)
                  # Do not forward GitHub authorization to blob storage.
                  with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
              assert hashlib.sha256(data).hexdigest()==archive_sha
              raw=zipfile.ZipFile(io.BytesIO(data)).read(json_name)
              assert hashlib.sha256(raw).hexdigest()==json_sha
              Path('artifacts',json_name).write_bytes(raw)
              print('Accepted run/source/artifact/archive/JSON custody PASS',run_id,artifact_id)
          PY
      - name: Compose complete reference-inverse compression with exact Fractions
        run: python scripts/verify_rpb108_si29_reference_complement_scalar.py --certificate artifacts/si29_full_J_L2_normalization.json --trial-certificate artifacts/si29_full_trial_preconditioner.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si29-reference-complement-scalar
          path: artifacts/*.json
          if-no-files-found: warn
