name: NF611 original physical solve existence
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaOriginalPhysicalSolveExistence.lean"
      - "WeilDefect/Arithmetic/ActualZetaOriginalPhysicalExistentialMargin.lean"
      - ".github/workflows/nf611-original-physical-existence.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nf611-${{ github.ref }}
  cancel-in-progress: true
jobs:
  existence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Exact transformed solution existence and uniqueness
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalPhysicalSolveExistence
      - name: Exact solution and corrected conditional relative margin
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalPhysicalExistentialMargin
      - name: Axiom audit
        run: |
          cat > /tmp/nf611Audit.lean <<'EOF'
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalExistentialMargin
          #print axioms WeilDefect.neutralNF611Solve_existsUnique
          #print axioms WeilDefect.neutralNF611PhysicalSolve_box
          #print axioms WeilDefect.neutralNF611PhysicalResidual_corrected
          EOF
          lake env lean /tmp/nf611Audit.lean
