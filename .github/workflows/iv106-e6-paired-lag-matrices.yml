name: IV106-E6 paired lag matrices
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv106/iv106_e6/ActualZetaIV106E6PairedLagMatrices.lean'
      - '.github/workflows/iv106-e6-paired-lag-matrices.yml'
permissions:
  contents: read
jobs:
  physical-action:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C candidate hash-object verification/iv106/iv106_e6/ActualZetaIV106E6PairedLagMatrices.lean)" = 338c4a5ae35d8314f30d21e36b30fa8778836465
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv106/iv106_e6/ActualZetaIV106E6PairedLagMatrices.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.lean
          cp candidate/verification/iv106/iv106_e6/ActualZetaIV106E6PairedLagMatrices.lean research/WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv106-e6/out
          touch iv106-e6/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV106E6PairedLagMatrices 2>&1 | tee iv106-e6/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.olean -nt iv106-e6/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV106E6PairedLagMatrices' '#print axioms WeilDefect.neutralIV106E6Pair_symm' '#print axioms WeilDefect.neutralIV106E6Lag2' '#print axioms WeilDefect.neutralIV106E6Lag3' '#print axioms WeilDefect.neutralIV106E6Lag4' '#print axioms WeilDefect.neutralIV106E6Integral_receiver' '#print axioms WeilDefect.neutralIV106E6Total_receiver' > /tmp/iv106-e6-axioms.lean
          lake env lean /tmp/iv106-e6-axioms.lean 2>&1 | tee iv106-e6/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv106-e6/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==6 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV106E6Pair_symm","neutralIV106E6Lag2","neutralIV106E6Lag3","neutralIV106E6Lag4","neutralIV106E6Integral_receiver","neutralIV106E6Total_receiver"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV106-E6 strict named axioms PASS 6/6')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.olean > iv106-e6/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv106-e6-physical-action-evidence
          path: |
            research/iv106-e6/out/
            research/WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E6PairedLagMatrices.olean
          include-hidden-files: true
          if-no-files-found: error
