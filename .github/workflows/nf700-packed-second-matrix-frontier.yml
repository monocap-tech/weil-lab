name: NF700 packed second original HD row and A column
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaOriginalPhysicalPackedProducts.lean"
      - "scripts/emit_nf700_packed_second_matrix_frontier.py"
      - ".github/workflows/nf700-packed-second-matrix-frontier.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf700-packed-matrix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-flint==0.8.0
      - name: Authenticate retained original archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          fetch() {
            local id="$1" name="$2" digest="$3"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "inputs/$name.zip"
            echo "$digest  inputs/$name.zip" | sha256sum -c -
            unzip -q "inputs/$name.zip" -d "inputs/$name"
          }
          fetch 14443252637 frame 3621906bd54c007900ca082ae1d2ee783d05d28ab5f3caab78b4a870b33abc7c
          fetch 14459025571 entries e91a83cae117e98608aefa6849dac178e4ddb58dd1dffbfe37304ad248af9ed9
          fetch 14457911117 cache bb89b0c7b9bc4017b8c855f0e30474ee8b2f0589e29f99747fff965f44f3b1a7
          fetch 14458146136 payments 8cbae72a7714dc555c0183edfbbda077096ef910b1e284d4abc91c4960d95e6e
      - name: Reconcile 484 new original products and emit exact bounded packed certificates
        run: |
          set -euo pipefail
          python -m py_compile scripts/emit_nf700_packed_second_matrix_frontier.py
          python scripts/emit_nf700_packed_second_matrix_frontier.py --root . --historical inputs/frame/nf623-historical-entries.jsonl.gz --entries inputs/entries/nf631-widened-entries.jsonl.gz --payments inputs/payments/nf631-widened-payments.json --cache inputs/cache/nf631-center-cache.jsonl.gz --output WeilDefect/Generated/NF700
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF700')
          m=json.loads((d/'manifest.json').read_text())
          assert (m['H_source_row'],m['HD_source_column'])==(1,1)
          assert (m['HD_exact_external'],m['A_exact_external'],len(m['blocks']))==(242,242,31)
          assert [j for b in m['blocks'] for j in range(b['start'],b['stop'])]==list(range(242))
          assert all(b['width']==b['stop']-b['start'] and 0<b['width']<=8 and len(b['theorems'])==17 for b in m['blocks'])
          assert {x['file'] for x in m['files']}=={'Common.lean'}|{b['module']+'.lean' for b in m['blocks']}
          for x in m['files']: assert hashlib.sha256((d/x['file']).read_bytes()).hexdigest()==x['sha256']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf700-packed-matrix-proposals
          path: WeilDefect/Generated/NF700/
          if-no-files-found: error
  packed-shards:
    needs: emit
    runs-on: ubuntu-latest
    name: Packed matrix blocks ${{ matrix.first }}-${{ matrix.last }}
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {first: 0, last: 7}
          - {first: 8, last: 15}
          - {first: 16, last: 23}
          - {first: 24, last: 30}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nf700-packed-matrix-proposals
          path: WeilDefect/Generated/NF700
      - name: Authenticate all generated exact literals
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF700')
          for x in json.loads((d/'manifest.json').read_text())['files']:
              assert hashlib.sha256((d/x['file']).read_bytes()).hexdigest()==x['sha256']
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile accepted deterministic signed-digit reduction and common data
        run: lake build WeilDefect.Generated.NF700.Common
      - name: Kernel check each bounded original packed product block
        timeout-minutes: 110
        env:
          FIRST: ${{ matrix.first }}
          LAST: ${{ matrix.last }}
        run: |
          set -euo pipefail
          for ((i=FIRST;i<=LAST;i++)); do
            printf -v block 'Block%03d' "$i"
            echo "TARGET $block" | tee -a nf700-timing.txt
            /usr/bin/time -a -o nf700-timing.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build "WeilDefect.Generated.NF700.$block" 2>&1 | tee -a nf700-build.log
          done
      - name: Strict independent axiom and packed-coordinate inventory audit
        env:
          FIRST: ${{ matrix.first }}
          LAST: ${{ matrix.last }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('WeilDefect/Generated/NF700/manifest.json').read_text())
          blocks=m['blocks'][int(os.environ['FIRST']):int(os.environ['LAST'])+1]
          names=['neutralNF683PackedProducts']+[n for b in blocks for n in b['theorems']]
          Path('/tmp/nf700Audit.lean').write_text(''.join(f"import WeilDefect.Generated.NF700.{b['module']}\n" for b in blocks)+''.join(f'#print axioms WeilDefect.{n}\n' for n in names))
          Path('nf700-names.txt').write_text('\n'.join(names)+'\n')
          PY
          lake env lean /tmp/nf700Audit.lean 2>&1 | tee nf700-axioms.log
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF700')
          m=json.loads((d/'manifest.json').read_text())
          lo,hi=int(os.environ['FIRST']),int(os.environ['LAST'])
          blocks=m['blocks'][lo:hi+1]
          names=set(Path('nf700-names.txt').read_text().splitlines())
          found={}
          s=Path('nf700-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",s):
              if n in names:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",s):
              if n in names:
                  assert n not in found
                  found[n]=[]
          assert set(found)==names and len(found)==17*len(blocks)+1
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in found.values())
          found.pop('neutralNF683PackedProducts')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          h={x['file']:x['sha256'] for x in m['files']}
          for b in blocks: assert sha(d/(b['module']+'.lean'))==h[b['module']+'.lean']
          Path('nf700-audit.json').write_text(json.dumps({'first':lo,'last':hi,'blocks':blocks,'manifest_sha256':sha(d/'manifest.json'),'theorems':found},indent=2)+'\n')
          print('NF700 packed coordinate LEAN PASS',lo,hi,2*sum(b['width'] for b in blocks))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf700-packed-audit-${{ matrix.first }}-${{ matrix.last }}
          path: |
            nf700-*.log
            nf700-*.txt
            nf700-audit.json
          if-no-files-found: ignore
  aggregate:
    needs: packed-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nf700-packed-matrix-proposals
          path: proposals
      - uses: actions/download-artifact@v4
        with:
          pattern: nf700-packed-audit-*
          path: audits
      - name: Strict complete original second matrix frontier audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('proposals')
          m=json.loads((d/'manifest.json').read_text())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          a=sorted([json.loads(p.read_text()) for p in Path('audits').rglob('nf700-audit.json')],key=lambda x:x['first'])
          assert [(r['first'],r['last']) for r in a]==[(0,7),(8,15),(16,23),(24,30)]
          assert all(r['manifest_sha256']==sha(d/'manifest.json') for r in a)
          blocks=[b for r in a for b in r['blocks']]
          assert blocks==m['blocks'] and len(blocks)==31
          assert [j for b in blocks for j in range(b['start'],b['stop'])]==list(range(242))
          found={}
          for r in a:
              assert set(r['theorems'])=={n for b in r['blocks'] for n in b['theorems']}
              for n,v in r['theorems'].items():
                  assert n not in found and set(v)<={'propext','Classical.choice','Quot.sound'}
                  found[n]=v
          assert len(found)==527
          assert sum(b['HD'] for b in blocks)==sum(b['A'] for b in blocks)==242
          Path('nf700-complete-audit.json').write_text(json.dumps({'schema':'NF700-packed-second-matrix-audit-v1','manifest_sha256':sha(d/'manifest.json'),'blocks':blocks,'theorems':found,'scope':'484 new original local matrix product coordinates; global projections remain open.'},indent=2)+'\n')
          print('NF700 all 484 new original packed local products / 527 declarations LEAN PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf700-complete-packed-matrix-audit
          path: nf700-complete-audit.json
