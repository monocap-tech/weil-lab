name: RPB108 PS14 original full signed 13-channel coercivity

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps14_full_original_13channel.py"
      - "notes/RPB108_PS14_FULL_ORIGINAL_13CHANNEL_COERCIVITY_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps14-original-13channel.yml"
  workflow_dispatch:

jobs:
  ps14-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay original source and verify whole-source signed Q coercivity
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps14_full_original_13channel.py
          python3 scripts/validate_rpb108_ps14_full_original_13channel.py
      - name: Canonical W-ODD-NEG not falsely promoted
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
