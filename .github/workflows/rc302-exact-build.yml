name: RC302 exact supported-polynomial action generator
on:
  push:
    branches:
      - research/rpb108-rc302-polynomial-interface
    paths:
      - "scripts/validate_rpb108_rc302_polynomial_action_interface.py"
      - ".github/workflows/rc302-exact-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited validator dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Generate and replay exact polynomial action contract
        run: |
          python scripts/validate_rpb108_rc302_polynomial_action_interface.py --output certificates/rpb108_rc302_polynomial_action_interface.json
          python scripts/validate_rpb108_rc302_polynomial_action_interface.py --output certificates/rpb108_rc302_polynomial_action_interface.json --replay
      - name: Commit and push certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc302_polynomial_action_interface.json
          if ! git diff --cached --quiet; then
            git commit -m "RC302: freeze exact V5 polynomial action and noninvariance certificate"
            git push origin HEAD:research/rpb108-rc302-polynomial-interface
          fi
