name: IV009 exact original finite Schwartz-sum mixed Weil polarization
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalSchwartzPolarization.lean"
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalMixedHermitian.lean"
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVFiniteMixedWindowSystem.lean"
      - "scripts/iv009_original_schwartz_polarization_audit.py"
      - ".github/workflows/iv009-original-schwartz-polarization.yml"
      - "docs/IV009_PHASE_IV_ORIGINAL_SCHWARTZ_POLARIZATION.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iv009-original-schwartz-polarization-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-finite-schwartz-sum-polarization:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original source and new theorem preflight — NOT kernel acceptance
        run: |
          set -euo pipefail
          python -m py_compile scripts/iv009_original_schwartz_polarization_audit.py
          python scripts/iv009_original_schwartz_polarization_audit.py preflight
      - name: Install pinned original Lean toolchain and Mathlib cache
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Direct full ORIGINAL mixed Weil physical-sum Lean kernel build
        timeout-minutes: 190
        run: |
          set -euo pipefail
          /usr/bin/time -o iv009-original-schwartz-polarization-resources.log -f 'elapsed=%e rss_kb=%M exit=%x' \
            lake build WeilDefect.Arithmetic.ActualZetaPhaseIVOriginalSchwartzPolarization 2>&1 | tee iv009-original-schwartz-polarization-build.log
      - name: Direct Lean standard-axiom audit for eight IV009 and four original source anchors
        timeout-minutes: 35
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalSchwartzPolarization.lean 2>&1 | tee iv009-original-schwartz-polarization-axioms.log
          python scripts/iv009_original_schwartz_polarization_audit.py verify
          test -s iv009-original-schwartz-polarization-kernel-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv009-original-schwartz-sum-physical-mixed-weil-kernel-audit
          path: |
            iv009-original-schwartz-polarization-build.log
            iv009-original-schwartz-polarization-axioms.log
            iv009-original-schwartz-polarization-kernel-audit.json
            iv009-original-schwartz-polarization-resources.log
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalSchwartzPolarization.olean
          if-no-files-found: ignore
          include-hidden-files: true
