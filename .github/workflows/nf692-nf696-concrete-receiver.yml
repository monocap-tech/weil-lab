name: NF692 NF696 concrete original bank receiver
on:
  push:
    branches:
      - research/nf692-nf696-concrete-receiver
    paths:
      - ".github/workflows/nf692-nf696-concrete-receiver.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  batch:
    name: Prior concrete receiver
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
          run-id: 44598398608
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=json.loads(Path('compiled-bank/nf697-bank-binding.json').read_text())
          b=json.loads(Path('nf697-bank-binding.json').read_text())
          for x in (a,b):
              f=x.pop('fingerprint')
              assert hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()==f
          assert a['schema']==b['schema'] and a['environment']==b['environment']
          assert all(b['files'].get(k)==v for k,v in a['files'].items())
          extra=set(b['files'])-set(a['files'])
          assert extra=={'WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.lean'},extra
          # Existing source closure must not reference the newly added module.
          assert all('ActualZetaOriginalPhysicalTriangularCacheAssembly' not in Path(p).read_text()
                     for p in a['files'] if p.endswith('.lean'))
          print('NF705 all producer sources unchanged; exactly one new independent theorem module')
          PY
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
          test ! -e .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.olean
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - name: Authenticate prior local receipts and concrete source proposals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p prior-input
          fetch() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$2/zip" -o "prior-input/$1.zip"
            echo "$3  prior-input/$1.zip" | sha256sum -c -
          }
          fetch source692 14560118454 b7209e4fee4d9309cf86f2551f57f2ff0fe75f47931e8c3dd721a42c3e2ec7b2
          fetch audit692 14568861192 e0b10f84227688ac39b143996a10cf31760d31dbc2cf3abce067856dbefb7048
          fetch source696 14565840709 ccfdfabd15e85e5564c7c5bf7c88de6a9f270174dd3e16f490f50c750173c81e
          fetch audit696 14567980736 f11ecfb1493e1990954f0dec8b3a129a50c985286014fb34abc0f43db84ef497
          fetch unified 15084125240 5ecdd6e9cccf16359cdc1bdcffbe415256b3b03b5a3066009fa0a44fcffc2513
      - name: Verify 398 local receipts and generate bounded concrete receiver
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          from fractions import Fraction as F
          root=Path('WeilDefect/Generated')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def put(p,b):
              p.parent.mkdir(parents=True,exist_ok=True)
              if p.exists(): assert p.read_bytes()==b,p
              else: p.write_bytes(b)
          def load(p): return json.loads(p.read_text())
          bm=load(root/'NF690/manifest.json')
          bh=sha((root/'NF690/manifest.json').read_bytes())
          slots=bm['slots']; assert [r['index'] for r in slots]==list(range(7835))
          allowed={'propext','Classical.choice','Quot.sound'}
          seen=set(); names=[]; targets=[]; out=root/'NF696Concrete'; emitted={}
          mod='WeilDefect.Generated.NF696Concrete.'
          prop='neutralNF690TableSound (neutralNF624BankRead nf690OriginalBank i)'
          def emit(file,imports,body):
              data=(''.join('import '+x+'\n' for x in imports)+'\nnamespace WeilDefect\n\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n\n'+body+'\nend WeilDefect\n').encode()
              put(out/(file+'.lean'),data); emitted[file+'.lean']=sha(data)
          def combine(file,d,t,leaves):
              def chain(xs):
                  return xs[0][1] if len(xs)==1 else '('+xs[0][1]+' ++ '+chain(xs[1:])+')'
              body=f'def {d} : List ℕ := '+chain(leaves)+'\n\n'
              body+=f'theorem {t} (i : ℕ) (hi : i ∈ {d}) :\n    {prop} := by\n'
              body+=f'  change i ∈ {chain(leaves)} at hi\n'
              def eliminate(xs,h,indent):
                  if len(xs)==1: return indent+f'exact {xs[0][2]} i {h}\n'
                  return (indent+f'rcases List.mem_append.mp {h} with hleft | hright\n'
                          +indent+f'· exact {xs[0][2]} i hleft\n'
                          +indent+'· '+eliminate(xs[1:],'hright',indent+'  ').lstrip())
              body+=eliminate(leaves,'hi','  ')
              emit(file,[mod+x[0] for x in leaves],body)
              names.append(t)
              return (file,d,t)
          phases=[]
          for stage,count,rows in [(692,271,2124),(696,127,548)]:
              folder=f'NF{stage}'; prefix=f'nf{stage}'
              with zipfile.ZipFile(f'prior-input/source{stage}.zip') as z,zipfile.ZipFile(f'prior-input/audit{stage}.zip') as q:
                  raw=z.read(folder+'/manifest.json'); m=json.loads(raw)
                  a=json.loads(q.read(f'nf{stage}-complete-audit.json'))
                  assert m['bank_manifest_sha256']==bh and a['manifest_sha256']==sha(raw)
                  assert (m['tables'],m['rows'])==(count,rows)
                  records=m['records']; index={r['index']:r for r in records}
                  assert len(index)==count and sum(r['rows'] for r in records)==rows
                  assert sorted(records,key=lambda r:r['index'])==sorted(a['records'],key=lambda r:r['index'])
                  expected={prefix+r['module']+v for r in records for v in ('Key','Length','RowsEq','Sound')}
                  assert set(a['theorems'])==expected and all(set(v)<=allowed for v in a['theorems'].values())
                  assert seen.isdisjoint(index); seen.update(index)
                  for i,r in index.items():
                      b=slots[i]
                      assert tuple(map(F,r['key']))==tuple(map(F,b['key']))
                      assert (r['rows'],r['chunk'],r['offset'])==(b['rows'],b['chunk'],b['offset'])
                  for p in z.namelist():
                      if p.endswith('/'): continue
                      assert not Path(p).is_absolute() and '..' not in Path(p).parts
                      put(root/p,z.read(p))
                  for p in {x.split('/')[0] for x in z.namelist() if x.endswith('/manifest.json')}:
                      d=root/p; v=load(d/'manifest.json')
                      for f in v['files']:
                          assert sha((d/f['file']).read_bytes())==f['sha256']
                  if stage==696: assert m['nf692_manifest_sha256']==sha((root/'NF692/manifest.json').read_bytes())
                  got=set(); leaves=[]
                  for j,p in enumerate(sorted((root/folder).glob('Concrete*.lean'))):
                      source=p.read_text()
                      ids=[int(x) for x in re.findall(r'^import WeilDefect\.Generated\.'+folder+r'\.Slot(\d+)$',source,re.M)]
                      assert ids and len(ids)==len(set(ids)) and set(ids)<=index.keys() and got.isdisjoint(ids)
                      got.update(ids)
                      file=f'Bank{stage}Batch{j:02d}'; d='nf696Concrete'+file+'Slots'; t='nf696Concrete'+file+'Sound'
                      ls='['+', '.join(map(str,ids))+']'
                      body=f'def {d} : List ℕ := {ls}\n\ntheorem {t} (i : ℕ) (hi : i ∈ {d}) :\n    {prop} := by\n'
                      body+=f'  simp only [{d}, List.mem_cons, List.not_mem_nil, or_false] at hi\n'
                      if len(ids)==1: body+='  subst i\n'
                      else: body+='  rcases hi with '+' | '.join(['rfl']*len(ids))+'\n'
                      for i in ids:
                          zname=prefix+index[i]['module']
                          for v in ('PayloadEq','Concrete'):
                              assert re.search(r'\btheorem '+zname+v+r'\b',source)
                          names.extend(zname+v for v in ('Key','Length','RowsEq','Sound','PayloadEq','Concrete'))
                          body+=('  exact ' if len(ids)==1 else '  · exact ')+zname+'Concrete\n'
                      emit(file,[f'WeilDefect.Generated.{folder}.{p.stem}'],body)
                      names.append(t); leaves.append((file,d,t))
                  assert got==index.keys()
                  f=f'Bank{stage}'
                  phases.append(combine(f,'nf696Concrete'+f+'Slots','nf696Concrete'+f+'Sound',leaves))
                  targets.append(mod+f)
          assert len(seen)==398
          with zipfile.ZipFile('prior-input/unified.zip') as z:
              m=json.loads(z.read('unified-receiver-manifest.json'))
              assert seen<=set(m['prior_slots']) and seen.isdisjoint(m['slots'])
          combine('Receiver','nf692696ConcreteSlots','nf692696ConcreteSound',phases)
          assert len(names)==len(set(names))
          put(out/'Audit.lean',('import '+mod+'Receiver\n'+''.join('#print axioms WeilDefect.'+n+'\n' for n in names)).encode())
          emitted['Audit.lean']=sha((out/'Audit.lean').read_bytes())
          Path('prior-concrete-manifest.json').write_text(json.dumps({'slots':sorted(seen),'rows':2672,'theorems':names,'source_sha256':emitted},indent=2)+'\n')
          Path('prior-concrete-targets.txt').write_text('\n'.join(targets)+'\n')
          print('NF692 NF696 398-slot concrete source preflight PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf692-nf696-concrete-source
          path: |
            WeilDefect/Generated/NF696Concrete/
            prior-concrete-manifest.json
          if-no-files-found: error
      - name: Compile concrete payload projections and stage receivers
        timeout-minutes: 240
        run: |
          set -euo pipefail
          while read -r target; do
            lake build "$target" 2>&1 | tee -a prior-concrete-build.log
          done < prior-concrete-targets.txt
      - name: Compile terminal receiver and strict axiom audit
        timeout-minutes: 30
        run: |
          set -euo pipefail
          lake build WeilDefect.Generated.NF696Concrete.Receiver 2>&1 | tee -a prior-concrete-build.log
          lake env lean WeilDefect/Generated/NF696Concrete/Audit.lean 2>&1 | tee prior-concrete-axioms.log
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          p=Path('prior-concrete-manifest.json'); m=json.loads(p.read_text())
          names=set(m['theorems']); found={}
          text=Path('prior-concrete-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",text):
              if n in names:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",text):
              if n in names:
                  assert n not in found
                  found[n]=[]
          assert set(found)==names and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          Path('prior-concrete-audit.json').write_text(json.dumps({'manifest_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'theorems':found,'slots':len(m['slots']),'rows':m['rows']},indent=2)+'\n')
          print('NF692 NF696 concrete finite receiver LEAN PASS',len(m['slots']),m['rows'],len(found))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf692-nf696-concrete-evidence
          path: |
            prior-concrete-*.json
            prior-concrete-*.log
          if-no-files-found: warn
