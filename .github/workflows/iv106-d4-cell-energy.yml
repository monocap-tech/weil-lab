name: IV106-D4 direct cell energy
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv106/iv106_d4/ActualZetaIV106D4CellEnergy.lean'
      - '.github/workflows/iv106-d4-cell-energy.yml'
permissions:
  contents: read
jobs:
  physical-action:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C candidate hash-object verification/iv106/iv106_d4/ActualZetaIV106D4CellEnergy.lean)" = 6498d195ed1200fbdd52235decd199d5504a4660
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv106/iv106_d4/ActualZetaIV106D4CellEnergy.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.lean
          cp candidate/verification/iv106/iv106_d4/ActualZetaIV106D4CellEnergy.lean research/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv106-d4/out
          touch iv106-d4/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV106D4CellEnergy 2>&1 | tee iv106-d4/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.olean -nt iv106-d4/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV106D4CellEnergy' '#print axioms WeilDefect.neutralIV106D4IntervalCS' '#print axioms WeilDefect.neutralIV106D4Envelope' '#print axioms WeilDefect.neutralIV106D4Point' > /tmp/iv106-d4-axioms.lean
          lake env lean /tmp/iv106-d4-axioms.lean 2>&1 | tee iv106-d4/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv106-d4/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==3 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV106D4IntervalCS","neutralIV106D4Envelope","neutralIV106D4Point"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV106-D4 strict named axioms PASS 3/3')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.olean > iv106-d4/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv106-d4-physical-action-evidence
          path: |
            research/iv106-d4/out/
            research/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.olean
          include-hidden-files: true
          if-no-files-found: error
