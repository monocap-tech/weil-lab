name: Weil-Lab NF356-364 reconciled historical replay (archived evidence, NOT theorem acceptance)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nf356-364-historical-verify.yml'
      - 'notes/data/provisional/**'
      - 'research/obligations.json'
      - 'notes/provisional/NF356-370_HISTORICAL_CUSTODY_RECONCILIATION_20261028.md'
      - 'scripts/custody/restore_nf356_364_historical.py'
      - 'scripts/local_replay/replay_provisional_nf356_364.py'
permissions:
  contents: read
  actions: read
jobs:
  verify-exact-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download three correct accepted parent GitHub artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/historical-parents"
          for spec in "12738593751:nf361-pr348-fourmode.zip" "12770022548:pr350-certificate.zip" "12776684037:pr355-exterior.zip"; do
            id="${spec%%:*}"; name="${spec#*:}"
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/monocap-tech/weil-lab/actions/artifacts/${id}/zip" \
              --output "${RUNNER_TEMP}/historical-parents/${name}"
          done
      - name: Require ALL 49 historical files exactly present and parent-hash matched
        run: |
          python3 scripts/custody/restore_nf356_364_historical.py --verify-only \
            --source . --destination . --artifacts-dir "${RUNNER_TEMP}/historical-parents" \
            > "${RUNNER_TEMP}/reconciled-check.txt"
          grep -F 'PASS exact historical custody: 49 files; new 0; already identical 49' "${RUNNER_TEMP}/reconciled-check.txt"
          python3 scripts/local_replay/verify_provisional_manifest.py
      - name: Replay ALL nine historical focused rational checks on committed bytes
        run: |
          python3 scripts/local_replay/replay_provisional_nf356_364.py \
            --offline "${RUNNER_TEMP}/historical-parents" \
            --work-dir "${RUNNER_TEMP}/historical-replay"
      - name: Check canonical typed obligation status remains OPEN
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('research/obligations.json').read_text())
          assert obj['active_obligation']=='W-ODD-NEG'
          w=next(x for x in obj['obligations'] if x['id']=='W-ODD-NEG')
          assert w['status']=='open'
          assert 'NF356_370_HISTORICAL_CUSTODY' in obj['evidence']
          assert 'NF356_370_HISTORICAL_CUSTODY' in w['evidence']
          assert Path('notes/provisional/NF356-370_HISTORICAL_CUSTODY_RECONCILIATION_20261028.md').is_file()
          assert any(x['id']=='NF356-364-historical-SHA-manifest' for x in obj['active_checks'])
          print('PASS canonical obligation graph: custody acknowledged, W-ODD-NEG OPEN')
          PY
      - name: Audit warning — verification scope
        run: |
          echo 'PASS means byte provenance and nine inherited rational replays only.'
          echo 'NF356 stronger floor native Arb recomputation: UNACCEPTED.'
          echo 'Original analytic/operator domain audit: OPEN.'
          echo 'W-ODD-NEG and RH: OPEN.'
