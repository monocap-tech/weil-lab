          import json,subprocess,re,hashlib,sys
          from pathlib import Path
          mpath=Path('nf698-tail-final-manifest.json')
          m=json.loads(mpath.read_text())
          j=int(sys.argv[1]); b=m['batches'][j]
          out=Path(f'checkpoint-{j:02d}'); out.mkdir()
          name=b['target']
          def run(args,log):
              with log.open('w') as f:
                  with subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1) as p:
                      for line in p.stdout:
                          f.write(line); print(line,end='',flush=True)
                      assert p.wait()==0,args
          run(['lake','build','WeilDefect.Generated.NF698Tail.'+name],out/'build.log')
          log=out/'axioms.log'
          run(['lake','env','lean','WeilDefect/Generated/NF698Tail/'+b['audit']+'.lean'],log)
          expected=set(b['expected_theorems']); found={}
          text=log.read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",text):
              if n in expected:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",text):
              if n in expected:
                  assert n not in found
                  found[n]=[]
          assert set(found)==expected and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          (out/'audit.json').write_text(json.dumps({'pair':m['pair'],'target':name,'records':b['records'],'theorems':found,'manifest_sha256':hashlib.sha256(mpath.read_bytes()).hexdigest()},indent=2)+'\n')
          print('NF698 bounded batch PASS',name,len(b['records']),len(found),flush=True)
          PY
