name: NF698 tail final five phase pairs
on:
  push:
    branches:
      - research/nf698-tail-pairs07-11
    paths:
      - ".github/workflows/nf698-tail-pairs07-11.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  batch:
    name: Phase pair ${{ matrix.pair }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair: [7, 8, 9, 10, 11]
    env:
      PAIR: ${{ matrix.pair }}
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
          run-id: 44598398608
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=json.loads(Path('compiled-bank/nf697-bank-binding.json').read_text())
          b=json.loads(Path('nf697-bank-binding.json').read_text())
          for x in (a,b):
              f=x.pop('fingerprint')
              assert hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()==f
          assert a['schema']==b['schema'] and a['environment']==b['environment']
          assert all(b['files'].get(k)==v for k,v in a['files'].items())
          extra=set(b['files'])-set(a['files'])
          assert extra=={'WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.lean'},extra
          # Existing source closure must not reference the newly added module.
          assert all('ActualZetaOriginalPhysicalTriangularCacheAssembly' not in Path(p).read_text()
                     for p in a['files'] if p.endswith('.lean'))
          print('NF705 all producer sources unchanged; exactly one new independent theorem module')
          PY
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
          test ! -e .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.olean
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - name: Authenticate historical source, dual pilot receipts and eight exact payloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tail-staging
          fetch() {
            local id="$1" name="$2" digest="$3"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "tail-staging/$name.zip"
            echo "$digest  tail-staging/$name.zip" | sha256sum -c -
          }
          fetch 14576262070 proposals e5ccb75d630fdc10446660d357b7956ff31d55482fc6f40f60617147c054a8ee
          fetch 14584035606 pair6 aa8d369b487d6e72c43fa65a4b3f7d64159d144c66379b0f6ee2caaa4531e3ef
          fetch 14590029144 aggregate c77d19cf60e19e612a634c0a9225c79ed31952c94412347c2cd8b57c6c482a58
          fetch 14579566002 prior bb7655fc43eb94e4083bc27727bba86f95557873c6863bdd3195cea03c295687
          fetch 14594210703 nf705 39bf39110ed79e0ea7daca68bc8367272305ccf64504a9ddfc1440c67da66f68
          fetch 15027460220 pilot1 220c2098740f35faac25d932882e8eb27a876cc148a8a444ee2b2a7bb4463818
          fetch 15031976389 pilot2 df8ce66190dd0b4fd042dafbe646a036ecee3f0efeacfac07a3fde5bd17d6be6
          fetch 15041197414 batch00 a0c3ec2140a79ffc01cb7b98bc0d1bd5464461c3d39cb5d0b926ea50844e01c1
          fetch 15070833157 pair6done 9cffcb2ae4220f041e0658ed4dcfe5533e8912ec393332e08c0e69d53be3a71d
          fetch 14584076414 pair7 3dcc7179bb272082fae1137b41542c85cbfd58688c84b333f7bc52c7732e25dc
          fetch 14585124587 pair8 30275d8b2f3a7c6138efc6d45982f7e59c7856bc390ce639abe9e33b174a785d
          fetch 14585009739 pair9 29ee7320a13f1009b29857a2aa397b7bbd36484ac7c1044022651693004cb040
          fetch 14588018791 pair10 a8a7b6fdd6da95e8e75cb90676c5e1f0d0d0945e39f5f3558e10f6398bb629e9
          fetch 14589521183 pair11 6e148ab2db9ffa1047abc140362525f8342d5a99048e0b2d3bca6c1c13a3c7a4
          python - <<'PY'
          import hashlib,json,re,zipfile
          from fractions import Fraction as F
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          read=lambda z,p:json.loads(z.read(p))
          zs={n:zipfile.ZipFile('tail-staging/'+n+'.zip') for n in ('proposals','pair6','aggregate','prior','nf705')}
          s=zs['proposals']; m=read(s,'NF698/manifest.json'); mh=sha(s.read('NF698/manifest.json'))
          bank=root/'NF690'; raw=(bank/'manifest.json').read_bytes(); bm=json.loads(raw); bh=sha(raw)
          assert (bm['keys'],bm['rows'],bm['chunks'])==(7835,37994,490)
          assert m['input_sha256']==bm['input_sha256']
          a=read(zs['pair6'],'nf698-audit.json'); g=read(zs['aggregate'],'nf698-complete-audit.json')
          assert a['pair']==6 and a['manifest_sha256']==g['manifest_sha256']==mh
          assert a['full_plan_sha256']==m['full_plan_sha256']
          assert len(a['tables'])==82 and sum(x['rows'] for x in a['tables'])==349
          assert len(g['tables'])==930 and g['new_rows']==4255
          exp={x['group']:x for x in m['groups']}
          assert len(exp)==930 and len(m['selected_families'])==24
          assert {x['group'] for x in a['tables']}=={x['group'] for x in exp.values() if x['family']//2==6}
          r=next(x for x in a['tables'] if x['group']=='Key475')
          assert r==next(x for x in g['tables'] if x['group']=='Key475')
          assert all(r[k]==v for k,v in exp['Key475'].items())
          assert r['theorem']=='nf698Key475Moment' and set(r['axioms'])<={'propext','Classical.choice','Quot.sound'}
          assert r['rows']==4 and list(map(F,r['key']))==[F(-1,2),F(15787,64)]
          slots=bm['slots']; assert [x['index'] for x in slots]==list(range(7835))
          b=slots[85]; assert tuple(map(F,b['key']))==tuple(map(F,r['key']))
          assert (b['chunk'],b['offset'],b['rows'])==('Chunk005',5,4)
          prior=set(); p=zs['prior']; ph={}
          assert p.read('NF690/manifest.json')==raw
          for stage,n in [('NF692',271),('NF696',127),('NF701',548)]:
              qraw=p.read(stage+'/manifest.json'); q=json.loads(qraw)
              assert q['bank_manifest_sha256']==bh
              assert all(q[k.lower()+'_manifest_sha256']==v for k,v in ph.items())
              ph[stage]=sha(qraw)
              rr=q['records']; ss={x['index'] for x in rr}
              assert len(rr)==len(ss)==n and prior.isdisjoint(ss)
              prior.update(ss)
          c=read(zs['nf705'],'nf705-complete-audit.json')
          rr=c['records']; ss={x['index'] for x in rr}
          assert len(rr)==len(ss)==475 and prior.isdisjoint(ss)
          assert set(c['theorems'])=={'nf705'+x['module']+v for x in rr for v in ('Key','Length','RowsEq','Sound','PayloadEq','Concrete')}
          assert len(c['theorems'])==2850 and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in c['theorems'].values())
          prior.update(ss); assert len(prior)==1421 and 85 not in prior
          for stage in ('NF632','NF698'):
              for f in read(s,stage+'/manifest.json')['files']:
                  rel=stage+'/'+f['file']; content=s.read(rel)
                  assert sha(content)==f['sha256']
              for rel in s.namelist():
                  if not rel.startswith(stage+'/') or rel.endswith('/'): continue
                  assert '..' not in Path(rel).parts
                  dest=root/rel; dest.parent.mkdir(parents=True,exist_ok=True)
                  content=s.read(rel)
                  if dest.exists(): assert dest.read_bytes()==content,rel
                  else: dest.write_bytes(content)
          src=(root/'NF698/Key475.lean').read_bytes()
          assert sha(src)==r['sha256']=='3cb9dc3c18dafb0020c54780acb176303ed03de4c2b47645a67c6dcc8b21e544'
          chunk=(bank/'Chunk005.lean').read_bytes()
          assert sha(chunk)==next(x['sha256'] for x in bm['files'] if x['file']=='Chunk005.lean')
          rows=re.findall(r'#\[\n    (.*?)\n  \]',chunk.decode(),re.S)
          mt=re.search(r'def nf698Key475Table : NF624KeyTable := ⟨⟨\(([^:]+):ℚ\),\(([^:]+):ℚ\)⟩, #\[\n    (.*?)\n  \]⟩',src.decode(),re.S)
          assert len(rows)==16 and mt and tuple(map(F,mt.group(1,2)))==tuple(map(F,b['key']))
          assert mt[3]==rows[5] and len(mt[3].split(',\n    '))==4
          Path('nf698-tail-reconciliation.json').write_text(json.dumps({'record':r,'bank_slot':b,'bank_manifest_sha256':bh,'analytic_manifest_sha256':mh,'disjoint_from':len(prior)},indent=2)+'\n')
          print('NF698 tail slot 85 source authentication and exact row reconciliation PASS')
          pilot_names={'nf698TailSlot00085'+v for v in ('Key','Length','RowsEq','Sound','PayloadEq','Concrete')}
          pilot_audits=[]
          for name in ('pilot1','pilot2'):
              with zipfile.ZipFile('tail-staging/'+name+'.zip') as z:
                  matches=[x for x in z.namelist() if Path(x).name=='nf698-tail-pilot-audit.json']
                  assert len(matches)==1
                  pa=read(z,matches[0])
                  assert (pa['slot'],pa['rows'])==(85,4) and set(pa['theorems'])==pilot_names
                  assert all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in pa['theorems'].values())
                  pilot_audits.append(pa)
          assert pilot_audits[0]==pilot_audits[1]
          frozen=[
              (3240,'Key476','Chunk202',8,7,'0','4053/64','e0697b9d35d3826a85e06d4c6a200ef9cc4c78c7c993c80aada1e96ba832dd01'),
              (4960,'Key477','Chunk310',0,4,'0','10027/64','f8b0d2798109463a9ffbabe603165f406c5e8391769c6a64cf1b72185aada652'),
              (5604,'Key478','Chunk350',4,4,'0','14507/64','42b9c99a71fe007127f8ac22114e0c2823612d3bdaafe704bbe103cb27debf1b'),
              (5628,'Key479','Chunk351',12,4,'0','163417/704','f0d015b971a3965fd102bed9bcc9ea382454eca5fc16b1c0b5013bba38be6e71'),
              (5635,'Key480','Chunk352',3,4,'0','164057/704','ce4970ccce50ecdf765d4ba11b30f60a153482a9dcf91e2f72cfcd6e6f007ace'),
              (5643,'Key481','Chunk352',11,4,'0','164697/704','e72dd3498bc104966519fcbda4f7b3e308bb8dfe589710db7ff517bb4d0ec422'),
              (5647,'Key482','Chunk352',15,4,'0','165337/704','8b0d0a1f648fc51763fe537574035b094176ed36e348c0b3f4bd6b00bfbc4c41'),
              (5654,'Key483','Chunk353',6,4,'0','165977/704','17b4eddfb22c280957aa811a3dfa239d18cdd372c13381d8149a9713b49c9f7c')]
          accepted={x['group']:x for x in a['tables']}
          aggregate={x['group']:x for x in g['tables']}
          records=[]; seen=set(prior)|{85}
          for i,k,ch,off,n,k0,k1,h in frozen:
              rec=accepted[k]
              assert rec==aggregate[k] and all(rec[x]==v for x,v in exp[k].items())
              assert rec['theorem']=='nf698'+k+'Moment' and set(rec['axioms'])<={'propext','Classical.choice','Quot.sound'}
              slot=slots[i]; assert i not in seen; seen.add(i)
              assert tuple(map(F,slot['key']))==tuple(map(F,rec['key']))==(F(k0),F(k1))
              assert (slot['chunk'],slot['offset'],slot['rows'],rec['rows'])==(ch,off,n,n)
              src=(root/'NF698'/(k+'.lean')).read_bytes()
              assert sha(src)==rec['sha256']==h
              chunk=(bank/(ch+'.lean')).read_bytes()
              assert sha(chunk)==next(x['sha256'] for x in bm['files'] if x['file']==ch+'.lean')
              rows=re.findall(r'#\[\n    (.*?)\n  \]',chunk.decode(),re.S)
              mt=re.search(r'def nf698'+k+r'Table : NF624KeyTable := ⟨⟨\(([^:]+):ℚ\),\(([^:]+):ℚ\)⟩, #\[\n    (.*?)\n  \]⟩',src.decode(),re.S)
              assert len(rows)==16 and mt and tuple(map(F,mt.group(1,2)))==(F(k0),F(k1))
              assert mt[3]==rows[off] and len(mt[3].split(',\n    '))==n
              records.append(dict(index=i,key=[k0,k1],rows=n,receipt=k,chunk=ch,offset=off,pair=6,source_sha256=h))
          assert len(records)==8 and sum(x['rows'] for x in records)==35
          Path('nf698-tail-batch-reconciliation.json').write_text(json.dumps({'records':records,'bank_manifest_sha256':bh,'analytic_manifest_sha256':mh,'disjoint_from':1422},indent=2)+'\n')
          print('NF698 pair06 batch00 exact eight-table source reconciliation PASS')
          with zipfile.ZipFile('tail-staging/batch00.zip') as z:
              matches=[x for x in z.namelist() if Path(x).name=='nf698-tail-batch00-audit.json']
              assert len(matches)==1
              done=read(z,matches[0])
          assert done['records']==records and done['rows']==35
          assert set(done['theorems'])=={f"nf698TailSlot{r['index']:05d}"+v for r in records for v in ('Key','Length','RowsEq','Sound','PayloadEq','Concrete')}
          assert all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in done['theorems'].values())
          slotmap={tuple(map(F,x['key'])):x for x in slots}
          assert len(slotmap)==7835
          rest=[]
          for k in (f'Key{j}' for j in range(484,557)):
              rec=accepted[k]
              assert rec==aggregate[k] and all(rec[x]==v for x,v in exp[k].items())
              assert rec['theorem']=='nf698'+k+'Moment' and set(rec['axioms'])<={'propext','Classical.choice','Quot.sound'}
              key=tuple(map(F,rec['key'])); slot=slotmap[key]
              i,ch,off,n=(slot[v] for v in ('index','chunk','offset','rows'))
              assert i not in seen; seen.add(i)
              assert n==rec['rows']
              src=(root/'NF698'/(k+'.lean')).read_bytes()
              assert sha(src)==rec['sha256']
              chunk=(bank/(ch+'.lean')).read_bytes()
              assert sha(chunk)==next(x['sha256'] for x in bm['files'] if x['file']==ch+'.lean')
              rows=re.findall(r'#\[\n    (.*?)\n  \]',chunk.decode(),re.S)
              mt=re.search(r'def nf698'+k+r'Table : NF624KeyTable := ⟨⟨\(([^:]+):ℚ\),\(([^:]+):ℚ\)⟩, #\[\n    (.*?)\n  \]⟩',src.decode(),re.S)
              assert len(rows)==min(16,7835-16*int(ch[-3:])) and mt and tuple(map(F,mt.group(1,2)))==key
              assert mt[3]==rows[off] and len(mt[3].split(',\n    '))==n
              rest.append(dict(index=i,key=list(map(str,key)),rows=n,receipt=k,chunk=ch,offset=off,pair=6,source_sha256=rec['sha256']))
          assert len(rest)==73 and sum(x['rows'] for x in rest)==310
          assert sha(json.dumps(rest,sort_keys=True,separators=(',',':')).encode())=='b53f99689de6cb8e1d4c521136bb6a9f9d0e2103aa89a2bbc788aa6b94d0dc37'
          assert len(seen)==1503
          Path('nf698-tail-remainder-records.json').write_text(json.dumps(rest,indent=2)+'\n')
          print('NF698 pair06 remainder: 73 exact original slots / 310 rows reconciled')
          with zipfile.ZipFile('tail-staging/pair6done.zip') as z:
              raw6=z.read('nf698-tail-remainder-manifest.json'); m6=json.loads(raw6)
              assert len(m6['batches'])==10 and len(m6['source_sha256'])==93
              assert [x for b in m6['batches'] for x in b['records']]==rest
              names=set()
              for b in m6['batches']:
                  q=read(z,'nf698-tail-remainder-evidence/'+b['target']+'-audit.json')
                  expected={f"nf698TailSlot{x['index']:05d}"+v for x in b['records'] for v in ('Key','Length','RowsEq','Sound','PayloadEq','Concrete')}
                  assert q['records']==b['records'] and q['manifest_sha256']==sha(raw6)
                  assert set(q['theorems'])==set(b['expected_theorems'])==expected
                  assert names.isdisjoint(expected) and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in q['theorems'].values())
                  names.update(expected)
              assert len(names)==438
              for p,h in m6['source_sha256'].items(): assert sha(z.read('WeilDefect/Generated/NF698Tail/'+p))==h
          bounds={
              7:(557,637,80,344,'9b3014a2be4d47475e13c0f5198ff651ef31ec243da62c5de78a23ef2b30b764'),
              8:(637,707,70,342,'2cd595e4b46844c6fa4b07740c5ddcc07d43e3a07c38dc102800d2089d4f0067'),
              9:(707,780,73,339,'28e57e12a853cccda7af17b865a19b45d662e2a52b9365d88fd566538776cc66'),
              10:(780,854,74,338,'b48a7f4385d6386517c2a478b4f9209b8632aa486aea951693699fa6014222cd'),
              11:(854,930,76,334,'5623beda1ca1de2eac7d77fcc915ef3db717f1e230c1d8cc334be0d9323102c0')}
          import os
          selected=int(os.environ['PAIR']); assert selected in bounds
          bypair={}
          for pair,(lo,hi,count,total,digest) in bounds.items():
              with zipfile.ZipFile(f'tail-staging/pair{pair}.zip') as z:
                  receipt=read(z,'nf698-audit.json')
              assert receipt['pair']==pair and receipt['manifest_sha256']==mh
              assert receipt['full_plan_sha256']==m['full_plan_sha256']
              assert len(receipt['tables'])==count and sum(x['rows'] for x in receipt['tables'])==total
              acceptedp={x['group']:x for x in receipt['tables']}
              assert set(acceptedp)=={x['group'] for x in exp.values() if x['family']//2==pair}=={f'Key{j}' for j in range(lo,hi)}
              recs=[]
              for j in range(lo,hi):
                  k=f'Key{j}'; rec=acceptedp[k]
                  assert rec==aggregate[k] and all(rec[x]==v for x,v in exp[k].items())
                  assert rec['theorem']=='nf698'+k+'Moment' and set(rec['axioms'])<={'propext','Classical.choice','Quot.sound'}
                  key=tuple(map(F,rec['key'])); slot=slotmap[key]
                  i,ch,off,n=(slot[v] for v in ('index','chunk','offset','rows'))
                  assert i not in seen; seen.add(i)
                  assert n==rec['rows']
                  src=(root/'NF698'/(k+'.lean')).read_bytes()
                  assert sha(src)==rec['sha256']
                  chunk=(bank/(ch+'.lean')).read_bytes()
                  assert sha(chunk)==next(x['sha256'] for x in bm['files'] if x['file']==ch+'.lean')
                  rows=re.findall(r'#\[\n    (.*?)\n  \]',chunk.decode(),re.S)
                  mt=re.search(r'def nf698'+k+r'Table : NF624KeyTable := ⟨⟨\(([^:]+):ℚ\),\(([^:]+):ℚ\)⟩, #\[\n    (.*?)\n  \]⟩',src.decode(),re.S)
                  assert len(rows)==min(16,7835-16*int(ch[-3:])) and mt and tuple(map(F,mt.group(1,2)))==key
                  assert mt[3]==rows[off] and len(mt[3].split(',\n    '))==n
                  recs.append(dict(index=i,key=list(map(str,key)),rows=n,receipt=k,chunk=ch,offset=off,pair=pair,source_sha256=rec['sha256']))
              assert len(recs)==count and sum(x['rows'] for x in recs)==total
              assert sha(json.dumps(recs,sort_keys=True,separators=(',',':')).encode())==digest
              bypair[pair]=recs
          assert len(seen)==1876 and sum(map(len,bypair.values()))==373
          assert sum(x['rows'] for a in bypair.values() for x in a)==1697
          Path('nf698-tail-final-records.json').write_text(json.dumps(bypair[selected],indent=2)+'\n')
          print('NF698 final five pairs: 373 exact slots / 1697 rows; pair 06 evidence authenticated; selected pair',selected)
