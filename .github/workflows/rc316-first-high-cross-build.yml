name: RC316 original high-cross certificate
on:
  push:
    branches:
      - research/rpb108-rc316-first-high-cross
    paths:
      - "scripts/validate_rpb108_rc316_first_high_cross.py"
      - ".github/workflows/rc316-first-high-cross-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned original high-cross rational certificate and reverse replay
        run: |
          python scripts/validate_rpb108_rc316_first_high_cross.py --output certificates/rpb108_rc316_first_high_cross.json
          python scripts/validate_rpb108_rc316_first_high_cross.py --output certificates/rpb108_rc316_first_high_cross.json --replay
      - name: Freeze rational RC316 certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc316_first_high_cross.json
          if ! git diff --cached --quiet; then
            git commit -m "RC316: freeze signed high-cross rational certificate"
            git fetch origin research/rpb108-rc316-first-high-cross
            git rebase origin/research/rpb108-rc316-first-high-cross
            git push origin HEAD:research/rpb108-rc316-first-high-cross
          fi
