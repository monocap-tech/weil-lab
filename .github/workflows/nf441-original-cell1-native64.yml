name: Weil-Lab NF441 original cell1 source-native 64 Cheb
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf441_original_cell1_source_native_cheb64.py'
      - '.github/workflows/nf441-original-cell1-native64.yml'
permissions:
  contents: read
jobs:
  original-J1-native-64:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install python-flint==0.8.0
      - name: Original source-correlated physical J1 both n2 and n3 sides
        run: |
          python3 -m py_compile scripts/local_replay/nf441_original_cell1_source_native_cheb64.py
          python3 scripts/local_replay/nf441_original_cell1_source_native_cheb64.py --modes 64 --precision 2048 --output artifacts/NF441_original_true_J1_native64.json
      - name: Original two-positive-prime-both-translate and no principal-jump replacement
        run: |
          python3 - <<'PY'
          import json,sys
          from fractions import Fraction as F
          sys.set_int_max_str_digits(0)
          d=json.load(open('artifacts/NF441_original_true_J1_native64.json'))
          assert d['pass']=='NF441'
          assert d['source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert d['seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert d['original_true_cell1']=='(0,11/10-log(3))'
          assert d['analytic_Chebyshev_center']=='7/10000'
          assert d['analytic_Chebyshev_halfwidth']=='1/1250'
          assert d['original_minus_translate_primes']==[2,3]
          assert d['original_plus_translate_primes']==[2,3]
          assert d['original_neither_prime_branches']==[4,5,7,8,9]
          assert d['original_independent_direct_source_both_n2_and_n3_prime_overlap_pass']
          assert d['original_independent_direct_source_endpoint_overlap_pass']
          assert d['common_endpoint_image_indices']==2048
          assert d['number_of_certified_low_mode_coefficients']==64
          assert [x['n'] for x in d['coefficients']]==list(range(64))
          assert all(F(x['true_original_cell1_fixed_branch_coefficient_outward_interval'][1])-F(x['true_original_cell1_fixed_branch_coefficient_outward_interval'][0])<F(1,10**44) for x in d['coefficients'])
          assert not d['true_cell1_signed_pz_and_z2_integrated']
          assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF441 PASS original J1 full source low64 Cheb n2/n3 BOTH-SIGNED, principal r jump ZERO, signed OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF441-original-true-cell1-native-64
          path: artifacts/NF441_original_true_J1_native64.json
          if-no-files-found: error
