name: RPB108 PS08 original graph-Galerkin quantitative rank gate

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps08_quantitative_galerkin.py"
      - "notes/RPB108_PS08_QUANTITATIVE_GALERKIN_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps08-quant-galerkin.yml"
  workflow_dispatch:

jobs:
  ps08-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact original seven-prime parent replay and Galerkin rank/error
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps08_quantitative_galerkin.py
          python3 scripts/validate_rpb108_ps08_quantitative_galerkin.py
      - name: Confirm canonical obligation and method-only standing
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(value is False for value in p["closures"].values())
          PY
