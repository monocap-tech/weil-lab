name: NF719 parallel original second HD/A matrix row index one blocks 016–023
on:
  pull_request:
    paths:
      - "scripts/nf719_parallel_original_row_one_shards.py"
      - ".github/workflows/nf719-parallel-original-row-one-shards.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf719-parallel-original-matrix-row-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-shards:
    name: Original global index-one blocks ${{ matrix.first }}–${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {first: 16, end: 20}
          - {first: 20, end: 24}
    env:
      FIRST: ${{ matrix.first }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strictly check source-plan syntax and exact packed-coordinate coverage
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/nf715_second_global_matrix_row_driver.py \
            scripts/nf716_second_global_matrix_row_continuation.py \
            scripts/nf719_parallel_original_row_one_shards.py
          python scripts/nf719_parallel_original_row_one_shards.py preflight --first-block "$FIRST" --end-block "$END"
      - name: Restore immutable NF702 original scaled input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nf719-receipts/{input,cache-proposals,cache-audit,packed-proposals,packed-audit}
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14582437652/zip" -o nf719-input.zip
          echo "258637da71e96468ed7c6ac5b0a4480ce06cdee9989aef8e71a4cd09059789e0  nf719-input.zip" | sha256sum -c -
          unzip -q nf719-input.zip -d nf719-receipts/input
      - name: Restore accepted NF703 full original center cache source proposals
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-proposals
          path: nf719-receipts/cache-proposals
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore NF703 source-bound complete center-cache axiom audit
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-audit
          path: nf719-receipts/cache-audit
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore all accepted NF700 original packed second-row source products
        uses: actions/download-artifact@v4
        with:
          name: nf700-packed-matrix-proposals
          path: nf719-receipts/packed-proposals
          run-id: 44623902055
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore strict NF700 original packed-source 527-declaration kernel audit
        uses: actions/download-artifact@v4
        with:
          name: nf700-complete-packed-matrix-audit
          path: nf719-receipts/packed-audit
          run-id: 44623902055
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate NF715 accepted first second-row 12-theorem kernel source and audit
        uses: actions/download-artifact@v4
        with:
          name: nf715-first-second-global-matrix-row-certificates
          path: nf719-prior
          run-id: 44660635800
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct immutable NF715 source and emit independently bounded actual global product certificates
        run: |
          set -euo pipefail
          python scripts/nf719_parallel_original_row_one_shards.py prepare \
            --first-block "$FIRST" --end-block "$END" 2>&1 | tee nf719-preflight.log
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF719')
          m=json.loads((d/'manifest.json').read_text())
          first,end=int(os.environ['FIRST']),int(os.environ['END'])
          assert m['schema']=='NF719-parallel-original-global-row-one-shard-v1'
          assert (m['first_block'],m['end_block'])==(first,end)
          assert (m['original_index'],m['first'],m['end'])==(1,8*first,8*end)
          assert m['new_HD_gates']==m['new_A_gates']==32
          assert m['coordinates']==list(range(8*first,8*end))
          assert len(m['files'])==4 and len(m['audit_theorems'])==32
          for f in m['files']:
              assert hashlib.sha256((d/f['file']).read_bytes()).hexdigest()==f['sha256']
          print('NF719 exact 32-coordinate original source-bound preflight PASS')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Reuse accepted NF707 compiled original scaled-input objects
        uses: actions/download-artifact@v4
        with:
          name: nf707-compiled-original-input
          path: nf708-compiled-input
          run-id: 44633937710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate producer source and matching Lean environment before compiled object reuse
        run: |
          set -euo pipefail
          python scripts/nf708_global_matrix_attachment_driver.py restore-input
      - name: Compile genuine original center cache and four packed local matrix-product blocks
        timeout-minutes: 245
        run: |
          set -euo pipefail
          /usr/bin/time -o nf719-source-time.log -f 'elapsed=%e user=%U rss_kb=%M exit=%x' \
            lake build WeilDefect.Generated.NF703Cache.Data \
              WeilDefect.Generated.NF715.Common 2>&1 | tee nf719-source-build.log
          for ((i=FIRST;i<END;i++)); do
            printf -v b 'Block%03d' "$i"
            lake build "WeilDefect.Generated.NF700.$b" 2>&1 | tee -a nf719-source-build.log
          done
      - name: Kernel-check four bounded actual global HD row-one / A column-one blocks
        timeout-minutes: 95
        run: |
          set -euo pipefail
          for ((i=FIRST;i<END;i++)); do
            printf -v b 'Block%03d' "$i"
            /usr/bin/time -a -o nf719-kernel-time.log -f 'block='$b' elapsed=%e rss_kb=%M exit=%x' \
              lake build "WeilDefect.Generated.NF719.$b" 2>&1 | tee -a nf719-kernel-build.log
          done
      - name: Independently audit all 32 source-bound Lean theorems and their exact provenance
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python scripts/nf719_parallel_original_row_one_shards.py axiom-file \
            --first-block "$FIRST" --end-block "$END"
          lake env lean nf719Audit.lean 2>&1 | tee nf719-axioms.log
          python scripts/nf719_parallel_original_row_one_shards.py verify \
            --first-block "$FIRST" --end-block "$END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf719-source-bound-${{ matrix.first }}-${{ matrix.end }}
          path: |
            nf719-*.log
            nf719-*-time.log
            nf719-shard-audit.json
            WeilDefect/Generated/NF719/
          if-no-files-found: ignore
  aggregate:
    needs: source-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore only completed kernel-and-axiom-audited original global shards
        uses: actions/download-artifact@v4
        with:
          pattern: nf719-source-bound-*
          path: nf719-audits
          merge-multiple: false
      - name: Strict source SHA, disjoint-coverage, exact 64-name and standard-axiom aggregate
        run: |
          set -euo pipefail
          python -m py_compile scripts/nf719_parallel_original_row_one_shards.py
          python scripts/nf719_parallel_original_row_one_shards.py aggregate \
            --audits nf719-audits
      - uses: actions/upload-artifact@v4
        with:
          name: nf719-complete-original-global-matrix-row-one-64-coordinate-audit
          path: nf719-complete-audit.json
          if-no-files-found: error
