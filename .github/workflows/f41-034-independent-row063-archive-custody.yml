name: F41-034 independent original row063 archive custody (NO new Lean)
on:
  pull_request:
    paths:
      - 'verification/f41/f41_034/**'
      - '.github/workflows/f41-034-independent-row063-archive-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: f41-034-receipt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-original-row063:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      F41_RUN_ID: '45291263611'
      F41_ARTIFACT_ID: '14875297867'
      F41_ZIP_SHA256: '0c2b2d70f8f239446dab0f6712194c3f7ad0a75b2370f14644b0866a38188a6b'
    steps:
      - uses: actions/checkout@v4
      - name: Source-only Python preflight and four negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile verification/f41/f41_034/f41_034_row063_archive_audit.py
          python3 verification/f41/f41_034/f41_034_row063_archive_audit.py selftest
      - name: Independently verify successful F41-033 original compiler run and pinned ZIP artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p f41-034-receipt
          python3 - <<'PY'
          import json,os,re,urllib.request
          runid=os.environ['F41_RUN_ID']
          artifactid=os.environ['F41_ARTIFACT_ID']
          expected=os.environ['F41_ZIP_SHA256']
          assert re.fullmatch(r'\d+',runid) and re.fullmatch(r'\d+',artifactid)
          assert re.fullmatch(r'[0-9a-f]{64}',expected)
          root=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=hdr),timeout=30) as r:
                  return json.load(r)
          run=get(root+'/actions/runs/'+runid)
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']=='69e23df8c5f94427dc1802a1644c6647d253fdad'
          assert run['name']=='F41-033 original physical H/V row063 actual full-payment Lean gate'
          assert run['head_repository']['full_name']=='monocap-tech/weil-lab'
          artifact=get(root+'/actions/artifacts/'+artifactid)
          assert artifact['workflow_run']['id']==int(runid)
          assert artifact['name']=='f41-033-original-full-payment-row063-kernel-evidence'
          assert not artifact['expired']
          assert artifact['digest']=='sha256:'+expected
          assert artifact['size_in_bytes']>0
          with open('f41-034-receipt/validated-producer.json','w') as f:
              json.dump({'run_id':int(runid),'artifact_id':int(artifactid),'run_head_sha':run['head_sha'],
                  'run_conclusion':'success','artifact_zip_sha256':expected},f,indent=2)
          print('F41-034 externally confirmed successful original compiler and pinned ZIP digest')
          PY
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$F41_ARTIFACT_ID/zip" -o f41-034-receipt/f41-033-original-row063.zip
          echo "$F41_ZIP_SHA256  f41-034-receipt/f41-033-original-row063.zip" | sha256sum -c -
          python3 verification/f41/f41_034/f41_034_row063_archive_audit.py audit \
            --zip f41-034-receipt/f41-033-original-row063.zip \
            --expected-zip-sha256 "$F41_ZIP_SHA256" \
            --run-url "https://github.com/monocap-tech/weil-lab/actions/runs/$F41_RUN_ID" \
            --run-status success \
            --output f41-034-receipt/f41-034-original-row063-independent-custody.json
      - name: Preserve independent row63 custody evidence (only after audit)
        uses: actions/upload-artifact@v4
        with:
          name: f41-034-original-physical-row063-independent-audit
          path: |
            f41-034-receipt/validated-producer.json
            f41-034-receipt/f41-034-original-row063-independent-custody.json
          if-no-files-found: error