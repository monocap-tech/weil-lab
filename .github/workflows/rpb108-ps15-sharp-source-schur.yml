name: RPB108 PS15 original sharp source signed Schur domain

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps15_sharp_source_schur.py"
      - "notes/RPB108_PS15_SHARP_SOURCE_SCHUR_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps15-sharp-source-schur.yml"
  workflow_dispatch:

jobs:
  ps15-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay full original signed source and bound actual sharp Schur cross
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps15_sharp_source_schur.py
          python3 scripts/validate_rpb108_ps15_sharp_source_schur.py
      - name: Enforce open complement and canonical W-ODD-NEG
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
