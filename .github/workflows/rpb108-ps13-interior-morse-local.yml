name: RPB108 PS13 original unshifted interior local-form checks

on:
  pull_request:
    paths:
      - "notes/RPB108_PS13_INTERIOR_MORSE_LOCAL_20261017.md"
      - "scripts/validate_rpb108_ps13_interior_morse_local.py"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps13-interior-morse-local.yml"
  workflow_dispatch:

jobs:
  ps13-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay originals and certify unshifted Q local and index bounds
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps13_interior_morse_local.py
          python3 scripts/validate_rpb108_ps13_interior_morse_local.py
      - name: Keep canonical W-ODD-NEG open
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
