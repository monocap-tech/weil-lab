name: mg07-full470-reference-weighted-galerkin

on:
  pull_request:
    paths:
      - 'scripts/validate_rpb108_mg07_preconditioned_470_residual.py'
      - 'scripts/validate_rpb108_mg07_global_negative_sup.py'
      - 'scripts/validate_rpb108_mg07_augmented_si29_trial.py'
      - 'scripts/validate_rpb108_mg07_si29_feature_strong_tail.py'
      - 'scripts/validate_rpb108_mg07_pole_aligned_si29_tail.py'
      - 'scripts/validate_rpb108_mg07_two_source_original_physical_pole_input.py'
      - 'scripts/validate_rpb108_mg07_two_source_endpoint_log_tail.py'
      - 'scripts/validate_rpb108_mg07_two_source_stop_low_band_reduction.py'
      - 'scripts/validate_rpb108_mg07_augmented_young_ray_gate.py'
      - 'scripts/scout_rpb108_mg07_augmented_true_si29_two_source.py'
      - 'notes/RPB108_MG07_SI29_AUGMENTED_TRIAL_20261023.md'
      - 'notes/RPB108_MG07_GLOBAL_NEGATIVE_SUP_20261023.md'
      - 'notes/RPB108_MG07_FULL470_REFERENCE_RESIDUAL_20261019.md'
      - 'research/obligations.json'
      - '.github/workflows/rpb108-mg07-preconditioned-470.yml'
  workflow_dispatch:

jobs:
  mg07-original-470-preconditioned-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Trusted exact-rational certificates exceed Python 3.11's default
      # 4300-digit display limit. Keep a finite cap; arithmetic is unchanged.
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Verify original geometry and full coupled matrix theorem
        run: |
          python -m py_compile scripts/validate_rpb108_mg07_preconditioned_470_residual.py scripts/validate_rpb108_mg07_global_negative_sup.py
          python scripts/validate_rpb108_mg07_global_negative_sup.py
          python scripts/validate_rpb108_mg07_augmented_si29_trial.py
          python scripts/validate_rpb108_mg07_si29_feature_strong_tail.py
          python scripts/validate_rpb108_mg07_pole_aligned_si29_tail.py
          python scripts/validate_rpb108_mg07_two_source_original_physical_pole_input.py
          python scripts/validate_rpb108_mg07_two_source_endpoint_log_tail.py
          python scripts/validate_rpb108_mg07_two_source_stop_low_band_reduction.py
          python scripts/validate_rpb108_mg07_augmented_young_ray_gate.py
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg07_preconditioned_470_residual.py
      - name: Fail closed on unresolved original full operator
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction as F
          d=json.load(open("artifacts/mg07_470_preconditioned_residual.json"))
          assert d["canonical_W_ODD_NEG"]=="OPEN"
          assert d["original_exceptional_source_count"]==470
          assert d["original_negative_cap_columns"]==890
          assert d["original_true_positive_reference_features"]==14
          assert F(d["original_kappa_star"])==F(33621,10**9)
          assert F(d["whole_odd_sufficient_theta"])==F(51,56)
          assert F(d["original_full_negative_norm_upper"])==F(871887,70000)
          assert F(d["prior_repaired_mass_based_norm_upper"])==F(13244372713,160000000)
          assert F(d["new_global_negative_norm_improvement_factor"])>6
          assert F(d["feature_and_pole_orthogonal_ratio_to_old"])==F(33621,10**6)
          assert F(d["old_t1_scalar_residual_coefficient"])>F(d["feature_and_pole_orthogonal_coefficient"])
          assert d["toy"]["exact_full_coupled_two_source_test"]
          assert F(d["toy"]["strict_reference_residual_gain_trace"])>0
          assert not d["whole470_schur_acceptance_certified"]
          assert not d["original_complete_residual_physical_Grams_computed"]
          assert not d["entire_original_odd_negative_index_classified"]
          assert d["even_Weil_CC27_RH"]=="OPEN"
          assert d["independent_Fourier_and_form_domain_audit"]=="OPEN"
          PY
      - name: NONCERTIFYING original two-source SI29 augmented numerical scout
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/scout_rpb108_mg07_augmented_true_si29_two_source.py --quick
          python - <<'PY'
          import json
          x=json.load(open("artifacts/mg07_augmented_true_si29_ray_NONCERTIFYING.json"))
          assert x["status"].startswith("NONCERTIFYING")
          assert not x["claim_genuine_original_470_source_G_N_loewner"]
          assert x["odd_even_Weil_CC27_RH"]=="OPEN"
          assert x["source_count"]==470 and x["original_source_support"]==2
          assert x["SI29_features_true"]==14
          assert all(y["all_Fourier_approximations_uncontrolled"] for y in x["all_tests"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mg07-augmented-original-source-ray-NONCERTIFYING
          path: artifacts/mg07_augmented_true_si29_ray_NONCERTIFYING.json
      - uses: actions/upload-artifact@v4
        with:
          name: mg07-full470-reference-residual-gate
          path: artifacts/mg07_470_preconditioned_residual.json
