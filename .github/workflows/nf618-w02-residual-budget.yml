name: NF618 W02 original row residual budget
on:
  push:
    branches: [research/nf618-w02-residual-budget]
    paths: ['.github/workflows/nf618-w02-residual-budget.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5801507d416e4a699c002920b2441f5aa0c19aef
          path: research
          sparse-checkout: scripts/verify_nf620_physical_key_tables.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: dea274a9554f9705bea2202b82c72e144b15d159
          path: historical
          sparse-checkout: |
            custody/run_46076027949-attempt_1/recovery.json
            custody/run_46076027949-attempt_1/nf690-payload/
          sparse-checkout-cone-mode: false
      - name: Exact external replay with frozen literals and historical evaluator control
        run: |
          set -euo pipefail
          mkdir evidence
          cp budget.py evidence/
          cp research/scripts/verify_nf620_physical_key_tables.py evidence/
          python3 budget.py 2>&1 | tee evidence/budget.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf618-w02-residual-budget
          path: evidence/
          if-no-files-found: error
  custody:
    needs: diagnose
    if: always() && needs.diagnose.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nf618-w02-residual-budget
      - name: Preserve exact diagnostic receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.diagnose.result }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          d="custody/run_$GITHUB_RUN_ID-attempt_$GITHUB_RUN_ATTEMPT"
          mkdir -p "$d"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq -e '[.artifacts[] | select(.name=="nf618-w02-residual-budget" and .expired==false)] | if length==1 then .[0] else error("missing evidence") end' > "$d/metadata.json"
          id=$(jq -er .id "$d/metadata.json")
          hash=$(jq -er '.digest | sub("^sha256:";"")' "$d/metadata.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$d/evidence.zip"
          echo "$hash  $d/evidence.zip" | sha256sum -c -
          python3 -m zipfile -t "$d/evidence.zip"
          printf 'diagnose_result=%s\nhead=Batch24R1\nnew_admissions=0\nhold=unchanged\n' "$RESULT" > "$d/status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$d"
          git commit -m 'NF618 preserve exact residual budget diagnosis [skip ci]'
          git push origin "HEAD:refs/heads/research/nf618-w02-residual-budget"
          git fetch --no-tags origin "research/nf618-w02-residual-budget"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          test "$(git show "FETCH_HEAD:$d/evidence.zip" | sha256sum | cut -d' ' -f1)" = "$hash"
