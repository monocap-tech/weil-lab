name: NF506 independent 242D Schur posterior

on:
  push:
    branches:
      - 'research/nf506-original-J8-independent-posterior-schur'
    paths:
      - '.github/workflows/nf506-original-J8-independent-posterior-schur.yml'
      - 'scripts/local_replay/verify_nf506_independent_a_posteriori_schur.py'
      - 'scripts/local_replay/verify_nf506_support_expansion_exact.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  nf506-242d-independent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43352403600
          name: nf504-original-J8-full-242D-support-saturated-exterior-source-native
          path: native
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 43352403600
          name: nf505-original-independent-242D-true-J8-saturated-Schur
          path: audit
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --only-binary=:all: numpy==2.3.5
      - name: Verify all 242D inverse entries through integer posterior algebra
        run: |
          python -u -X int_max_str_digits=0 scripts/local_replay/verify_nf506_independent_a_posteriori_schur.py \
            --native native/nf504-original-J8-physical-support-saturated-exterior-source-native.json \
            --nf505-audit audit/nf505-original-J8-support-saturated-independent-exact.json \
            --output nf506-independent-posterior-result.json
      - name: Verify support liberation with exact Fraction controls
        run: python scripts/local_replay/verify_nf506_support_expansion_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: nf506-source-original-242D-independent-posterior
          path: nf506-independent-posterior-result.json
          retention-days: 90
