name: Weil-Lab NF425 original cell6 Chebyshev analytic degree exact
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf425_original_cell6_chebyshev_existence_exact.py'
      - 'notes/provisional/NF425_ORIGINAL_CELL6_CHEBYSHEV_DEGREE_AND_DIRECT_COEFFICIENT_FORMULA_20261031.md'
      - '.github/workflows/nf425-cell6-chebyshev-existence.yml'
      - 'notes/data/provisional/NF407_original_fourth_physical_coefficients_native.json'
      - 'notes/data/provisional/NF406_original_prime_support_partition_exact.json'
      - 'notes/data/provisional/NF423_original_entire_open_cell6_zthird_native.json'
      - 'scripts/local_replay/nf424_original_cell6_global_exponential_transfer_exact.py'
permissions:
  contents: read
jobs:
  exact-original-source-ellipse-degree:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck original source, true knot branch, pole regularization premises and ellipse bound
        run: |
          python3 -m py_compile scripts/local_replay/nf425_original_cell6_chebyshev_existence_exact.py
          python3 scripts/local_replay/nf425_original_cell6_chebyshev_existence_exact.py \
            --output artifacts/NF425_original_cell6_chebyshev_existence_exact.json
      - name: Retain independent exact source/rational Chebyshev certificate
        uses: actions/upload-artifact@v4
        with:
          name: NF425-original-cell6-chebyshev-existence-exact
          path: artifacts/NF425_original_cell6_chebyshev_existence_exact.json
          if-no-files-found: error
