name: NF741 actual signed Weil mixed EF exact two-window naturality
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVWindowNaturality.lean"
      - "scripts/nf741_original_literal_window_naturality_audit.py"
      - ".github/workflows/nf741-actual-mixed-window-naturality.yml"
      - "docs/NF741_PHASE_IV_EXACT_WINDOW_NATURALITY.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nf741-actual-mixed-window-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-and-kernel-original-mixed-weil:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source preflight — authentic source window, full divisor and all theorem statements
        run: |
          set -euo pipefail
          python -m py_compile scripts/nf741_original_literal_window_naturality_audit.py
          python scripts/nf741_original_literal_window_naturality_audit.py preflight
      - name: Install pinned original Lean 4.34 and Mathlib cache
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Build exact original zeta mixed Weil window-naturality Lean module
        timeout-minutes: 190
        run: |
          set -euo pipefail
          /usr/bin/time -o nf741-build-resource.log -f 'elapsed=%e rss_kb=%M exit=%x' \
            lake build WeilDefect.Arithmetic.ActualZetaPhaseIVWindowNaturality 2>&1 | tee nf741-original-mixed-window-build.log
      - name: Direct Lean proof/axiom audit for 9 new source theorems and 3 genuine source anchors
        timeout-minutes: 35
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaPhaseIVWindowNaturality.lean 2>&1 | tee nf741-original-mixed-window-axioms.log
          python scripts/nf741_original_literal_window_naturality_audit.py verify
          test -s nf741-original-mixed-window-naturality-kernel-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf741-original-source-bound-mixed-window-naturality-kernel-audit
          path: |
            nf741-original-mixed-window-build.log
            nf741-original-mixed-window-axioms.log
            nf741-original-mixed-window-naturality-kernel-audit.json
            nf741-build-resource.log
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaPhaseIVWindowNaturality.olean
          if-no-files-found: ignore
          include-hidden-files: true
