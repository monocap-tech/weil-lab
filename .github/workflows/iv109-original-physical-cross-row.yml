name: IV109 original physical cross-row — kernel gate
on:
  push:
    branches:
      - staging/iv109-original-physical-cross-row
    paths:
      - "WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV103OriginalSchwartzSpectralAttachment.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV102OriginalSchwartzMetricTransport.lean"
      - "WeilDefect/Arithmetic/ActualZetaNativeFormOperator.lean"
      - "WeilDefect/Arithmetic/ActualZetaCanonicalNativeEnergy.lean"
      - "WeilDefect/Arithmetic/ActualZetaLogCarrierSchwartzCompact.lean"
      - "WeilDefect/Morphology/NeutralLogPoleSourceAttachment.lean"
      - ".github/workflows/iv109-original-physical-cross-row.yml"
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV103OriginalSchwartzSpectralAttachment.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV102OriginalSchwartzMetricTransport.lean"
      - "WeilDefect/Arithmetic/ActualZetaNativeFormOperator.lean"
      - "WeilDefect/Arithmetic/ActualZetaCanonicalNativeEnergy.lean"
      - "WeilDefect/Arithmetic/ActualZetaLogCarrierSchwartzCompact.lean"
      - "WeilDefect/Morphology/NeutralLogPoleSourceAttachment.lean"
      - ".github/workflows/iv109-original-physical-cross-row.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iv109-original-physical-cross-row-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-physical-cross-row-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Strict IV109 original-source preflight
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path("WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.lean").read_text()
          names=["neutralIV109Weight_sq_le","neutralIV109SpectralRow_memLp","neutralIV109SpectralRow_pair","neutralIV109RowConstant_nonneg","neutralIV109Mixed_physical_bound","neutralIV109Original_garding"]
          assert len(names)==len(set(names))==6
          assert set(re.findall(r"(?m)^theorem (\w+)",s))==set(names)
          assert set(re.findall(r"(?m)^#print axioms (\w+)$",s))==set(names)
          assert all(s.splitlines().count("#print axioms "+n)==1 for n in names)
          assert not re.search(r"\b(?:sorry|admit|sorryAx)\b",s)
          print("IV109 strict preflight: six exact source declarations")
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          lake exe cache get
      - name: Native fresh Lean source build
        run: |
          set -euo pipefail
          mkdir -p iv109/out
          touch iv109/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV109OriginalPhysicalCrossRow 2>&1 | tee iv109/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.olean -nt iv109/out/fresh.stamp
      - name: Exact strict named axiom audit
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.lean 2>&1 | tee iv109/out/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          t=Path("iv109/out/axioms.log").read_text()
          names=["neutralIV109Weight_sq_le","neutralIV109SpectralRow_memLp","neutralIV109SpectralRow_pair","neutralIV109RowConstant_nonneg","neutralIV109Mixed_physical_bound","neutralIV109Original_garding"]
          allowed={"propext","Classical.choice","Quot.sound"}
          found={}
          for name in names:
              full="WeilDefect."+name
              pat=re.compile(r"^'"+re.escape(full)+r"' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)\s*$",re.M)
              hits=list(pat.finditer(t))
              assert len(hits)==1,(full,len(hits))
              axioms=({a.strip() for a in hits[0].group(1).split(",") if a.strip()}
                      if hits[0].group(1) is not None else set())
              assert axioms<=allowed,(full,axioms-allowed)
              found[full]=sorted(axioms)
          assert not re.search(r'(?m)^\s*(?:error:|.*: error:)',t)
          Path("iv109/out/receipts.json").write_text(json.dumps(found,sort_keys=True,indent=2)+"\n")
          print("IV109 six strict source/axiom receipts PASS")
          PY
          git rev-parse HEAD > iv109/out/commit.txt
          sha256sum WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.lean \
            WeilDefect/Arithmetic/ActualZetaIV103OriginalSchwartzSpectralAttachment.lean \
            WeilDefect/Arithmetic/ActualZetaIV102OriginalSchwartzMetricTransport.lean \
            WeilDefect/Arithmetic/ActualZetaNativeFormOperator.lean \
            WeilDefect/Arithmetic/ActualZetaCanonicalNativeEnergy.lean \
            WeilDefect/Arithmetic/ActualZetaLogCarrierSchwartzCompact.lean \
            WeilDefect/Morphology/NeutralLogPoleSourceAttachment.lean \
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.olean > iv109/out/sha256.txt
          sha256sum -c iv109/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv109-original-physical-cross-row-native-lean-receipts
          path: |
            iv109/out/
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV109OriginalPhysicalCrossRow.olean
          if-no-files-found: ignore
          include-hidden-files: true
