name: NF457 source-original endpoint log peel
on:
  pull_request:
  workflow_dispatch:
jobs:
  original-endpoint-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original NF407/NF411/NF450/NF451 and NF404 endpoint residual contract
        run: python -X int_max_str_digits=0 scripts/local_replay/verify_nf457_endpoint_log_peel.py > nf457-source-verified.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf457-original-log-peel
          path: nf457-source-verified.json
