name: mg46-original-joint-missing-frequency-source-covariance
on:
  pull_request:
    paths:
      - 'scripts/validate_rpb108_mg46_joint_omitted_source_cross.py'
      - 'scripts/validate_rpb108_mg46_independent_complete_replay.py'
      - 'notes/RPB108_MG46_ORIGINAL_MISSING_JOINT_SOURCE_RESIDUAL_20261021.md'
      - '.github/workflows/rpb108-mg46-original-missing-joint-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-24D-true-missing-source-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Pin accepted original mg24 physical source evidence
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39378465438
          name: mg24-original-full-frequency-coupled-source-brackets
          github-token: ${{ github.token }}
          path: artifacts/mg24_verified
      - name: Pin accepted original mg29 physical source evidence
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39440914565
          name: mg29-original-adapted-third-24D-source-intervals
          github-token: ${{ github.token }}
          path: artifacts/mg29_verified
      - name: Pin accepted original mg32 physical source evidence
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39459624082
          name: mg32-actual-original-joint-24D-Fourier-residual
          github-token: ${{ github.token }}
          path: artifacts/mg32_verified
      - name: Pin accepted original mg43 physical source evidence
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39522608989
          name: mg43-original-independent-G-S-full24-source-grid
          github-token: ${{ github.token }}
          path: artifacts/mg43_verified
      - name: Pin accepted original mg44 physical source evidence
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39542236311
          name: mg44-original-exact-coupled-source-directional-12-ray-audit
          github-token: ${{ github.token }}
          path: artifacts/mg44_verified
      - name: Pin accepted original mg45 physical source evidence
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39544081287
          name: mg45-original-signed-source-Fourier-ray-384-cells
          github-token: ${{ github.token }}
          path: artifacts/mg45_verified
      - name: Check independent main and replay scripts compile
        run: |
          python -m py_compile scripts/validate_rpb108_mg46_joint_omitted_source_cross.py scripts/validate_rpb108_mg46_independent_complete_replay.py
          test -s artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json
          test -s artifacts/mg29_verified/mg29_original_direct_third_drift.json
          test -s artifacts/mg32_verified/mg32_joint_original_source_residual.json
          test -s artifacts/mg43_verified/mg43_original_independent_G_S_matrix_blend.json
          test -s artifacts/mg44_verified/mg44_original_exact_directional_coupled_source.json
          test -s artifacts/mg45_verified/mg45_original_joint_ray_fourier_residual.json
      - name: New true original complete missing-frequency 24D G/S covariance and signed source trials
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg46_joint_omitted_source_cross.py --verified-mg24-json artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json --verified-mg29-json artifacts/mg29_verified/mg29_original_direct_third_drift.json --verified-mg32-json artifacts/mg32_verified/mg32_joint_original_source_residual.json --verified-mg43-json artifacts/mg43_verified/mg43_original_independent_G_S_matrix_blend.json --verified-mg44-json artifacts/mg44_verified/mg44_original_exact_directional_coupled_source.json --verified-mg45-json artifacts/mg45_verified/mg45_original_joint_ray_fourier_residual.json
      - name: Independently reconstruct all original 256 complement matrices and exact 24D inertia certificates
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg46_independent_complete_replay.py --verified-mg24-json artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json --verified-mg29-json artifacts/mg29_verified/mg29_original_direct_third_drift.json --verified-mg32-json artifacts/mg32_verified/mg32_joint_original_source_residual.json --verified-mg43-json artifacts/mg43_verified/mg43_original_independent_G_S_matrix_blend.json --verified-mg44-json artifacts/mg44_verified/mg44_original_exact_directional_coupled_source.json --verified-mg45-json artifacts/mg45_verified/mg45_original_joint_ray_fourier_residual.json --verified-mg46-json artifacts/mg46_original_joint_missing_frequency_residual.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mg46-original-complete-missing-GS-256-matrix-audit
          path: artifacts/mg46_original_joint_missing_frequency_residual.json
          if-no-files-found: ignore
