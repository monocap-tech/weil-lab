name: RETURN108-U literal carrier integration
on:
  push:
    branches: [research/return108u-carrier-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticated minimal closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f2e8ec89ae4bf8687a652b299b730d6d1baa43f7
          git fetch origin 8866d05c4d795bf153027b0b076a323262b0c71a
          python3 research/return108u/assemble_closure.py 2>&1 | tee return108u-closure.log
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Build literal bridge dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake build WeilDefect.MasterReturn.LogWeightComparison WeilDefect.MasterRecon.V08J WeilDefect.Morphology.NeutralLogHilbertCarrier 2>&1 | tee return108u-deps.log
      - name: Compile and strict named axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean WeilDefect/MasterReturn/LogCarrierBridge.lean 2>&1 | tee return108u-lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path("return108u-lean.log").read_text()
          names = ["recon_le_scaled_iv","iv_le_scaled_recon","iv_energy_to_recon","recon_energy_to_iv","toRecon_physical","toIV_physical","iv_physical_injective","carrierEquiv","carrierEquiv_physical"]
          allowed = {"propext","Classical.choice","Quot.sound"}
          for name in names:
              q = "WeilDefect.MasterReturn.LogCarrierBridge." + name
              m = re.search(r"'" + re.escape(q) + r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  assert f"'{q}' does not depend on any axioms" in s, q
              else:
                  assert {x.strip() for x in m.group(1).split(",") if x.strip()} <= allowed, q
              print("PASS", q)
          print("RETURN108-U strict axiom audit PASS 9/9")
          PY
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return108u-integration
          path: |
            return108u-closure.json
            return108u-closure.log
            return108u-deps.log
            return108u-lean.log
