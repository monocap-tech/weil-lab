name: RPB108 PS06 original Weil form-domain stable partition

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps06_form_domain_partition.py"
      - "notes/RPB108_PS06_FORM_DOMAIN_PARTITION_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps06-form-partition.yml"
  workflow_dispatch:

jobs:
  ps06-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact original signed Weil form graph-norm partition
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps06_form_domain_partition.py
          python3 scripts/validate_rpb108_ps06_form_domain_partition.py
      - name: Canonical obligation and form domain transfer remain open
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
