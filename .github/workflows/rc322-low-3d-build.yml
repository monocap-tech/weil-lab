name: RC322 exact signed low Gram audit
on:
  push:
    branches:
      - research/rpb108-rc322-low-3d-gram
    paths:
      - "scripts/validate_rpb108_rc322_low_3d_gram.py"
      - ".github/workflows/rc322-low-3d-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct all original CC27 P0/P2/P4 signed low entries and reverse replay
        run: |
          python scripts/validate_rpb108_rc322_low_3d_gram.py --output certificates/rpb108_rc322_low_3d_gram.json
          python scripts/validate_rpb108_rc322_low_3d_gram.py --output certificates/rpb108_rc322_low_3d_gram.json --replay
      - name: Freeze source-pinned certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc322_low_3d_gram.json
          if ! git diff --cached --quiet; then
            git commit -m "RC322: freeze complete signed original P0/P2/P4 low Gram"
            git fetch origin research/rpb108-rc322-low-3d-gram
            git rebase origin/research/rpb108-rc322-low-3d-gram
            git push origin HEAD:research/rpb108-rc322-low-3d-gram
          fi
