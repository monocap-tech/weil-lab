name: NF618 real terminal slot
on:
  push:
    branches:
      - research/nf618-real-terminal-slot
    paths:
      - ".github/workflows/nf618-real-terminal-slot.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  batch:
    name: NF618 real terminal slot
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          # Pin installer asset independently of the repository's Lean toolchain.
          archive="$RUNNER_TEMP/nf703-elan.tar.gz"
          digest=0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
          fetch_verified() {
            rm -f "$archive"
            curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 180 "$@" -o "$archive" &&
              printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          }
          if ! fetch_verified https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz; then
            fetch_verified -H 'Accept: application/octet-stream' "https://api.github.com/repos/leanprover/elan/releases/assets/763468108?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          mkdir -p "$RUNNER_TEMP/nf703-elan"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nf703-elan"
          "$RUNNER_TEMP/nf703-elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan --version
          cat lean-toolchain
          retry() {
            local n
            for n in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$n" -lt 3 ]; then sleep "$((15*n))"; fi
            done
            return 1
          }
          retry elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          retry lake update
          retry lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
          run-id: 44598398608
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=json.loads(Path('compiled-bank/nf697-bank-binding.json').read_text())
          b=json.loads(Path('nf697-bank-binding.json').read_text())
          for x in (a,b):
              f=x.pop('fingerprint')
              assert hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()==f
          assert a['schema']==b['schema'] and a['environment']==b['environment']
          assert all(b['files'].get(k)==v for k,v in a['files'].items())
          extra=set(b['files'])-set(a['files'])
          assert extra=={'WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.lean'},extra
          # Existing source closure must not reference the newly added module.
          assert all('ActualZetaOriginalPhysicalTriangularCacheAssembly' not in Path(p).read_text()
                     for p in a['files'] if p.endswith('.lean'))
          print('NF705 all producer sources unchanged; exactly one new independent theorem module')
          PY
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
          test ! -e .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.olean
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - name: Restore certified semantic adapter and pi source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nf618-input
          fetch() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$2/zip" -o "nf618-input/$1.zip"
            echo "$3  nf618-input/$1.zip" | sha256sum -c -
          }
          fetch semantic 15136694468 e324a64d4a1a8f6c537e3d8040a335333973a2df63dc5b1f39f3bb49b246811f
          fetch phase 14580099864 fba35eada4a0614260109add6e3762b90447bf047541817c7529348121f33ab3
          fetch prior 15084125240 5ecdd6e9cccf16359cdc1bdcffbe415256b3b03b5a3066009fa0a44fcffc2513
          python - <<'PY'
          import json,zipfile,hashlib
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          p='WeilDefect/Arithmetic/ActualZetaOriginalPhysicalSemanticEndpointCache.lean'
          with zipfile.ZipFile('nf618-input/semantic.zip') as z:
              a=json.loads(z.read('nf618-semantic-audit.json'))
              assert len(a['theorems'])==3 and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in a['theorems'].values())
              b=z.read(p)
              assert sha(b)==a['source_sha256']=='c28806932277661273bc6f48a34a4119fae242a9dbd88e296c7dfd83477e3d3f'
              Path(p).write_bytes(b)
          with zipfile.ZipFile('nf618-input/phase.zip') as z:
              root=Path('WeilDefect/Generated/NF632');root.mkdir(parents=True,exist_ok=True)
              b=z.read('NF632/manifest.json')
              assert sha(b)=='b4d290d158af245635d17b58f1c8e9f8bfa5076f773c1a35aa7e789bf850b086'
              (root/'manifest.json').write_bytes(b)
              for f in json.loads(b)['files']:
                  raw=z.read('NF632/'+f['file'])
                  assert sha(raw)==f['sha256']
                  (root/f['file']).write_bytes(raw)
              root=Path('WeilDefect/Generated/NF703');root.mkdir(parents=True,exist_ok=True)
              m=json.loads(z.read('NF703/manifest.json'))
              count=0
              for f in m['files']:
                  if not f['file'].startswith(('Real0001','Real0003')):continue
                  raw=z.read('NF703/'+f['file'])
                  assert sha(raw)==f['sha256']
                  (root/f['file']).write_bytes(raw)
                  count+=1
              assert count==14
          PY
      - name: Bind original real terminal slot
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('WeilDefect/Generated/NF690')
          b=(root/'manifest.json').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='8d064584205c62907a397ebc854630a5481a675923648dcdcb7c4051af218bf7'
          t=json.loads(b)['slots'][7834]
          assert t=={'index':7834,'key':['1','0'],'rows':1,'chunk':'Chunk489','offset':10}
          raw=re.findall(r'#\[\n    (.*?)\n  \]',(root/'Chunk489.lean').read_text(),re.S)[10]
          assert hashlib.sha256(raw.encode()).hexdigest()=='7e9c87d3187b4bff1bbedbc4de22d9d6040e04118ada863917b27bd053a10477'
          Path('nf618-real-slot-manifest.json').write_text(json.dumps(t,indent=2)+'\n')
          print('NF618 real slot source PASS',7834)
          PY
          mkdir -p WeilDefect/Generated/NF618RealTerminal
          cat > WeilDefect/Generated/NF618RealTerminal/Slot.lean <<'EOF'
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalSemanticEndpointCache
          import WeilDefect.Generated.NF632.Pi
          import WeilDefect.Generated.NF690.Bank
          
          namespace WeilDefect
          set_option maxRecDepth 100000
          set_option maxHeartbeats 0
          
          def nf618RealTerminalTable : NF624KeyTable :=
            ⟨⟨1,0⟩, (nf690Chunk489[10]?).getD #[]⟩
          
          def nf618RealTerminalCache : NF617MomentCache :=
            ⟨neutralNF615LambdaRect nf632Pi 1 0 neutralNF616Q,
              neutralNF621RealEndpoint 1 neutralNF616Q neutralNF616ExpN,
              neutralNF621RealEndpoint (-1) neutralNF616Q neutralNF616ExpN⟩
          
          theorem nf618RealTerminalCacheSound :
              nf618RealTerminalCache.SemanticSound nf618RealTerminalTable.key := by
            have hp := neutralNF615RealEndpoint_sound (1:ℚ) (by norm_num)
              neutralNF616Q neutralNF616ExpN (by decide +kernel) (by decide +kernel)
              neutralNF616ExpFee
            have hn := neutralNF615RealEndpoint_sound (-1:ℚ) (by norm_num)
              neutralNF616Q neutralNF616ExpN (by decide +kernel) (by decide +kernel)
              neutralNF616ExpFee
            refine ⟨neutralNF615LambdaRect_sound nf632Pi nf632PiSound 1 0 neutralNF616Q
              (by decide +kernel), ?_, ?_⟩
            · change (neutralNF621RealEndpoint 1 neutralNF616Q neutralNF616ExpN).Contains _
              rw [neutralNF621RealEndpoint_eq]
              convert hp using 1 <;>
                norm_num [nf618RealTerminalTable, NF616Frequency.value, neutralNF615Lambda]
            · change (neutralNF621RealEndpoint (-1) neutralNF616Q neutralNF616ExpN).Contains _
              rw [neutralNF621RealEndpoint_eq]
              convert hn using 1 <;>
                norm_num [nf618RealTerminalTable, NF616Frequency.value, neutralNF615Lambda]
          
          theorem nf618RealTerminalRowsCheck :
              (List.range nf618RealTerminalTable.rows.size).all
                (neutralNF617MomentRowCheck nf618RealTerminalCache nf618RealTerminalTable.key.lower
                  neutralNF616Q nf618RealTerminalTable.rows) = true := by
            decide +kernel
          
          theorem nf618RealTerminalSound : neutralNF690TableSound nf618RealTerminalTable := by
            apply neutralNF690TableSound_of_semantic_cache nf618RealTerminalCache nf618RealTerminalTable
              nf618RealTerminalCacheSound (by decide +kernel) neutralNF616Q (by decide +kernel)
            intro n hn
            exact List.all_eq_true.mp nf618RealTerminalRowsCheck n (List.mem_range.mpr hn)
          
          theorem nf618RealTerminalConcrete :
              neutralNF690TableSound (neutralNF624BankRead nf690OriginalBank 7834) := by
            rw [show nf690OriginalBank = neutralNF690Bank nf687Read nf687Size nf690Payload from rfl]
            rw [neutralNF690Bank_read nf687Read nf687Size nf690Payload 7834 (by decide +kernel)]
            rw [neutralNF690Table_eq nf687Read nf690Payload 7834 nf618RealTerminalTable
              (by decide +kernel) (by rfl) (by decide +kernel)]
            exact nf618RealTerminalSound
          
          end WeilDefect
          EOF
      - name: Kernel certify real terminal slot and audit
        run: |
          set -euo pipefail
          lake build WeilDefect.Generated.NF618RealTerminal.Slot 2>&1 | tee nf618-real-slot-build.log
          cat > nf618RealSlotAudit.lean <<'EOF'
          import WeilDefect.Generated.NF618RealTerminal.Slot
          #print axioms WeilDefect.nf618RealTerminalCacheSound
          #print axioms WeilDefect.nf618RealTerminalRowsCheck
          #print axioms WeilDefect.nf618RealTerminalSound
          #print axioms WeilDefect.nf618RealTerminalConcrete
          EOF
          lake env lean nf618RealSlotAudit.lean 2>&1 | tee nf618-real-slot-axioms.log
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          expected=set(["nf618RealTerminalCacheSound","nf618RealTerminalRowsCheck","nf618RealTerminalSound","nf618RealTerminalConcrete"]);found={}
          log=Path('nf618-real-slot-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",log):
              if n in expected:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",log):
              if n in expected:
                  assert n not in found
                  found[n]=[]
          assert set(found)==expected and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          p=Path('WeilDefect/Generated/NF618RealTerminal/Slot.lean')
          Path('nf618-real-slot-audit.json').write_text(json.dumps({'slot':7834,'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'theorems':found},indent=2)+'\n')
          print('NF618 real terminal concrete LEAN PASS',7834,len(found))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf618-real-terminal-slot-evidence
          path: |
            WeilDefect/Generated/NF618RealTerminal/
            nf618-real-slot-*.json
            nf618-real-slot-*.log
          if-no-files-found: warn
