name: NF475 independent original source signed Fraction custody audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-gates-and-raw-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42429671313
          name: nf475-original-J7-signed-moments
          path: original-native
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact rational image cutoff and analytic physical seam gate
        run: python -u -X int_max_str_digits=0 scripts/local_replay/verify_nf475_24000_image_tail_gate_exact.py
      - name: Independently source-verify original pz/z2 signed negative and true contiguous partial union
        run: python -u -X int_max_str_digits=0 scripts/local_replay/verify_nf475_original_J7_near_B_panel_and_partial_union_exact.py --native original-native/nf475-original-J7-source-signed-moments.json --output nf475-original-J7-exact-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf475-original-J7-independent-exact-signed-audit
          path: nf475-original-J7-exact-audit.json
          retention-days: 90
