name: mg49-original-joint-certificate-loss-audit
on:
  pull_request:
    paths:
      - 'scripts/validate_rpb108_mg49_original_joint_loss_audit.py'
      - 'scripts/validate_rpb108_mg49_independent_loss_replay.py'
      - 'notes/RPB108_MG49_ORIGINAL_JOINT_LOSS_AUDIT_20261021.md'
      - '.github/workflows/rpb108-mg49-joint-loss-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-original-24D-joint-certificate-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Retrieve accepted original MG24 source tail
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39378465438
          name: mg24-original-full-frequency-coupled-source-brackets
          github-token: ${{ github.token }}
          path: artifacts/mg24_verified
      - name: Retrieve accepted original MG46 omitted joint source
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39638393721
          name: mg46-original-complete-missing-GS-256-matrix-audit
          github-token: ${{ github.token }}
          path: artifacts/mg46_verified
      - name: Retrieve accepted MG47 conditioned moment source
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39663431182
          name: mg47-original-conditioned-864-whole-missing-GS-source-matrices
          github-token: ${{ github.token }}
          path: artifacts/mg47_verified
      - name: Retrieve accepted MG48 jointly coupled multiplier source
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39685179933
          name: mg48-original-joint-multiplier-864-source-matrices
          github-token: ${{ github.token }}
          path: artifacts/mg48_verified
      - name: Verify pinned files and compile independently authored audits
        run: |
          python -m py_compile scripts/validate_rpb108_mg49_original_joint_loss_audit.py scripts/validate_rpb108_mg49_independent_loss_replay.py
          test -s artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json
          test -s artifacts/mg46_verified/mg46_original_joint_missing_frequency_residual.json
          test -s artifacts/mg47_verified/mg47_original_conditioned_missing_moments.json
          test -s artifacts/mg48_verified/mg48_joint_multiplier_source_covariance.json
      - name: Decompose MG48 exact source certificate on four MG43 witness rays
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg49_original_joint_loss_audit.py --verified-mg24-json artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json --verified-mg46-json artifacts/mg46_verified/mg46_original_joint_missing_frequency_residual.json --verified-mg47-json artifacts/mg47_verified/mg47_original_conditioned_missing_moments.json --verified-mg48-json artifacts/mg48_verified/mg48_joint_multiplier_source_covariance.json
      - name: Independent original full source ungrouped polynomial and ray-loss audit
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg49_independent_loss_replay.py --verified-mg24-json artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json --verified-mg46-json artifacts/mg46_verified/mg46_original_joint_missing_frequency_residual.json --verified-mg47-json artifacts/mg47_verified/mg47_original_conditioned_missing_moments.json --verified-mg48-json artifacts/mg48_verified/mg48_joint_multiplier_source_covariance.json --verified-mg49-json artifacts/mg49_original_joint_loss_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mg49-exact-original-four-ray-source-loss-decomposition
          path: artifacts/mg49_original_joint_loss_audit.json
          if-no-files-found: ignore
