name: RC314 finite Morse index and signed Schur
on:
  push:
    branches:
      - research/rpb108-rc314-fredholm-schur
    paths:
      - "scripts/validate_rpb108_rc314_fredholm_schur.py"
      - ".github/workflows/rc314-fredholm-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and reverse replay RC314
        run: |
          python scripts/validate_rpb108_rc314_fredholm_schur.py --output certificates/rpb108_rc314_fredholm_schur.json
          python scripts/validate_rpb108_rc314_fredholm_schur.py --output certificates/rpb108_rc314_fredholm_schur.json --replay
      - name: Commit exact certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc314_fredholm_schur.json
          if ! git diff --cached --quiet; then
            git commit -m "RC314: freeze original Weil Fredholm/index and signed Schur residual identity"
            git pull --rebase origin research/rpb108-rc314-fredholm-schur
            git push origin HEAD:research/rpb108-rc314-fredholm-schur
          fi
