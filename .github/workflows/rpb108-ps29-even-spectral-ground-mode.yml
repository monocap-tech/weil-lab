name: RPB108 PS29 original even spectral ground-mode and pole-angle gate

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps29_even_spectral_ground_mode.py"
      - "notes/RPB108_PS29_EVEN_SPECTRAL_GROUND_MODE_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps29-even-spectral-ground-mode.yml"
  workflow_dispatch:

jobs:
  ps29-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original PS28 source replay and PS29 exact spectral algebra
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps29_even_spectral_ground_mode.py
          python3 scripts/validate_rpb108_ps29_even_spectral_ground_mode.py
      - name: Maintain original odd and even sign obligations OPEN
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert p["checkpoints"][-1]["id"]=="PS29"
          assert all(flag is False for flag in p["closures"].values())
          PY
