name: Weil-Lab NF395 observable original selected native gate (method STOP only)
on:
  push:
    branches:
      - research/nf395-native-execution-observable-gate
    paths:
      - .github/workflows/nf395-native-execution-observable.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: nf395-original-selected-native-telemetry
  cancel-in-progress: false
jobs:
  original-native:
    if: github.repository == 'monocap-tech/weil-lab' && github.ref == 'refs/heads/research/nf395-native-execution-observable-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nf395-native-execution-observable-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-code and source-pinned exact preflight
        run: |
          mkdir -p artifacts
          echo source-exact-preflight > artifacts/phase.txt
          python3 -m py_compile scripts/local_replay/nf393_original_pole_source_cancellation_preflight.py \
            scripts/local_replay/nf394_original_native_j387_receipt.py \
            scripts/local_replay/nf392_original_j387_polynomial_norm_gate.py \
            scripts/verify_nf390_original_j387_selected_moment.py
          python3 scripts/local_replay/nf393_original_pole_source_cancellation_preflight.py \
            --nf369 notes/data/provisional/nf372_nf369_fields.json \
            --j387 notes/data/provisional/NF387_original_J242_dyadic_candidate.json \
            --output artifacts/NF395_original_source_exact_preflight.json
          python3 scripts/local_replay/nf392_original_j387_polynomial_norm_gate.py \
            --original-512 notes/data/provisional/NF380_original_archived_unfitted_signed_dual_native.json \
            --nf375 notes/data/provisional/NF375_reduced_cutoff_exact.json \
            --j387 notes/data/provisional/NF387_original_J242_dyadic_candidate.json \
            --output artifacts/NF395_original_source_polynomial_gate.json
          echo native-dependencies > artifacts/phase.txt
      - name: Pin native Arb dependencies
        run: |
          pip install --only-binary=:all: python-flint==0.8.0 numpy scipy
          echo original-archive-download > artifacts/phase.txt
      - name: Authenticate historical signed original source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12776684037/zip" \
            -o artifacts/original_selected_signed_20261028.zip
          echo 'f7b64ceead7500fca389e3b994a208a6e8aae5be3270b750ab586e5ebe1fa1d0  artifacts/original_selected_signed_20261028.zip' | sha256sum -c -
          echo original-native-selected-moment > artifacts/phase.txt
      - name: Compute genuine original pole-corrected selected j387 moment
        run: |
          python3 -u scripts/verify_nf390_original_j387_selected_moment.py \
            --rank notes/data/provisional/parents/pr350_original_BS_pruned_rank_bound.json \
            --source notes/data/provisional/nf372_pr355_fields.json \
            --nf369 notes/data/provisional/nf372_nf369_fields.json \
            --nf375 notes/data/provisional/NF375_reduced_cutoff_exact.json \
            --j387 notes/data/provisional/NF387_original_J242_dyadic_candidate.json \
            --archive artifacts/original_selected_signed_20261028.zip \
            --output artifacts/NF395_original_j387_pole_restored_native.json
          echo independent-native-receipt > artifacts/phase.txt
      - name: Verify selected source, actual odd pole, outward moment and exact candidate criterion
        run: |
          python3 scripts/local_replay/nf394_original_native_j387_receipt.py \
            --native artifacts/NF395_original_j387_pole_restored_native.json \
            --original-512 notes/data/provisional/NF380_original_archived_unfitted_signed_dual_native.json \
            --nf375 notes/data/provisional/NF375_reduced_cutoff_exact.json \
            --j387 notes/data/provisional/NF387_original_J242_dyadic_candidate.json \
            --output artifacts/NF395_original_j387_selected_native_acceptance.json
          echo native-verified > artifacts/phase.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf395-source-and-native-run-telemetry
          path: |
            artifacts/phase.txt
            artifacts/NF395_original_source_exact_preflight.json
            artifacts/NF395_original_source_polynomial_gate.json
            artifacts/NF395_original_j387_pole_restored_native.json
            artifacts/NF395_original_j387_selected_native_acceptance.json
          if-no-files-found: ignore
  durable-observability-receipt:
    if: always() && github.repository == 'monocap-tech/weil-lab' && github.ref == 'refs/heads/research/nf395-native-execution-observable-gate'
    needs: original-native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nf395-native-execution-observable-gate
          persist-credentials: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nf395-source-and-native-run-telemetry
          path: artifacts
      - name: Write typed execution-only status or source-verified native acceptance
        env:
          ORIGINAL_JOB_RESULT: ${{ needs.original-native.result }}
          SOURCE_WORKFLOW_RUN: ${{ github.run_id }}
          SOURCE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder=Path('artifacts')
          folder.mkdir(exist_ok=True)
          status=os.environ['ORIGINAL_JOB_RESULT']
          phase=(folder/'phase.txt').read_text().strip() if (folder/'phase.txt').exists() else 'NO_STAGE_ARTIFACT'
          verdict=None
          data_path=folder/'NF395_original_j387_selected_native_acceptance.json'
          native_path=folder/'NF395_original_j387_pole_restored_native.json'
          native_verified=status=='success'
          if native_verified:
              assert data_path.is_file() and native_path.is_file(), 'Success cannot lack native receipt'
              decision=json.loads(data_path.read_bytes())
              report=json.loads(native_path.read_bytes())
              assert decision['recomputed_nf391_nf392_source_native_exact_verdict'] in ('STOP','INCONCLUSIVE')
              assert decision['physical_pole_independent_overlap_intersection_pass'] is True
              assert report['pole_restored_for_selected_test'] is True
              assert decision['W_ODD_NEG']==decision['RH']=='OPEN'
              verdict=decision['recomputed_nf391_nf392_source_native_exact_verdict']
              for name in (native_path.name,data_path.name):
                  raw=(folder/name).read_bytes()
                  target=Path('notes/data/provisional')/name
                  if target.exists():
                      assert target.read_bytes()==raw,'Never overwrite an earlier original-native result'
                  else:
                      target.write_bytes(raw)
          out={
              'standing':'NF395 EXECUTION TELEMETRY; NOT MATHEMATICAL CERTIFICATE UNLESS AUTHENTIC NATIVE ACCEPTANCE EXISTS',
              'run_id':os.environ['SOURCE_WORKFLOW_RUN'],
              'source_commit_sha':os.environ['SOURCE_WORKFLOW_SHA'],
              'original_native_job_result':status,
              'last_recorded_stage':phase,
              'original_selected_native_replay_verification_complete':native_verified,
              'frozen_j387_candidate_verdict':verdict if native_verified else 'UNDECIDED',
              'native_report_sha256':hashlib.sha256(native_path.read_bytes()).hexdigest() if native_verified else None,
              'no_missing_job_result_interpreted_as_mathematical_failure':True,
              'original_full_lowband_upper_computed':False,
              'whole_exterior_inverse_computed':False,
              'W_ODD_NEG':'OPEN','RH':'OPEN'}
          target=Path('notes/data/provisional/NF395_native_execution_telemetry.json')
          if target.exists():
              old=json.loads(target.read_text())
              assert old.get('run_id')==out['run_id'] or not old.get('original_selected_native_replay_verification_complete'), 'Refuse replacing accepted authentic result telemetry'
          target.write_text(json.dumps(out,indent=2)+'\n')
          print('NF395 original native job:',status,'stage:',phase,'mathematical verdict:',out['frozen_j387_candidate_verdict'])
          PY
      - name: Persist run-status telemetry to NF395 research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/data/provisional/NF395_native_execution_telemetry.json
          if test -f notes/data/provisional/NF395_original_j387_pole_restored_native.json; then
            git add notes/data/provisional/NF395_original_j387_pole_restored_native.json
          fi
          if test -f notes/data/provisional/NF395_original_j387_selected_native_acceptance.json; then
            git add notes/data/provisional/NF395_original_j387_selected_native_acceptance.json
          fi
          if git diff --cached --quiet; then
            echo 'Same telemetry already persisted'
          else
            git commit -m 'NF395 durable original selected native execution status and source-verified candidate verdict if available'
            git pull --rebase origin research/nf395-native-execution-observable-gate
            git push origin HEAD:refs/heads/research/nf395-native-execution-observable-gate
          fi
