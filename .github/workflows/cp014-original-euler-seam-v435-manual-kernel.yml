name: CP014 MANUAL original Zeta v4.35 Euler seam N(149.5) partial kernel
# Manual only: do not crowd original IV### or NF### compiler queues.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp014-original-1495-source-kernel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-kernel-seam-count-and-conditional-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original pinned Zeta 4.35 toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Require genuine original upstream v1-1e6 commit and source split
        working-directory: cp011_zeta_v435
        timeout-minutes: 55
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/Zeta rev-parse HEAD)" = c06b4e13d9c847e50a32c3d738271cbad62ae9f3
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          python ../scripts/cp013_rs_only_batch_source_lineage.py \
            --self-test --original-root .lake/packages/Zeta \
            --receipt cp014-inherited-cp013-source-lineage.json
          python ../scripts/cp014_seam_N_cut_and_derivative_screen.py \
            --self-test --source-root .lake/packages/Zeta \
            --receipt cp014-original-source-preflight.json
      - name: Build actual original CP013 and CP014 theorem candidates
        working-directory: cp011_zeta_v435
        timeout-minutes: 155
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build CP013RSOnly CP013Seam CP014EulerCutLower CP014FiniteCut CP014ZetaCut CP014HardyRank 2>&1 \
            | tee cp014-original-source-Lean-build.log
      - name: Require genuine original CP013 source split axiom audit
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          (
            cd cp011_zeta_v435
            lake env lean CP013RSOnly.lean
            lake env lean CP013Seam.lean
          ) 2>&1 | tee cp011_zeta_v435/cp013-original-RS-only-axioms.log
          python scripts/cp013_original_rs_only_lean_axiom_audit.py
      - name: Require real standard axioms in THREE CP014 theorem modules
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          (
            cd cp011_zeta_v435
            lake env lean CP014EulerCutLower.lean
            lake env lean CP014FiniteCut.lean
            lake env lean CP014ZetaCut.lean
            lake env lean CP014HardyRank.lean
          ) 2>&1 | tee cp011_zeta_v435/cp014-original-seam-actual-axioms.log
          python scripts/cp014_exact_seam_lean_axiom_audit.py
          test -s cp011_zeta_v435/cp014-cut-count-conditional-kernel-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp014-original-Zeta-v435-Euler-cut-52-lower-conditional-full-count-receipts
          path: |
            cp011_zeta_v435/cp014-inherited-cp013-source-lineage.json
            cp011_zeta_v435/cp014-original-source-preflight.json
            cp011_zeta_v435/cp014-original-source-Lean-build.log
            cp011_zeta_v435/cp013-original-RS-only-axioms.log
            cp011_zeta_v435/cp014-original-seam-actual-axioms.log
            cp011_zeta_v435/cp014-cut-count-conditional-kernel-receipt.json
            cp011_zeta_v435/.lake/build/lib/lean/CP014EulerCutLower.olean
            cp011_zeta_v435/.lake/build/lib/lean/CP014FiniteCut.olean
            cp011_zeta_v435/.lake/build/lib/lean/CP014ZetaCut.olean
            cp011_zeta_v435/.lake/build/lib/lean/CP014HardyRank.olean
          if-no-files-found: ignore
          include-hidden-files: true
