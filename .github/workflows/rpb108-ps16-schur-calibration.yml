name: RPB108 PS16 original complementary Schur sign calibration

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps16_schur_gap_calibration.py"
      - "notes/RPB108_PS16_SCHUR_GAP_CALIBRATION_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps16-schur-calibration.yml"
  workflow_dispatch:

jobs:
  ps16-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original source chain, source coercivity, high-energy Schur and parity margins
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps16_schur_gap_calibration.py
          python3 scripts/validate_rpb108_ps16_schur_gap_calibration.py
      - name: Keep complementary low Schur PSD and canonical RH obligations OPEN
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
