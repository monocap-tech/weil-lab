name: NF699 remaining concrete original analytical table attachments
on:
  pull_request:
    paths:
      - ".github/workflows/nf699-remaining-concrete-attachments.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf699-concrete-attachments-${{ github.ref }}
  cancel-in-progress: false
jobs:
  attach:
    name: Concrete original slots ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['686','689-0','689-1','689-2','689-3']
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
          run-id: 44598398608
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          cmp nf697-bank-binding.json compiled-bank/nf697-bank-binding.json
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - name: Restore exact accepted original slot proposals and complete audits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          fetch() {
            local id="$1" name="$2" digest="$3"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            mkdir -p "$name"
            unzip -q "$name.zip" -d "$name"
          }
          fetch 14560118454 p692 b7209e4fee4d9309cf86f2551f57f2ff0fe75f47931e8c3dd721a42c3e2ec7b2
          fetch 14565840709 p696 ccfdfabd15e85e5564c7c5bf7c88de6a9f270174dd3e16f490f50c750173c81e
          fetch 14568861192 a692 e0b10f84227688ac39b143996a10cf31760d31dbc2cf3abce067856dbefb7048
          fetch 14567980736 a696 f11ecfb1493e1990954f0dec8b3a129a50c985286014fb34abc0f43db84ef497
          python - <<'PY'
          import hashlib,json,os,re,shutil
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          read=lambda p:json.loads(p.read_text())
          allowed={'propext','Classical.choice','Quot.sound'}
          stages={}
          for n,count,rows in [(692,271,2124),(696,127,548)]:
              p=Path(f'p{n}')
              d=p/f'NF{n}'
              m=read(d/'manifest.json')
              assert (m['tables'],m['rows'])==(count,rows)
              assert m['bank_manifest_sha256']==sha(root/'NF690/manifest.json')
              files=list(Path(f'a{n}').rglob(f'nf{n}-complete-audit.json'))
              assert len(files)==1
              a=read(files[0])
              assert a['manifest_sha256']==sha(d/'manifest.json')
              assert {r['index']:r for r in a['records']}=={r['index']:r for r in m['records']}
              assert len(a['records'])==count and len({r['index'] for r in a['records']})==count
              assert set(a['theorems'])=={f'nf{n}'+r['module']+s for r in m['records'] for s in ('Key','Length','RowsEq','Sound')}
              assert all(set(x)<=allowed for x in a['theorems'].values())
              for name in (['NF632','NF684','NF685','NF686','NF689','NF687','NF692'] if n==692 else ['NF632','NF689','NF687','NF696']):
                  q=p/name
                  for f in read(q/'manifest.json')['files']: assert sha(q/f['file'])==f['sha256']
              for q in p.rglob('*'):
                  if not q.is_file(): continue
                  dst=root/q.relative_to(p)
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  if dst.exists(): assert q.read_bytes()==dst.read_bytes(),str(dst)
                  else: shutil.copyfile(q,dst)
              stages[n]=m
          assert stages[696]['nf692_manifest_sha256']==sha(root/'NF692/manifest.json')
          assert {r['index'] for r in stages[692]['records']}.isdisjoint(r['index'] for r in stages[696]['records'])
          shard=os.environ['SHARD']
          n=696 if shard in {'689-2','689-3'} else 692
          records=[r for r in stages[n]['records'] if r['shard']==shard]
          expected={'686':(108,909),'689-0':(35,308),'689-1':(36,306),'689-2':(65,278),'689-3':(62,270)}
          assert (len(records),sum(r['rows'] for r in records))==expected[shard]
          selected={r['module'] for r in records}
          done=set();targets=[]
          for p in sorted((root/f'NF{n}').glob('Concrete*.lean')):
              slots=set(re.findall(r'^import WeilDefect\.Generated\.NF'+str(n)+r'\.(Slot\d+)$',p.read_text(),re.M))
              assert slots
              if not slots&selected: continue
              assert slots<=selected and not slots&done
              done|=slots
              targets.append(p.stem)
          assert done==selected
          Path('nf699-targets.txt').write_text('\n'.join(f'WeilDefect.Generated.NF{n}.{t}' for t in targets)+'\n')
          Path('nf699-records.json').write_text(json.dumps(records,indent=2)+'\n')
          Path('nf699-stage.txt').write_text(str(n)+'\n')
          print('NF699 selected exact concrete slots',shard,len(records))
          PY
      - name: Kernel-check the exact concrete bank slot projections and soundness
        timeout-minutes: 105
        run: |
          set -euo pipefail
          while read -r name; do
            lake build "$name" 2>&1 | tee -a nf699-concrete.log
          done < nf699-targets.txt
      - name: Strict axiom and original slot audit
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          records=json.loads(Path('nf699-records.json').read_text())
          n=Path('nf699-stage.txt').read_text().strip()
          names=[f'nf{n}'+r['module']+s for r in records for s in ('PayloadEq','Concrete')]
          names+=['nf691OriginalCoverage','nf691OriginalLookup_eq']
          Path('/tmp/nf699Audit.lean').write_text(''.join(f'import {t}\n' for t in Path('nf699-targets.txt').read_text().splitlines())+'import WeilDefect.Generated.NF691.OriginalLookup\n'+''.join(f'#print axioms WeilDefect.{t}\n' for t in names))
          Path('nf699-names.txt').write_text('\n'.join(names)+'\n')
          PY
          lake env lean /tmp/nf699Audit.lean 2>&1 | tee nf699-axioms.log
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          names=set(Path('nf699-names.txt').read_text().splitlines())
          found={}
          s=Path('nf699-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",s):
              if n in names:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",s):
              if n in names:
                  assert n not in found
                  found[n]=[]
          assert set(found)==names
          assert all(set(x)<={'propext','Classical.choice','Quot.sound'} for x in found.values())
          records=json.loads(Path('nf699-records.json').read_text())
          assert len(found)==2*len(records)+2
          for n in ('nf691OriginalCoverage','nf691OriginalLookup_eq'): found.pop(n)
          Path('nf699-audit.json').write_text(json.dumps({'shard':os.environ['SHARD'],'records':records,'theorems':found,'fingerprint':json.loads(Path('nf697-bank-binding.json').read_text())['fingerprint']},indent=2)+'\n')
          print('NF699 concrete slots LEAN PASS',os.environ['SHARD'],len(records))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf699-concrete-audit-${{ matrix.shard }}
          path: |
            nf699-*.log
            nf699-audit.json
            nf697-reuse.log
            nf697-reuse-time.txt
          if-no-files-found: ignore
  aggregate:
    needs: attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nf699-concrete-audit-*
          path: receipts
      - name: Reconcile exact disjoint concrete slot audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=[json.loads(p.read_text()) for p in Path('receipts').rglob('nf699-audit.json')]
          assert len(a)==5 and {r['shard'] for r in a}=={'686','689-0','689-1','689-2','689-3'}
          assert len({r['fingerprint'] for r in a})==1
          rows=[r for x in a for r in x['records']]
          assert len(rows)==len({r['index'] for r in rows})==306
          assert sum(r['rows'] for r in rows)==2071
          th={}
          for x in a:
              for n,v in x['theorems'].items():
                  assert n not in th and set(v)<={'propext','Classical.choice','Quot.sound'}
                  th[n]=v
          assert len(th)==612
          Path('nf699-complete-audit.json').write_text(json.dumps({'schema':'NF699-concrete-slot-audit-v1','records':rows,'theorems':th,'fingerprint':a[0]['fingerprint']},indent=2)+'\n')
          print('NF699 306 concrete original slots / 2071 moment rows / 612 declarations LEAN PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf699-complete-concrete-slot-audit
          path: nf699-complete-audit.json
