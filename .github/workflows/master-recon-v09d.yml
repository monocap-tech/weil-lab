name: MASTER-RECON V09D

on:
  push:
    branches: [master-recon-001-neutral-shell]
    paths:
      - "WeilDefect/MasterRecon/V09D.lean"
      - ".github/workflows/master-recon-v09d.yml"
  pull_request:
    paths:
      - "WeilDefect/MasterRecon/V09D.lean"
      - ".github/workflows/master-recon-v09d.yml"

permissions:
  contents: read

jobs:
  abstract-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile V09D and inspect axioms
        shell: bash
        run: |
          set -euo pipefail
          lake build WeilDefect.MasterRecon.V09C
          lake env lean WeilDefect/MasterRecon/V09D.lean 2>&1 | tee v09d-lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path("v09d-lean.log").read_text()
          names = ["shifted_line_sample","lineWindow_finite","shiftedSamples_card","shiftedSamples_spec","count_superlinear_of_rvm","critical_supply_of_count_bounds","critical_supply_of_dyadic_estimates"]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              m = re.search(r"'WeilDefect\.MasterRecon\.V09D\."+name+r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if f"'WeilDefect.MasterRecon.V09D.{name}' does not depend on any axioms" in s:
                      continue
                  raise SystemExit("Missing axiom audit: " + name)
              axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f"Unexpected axioms for {name}: {axioms - allowed}")
          print("V09D strict axiom audit PASS")
          PY
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-recon-v09d-lean
          path: v09d-lean.log
