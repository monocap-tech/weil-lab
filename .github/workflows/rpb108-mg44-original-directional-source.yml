name: mg44-original-exact-coupled-source-directional-brackets
on:
  pull_request:
    paths:
      - 'scripts/validate_rpb108_mg44_exact_coupled_source_rays.py'
      - 'notes/RPB108_MG44_EXACT_COUPLED_SOURCE_DIRECTIONAL_20261020.md'
      - '.github/workflows/rpb108-mg44-original-directional-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-physical-source-full-spectrum-exact-directional-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39378465438
          name: mg24-original-full-frequency-coupled-source-brackets
          github-token: ${{ github.token }}
          path: artifacts/mg24_verified
      - uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39440914565
          name: mg29-original-adapted-third-24D-source-intervals
          github-token: ${{ github.token }}
          path: artifacts/mg29_verified
      - uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39513403010
          name: mg40-original-anisotropic-G-cross-source-24D
          github-token: ${{ github.token }}
          path: artifacts/mg40_verified
      - uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39519080670
          name: mg41-original-ideal-cross-fee-24D-feasibility
          github-token: ${{ github.token }}
          path: artifacts/mg41_verified
      - uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39520549337
          name: mg42-original-four-nonscalar-relative-PSD-fee-thresholds
          github-token: ${{ github.token }}
          path: artifacts/mg42_verified
      - uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39522608989
          name: mg43-original-independent-G-S-full24-source-grid
          github-token: ${{ github.token }}
          path: artifacts/mg43_verified
      - name: Exact integer square-root and 24D original source directional regression
        run: |
          python -m py_compile scripts/validate_rpb108_mg44_exact_coupled_source_rays.py
          OPENBLAS_NUM_THREADS=2 python scripts/validate_rpb108_mg44_exact_coupled_source_rays.py --self-test
      - name: Construct original pole-inclusive complete-frequency coupled G/S 12 source-direction residual bounds
        run: |
          test -s artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json
          test -s artifacts/mg29_verified/mg29_original_direct_third_drift.json
          test -s artifacts/mg40_verified/mg40_original_anisotropic_cross_error.json
          test -s artifacts/mg41_verified/mg41_original_ideal_cross_error_feasibility.json
          test -s artifacts/mg42_verified/mg42_original_relative_uncertainty_budget.json
          test -s artifacts/mg43_verified/mg43_original_independent_G_S_matrix_blend.json
          OPENBLAS_NUM_THREADS=2 python scripts/validate_rpb108_mg44_exact_coupled_source_rays.py --verified-mg24-json artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json --verified-mg29-json artifacts/mg29_verified/mg29_original_direct_third_drift.json --verified-mg40-json artifacts/mg40_verified/mg40_original_anisotropic_cross_error.json --verified-mg41-json artifacts/mg41_verified/mg41_original_ideal_cross_error_feasibility.json --verified-mg42-json artifacts/mg42_verified/mg42_original_relative_uncertainty_budget.json --verified-mg43-json artifacts/mg43_verified/mg43_original_independent_G_S_matrix_blend.json
      - name: Independent exact rational complete-original source H/G/S Schwarz and ray replay
        run: |
          OPENBLAS_NUM_THREADS=2 python - <<'PY'
          import json,sys
          from fractions import Fraction as F
          from math import isqrt
          if hasattr(sys,"set_int_max_str_digits"):sys.set_int_max_str_digits(0)
          sys.path.insert(0,"scripts")
          from validate_rpb108_mg25_original24_robust_trial import original_H24_from_physical_source
          from validate_rpb108_mg25_robust_source_aware_residual import (
              Id,T,mm,plus,sub,mul,psd)
          name={
              "mg24":"mg24_full_original_coupled_24source_matrix_enclosures.json",
              "mg29":"mg29_original_direct_third_drift.json",
              "mg40":"mg40_original_anisotropic_cross_error.json",
              "mg41":"mg41_original_ideal_cross_error_feasibility.json",
              "mg42":"mg42_original_relative_uncertainty_budget.json",
              "mg43":"mg43_original_independent_G_S_matrix_blend.json"}
          src={k:json.load(open(f"artifacts/{k}_verified/{v}"))
               for k,v in name.items()}
          d=json.load(open("artifacts/mg44_original_exact_directional_coupled_source.json"))
          assert d["status"]=="ORIGINAL_MG44_EXACT_COUPLED_SOURCE_DIRECTIONAL_SCHWARZ_ENCLOSURES"
          assert d["canonical_W_ODD_NEG"]=="OPEN"
          assert [d["verified_original_MG24_run"],d["verified_original_MG29_run"],
             d["verified_original_MG40_run"],d["verified_original_MG41_run"],
             d["verified_original_MG42_run"],d["verified_original_MG43_run"]]==[
             39378465438,39440914565,39513403010,39519080670,39520549337,39522608989]
          for field in ("same_true_original_full24_source_operator_moments",
              "original_real_frequency_sinh_pole_and_signed_arch_primes_inherited",
              "original_two_parent_Loewner_first_moment_brackets",
              "original_two_parent_Loewner_second_moment_uppers",
              "exact_Cauchy_cross_uncertainty_support_per_fixed_rational_ray",
              "sqrt_rounding_outward_only_integer_isqrt",
              "individual_ray_certificates_NOT_complete_source_pos"):
              assert d[field],field
          assert not d["complete_original_24D_Loewner_residual_certificate_new"]
          assert [(x["mesh_cells"],x["cutoff_k"]) for x in d["cases"]]==[
              (16,12),(16,16),(32,12),(32,16)]
          def mat(A,symmetric=True):
              a=[[F(x) for x in row] for row in A]
              assert len(a)==24 and all(len(row)==24 for row in a)
              if symmetric: assert a==T(a)
              return a
          def bil(v,A,w):
              return sum((v[i]*A[i][j]*w[j] for i in range(24)
                          for j in range(24)),F(0))
          def mv(A,v):
              return [sum((A[i][j]*v[j] for j in range(24)),F(0))
                      for i in range(24)]
          def sqrt_ceil(q):
              assert q>=0
              if q==0:return F(0)
              scale=10**12
              n=isqrt((q.numerator*scale*scale)//q.denominator)
              ans=F(n,scale)
              if ans*ans<q:ans+=F(1,scale)
              assert ans*ans>=q
              assert (ans-F(1,scale))**2<=q
              return ans
          h,hr,err=original_H24_from_physical_source()
          assert err==F(src["mg24"]["physical_Gram_Loewner_row_error"])
          hlo=sub(h,mul(err,Id(24)))
          hup=plus(h,mul(err,Id(24)))
          improved=cleared=0;total=0
          for case in d["cases"]:
              k=case["cutoff_k"];mesh=case["mesh_cells"]
              row43=next(x for x in src["mg43"]["scenarios"]
                          if x["cutoff_k"]==k and x["mesh_cells"]==mesh)
              row24=next(x for x in src["mg24"]["cases"] if x["cutoff_k"]==k)
              row29=next(x for x in next(x for x in src["mg29"]["meshes"]
                          if x["mesh_cells"]==mesh)["full_original_frequency_scenarios"]
                          if x["cutoff_k"]==k)
              B=mat(row43["exact_original_rational_B"],False)
              oldU=mat(row43["original_24D_new_upper_matrix"])
              parents={
                  "MG24":(mat(row24["complete_Gstar_lower"]),
                         mat(row24["complete_Gstar_upper"]),
                         mat(row24["complete_Sstar_upper"])),
                  "MG29":(mat(row29["full_original_Gstar_lower"]),
                         mat(row29["full_original_Gstar_upper"]),
                         mat(row29["full_original_Sstar_upper"]))}
              for L,U,S in parents.values():
                  assert psd(sub(U,L)) and psd(S)
              kinds=[
                "MG43_original_selected_negative_source_ray",
                "MG41_original_MG40_fee_bearing_negative_source_ray",
                "MG42_original_relative_fee_upper_negative_source_ray"]
              assert [x["archived_original_negative_ray_kind"]
                      for x in case["original_exact_source_rays"]]==kinds
              assert case["number_independently_grounded_exact_source_rays"]==3
              c43=[F(x) for x in row43["full24_exact_inertia_witness"]["rational_vector"]]
              assert [F(x) for x in case["original_exact_source_rays"][0][
                  "nonzero_original_24D_rational_ray"]]==c43
              for ray in case["original_exact_source_rays"]:
                  total+=1
                  v=[F(x) for x in ray["nonzero_original_24D_rational_ray"]]
                  assert len(v)==24 and any(v)
                  w=mv(B,v)
                  assert [str(x) for x in w]==ray["original_Bv_rational_ray"]
                  hray=bil(v,hlo,v)
                  Hup=bil(v,hup,v)
                  assert F(ray["original_source_Hlower_ray"])==hray
                  assert F(ray["original_source_Hupper_ray"])==Hup
                  old=bil(v,oldU,v)
                  assert old==F(ray["old_MG43_full24_source_upper_projected"])
                  glowers=[];suppers=[]
                  assert [x["source_parent"] for x in
                      ray["independent_parent_directional_bounds"]]==["MG24","MG29"]
                  for per in ray["independent_parent_directional_bounds"]:
                      label=per["source_parent"]
                      L,U,S=parents[label]
                      E=mul(F(1,2),sub(U,L))
                      C=mul(F(1,2),plus(U,L))
                      av,bv=bil(v,E,v),bil(w,E,w)
                      assert av>=0 and bv>=0
                      cen=bil(v,C,w)
                      root=sqrt_ceil(av*bv)
                      lower=cen-root
                      sup=bil(w,S,w)
                      assert [F(per[key]) for key in (
                          "exact_original_G_cross_center",
                          "exact_original_G_error_vEv",
                          "exact_original_G_error_Bv_E_Bv",
                          "exact_original_cross_sqrt_radicand",
                          "outward_rational_cross_sqrt_upper",
                          "verified_original_cross_first_moment_lower",
                          "verified_original_second_moment_upper")]==[
                           cen,av,bv,av*bv,root,lower,sup]
                      assert per["original_true_pole_and_all_real_frequency"]
                      glowers.append((lower,label))
                      suppers.append((sup,label))
                  gl,fromg=max(glowers)
                  su,froms=min(suppers)
                  direct=Hup-2*gl+su
                  bound=min(direct,old)
                  lower=hray-bound
                  assert fromg==ray["chosen_first_moment_original_parent"]
                  assert froms==ray["chosen_second_moment_original_parent"]
                  assert direct==F(ray["new_directed_original_complete_residual_upper"])
                  assert bound==F(ray["certified_intersection_upper_with_MG43"])
                  assert hray-old==F(ray["old_MG43_source_lower_ray_margin"])
                  assert hray-direct==F(ray["new_direction_only_unmixed_margin"])
                  assert lower==F(ray["selected_direction_only_source_margin"])
                  assert ray["new_directional_bound_improves_MG43_on_this_ray"]==(direct<old)
                  assert ray["strict_nonnegative_directional_certification"]==(lower>=0)
                  assert ray["NO_complete_24D_matrix_Loewner_promotion"]
                  assert ray["NO_operator_signed_spectral_assertion"]
                  improved+=direct<old
                  cleared+=lower>=0
              assert case["count_new_directional_upper_strictly_better"]==sum(
                r["new_directional_bound_improves_MG43_on_this_ray"]
                for r in case["original_exact_source_rays"])
              assert case["count_directional_source_lower_nonnegative"]==sum(
                r["strict_nonnegative_directional_certification"]
                for r in case["original_exact_source_rays"])
          assert total==d["total_rays_audited"]==12
          assert improved==d["total_directional_uppers_strictly_improved"]
          assert cleared==d["total_nonnegative_directional_source_lowers"]
          assert not d["original_24D_complete_source_contraction_certified"]
          assert not d["original_full470_source_inverse_certified"]
          assert not d["signed_original_51over56_negative_cap_certified"]
          assert d["independent_original_Fourier_form_domain_audit"]=="OPEN"
          assert d["complete_even_Weil_CC27_RH"]=="OPEN"
          print("MG44 independent exact original full-frequency directed Schwarz replays PASS:",
                {"rays":total,"strict_improvement":improved,"nonnegative_cert":cleared})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mg44-original-exact-coupled-source-directional-12-ray-audit
          path: artifacts/mg44_original_exact_directional_coupled_source.json
          if-no-files-found: ignore
