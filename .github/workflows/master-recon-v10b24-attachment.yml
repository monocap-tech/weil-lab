name: MASTER-RECON V10B27 focused attachment audit
on:
  push:
    branches: [master-recon-v10b20-staging]
    paths:
      - ".github/workflows/master-recon-v10b24-attachment.yml"
  workflow_dispatch:
concurrency:
  group: master-recon-v10b24-attachment
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl --retry 3 --retry-delay 2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile and audit staged chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recon-v10b24-evidence
          audit() {
            local mod="$1"
            file="WeilDefect/MasterRecon/${mod}.lean"
            lake build "WeilDefect.MasterRecon.${mod}" 2>&1 | tee "recon-v10b24-evidence/${mod}-build.log" || return 1
            lake env lean "$file" 2>&1 | tee "recon-v10b24-evidence/${mod}-lean.log" || return 1
            python3 - "$mod" <<'PY' || return 1
          import re
          import sys
          from pathlib import Path
          mod = sys.argv[1]
          src = Path(f"WeilDefect/MasterRecon/{mod}.lean").read_text()
          log = Path(f"recon-v10b24-evidence/{mod}-lean.log").read_text()
          expected = re.findall(r"^#print axioms (\S+)", src, re.M)
          declared = re.findall(r"^theorem (\w+)", src, re.M)
          assert expected and len(expected) == len(set(expected))
          assert set(expected) == {f"WeilDefect.MasterRecon.{mod}.{name}" for name in declared}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in expected:
              m = re.search(re.escape("'" + name + "' depends on axioms: [") + r"([^\]]*)\]", log)
              if m is None:
                  assert "'" + name + "' does not depend on any axioms" in log, name
              else:
                  assert {v.strip() for v in m.group(1).split(",") if v.strip()} <= allowed, name
          print(f"{mod}: strict axiom audit PASS ({len(expected)} declarations)")
          Path(f"recon-v10b24-evidence/{mod}-audit.txt").write_text(f"{mod}: PASS {len(expected)}\n")
          PY
          }
          failed=0
          declare -A pass
          gate() {
            local mod="$1"; shift
            local dep
            for dep in "$@"; do
              if [[ "${pass[$dep]:-0}" != 1 ]]; then
                echo "$mod: BLOCKED by $dep" | tee "recon-v10b24-evidence/$mod-blocked.txt"
                pass[$mod]=0
                failed=1
                return 0
              fi
            done
            if audit "$mod"; then pass[$mod]=1; else pass[$mod]=0; failed=1; fi
          }
          # Start independent analytic roots and current compiler blockers.
          gate V10B24a
          gate V10B24b V10B24a
          gate V10B25a V10B24b
          gate V10B25b V10B24b
          gate V10B26a V10B25b
          gate V10B26b V10B25a
          gate V10B26c V10B26a
          gate V10B27a V10B26c
          gate V10B27b V10B27a V10B26b
          gate V10B20a
          gate V10B20b
          gate V10B20c V10B20b
          gate V10B20d V10B20c
          gate V10B21a V10B20b
          gate V10B8e
          gate V10B8f V10B8e
          gate V10B12c
          gate V10B13b
          gate V10B14c
          gate V10B16a
          gate V10B5c
          gate V10B21b
          gate V10B21c V10B21b
          gate V10B22a V10B21c
          gate V10B22b V10B22a
          gate V10B22c V10B22b
          gate V10B23a V10B20a V10B22b V10B8f
          gate V10B23b V10B23a V10B22c
          gate V10B23c V10B23b
          gate V10B18a V10B12c
          gate V10B15a V10B8f
          gate V10B16b V10B15a V10B16a
          gate V10B16c V10B13b
          gate V10B17a V10B16b
          gate V10B8g V10B8f
          gate V10B8h V10B8g
          gate V10B17b V10B17a V10B16c V10B8h
          gate V10B17c V10B17b
          python3 verification/master_recon/v10b19_terminal_congruence.py | tee recon-v10b24-evidence/conditional-terminal.txt
          python3 verification/master_recon/v10b21_reflected_moments.py | tee recon-v10b24-evidence/reflected-moments.txt
          python3 verification/master_recon/v10b25_kernel_residual.py | tee recon-v10b24-evidence/kernel-residual.txt
          exit "$failed"
      - name: Upload compiler and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-recon-v10b24-attachment
          path: recon-v10b24-evidence/
