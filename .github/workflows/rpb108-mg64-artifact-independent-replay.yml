name: mg64-independent-replay-of-original-accepted-3D-producer-artifact
on:
  pull_request:
    paths:
      - 'scripts/validate_rpb108_mg64_independent_three_source_replay.py'
      - '.github/workflows/rpb108-mg64-artifact-independent-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay-original-3D-source-physical-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Accepted original MG24 physical source pole Gram
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39378465438
          name: mg24-original-full-frequency-coupled-source-brackets
          github-token: ${{ github.token }}
          path: artifacts/mg24_verified
      - name: Accepted original MG57 baseline physical Fourier source
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39897754515
          name: mg57-original-coupled-pole-and-twelve-new-physical-fourier-cells
          github-token: ${{ github.token }}
          path: artifacts/mg57_verified
      - name: Accepted original MG58 55-cell true physical source
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39902364126
          name: mg58-original-true-adaptive-physical-47-55-cell-2D-strong-moment
          github-token: ${{ github.token }}
          path: artifacts/mg58_verified
      - name: Accepted original MG63 final coordinate 5 2D positivity
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 39997475198
          name: mg63-original-55-physical-source-coordinate5-multicell-Jensen
          github-token: ${{ github.token }}
          path: artifacts/mg63_verified
      - name: Pin ORIGINAL MG64 36-plane producer artifact from Actions 40002249165
        uses: actions/download-artifact@v4
        with:
          repository: monocap-tech/weil-lab
          run-id: 40002249165
          name: mg64-original-55cell-physical-three-source-Jensen-exact-Gram
          github-token: ${{ github.token }}
          path: artifacts/mg64_producer_verified
      - name: Compile and verify pinned original physical input and MG64 producer archives
        run: |
          python -m py_compile scripts/validate_rpb108_mg64_independent_three_source_replay.py
          test -s artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json
          test -s artifacts/mg57_verified/mg57_targeted_true_strong_action_refinement.json
          test -s artifacts/mg58_verified/mg58_original_targeted_2D_strong_moment.json
          test -s artifacts/mg63_verified/mg63_original_e5_multicell_Jensen.json
          test -s artifacts/mg64_producer_verified/mg64_original_three_source_Jensen.json
      - name: Independent actual original source Fourier regeneration and 252 rational 3x3 selected Gram tests
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg64_independent_three_source_replay.py --verified-mg24-json artifacts/mg24_verified/mg24_full_original_coupled_24source_matrix_enclosures.json --verified-mg57-json artifacts/mg57_verified/mg57_targeted_true_strong_action_refinement.json --verified-mg58-json artifacts/mg58_verified/mg58_original_targeted_2D_strong_moment.json --verified-mg63-json artifacts/mg63_verified/mg63_original_e5_multicell_Jensen.json --verified-mg64-json artifacts/mg64_producer_verified/mg64_original_three_source_Jensen.json
