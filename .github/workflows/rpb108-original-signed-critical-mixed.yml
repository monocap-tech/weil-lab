name: Original closed signed kernel and complete critical mixed block

on:
  push:
    paths:
      - scripts/verify_rpb108_original_signed_frequency_kernel.py
      - scripts/verify_rpb108_original_signed_critical_mixed_block.py
      - scripts/verify_rpb108_original_signed_kernel_validation.py
      - scripts/verify_rpb108_original_signed_critical_mixed_replay.py
      - .github/workflows/rpb108-original-signed-critical-mixed.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bounded-complete-original-signed-mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged open obligation
        run: python scripts/verify_obligation_manifest.py
      - name: Verify accepted original rank custody and FIVE exact JSONs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:return json.load(r)
          run=get('/actions/runs/40582136032')
          source='f61befddcba8600e283a276bfe6205a6d16b5222'
          digest='3389809c3a01c223b95e9dc96ea7c9dd776cb83049bb2d93a3c9d9bbad45af09'
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
          artifact=get('/actions/artifacts/12770022548')
          assert artifact['name']=='original-BS-pruned-rank-bound' and artifact['expired'] is False
          assert artifact['workflow_run']['id']==40582136032 and artifact['workflow_run']['head_sha']==source
          assert artifact['digest']=='sha256:'+digest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(base+'/actions/artifacts/12770022548/zip',headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # Never forward GitHub authorization to blob storage.
              with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==digest
          archive=zipfile.ZipFile(io.BytesIO(data));Path('artifacts').mkdir(exist_ok=True)
          for filename,sha in [
            ('original_BS_pruned_rank_bound.json','9b9820a0163e5e8bf08dd1c2525c757ff67214b49a40cb093d00bc611c9ff9e2'),
            ('original_four_mode_critical_block.json','a84b19c1fefc4e680c5c19ea643bbe5badce639374cb0a424211ee980020f922'),
            ('si29_full_J_L2_normalization.json','c9ee487f8abe7b633c47d2ef7d72e2cc4f7289bc794b2d8fc02bb61520b25e60'),
            ('sm40_original_envelope_method_stop.json','19af532b6bbd4a808854696b2a993e7ebd966e04da27fdd5f55e8b736668770b'),
            ('original_BS_infinite_tail_upper.json','931e5c64db19b28201ce96958495a8bfd8337eb7ebe08096466d86db29a1f801')]:
              raw=archive.read(filename);assert hashlib.sha256(raw).hexdigest()==sha
              Path('artifacts',filename).write_bytes(raw)
          print('Accepted run/source/artifact/archive and FIVE matched JSONs PASS')
          PY
      - name: Replay accepted original reduced rank and complete leakage
        run: python scripts/verify_rpb108_original_BS_pruned_rank_replay.py artifacts/original_BS_pruned_rank_bound.json artifacts/si29_full_J_L2_normalization.json artifacts/sm40_original_envelope_method_stop.json artifacts/original_BS_infinite_tail_upper.json
      - name: Install pinned native arithmetic
        run: python -m pip install python-flint==0.8.0
      - name: Compute COMPLETE original raw signed 242 by 4 mixed block
        run: python scripts/verify_rpb108_original_signed_critical_mixed_block.py --rank artifacts/original_BS_pruned_rank_bound.json --critical artifacts/original_four_mode_critical_block.json
      - name: Independent physical scalar and rigorous Cauchy order13 validation
        run: python scripts/verify_rpb108_original_signed_kernel_validation.py --column artifacts/original_signed_critical_mixed_block.json
      - name: Independent exact all-entry and validation replay
        run: python scripts/verify_rpb108_original_signed_critical_mixed_replay.py artifacts/original_signed_critical_mixed_block.json artifacts/original_signed_kernel_validation.json artifacts/original_BS_pruned_rank_bound.json artifacts/original_four_mode_critical_block.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-signed-critical-mixed-block
          path: artifacts/*.json
          if-no-files-found: error
