name: F08-012 independent original physical normalized smooth mollifier custody
on:
  pull_request:
    paths:
      - 'verification/f08/f08_012/**'
      - '.github/workflows/f08-012-independent-normalized-mollifier-custody.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-original-log-weight:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      F08_RUN: '45246883303'
      F08_ARTIFACT: '14853069607'
      F08_ARTIFACT_SHA: 'ad0c051176dc1e51506ecd12a16cf0363fe4813b4bdf800894440af5be33e2ca'
    steps:
      - uses: actions/checkout@v4
      - name: Source-only preflight and four negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile verification/f08/f08_012/f08_012_independent_mollifier_audit.py
          python3 verification/f08/f08_012/f08_012_independent_mollifier_audit.py --selftest
      - name: Independently validate actual producer Lean run and artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p f08-012-receipt
          python3 - <<'PY'
          import json,os,urllib.request
          root=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          head='7861d585634d150d0f8b47086e5d3a368f48b3fa'
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers=hdr),timeout=30) as r:return json.load(r)
          run=get('/actions/runs/'+os.environ['F08_RUN'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==head and run['head_repository']['full_name']=='monocap-tech/weil-lab'
          assert run['name']=='F08-011 true physical normalized smooth mollifier and Fourier contraction Lean gate'
          jobs=get('/actions/runs/'+os.environ['F08_RUN']+'/jobs')
          assert any(j['conclusion']=='success' and any(
              s['name']=='Genuine pinned kernel build plus strict ten-name axiom audit' and s['conclusion']=='success'
              for s in j['steps']) for j in jobs['jobs'])
          artifact=get('/actions/artifacts/'+os.environ['F08_ARTIFACT'])
          assert artifact['workflow_run']['id']==int(os.environ['F08_RUN'])
          assert artifact['name']=='f08-011-original-normalized-mollifier-compiler-evidence'
          assert artifact['digest']=='sha256:'+os.environ['F08_ARTIFACT_SHA']
          assert artifact['size_in_bytes']>0 and not artifact['expired']
          with open('f08-012-receipt/source-producer.json','w') as f:json.dump(
              {'producer_commit_sha':head,'run_id':int(os.environ['F08_RUN']),'artifact_id':int(os.environ['F08_ARTIFACT']),
               'outer_zip_sha256':os.environ['F08_ARTIFACT_SHA'],'successful':True},f,sort_keys=True,indent=2)
          print('F08-012 independently confirmed successful pinned Lean source and artifact digest')
          PY
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$F08_ARTIFACT/zip" -o f08-012-receipt/f08-011-producer.zip
          echo "$F08_ARTIFACT_SHA  f08-012-receipt/f08-011-producer.zip" | sha256sum -c -
          python3 verification/f08/f08_012/f08_012_independent_mollifier_audit.py --archive f08-012-receipt/f08-011-producer.zip --out f08-012-receipt/f08-012-original-independent-axiom-audit.json
      - name: Archive independent source-only custody
        uses: actions/upload-artifact@v4
        with:
          name: f08-012-original-normalized-mollifier-independent-source-audit
          path: |
            f08-012-receipt/source-producer.json
            f08-012-receipt/f08-012-original-independent-axiom-audit.json
          if-no-files-found: error
