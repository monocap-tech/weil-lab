# Formalization F40 NF779: main-registered review-only PR source checks plus explicitly gated manual Lean pass.
# No historical-branch fan-out. Heavy execution has exactly one marker path and an exact commit-message/source guard.
name: F40 NF779 original HD/A 192–199 one explicitly authorized kernel lane
on:
  # This exact marker can request ONE original-source compiler CANDIDATE; never directly an accepted certificate.
  # No other changed path starts a heavyweight runner.
  push:
    branches: [main]
    paths:
      - 'verification/f40/nf779/NF779_ONE_SHOT_COMPILE_REQUEST.txt'
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 'Exact immutable accepted NF769 source SHA'
        type: string
        required: true
        default: 'a431f903254000bb5ad8edbc276ccc8599da98f5'
      mode:
        description: 'audit: source-only; compile: one source-pinned 192–199 Lean pass'
        type: choice
        options:
          - audit
          - compile
        required: true
        default: audit
      heavy_confirmation:
        description: 'For compile only, type RUN-PINNED-F40-NF779'
        required: false
        type: string
        default: 'NO'
permissions:
  contents: read
  actions: read
jobs:
  authenticate-reuse-and-kernel-actual-original-indexzero-192-199:
    if: >-
      github.repository == 'monocap-tech/weil-lab' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'compile') ||
        (github.event_name == 'push' && github.event.head_commit.message == 'F40 NF779: compile exactly one original 192-199 batch')
      )
    concurrency:
      group: weil-uoi030-single-lane-source-pinned
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Reject unrelated ref, mode or unpinned source before any heavy work
        shell: bash
        env:
          CHECKPOINT: ${{ github.event_name == 'push' && 'a431f903254000bb5ad8edbc276ccc8599da98f5' || inputs.checkpoint }}
          MODE: ${{ github.event_name == 'push' && 'compile' || inputs.mode }}
          HEAVY_CONFIRMATION: ${{ github.event_name == 'push' && 'RUN-PINNED-F40-NF779' || inputs.heavy_confirmation }}
          REQUEST_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'monocap-tech/weil-lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) test "$MODE" = 'compile' ;;
            push)
              test "$MODE" = 'compile'
              test "$REQUEST_COMMIT_MSG" = 'F40 NF779: compile exactly one original 192-199 batch'
              ;;
            *) echo 'Unsupported event'; exit 1 ;;
          esac
          test "$CHECKPOINT" = 'a431f903254000bb5ad8edbc276ccc8599da98f5'
          test "$HEAVY_CONFIRMATION" = 'RUN-PINNED-F40-NF779'
          test "${#GITHUB_SHA}" -eq 40
          echo "Immutable accepted NF769 source pin: $CHECKPOINT; invoking main head: $GITHUB_SHA"
      - name: Checkout immutable accepted NF769 research files into working root
        uses: actions/checkout@v4
        with:
          ref: 'a431f903254000bb5ad8edbc276ccc8599da98f5'
          persist-credentials: false
      - name: Checkout exact main revision containing new NF779 proof drivers
        uses: actions/checkout@v4
        with:
          path: nf779-inputs
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact one-shot marker for push-triggered compiler path
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          p=nf779-inputs/verification/f40/nf779/NF779_ONE_SHOT_COMPILE_REQUEST.txt
          test -f "$p"
          test "$(cat "$p")" = 'COMPILE-NF779-192-199-ONCE:a431f903254000bb5ad8edbc276ccc8599da98f5'
          test "$GITHUB_REF" = 'refs/heads/main'
      - name: Require pinned research identity and overlay only the three new source drivers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a431f903254000bb5ad8edbc276ccc8599da98f5'
          test "$(git -C nf779-inputs rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0'
