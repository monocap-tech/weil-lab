name: NF663 actual physical Gram integer-to-real S^-3 certificate
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaOriginalPhysicalGramIntegerRealScale.lean"
      - "scripts/emit_nf663_original_real_scale_gates.py"
      - ".github/workflows/nf663-original-real-scaling.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf663-scale-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generic-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Exact arbitrary-dimensional integer-to-real center/radius scaling
        run: |
          lake build WeilDefect.Arithmetic.ActualZetaOriginalPhysicalGramIntegerRealScale
      - name: Generic real-scaling axiom audit
        run: |
          cat >/tmp/nf663ScaleAudit.lean <<'EOF'
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalGramIntegerRealScale
          #print axioms WeilDefect.neutralNF663CenterInteger_cast
          #print axioms WeilDefect.neutralNF663RadiusInteger_cast
          #print axioms WeilDefect.neutralNF663Center_scale
          #print axioms WeilDefect.neutralNF663Radius_scale
          #print axioms WeilDefect.neutralNF663ActualIntegerCongruence_enclosed
          EOF
          lake env lean /tmp/nf663ScaleAudit.lean
  physical-integer-attachment:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned exact original source and prior accepted proof artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inputs/archives
          get() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              -o "inputs/archives/$2.zip"
          }
          get 14476203337 nf648-Pole
          get 14476327246 nf648-Osc
          get 14478132104 nf648-Mixed
          get 14443955726 nf621-shard0
          get 14443029185 nf621-shard1
          get 14442993898 nf621-shard2
          get 14443875632 nf621-shard3
          get 14443830605 nf621-shard4
          get 14443726709 nf621-shard5
          get 14441839748 nf621-shard6
          get 14442134710 nf621-shard7
          get 14459025571 nf631-widened
          get 14458696200 nf632-pi
          echo 'e91a83cae117e98608aefa6849dac178e4ddb58dd1dffbfe37304ad248af9ed9  inputs/archives/nf631-widened.zip' | sha256sum -c -
          echo 'd1769ab74275cc9c57452d3aa5ad3a30109efc500f7834ee392ed668612d9a37  inputs/archives/nf632-pi.zip' | sha256sum -c -
          mkdir -p WeilDefect/Generated/NF632
          unzip -q inputs/archives/nf632-pi.zip -d WeilDefect/Generated/NF632
      - name: Rebuild NF655 original analytic Gram sources and NF657 compact witness
        run: |
          python scripts/prepare_nf655_certified_moment_gram.py inputs/archives WeilDefect/Generated
          python scripts/emit_nf657_compact_congruence.py inputs/archives/nf631-widened.zip inputs/nf663-compact.json
          python scripts/verify_nf657_compact_congruence.py inputs/nf663-compact.json inputs/archives/nf631-widened.zip
          python scripts/emit_nf658_original_gram_widenings.py --archive inputs/archives/nf631-widened.zip --witness inputs/nf663-compact.json --output WeilDefect/Generated/NF658
      - name: Recreate all 450 exact NF659 integer gates and 225 original NF662 real entry proofs
        run: |
          python scripts/emit_nf659_gram_transformed_gates.py inputs/nf663-compact.json WeilDefect/Generated/NF659
          python scripts/emit_nf662_original_real_intervals.py WeilDefect/Generated/NF662
          python -m py_compile scripts/emit_nf663_original_real_scale_gates.py
          python scripts/emit_nf663_original_real_scale_gates.py WeilDefect/Generated/NF663
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('WeilDefect/Generated/NF663')
          m=json.loads((p/'manifest.json').read_text())
          assert m['center_gate_references']==225
          assert m['radius_gate_references']==225
          assert len(m['files'])==16
          for x in m['files']:
              assert hashlib.sha256((p/x['file']).read_bytes()).hexdigest()==x['sha256']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf663-real-physical-attachment-source-proposals
          path: |
            WeilDefect/Generated/NF663/manifest.json
            inputs/nf663-compact.json
          if-no-files-found: error
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Original actual H proof bank and representative exact NF659 gate bindings
        timeout-minutes: 35
        run: |
          lake build WeilDefect.Generated.NF662.Complete WeilDefect.Generated.NF663.Row00 WeilDefect.Generated.NF663.Row07 WeilDefect.Generated.NF663.Row14
      - name: Full original 225 transformed REAL entries in NF659 exact integer balls
        timeout-minutes: 35
        run: |
          lake build WeilDefect.Generated.NF663.Complete
      - name: Standard axiom audit of original REAL physical transport
        run: |
          cat >/tmp/nf663PhysicalAudit.lean <<'EOF'
          import WeilDefect.Generated.NF663.Complete
          #print axioms WeilDefect.nf663AllCenters
          #print axioms WeilDefect.nf663AllRadii
          #print axioms WeilDefect.nf663OriginalPhysical_sourceEnclosed
          #print axioms WeilDefect.nf663ActualPhysical_transformedEnclosed
          EOF
          lake env lean /tmp/nf663PhysicalAudit.lean
