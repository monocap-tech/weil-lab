name: F08-057 original log dilation fixed-vector correction kernel
on:
  pull_request:
    paths:
      - 'verification/f08/f08_057/**'
      - '.github/workflows/f08-057-log-dilation-fixed-vector-correction-kernel.yml'
permissions:
  contents: read
jobs:
  original-logarithmic-dilation-factor:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout immutable original IV023 research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Verify source and attach accepted F08-001 weight inequalities
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Arithmetic/LogarithmicForm.lean)" = ae932d4f3f7e4d6d06dbd778a5708927172238dc
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C candidate hash-object verification/f08/f08_001/F08LogWeightDilation.lean)" = 5dce3a647223afbf75ef09f72d90c8afb331ee81
          ! grep -Eq 'sorry|admit|unsafe' candidate/verification/f08/f08_001/F08LogWeightDilation.lean
          ! grep -Eq 'sorry|admit|unsafe' candidate/verification/f08/f08_025/F08NativeLogDilationFactor.lean
          mkdir -p research/WeilDefect/Generated/F08
          cp candidate/verification/f08/f08_001/F08LogWeightDilation.lean research/WeilDefect/Generated/F08/LogWeightDilation.lean
          cp candidate/verification/f08/f08_025/F08NativeLogDilationFactor.lean research/WeilDefect/Generated/F08/NativeLogDilationFactor.lean
          test "$(git -C candidate hash-object verification/f08/f08_025/F08NativeLogDilationFactor.lean)" = d208814f79f04a9926c2059d427419e73d6abb4b
          test "$(git -C candidate hash-object verification/f08/f08_057/F08LogDilationFixedVectorCorrection.lean)" = d1c2d9241f58541e23b1975aec610c63eb84b92f
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_057/F08LogDilationFixedVectorCorrection.lean
          cp candidate/verification/f08/f08_057/F08LogDilationFixedVectorCorrection.lean research/WeilDefect/Generated/F08/LogDilationFixedVectorCorrection.lean
      - name: Initialize frozen Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Genuine Lean build and strict three-name axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.LogDilationFixedVectorCorrection 2>&1 | tee f08-057-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.LogDilationFixedVectorCorrection' '#print axioms WeilDefect.f08_057_logDilationFactor_continuous' '#print axioms WeilDefect.f08_057_logDilationFactor_sub_one_sq_le' '#print axioms WeilDefect.f08_057_logDilationFixedVector_error_tendsto' > /tmp/f08-057-axioms.lean
          lake env lean /tmp/f08-057-axioms.lean 2>&1 | tee f08-057-axioms.log
          python3 - <<'PY'
          import pathlib,re
          names={'f08_057_logDilationFactor_continuous','f08_057_logDilationFactor_sub_one_sq_le','f08_057_logDilationFixedVector_error_tendsto'}
          found={}
          log=pathlib.Path('f08-057-axioms.log').read_text()
          pat=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          for m in re.finditer(pat,log,re.S):
              assert m[1] not in found,('duplicate axiom name',m[1])
              found[m[1]]={x.strip() for x in m[2].split(',') if x.strip()}
          assert not re.sub(pat,'',log,flags=re.S).strip(),('unexpected compiler output',log)
          assert set(found)==names,(found,names)
          assert all(a <= {'propext','Classical.choice','Quot.sound'} for a in found.values()),found
          print('F08-057 fixed-vector correction: 3/3 standard-only axioms')
          PY
      - name: Archive actual compiler logs and complete staged Lean sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-057-original-log-dilation-fixed-vector-correction-compiler-evidence
          path: |
            research/f08-057-build.log
            research/f08-057-axioms.log
            research/WeilDefect/Generated/F08/LogWeightDilation.lean
            research/WeilDefect/Generated/F08/NativeLogDilationFactor.lean
            research/WeilDefect/Generated/F08/LogDilationFixedVectorCorrection.lean
          if-no-files-found: ignore
