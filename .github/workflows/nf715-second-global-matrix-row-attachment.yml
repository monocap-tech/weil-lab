name: NF715 packed second original HD row and A column global attachments
on:
  pull_request:
    paths:
      - "scripts/nf715_second_global_matrix_row_driver.py"
      - ".github/workflows/nf715-second-global-matrix-row-attachment.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf715-packed-second-global-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  second-matrix-global:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate immutable original NF702 complete scaled input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nf715-receipts/{input,cache-proposals,cache-audit,packed-proposals,packed-audit}
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14582437652/zip" -o nf715-input.zip
          echo "258637da71e96468ed7c6ac5b0a4480ce06cdee9989aef8e71a4cd09059789e0  nf715-input.zip" | sha256sum -c -
          unzip -q nf715-input.zip -d nf715-receipts/input
      - name: Restore immutable complete original NF703 center cache
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-proposals
          path: nf715-receipts/cache-proposals
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore NF703 kernel source-specific complete-cache audit
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-audit
          path: nf715-receipts/cache-audit
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore all 31 NF700 packed original row-one / column-one product blocks
        uses: actions/download-artifact@v4
        with:
          name: nf700-packed-matrix-proposals
          path: nf715-receipts/packed-proposals
          run-id: 44623902055
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore the complete accepted NF700 527-theorem packed kernel audit
        uses: actions/download-artifact@v4
        with:
          name: nf700-complete-packed-matrix-audit
          path: nf715-receipts/packed-audit
          run-id: 44623902055
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate exact upstream source and emit first row-one global HD/A gates
        run: |
          set -euo pipefail
          python -m py_compile scripts/nf715_second_global_matrix_row_driver.py
          python scripts/nf715_second_global_matrix_row_driver.py prepare 2>&1 | tee nf715-preflight.log
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF715')
          m=json.loads((d/'manifest.json').read_text())
          assert (m['row'],m['column'],m['first'],m['end'])==(1,1,0,8)
          assert m['actual_global_HD_gates']==m['actual_global_A_gates']==8
          assert len(m['files'])==2 and len(m['audit_theorems'])==12
          assert set(m['source_manifests'])=={'inputs','cache','packed'}
          assert set(m['accepted_audits'])=={'inputs','cache','packed'}
          for f in m['files']:
              assert hashlib.sha256((d/f['file']).read_bytes()).hexdigest()==f['sha256']
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Restore NF707 compiled original scaled input archive
        uses: actions/download-artifact@v4
        with:
          name: nf707-compiled-original-input
          path: nf708-compiled-input
          run-id: 44633937710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable input source and matching compiler environment before reuse
        run: |
          set -euo pipefail
          python scripts/nf708_global_matrix_attachment_driver.py restore-input
      - name: Compile original complete center cache and NF700 signed-digit local block
        timeout-minutes: 245
        run: |
          set -euo pipefail
          /usr/bin/time -o nf715-source-build-time.log -f 'elapsed=%e user=%U rss_kb=%M exit=%x' \
            lake build WeilDefect.Generated.NF703Cache.Data \
              WeilDefect.Generated.NF700.Block000 \
              WeilDefect.Generated.NF715.Common 2>&1 | tee nf715-source-build.log
      - name: Kernel-check actual original matrix row-one and column-one global products
        timeout-minutes: 55
        run: |
          set -euo pipefail
          lake build WeilDefect.Generated.NF715.Block000 2>&1 | tee nf715-attachment-build.log
      - name: Independently print and strictly audit all twelve real global product certificates
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python scripts/nf715_second_global_matrix_row_driver.py axiom-file
          lake env lean nf715Audit.lean 2>&1 | tee nf715-axioms.log
          python scripts/nf715_second_global_matrix_row_driver.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf715-first-second-global-matrix-row-certificates
          path: |
            nf715-*.log
            nf715-*-time.log
            nf708-input-reuse.json
            nf715-complete-audit.json
            WeilDefect/Generated/NF715/
          if-no-files-found: ignore
