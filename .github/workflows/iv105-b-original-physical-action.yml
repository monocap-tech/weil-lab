name: IV105-B exact original physical action spectrum
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv105/iv105_b/ActualZetaIV105BOriginalPhysicalAction.lean'
      - '.github/workflows/iv105-b-original-physical-action.yml'
permissions:
  contents: read
jobs:
  physical-action:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 509e75bb8ac736bca7591336e12aa8a2ab7816d6
          path: predecessor
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaIV103OriginalSchwartzSpectralAttachment.lean)" = 51a58fff565bb27453ab19fe276d49621b951563
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCanonicalNativeEnergy.lean)" = bda93aa61bc6580197649833f30394aae943d910
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaLogCarrierSchwartzCompact.lean)" = bd794a56aa9a4b203ad52002d98f6737a27017b7
          test "$(git -C predecessor rev-parse HEAD)" = 509e75bb8ac736bca7591336e12aa8a2ab7816d6
          test "$(git -C predecessor hash-object verification/iv105/iv105_a/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean)" = 7209b6f0d02dfb7e0890f45c56405f966d25847a
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean
          cp predecessor/verification/iv105/iv105_a/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean research/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean
          test "$(git -C candidate hash-object verification/iv105/iv105_b/ActualZetaIV105BOriginalPhysicalAction.lean)" = bccbbccb7882c4baa67ea0ffbf2d3fc6d9d4536d
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv105/iv105_b/ActualZetaIV105BOriginalPhysicalAction.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.lean
          cp candidate/verification/iv105/iv105_b/ActualZetaIV105BOriginalPhysicalAction.lean research/WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv105-b/out
          touch iv105-b/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV105BOriginalPhysicalAction 2>&1 | tee iv105-b/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.olean -nt iv105-b/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV105BOriginalPhysicalAction' '#print axioms WeilDefect.neutralIV105BInverse_fourier' '#print axioms WeilDefect.neutralIV105BInverse_pair' '#print axioms WeilDefect.neutralIV105BPole_pair' '#print axioms WeilDefect.neutralIV105BAction_pair' > /tmp/iv105-b-axioms.lean
          lake env lean /tmp/iv105-b-axioms.lean 2>&1 | tee iv105-b/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv105-b/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==4 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV105BInverse_fourier","neutralIV105BInverse_pair","neutralIV105BPole_pair","neutralIV105BAction_pair"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV105-B strict named axioms PASS 4/4')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.olean > iv105-b/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv105-b-physical-action-evidence
          path: |
            research/iv105-b/out/
            research/WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105BOriginalPhysicalAction.olean
          include-hidden-files: true
          if-no-files-found: error
