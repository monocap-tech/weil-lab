name: NF459 original 244D native physical Christoffel collar
on:
  pull_request:
  workflow_dispatch:
jobs:
  original-native-244D:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original pinned Arb
        run: pip install --only-binary=:all: python-flint==0.8.0
      - name: Compute native original 242 Gram and two exterior Schur
        run: |
          mkdir -p artifacts
          python -u -X int_max_str_digits=0 scripts/verify_nf459_original_native_244D_christoffel.py --output artifacts/nf459-original-K.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf459-authentic-native-K
          path: artifacts/nf459-original-K.json
