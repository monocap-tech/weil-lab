name: NF503 original 242D support-saturated exterior quotient exact Hilbert theorem
on:
  push:
    branches:
      - research/nf503-original-support-saturated-quotient
    paths:
      - '.github/workflows/nf503-original-support-saturated-exterior-quotient-exact.yml'
      - 'scripts/local_replay/verify_nf503_original_saturated_exterior_Hilbert_quotient_exact.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-original-physical-support-saturation-theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43139106161
          name: nf501-original-J242-QJ-log-projection-source-native
          path: accepted-original-nf501
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact Fraction 48 independently computed outside/primal/direct support model controls and original immutable source calibration
        run: |
          python -m py_compile scripts/local_replay/verify_nf503_original_saturated_exterior_Hilbert_quotient_exact.py
          python -u -X int_max_str_digits=0 scripts/local_replay/verify_nf503_original_saturated_exterior_Hilbert_quotient_exact.py \
            --nf501 accepted-original-nf501/nf501-original-242D-QJ-smooth-log-capture-native.json \
            --output nf503-original-J242-support-saturated-exterior-quotient-exact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf503-original-J242-saturated-exterior-Hilbert-theorem-Fraction
          path: nf503-original-J242-support-saturated-exterior-quotient-exact.json
          if-no-files-found: ignore
          retention-days: 90
