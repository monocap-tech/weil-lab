name: MASTER-RECON V07C

on:
  push:
    branches: [master-recon-001-neutral-shell]
    paths:
      - "WeilDefect/MasterRecon/V07C.lean"
      - ".github/workflows/master-recon-v07c.yml"
  pull_request:
    paths:
      - "WeilDefect/MasterRecon/V07C.lean"
      - ".github/workflows/master-recon-v07c.yml"

permissions:
  contents: read

jobs:
  abstract-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile V07C and inspect axioms
        shell: bash
        run: |
          set -euo pipefail
          lake build WeilDefect.MasterRecon.V07B
          lake env lean WeilDefect/MasterRecon/V07C.lean 2>&1 | tee v07c-lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path("v07c-lean.log").read_text()
          names = ["swapBlock_apply","swapBlock_norm","swapBlock_symmetric","displacementBlock_norm_le","displacementBlock_symmetric","displacement_apply","displacement_norm_le","displacement_selfAdjoint","ordinatePhase_norm","phaseBlock_apply","phaseBlock_norm_le","phaseBlock_cancel","phase_cancel"]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              m = re.search(r"'WeilDefect\.MasterRecon\.V07C\."+name+r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if f"'WeilDefect.MasterRecon.V07C.{name}' does not depend on any axioms" in s:
                      continue
                  raise SystemExit("Missing axiom audit: " + name)
              axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f"Unexpected axioms for {name}: {axioms - allowed}")
          print("V07C strict axiom audit PASS")
          PY
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-recon-v07c-lean
          path: v07c-lean.log
