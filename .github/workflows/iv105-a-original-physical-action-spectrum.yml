name: IV105-A exact original physical action spectrum
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv105/iv105_a/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean'
      - '.github/workflows/iv105-a-original-physical-action-spectrum.yml'
permissions:
  contents: read
jobs:
  physical-action-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaIV103OriginalSchwartzSpectralAttachment.lean)" = 51a58fff565bb27453ab19fe276d49621b951563
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCanonicalNativeEnergy.lean)" = bda93aa61bc6580197649833f30394aae943d910
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaLogCarrierSchwartzCompact.lean)" = bd794a56aa9a4b203ad52002d98f6737a27017b7
          test "$(git -C candidate hash-object verification/iv105/iv105_a/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean)" = 7209b6f0d02dfb7e0890f45c56405f966d25847a
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv105/iv105_a/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean
          cp candidate/verification/iv105/iv105_a/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean research/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv105-a/out
          touch iv105-a/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV105AOriginalPhysicalActionSpectrum 2>&1 | tee iv105-a/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.olean -nt iv105-a/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV105AOriginalPhysicalActionSpectrum' '#print axioms WeilDefect.neutralIV105AWeight_sq_le' '#print axioms WeilDefect.neutralIV105ASpectrum_memLp' '#print axioms WeilDefect.neutralIV105ASpectrum_ae' '#print axioms WeilDefect.neutralIV105ASpectrum_pair' '#print axioms WeilDefect.neutralIV105AMixed_spectrum_pole' > /tmp/iv105-a-axioms.lean
          lake env lean /tmp/iv105-a-axioms.lean 2>&1 | tee iv105-a/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv105-a/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==5 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV105AWeight_sq_le","neutralIV105ASpectrum_memLp","neutralIV105ASpectrum_ae","neutralIV105ASpectrum_pair","neutralIV105AMixed_spectrum_pole"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV105-A strict named axioms PASS 5/5')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.olean > iv105-a/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv105-a-physical-action-spectrum-evidence
          path: |
            research/iv105-a/out/
            research/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV105AOriginalPhysicalActionSpectrum.olean
          include-hidden-files: true
          if-no-files-found: error
