name: Weil-Lab NF440 original J5 complete 3-panel continuous signed integral
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf440_original_cell5_true_signed_panel_exact.py'
      - '.github/workflows/nf440-original-cell5-true-signed.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-source-true-J5-signed-panel:
    strategy:
      fail-fast: false
      matrix:
        panel: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch five original 2048bit parent source JSON per physical J5 piece
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/low artifacts/high artifacts/control artifacts/tail artifacts/mom
          gh run download 41348228875 --repo "$GITHUB_REPOSITORY" --name NF440-original-J5-p${{ matrix.panel }}-m0to256 --dir artifacts/low
          gh run download 41348228875 --repo "$GITHUB_REPOSITORY" --name NF440-original-J5-p${{ matrix.panel }}-m256to512 --dir artifacts/high
          gh run download 41348228875 --repo "$GITHUB_REPOSITORY" --name NF440-original-J5-p${{ matrix.panel }}-m0to8 --dir artifacts/control
          gh run download 41348228856 --repo "$GITHUB_REPOSITORY" --name NF440-original-J5-panel${{ matrix.panel }}-sourcewise-512-tail --dir artifacts/tail
          gh run download 41348413705 --repo "$GITHUB_REPOSITORY" --name NF440-original-J5-panel${{ matrix.panel }}-principal-p512-dx1023 --dir artifacts/mom
      - name: Exact rational original true continuous pz/z2 and D on one J5 panel
        run: |
          python3 -m py_compile scripts/local_replay/nf440_original_cell5_true_signed_panel_exact.py
          python3 scripts/local_replay/nf440_original_cell5_true_signed_panel_exact.py \
            --panel ${{ matrix.panel }} \
            --low artifacts/low/NF440_original_J5_panel${{ matrix.panel }}_n0to256.json \
            --high artifacts/high/NF440_original_J5_panel${{ matrix.panel }}_n256to512.json \
            --control artifacts/control/NF440_original_J5_panel${{ matrix.panel }}_n0to8.json \
            --tail artifacts/tail/NF440_J5_panel${{ matrix.panel }}_sourcewise_true_tail.json \
            --moments artifacts/mom/NF440_original_J5_panel${{ matrix.panel }}_principal_p512_dx1023.json \
            --output artifacts/NF440_original_true_J5_panel${{ matrix.panel }}_signed.json
      - name: Require genuinely signed physical panel result and still-open aggregate
        env:
          PANEL: ${{ matrix.panel }}
        run: |
          python3 - <<'PY'
          import json,sys,os
          sys.set_int_max_str_digits(0)
          from fractions import Fraction as F
          n=int(os.environ['PANEL'])
          x=json.load(open(f'artifacts/NF440_original_true_J5_panel{n}_signed.json'))
          assert x['pass']=='NF440' and x['original_panel_number']==n
          assert x['source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert x['seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert x['original_true_cell5']=='(log(5)-11/10,log(7)-11/10)'
          assert x['original_regular_minus_and_principal_jump_active']==[2,3,4,5]
          assert x['original_regular_plus']==[]
          assert x['original_internal_cuts_are_not_original_support_seams']==['31/50','73/100']
          assert x['original_source_native_coefficient_count']==512
          assert x['original_independent_short_padding_overlap_n0to7']
          assert F(x['original_max_source_native_interval_width_exact'])<F(1,10**44)
          assert F(x['original_true_z_minus_P511_epsilon'])<F(1,10**30)
          assert F(x['original_true_principal_p0_interval'][1])<0
          d0,d1=map(F,x['original_true_signed_D_piece_interval'])
          assert d0<=d1 and d1-d0<F(1,10**28)
          assert not x['full_original_true_cell5_signed_decided']
          assert x['W_ODD_NEG']==x['RH']=='OPEN'
          print('NF440 original true J5 panel',n,'signed',x['original_true_signed_D_piece_sign'],'and p0 valid; whole J5 awaits exact aggregate')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF440-original-true-J5-panel${{ matrix.panel }}-continuous-signed
          path: artifacts/NF440_original_true_J5_panel${{ matrix.panel }}_signed.json
          if-no-files-found: error
  original-true-full-cell5-aggregate:
    needs: original-source-true-J5-signed-panel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download all three source-signed panels and accepted independent NF410 p0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for p in 1 2 3; do
            mkdir -p "artifacts/p$p"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "NF440-original-true-J5-panel${p}-continuous-signed" --dir "artifacts/p$p"
          done
          mkdir -p artifacts/parent
          gh run download 41337646776 --repo "$GITHUB_REPOSITORY" --name NF438-original-cells4-5-source-native-principal-p0 --dir artifacts/parent
      - name: Original NF410 p0 independent test and exact sum true continuous J5 signed
        run: |
          python3 - <<'PY'
          import sys,json,hashlib
          sys.set_int_max_str_digits(0)
          from pathlib import Path
          from fractions import Fraction as F
          def pair(v):return tuple(map(F,v))
          source='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          seams='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          base=Path('artifacts/parent/NF438_original_cells4_5_principal_p0.json').read_bytes()
          assert hashlib.sha256(base).hexdigest()=='b10057b4ec7d2f028342e1ef8ea5111d7f59d01639c7c2bceb2172fa99256177'
          old=json.loads(base)
          assert old['source_sha256']==source and old['seams_sha256']==seams
          ref=pair(old['cells']['5']['independent_original_NF410_p0_interval'])
          pz=(F(0),F(0));z2=(F(0),F(0));D=(F(0),F(0));p0=(F(0),F(0))
          hashes={};children=[]
          for i in (1,2,3):
              file=Path(f'artifacts/p{i}/NF440_original_true_J5_panel{i}_signed.json')
              raw=file.read_bytes()
              hashes[str(i)]=hashlib.sha256(raw).hexdigest()
              x=json.loads(raw)
              assert x['pass']=='NF440' and x['original_panel_number']==i
              assert x['source_sha256']==source and x['seams_sha256']==seams
              assert x['original_regular_minus_and_principal_jump_active']==[2,3,4,5]
              assert x['original_internal_cuts_are_not_original_support_seams']==['31/50','73/100']
              for key,acc in [('original_signed_pz_complete_interval',pz),('original_signed_z2_complete_interval',z2),('original_true_signed_D_piece_interval',D),('original_true_principal_p0_interval',p0)]:
                  a,b=pair(x[key]);acc=(acc[0]+a,acc[1]+b)
                  if key=='original_signed_pz_complete_interval':pz=acc
                  elif key=='original_signed_z2_complete_interval':z2=acc
                  elif key=='original_true_signed_D_piece_interval':D=acc
                  else:p0=acc
              children.append(x)
          assert p0[0]<=ref[1] and ref[0]<=p0[1],('original true J5 aggregated principal m0 mismatch NF410')
          assert p0[1]<0
          assert D[0]<=4*pz[0]+2*z2[0]<=4*pz[1]+2*z2[1]<=D[1]
          assert D[1]-D[0]<F(1,10**28)
          sign='negative' if D[1]<0 else 'positive' if D[0]>0 else 'undecided'
          out={'pass':'NF440','standing':'COMPLETE ORIGINAL TRUE J5 SIGNED CONTINUOUS THREE-PANEL INTEGRAL WITH ORIGINAL NF410 P0; GLOBAL OPEN',
             'original_source_sha256':source,'original_seams_sha256':seams,
             'original_true_cell5':'(log(5)-11/10,log(7)-11/10)',
             'original_rational_cuts_not_physical_seams':['31/50','73/100'],
             'original_three_panel_SHA256':hashes,
             'original_independent_NF410_p0_aggregate_overlap':True,
             'original_aggregate_p0':list(map(str,p0)),
             'original_parent_NF410_accepted_p0':list(map(str,ref)),
             'original_true_J5_pz_complete_interval':list(map(str,pz)),
             'original_true_J5_z2_complete_interval':list(map(str,z2)),
             'original_true_J5_signed_4pz_plus_2z2_interval':list(map(str,D)),
             'original_true_J5_signed_sign':sign,
             'original_true_J5_signed_decision_quality':True,
             'original_cells_complete':[3,4,5,6],
             'original_cells_open':[1,2,7,8],
             'original_global_NF410_NF404_signed_decided':False,
             'original_principal_E_p_global_complete':False,
             'W_ODD_NEG':'OPEN','RH':'OPEN'}
          Path('artifacts/NF440_original_true_full_J5_complete_signed.json').write_text(json.dumps(out,indent=2)+'\n')
          print('NF440 original whole J5 continuous signed',sign,'D',float(D[0]),float(D[1]),'p0 NF410 overlap PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF440-original-true-J5-complete-signed
          path: artifacts/NF440_original_true_full_J5_complete_signed.json
          if-no-files-found: error
