name: RC328 signed finite Parseval and infinite high residual
on:
  push:
    branches:
      - research/rpb108-rc328-signed-finite-tail-residual
    paths:
      - "scripts/validate_rpb108_rc328_signed_finite_tail_residual.py"
      - ".github/workflows/rc328-signed-source-build.yml"
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compute signed original 278-mode source and full infinity Parseval
        run: |
          python scripts/validate_rpb108_rc328_signed_finite_tail_residual.py --output certificates/rpb108_rc328_signed_finite_tail_residual.json
          python scripts/validate_rpb108_rc328_signed_finite_tail_residual.py --output certificates/rpb108_rc328_signed_finite_tail_residual.json --replay
      - name: Freeze certified rational result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc328_signed_finite_tail_residual.json
          if ! git diff --cached --quiet; then
            git commit -m "RC328: freeze signed 278-mode original source and full high residual"
            git fetch origin research/rpb108-rc328-signed-finite-tail-residual
            git rebase origin/research/rpb108-rc328-signed-finite-tail-residual
            git push origin HEAD:research/rpb108-rc328-signed-finite-tail-residual
          fi
