name: RC306 Markov/adaptive signed bounds generator
on:
  push:
    branches:
      - research/rpb108-rc306-adaptive-markov
    paths:
      - "scripts/validate_rpb108_rc306_adaptive_markov.py"
      - ".github/workflows/rc306-adaptive-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited validator dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Generate and replay adaptive endpoint and Markov prime bounds
        run: |
          python scripts/validate_rpb108_rc306_adaptive_markov.py --output certificates/rpb108_rc306_adaptive_markov.json
          python scripts/validate_rpb108_rc306_adaptive_markov.py --output certificates/rpb108_rc306_adaptive_markov.json --replay
      - name: Commit exact replayed certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc306_adaptive_markov.json
          if ! git diff --cached --quiet; then
            git commit -m "RC306: materialize signed-prime Markov and all-degree endpoint certificate"
            git pull --rebase origin research/rpb108-rc306-adaptive-markov
            git push origin HEAD:research/rpb108-rc306-adaptive-markov
          fi
