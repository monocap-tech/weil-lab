name: RC321 original P4 boundary-native response
on:
  push:
    branches:
      - research/rpb108-rc321-p4-boundary-native
    paths:
      - "scripts/validate_rpb108_rc321_p4_boundary_native.py"
      - ".github/workflows/rc321-p4-native-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evaluate original signed P4-P2 complete source and reverse exact replay
        run: |
          python scripts/validate_rpb108_rc321_p4_boundary_native.py --output certificates/rpb108_rc321_p4_boundary_native.json
          python scripts/validate_rpb108_rc321_p4_boundary_native.py --output certificates/rpb108_rc321_p4_boundary_native.json --replay
      - name: Freeze verified RC321 certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc321_p4_boundary_native.json
          if ! git diff --cached --quiet; then
            git commit -m "RC321: freeze complete signed boundary-native P4-P2 source certificate"
            git fetch origin research/rpb108-rc321-p4-boundary-native
            git rebase origin/research/rpb108-rc321-p4-boundary-native
            git push origin HEAD:research/rpb108-rc321-p4-boundary-native
          fi
