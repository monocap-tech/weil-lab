name: NF721 consolidate independently kernel-accepted original row-one matrix receipts
on:
  pull_request:
    paths:
      - "scripts/nf721_original_row_one_accepted_inventory.py"
      - ".github/workflows/nf721-original-row-one-accepted-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  accepted-index-one-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-bounded accepted parent kernel run conclusions and artifact IDs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          api=lambda p:json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{p}'],text=True))
          expected={
            44660635800:('nf715-first-second-global-matrix-row-certificates',14597076473),
            44664511419:('nf716-second-original-global-matrix-row-continuation',14599006475),
            44665952640:('nf718-complete-original-global-matrix-row-one-64-coordinate-audit',14600591151),
            44666765580:('nf719-complete-original-global-matrix-row-one-64-coordinate-audit',14599649777),
          }
          for run,(name,artifact) in expected.items():
            obj=api(f'actions/runs/{run}')
            assert obj['status']=='completed' and obj['conclusion']=='success',run
            arts=api(f'actions/runs/{run}/artifacts?per_page=100')['artifacts']
            found=[a for a in arts if a['name']==name and a['id']==artifact and not a['expired']]
            assert len(found)==1,(run,name,artifact)
          print('NF721 exact four accepted Lean workflow and immutable artifact prerequisites PASS')
          PY
      - name: Restore accepted first original row-one kernel receipt
        uses: actions/download-artifact@v4
        with:
          name: nf715-first-second-global-matrix-row-certificates
          path: nf721-audits/nf715
          run-id: 44660635800
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted second original row-one kernel receipt
        uses: actions/download-artifact@v4
        with:
          name: nf716-second-original-global-matrix-row-continuation
          path: nf721-audits/nf716
          run-id: 44664511419
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted NF718 two-shard standard-axiom aggregate
        uses: actions/download-artifact@v4
        with:
          name: nf718-complete-original-global-matrix-row-one-64-coordinate-audit
          path: nf721-audits/nf718
          run-id: 44665952640
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted NF719 two-shard standard-axiom aggregate
        uses: actions/download-artifact@v4
        with:
          name: nf719-complete-original-global-matrix-row-one-64-coordinate-audit
          path: nf721-audits/nf719
          run-id: 44666765580
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit original source hashes, theorem whitelist, exact gaps and disjoint gate inventory
        run: |
          set -euo pipefail
          python -m py_compile scripts/nf721_original_row_one_accepted_inventory.py
          python scripts/nf721_original_row_one_accepted_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: nf721-accepted-original-row-one-source-specific-inventory
          path: nf721-accepted-original-row-one-inventory.json
          if-no-files-found: error
