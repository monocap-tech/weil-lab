          Path(f'/tmp/f41_{k}_audit.lean').write_text(f'import WeilDefect.Generated.F41{k}.Attach{rr}\n'+''.join(f'#print axioms WeilDefect.{n}\n' for n in names))
          PY
          lake env lean "/tmp/f41_${K}_audit.lean" 2>&1 | tee "f41-$K-axioms.log"
          python "../candidate/$GENERATOR" audit --output "WeilDefect/Generated/F41$K" --axioms-log "f41-$K-axioms.log"
      - name: Publish row ${{ matrix.rows[6].rr }} original kernel archive
        if: ${{ matrix.rows[6].active }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rows[6].artifact }}
          path: |
            research/f41-${{ matrix.rows[6].k }}-*.log
            research/f41-${{ matrix.rows[6].k }}-original-source.json
            research/WeilDefect/Generated/F41${{ matrix.rows[6].k }}/
          if-no-files-found: error
          overwrite: true
      - name: Compile and axiom-audit row ${{ matrix.rows[7].rr }}
        if: ${{ matrix.rows[7].active }}
        timeout-minutes: 185
        env:
          RR: ${{ matrix.rows[7].rr }}
          K: ${{ matrix.rows[7].k }}
          GENERATOR: ${{ matrix.rows[7].generator }}
        run: |
          set -euo pipefail
          lake build "WeilDefect.Generated.F41$K.Row$RR" 2>&1 | tee "f41-$K-local-row.log"
          lake build "WeilDefect.Generated.F41$K.Attach$RR" 2>&1 | tee "f41-$K-full-attach.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          k=os.environ['K']; rr=os.environ['RR']
          d=Path(f'WeilDefect/Generated/F41{k}')
          m=json.loads((d/'manifest.json').read_text())
          names=m['axiom_names']
          assert m['row']==int(rr) and len(names)==len(set(names))==9
          Path(f'/tmp/f41_{k}_audit.lean').write_text(f'import WeilDefect.Generated.F41{k}.Attach{rr}\n'+''.join(f'#print axioms WeilDefect.{n}\n' for n in names))
          PY
          lake env lean "/tmp/f41_${K}_audit.lean" 2>&1 | tee "f41-$K-axioms.log"
          python "../candidate/$GENERATOR" audit --output "WeilDefect/Generated/F41$K" --axioms-log "f41-$K-axioms.log"
      - name: Publish row ${{ matrix.rows[7].rr }} original kernel archive
        if: ${{ matrix.rows[7].active }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rows[7].artifact }}
          path: |
            research/f41-${{ matrix.rows[7].k }}-*.log
            research/f41-${{ matrix.rows[7].k }}-original-source.json
            research/WeilDefect/Generated/F41${{ matrix.rows[7].k }}/
          if-no-files-found: error
          overwrite: true
