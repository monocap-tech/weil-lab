name: mg19-original-intersected-relative-weight-source
on:
  pull_request:
    paths:
      - 'scripts/validate_rpb108_mg19_intersected_weight_source_moments.py'
      - 'notes/RPB108_MG19_INTERSECTED_RELATIVE_WEIGHT_20261019.md'
      - '.github/workflows/rpb108-mg19-intersected-original-weight.yml'
  workflow_dispatch:
jobs:
  mg19-intersected-original-weight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Exact original 24x24 two moments and intersected relative multiplier bounds
        run: |
          python -m py_compile scripts/validate_rpb108_mg19_intersected_weight_source_moments.py
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/validate_rpb108_mg19_intersected_weight_source_moments.py
      - name: Exact original three-way spectral acceptance with all W-ODD-NEG gates OPEN
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction as F
          import sys
          # Exact-rational source matrices can legitimately contain
          # >4300-digit integers. Python 3.11's text-conversion guard
          # is an I/O limit, not a mathematical precision bound.
          sys.set_int_max_str_digits(0)
          sys.path.insert(0,"scripts")
          from validate_rpb108_sm62_full25_338signed_positive import exact_inertia_general
          d=json.load(open("artifacts/mg19_original_intersected_relative_weighted_moments.json"))
          assert d["canonical_W_ODD_NEG"]=="OPEN"
          assert d["status"]=="SCOPED_NONFLAT_ORIGINAL_INTERSECTED_RELATIVE_WEIGHT_FULL_SOURCE_MOMENTS"
          assert d["MG17_absolute_same_cell_exact_replay_matched"]
          assert d["MG19_all_independent_relative_weight_factors_intersected"]
          assert d["selected_new_nonflat_cells"]==24
          assert d["true_source_count"]==25 and d["true_boundary_adapted_source_count"]==23
          assert d["original_pole_included"] and d["all_24_coupled_source_channels_retained"]
          assert d["same_new_nonflat_cell_family_used_for_both_comparisons"]
          assert d["SM43A_true_signed_affine_J1_nonzero_each_cell"]
          assert len(d["per_cell_diagnostics"])==24
          for order in ("one","two"):
              assert 0<=d["MG19_strictly_tightened_original_reference_cell_moment_count"][order]<=24
              for cell in d["per_cell_diagnostics"]:
                  a,b=map(F,cell[order+"_MG18_old_multiplier_factors"])
                  c,e=map(F,cell[order+"_MG19_intersected_multiplier_factors"])
                  assert 0<=a<=c<=e<=b
              for family in ("constant","weighted","relative"):
                  m=d["actual_original_coupled_source_matrices"][family][order]
                  L=[[F(v) for v in row] for row in m["lower"]]
                  U=[[F(v) for v in row] for row in m["upper"]]
                  assert len(L)==len(U)==24 and all(len(row)==24 for row in L+U)
                  assert all(L[i][j]==L[j][i] and U[i][j]==U[j][i]
                             for i in range(24) for j in range(24))
                  assert all(U[i][i]>=L[i][i] for i in range(24))
                  assert F(m["lower_trace"])==sum(L[i][i] for i in range(24))
                  assert F(m["upper_trace"])==sum(U[i][i] for i in range(24))
                  inertia=exact_inertia_general(L)
                  assert m["lower_exact_inertia"]==dict(zip(
                      ("positive","negative","zero"),inertia))
              comp=d["same_cell_method_comparison"][order]
              assert comp["same_cell_constant_lower_inertia"]=={"positive":3,"negative":21,"zero":0}
              assert comp["same_cell_weighted_lower_inertia"]==(
                  {"positive":3,"negative":21,"zero":0} if order=="one"
                  else {"positive":2,"negative":22,"zero":0})
          assert not d["source_moments_cover_complete_low_band"]
          assert not d["original_Astar_squared_pole_correction_certified"]
          assert not d["original_strong_Galerkin_residual_certified"]
          assert not d["original_full470_odd_operator_certified"]
          assert d["even_Weil_CC27_RH"]=="OPEN"
          assert d["independent_original_Fourier_domain_premises_audit"]=="OPEN"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mg19-original-intersected-relative-weight
          path: artifacts/mg19_original_intersected_relative_weighted_moments.json
