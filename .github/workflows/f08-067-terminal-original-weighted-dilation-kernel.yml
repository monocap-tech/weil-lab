      - name: Install original frozen Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile terminal original weighted dilation and strict named axioms
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.TerminalOriginalWeightedDilation 2>&1 | tee f08-067-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.TerminalOriginalWeightedDilation' '#print axioms WeilDefect.f08_067_scale_pos' '#print axioms WeilDefect.f08_067_physicalDilation_mem' '#print axioms WeilDefect.f08_067_weightedDifference_sq' '#print axioms WeilDefect.f08_067_weightedPhysicalDilation_tendsto' > /tmp/f08-067-axioms.lean
          lake env lean /tmp/f08-067-axioms.lean 2>&1 | tee f08-067-axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('f08-067-axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==4,('four declarations required',s)
          assert not re.sub(p,'',s,flags=re.S).strip(),('unrecognized compiler output',s)
          assert {m[1] for m in ms}=={'f08_067_scale_pos','f08_067_physicalDilation_mem','f08_067_weightedDifference_sq','f08_067_weightedPhysicalDilation_tendsto'}
          for m in ms:
              a={x.strip() for x in m[2].split(',') if x.strip()}
              assert a <= {'propext','Classical.choice','Quot.sound'},('nonstandard axioms',a)
          print('F08-067 terminal weighted dilation: 4/4 standard-only axioms PASS')
          PY
      - name: Archive complete exact original source and actual Lean compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
