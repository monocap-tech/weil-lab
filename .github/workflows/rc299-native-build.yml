name: RC299 native P8 generator (one-time)
on:
  push:
    branches:
      - research/rpb108-rc299-p8-native
    paths:
      - "scripts/validate_rpb108_rc299_native_p8_action.py"
      - ".github/workflows/rc299-native-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited validator dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Generate exact P8 certificate from pinned inputs
        run: |
          python scripts/validate_rpb108_rc299_native_p8_action.py --output certificates/rpb108_rc299_native_p8_action.json
          python scripts/validate_rpb108_rc299_native_p8_action.py --output certificates/rpb108_rc299_native_p8_action.json --replay
      - name: Commit generated exact certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc299_native_p8_action.json
          if ! git diff --cached --quiet; then
            git commit -m "RC299: materialize and verify exact P8 high-output certificate"
            git push origin HEAD:research/rpb108-rc299-p8-native
          fi
