name: Weil-Lab NF385 exact original one-ray energy ceiling
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf385_original_one_ray_energy_dual_ceiling.py'
      - '.github/workflows/nf385-original-one-ray-energy.yml'
permissions:
  contents: read
jobs:
  exact-energy-ceiling:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original n512 Fraction budget
        run: |
          python3 scripts/local_replay/nf385_original_one_ray_energy_dual_ceiling.py --original-512 notes/data/provisional/NF380_original_archived_unfitted_signed_dual_native.json --output artifacts/NF385_original_one_ray.json
          python3 -c "import json;d=json.load(open('artifacts/NF385_original_one_ray.json'));assert d['W_ODD_NEG']==d['RH']=='OPEN' and d['original_n513_signed_measurement'] is False"
      - uses: actions/upload-artifact@v4
        with:
          name: nf385-original-one-ray-evidence
          path: artifacts/NF385_original_one_ray.json
