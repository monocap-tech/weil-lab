name: NF460 original bulk seam and H1 obstruction
on:
  pull_request:
  workflow_dispatch:
jobs:
  original-source-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict original 7-seam 244D residual source verification
        run: python -X int_max_str_digits=0 scripts/local_replay/verify_nf460_original_bulk_jumps_h1.py --output nf460-source-jumps.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf460-original-bulk-seam-source
          path: nf460-source-jumps.json
