name: Validate formalization metadata

on:
  pull_request:
    paths:
      - formalization.yaml
      - .github/workflows/formalization-metadata.yml
  push:
    paths:
      - formalization.yaml
      - .github/workflows/formalization-metadata.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install check-jsonschema
      - name: Validate formalization.yaml against upstream versioned schema
        run: check-jsonschema --schemafile https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json formalization.yaml
