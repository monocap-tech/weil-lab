name: Weil-Lab NF409 true original continuous-action two-form probe
on:
  push:
    branches: [research/nf409-original-continuous-certified-entry]
    paths:
      - '.github/workflows/nf409-original-two-form-probe.yml'
      - 'scripts/local_replay/nf409_original_continuous_two_form_pilot.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-original-two-form:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nf409-original-continuous-certified-entry
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source preflight and independent numerical environment
        run: |
          pip install mpmath==1.3.0 numpy==2.1.3
          python3 -m py_compile scripts/local_replay/nf409_original_continuous_two_form_pilot.py
      - name: Confirm real original analytic signed arch+prime stable continuous form vs unregularized source
        run: |
          python3 -u scripts/local_replay/nf409_original_continuous_two_form_pilot.py --nodes 14 --step 1/25 --dps 205 --output /tmp/NF409_original_continuous_two_form_pilot.json
          python3 - <<'PY'
          import json
          from mpmath import mp
          r=json.load(open('/tmp/NF409_original_continuous_two_form_pilot.json'))
          mp.dps=100
          assert len(r['original_two_form_samples'])==2
          for s in r['original_two_form_samples']:
              assert mp.mpf(s['difference_z_two_form'])<mp.mpf('1e-150')
              assert len(s['source_original_all_prime_branches'])==7
          assert r['arbitrary_transcendental_roundoff_certified'] is False
          assert r['original_x_integral_and_complete_centered_norm_certified'] is False
          assert r['W_ODD_NEG']==r['RH']=='OPEN'
          PY
      - name: Custody original source pointwise two-form provisional evidence only
        run: |
          mkdir -p notes/data/provisional
          target=notes/data/provisional/NF409_original_continuous_two_form_pilot.json
          if test -e "$target"; then cmp -s "$target" /tmp/NF409_original_continuous_two_form_pilot.json
          else cp /tmp/NF409_original_continuous_two_form_pilot.json "$target"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m 'NF409 original source true regularized continuous action pointwise PROVISIONAL two-form'
            git pull --rebase origin research/nf409-original-continuous-certified-entry
            git push origin HEAD:refs/heads/research/nf409-original-continuous-certified-entry
          fi
