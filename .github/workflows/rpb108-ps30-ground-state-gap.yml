name: RPB108 PS30 original even Schur ground-state jump and gap

on:
  pull_request:
    paths:
      - "notes/RPB108_PS30_GROUND_STATE_GAP_20261018.md"
      - "scripts/validate_rpb108_ps30_ground_state_gap.py"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps30-ground-state-gap.yml"
  workflow_dispatch:

jobs:
  ps30-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original PS28 source chain and PS30 ground-state exact Fraction regression
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps30_ground_state_gap.py
          python3 scripts/validate_rpb108_ps30_ground_state_gap.py
      - name: Keep original odd and even sign obligations and RH OPEN
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert p["checkpoints"][-1]["id"]=="PS30"
          assert all(flag is False for flag in p["closures"].values())
          PY
