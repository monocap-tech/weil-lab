name: NF365-NF367 provisional custody replay (NOT Weil acceptance)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'notes/provisional/**'
      - 'scripts/local_replay/nf365_projection_identity_check.py'
      - 'scripts/local_replay/nf366_negative_quotient_transfer.py'
      - 'scripts/local_replay/nf367_form_quotient_transfer.py'
      - '.github/workflows/nf365-custody-algebra.yml'
permissions:
  contents: read
  actions: read
jobs:
  algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Exact rational NF365 projection regression
        run: python3 scripts/local_replay/nf365_projection_identity_check.py
  pr355-archive-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download original PR355 native artifact (do not forward auth on redirect)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/monocap-tech/weil-lab/actions/artifacts/12776684037/zip" \
            --output "${RUNNER_TEMP}/nf366-pr355.zip"
      - name: SHA-pinned PR355 native output and NF366 exact rational replay
        run: python3 scripts/local_replay/nf366_negative_quotient_transfer.py --offline "${RUNNER_TEMP}/nf366-pr355.zip"
      - name: SHA-pinned PR355 native output and NF367 form-energy replay
        run: python3 scripts/local_replay/nf367_form_quotient_transfer.py --offline "${RUNNER_TEMP}/nf366-pr355.zip"
