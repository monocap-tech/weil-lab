name: SI29 full augmented Ritz method stop

on:
  push:
    paths:
      - scripts/verify_rpb108_si29_augmented_ritz_method_stop.py
      - scripts/verify_rpb108_si29_augmented_ritz_method_stop_replay.py
      - .github/workflows/rpb108-si29-augmented-ritz-method-stop.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  complete-augmented-method-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged open obligation and current stopping directive
        run: python scripts/verify_obligation_manifest.py
      - name: Verify all original GitHub custody and extract matched inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:return json.load(r)
          specs=[
            (40417043904,'0e3321350980247f8cba46cdbb45b717e49ad213',12694539474,'si29-full-trial-preconditioner','e2c6017b35cd85ba404efa8013305d9e7c023d916cc1b2f96dbbcf7a7c8f772a',[
              ('si29_full_J_L2_normalization.json','c9ee487f8abe7b633c47d2ef7d72e2cc4f7289bc794b2d8fc02bb61520b25e60'),
              ('si29_full_trial_preconditioner.json','87d6f3ae24cde489adaf9ab3ac7efa612bc82bd78c6c9e94866802fdc550052f')]),
            (40423854196,'fa7986b3fd83b8fd93014c886eb26943807e0202',12699072252,'si29-original-negative-mixed-budget','1e63931e6e64d8fa6e7926ccf905b46dc906d62be2c9624d36376ed27b0184c4',[
              ('si29_reference_on_J_perp.json','f1149e27da8a0e1d90e48b8ee0eb8a0a0b8ef51d0910499a7fcd19a082efca07'),
              ('si29_original_negative_mixed_budget.json','a693261c31f01a4a1e11ea6400e5173435a8260b41b1f6b43aa6f67f784ccb7f')]),
            (40194516892,'59b6449f11e7fae8791d8baf35cc049ad15826a5',12599562140,'original-low12-960-cell-rational-witness-or-diagnostic','98dc1704ceb5dfb007349100606026a87be60ceb785132e7f4e3293f09902e31',[
              ('mg07_true_original_low12_960cell.json','4cc8e320de50918965ce1c47acbf7cdd87747bdb373c6a5da6a2ae1b3b0d8ba2')])]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          Path('artifacts').mkdir(exist_ok=True)
          for run_id,commit,artifact_id,name,archive_sha,files in specs:
              run=get('/actions/runs/'+str(run_id));assert run['conclusion']=='success' and run['head_sha']==commit
              artifact=get('/actions/artifacts/'+str(artifact_id))
              assert artifact['name']==name and artifact['expired'] is False
              assert artifact['workflow_run']['id']==run_id and artifact['workflow_run']['head_sha']==commit
              assert artifact['digest']=='sha256:'+archive_sha
              request=urllib.request.Request(base+'/actions/artifacts/'+str(artifact_id)+'/zip',headers=headers)
              try:
                  with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
              except urllib.error.HTTPError as e:
                  assert e.code in (301,302,303,307,308)
                  # Authorization is never forwarded to artifact storage.
                  with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
              assert hashlib.sha256(data).hexdigest()==archive_sha
              archive=zipfile.ZipFile(io.BytesIO(data))
              for json_name,json_sha in files:
                  raw=archive.read(json_name);assert hashlib.sha256(raw).hexdigest()==json_sha
                  Path('artifacts',json_name).write_bytes(raw)
              print('Accepted run/source/archive and ALL matched JSON inputs PASS',run_id)
          PY
      - name: Install pinned native ball runtime
        run: python -m pip install python-flint==0.8.0
      - name: Compute all 321 actual jets and complete augmented Ritz stopping bound
        run: python scripts/verify_rpb108_si29_augmented_ritz_method_stop.py --native-certificate artifacts/si29_full_J_L2_normalization.json --negative-certificate artifacts/si29_original_negative_mixed_budget.json --schur-certificate artifacts/si29_reference_on_J_perp.json --stop-certificate artifacts/mg07_true_original_low12_960cell.json
      - name: Independently replay all exact payments and coupled graph proof regression
        run: python scripts/verify_rpb108_si29_augmented_ritz_method_stop_replay.py artifacts/si29_augmented_ritz_method_stop.json artifacts/si29_original_negative_mixed_budget.json artifacts/mg07_true_original_low12_960cell.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si29-full-augmented-ritz-method-stop
          path: artifacts/*.json
          if-no-files-found: warn
