name: RPB108 PS24 original signed second-generation seam absorption

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps24_second_generation_seam.py"
      - "notes/RPB108_PS24_SECOND_GENERATION_SEAM_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps24-second-generation-seam.yml"
  workflow_dispatch:

jobs:
  ps24-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay original signed source and verify two-generation Carleman seam gates
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps24_second_generation_seam.py
          python3 scripts/validate_rpb108_ps24_second_generation_seam.py
      - name: Preserve canonical W-ODD-NEG and whole residual OPEN
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(value is False for value in p["closures"].values())
          PY
