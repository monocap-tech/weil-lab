      - name: Independent original NF413 full L2 sharpened native ball, NF446 derivative moving-edge proof, three accepted NF489 original sources and exact signed physical strip integral
        run: >-
          python -u -X int_max_str_digits=0
          scripts/local_replay/verify_nf490_original_J8_first_true_positive_signed_strip_exact.py
          --native verified-native-point/nf489-original-J8-joint-compact-x549over500-native.json
          --native-audit verified-native-point/nf489-independent-original-J8-compact-point-exact.json
          --nf482-independent verified-independent-original-NF482/nf489-original-NF482-first-physical-boundary-source-exact.json
