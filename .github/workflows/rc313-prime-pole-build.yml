name: RC313 original prime and pole distributional identity
on:
  push:
    branches:
      - research/rpb108-rc313-prime-pole-distributions
    paths:
      - "scripts/validate_rpb108_rc313_prime_pole_distributions.py"
      - ".github/workflows/rc313-prime-pole-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and reverse replay CC27 original source identity
        run: |
          python scripts/validate_rpb108_rc313_prime_pole_distributions.py --output certificates/rpb108_rc313_prime_pole_distributions.json
          python scripts/validate_rpb108_rc313_prime_pole_distributions.py --output certificates/rpb108_rc313_prime_pole_distributions.json --replay
      - name: Commit verified rational certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc313_prime_pole_distributions.json
          if ! git diff --cached --quiet; then
            git commit -m "RC313: freeze original prime/pole source and canonical carrier interface"
            git pull --rebase origin research/rpb108-rc313-prime-pole-distributions
            git push origin HEAD:research/rpb108-rc313-prime-pole-distributions
          fi
