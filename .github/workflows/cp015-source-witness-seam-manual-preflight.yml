name: CP015 MANUAL cheap original Euler-RS zero-witness source and 149.5 seam gate
# Manual workflow_dispatch or explicit opt-in PR label only; no push/sync fanout.
# This source validation is NOT Lean kernel certification.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  original-zero-witness-source-not-kernel:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'cp015-source-preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact finite source cardinality, no-root-on-seam and negative controls
        run: |
          set -euo pipefail
          python -m py_compile scripts/cp015_unconditional_seam_source_preflight.py scripts/cp015_exact_source_seam_lean_axiom_audit.py
          python scripts/cp015_unconditional_seam_source_preflight.py --self-test \
            | tee cp015-exact-source-seam-negative-controls.log
          grep -F 'CP015 EXACT FULL SOURCE-CARDINALITY AND OPEN-SEAM SATURATION TEST: PASS' cp015-exact-source-seam-negative-controls.log
      - name: Fetch seven REAL original upstream source files and require SHA-pinned release
        timeout-minutes: 12
        run: |
          set -euo pipefail
          commit=c06b4e13d9c847e50a32c3d738271cbad62ae9f3
          for file in \
            Zeta/Zeros/Interval.lean \
            Zeta/Zeros/Certificates/Basic.lean \
            Zeta/Zeros/CountCertificates.lean \
            Zeta/Zeros/RiemannHypothesisUpTo/Basic.lean \
            Zeta/Gram/Certificates.lean \
            Zeta/Zeros/Certificates/EulerMaclaurin/Batch0001.lean \
            Zeta/Zeros/Certificates/RiemannSiegel/Batch0001.lean; do
            mkdir -p "cp015-upstream-source/$(dirname "$file")"
            curl -fLSs --retry 3 \
              "https://raw.githubusercontent.com/smmercuri/zeta/$commit/$file" \
              -o "cp015-upstream-source/$file"
          done
      - name: Verify authentic original SHA, public witness theorem signatures and source count
        run: |
          set -euo pipefail
          python scripts/cp015_unconditional_seam_source_preflight.py \
            --upstream-source cp015-upstream-source \
            --receipt cp015-source-only-zero-witnesses.json \
            | tee cp015-source-only-zero-witnesses.log
          grep -F 'CP015_SOURCE_WITNESS_COVER_AND_SEAM_SIGNATURES_PASS_NOT_KERNEL' cp015-source-only-zero-witnesses.log
          test -s cp015-source-only-zero-witnesses.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp015-authentic-7-source-witnesses-open-seam-NOT-LEAN-kernel
          path: |
            cp015-exact-source-seam-negative-controls.log
            cp015-source-only-zero-witnesses.log
            cp015-source-only-zero-witnesses.json
          if-no-files-found: ignore
