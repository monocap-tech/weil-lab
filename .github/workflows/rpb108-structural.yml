name: RPB108 structural SI verification

on:
  push:
    branches:
      - 'research/rpb108-structural-*'
    paths:
      - "scripts/validate_rpb108_si*.py"
      - "notes/RPB108_SI*.md"
      - ".github/workflows/rpb108-structural.yml"
  pull_request:
    branches:
      - research/rpb108-route-consolidation
    paths:
      - "scripts/validate_rpb108_si*.py"
      - "notes/RPB108_SI*.md"
      - ".github/workflows/rpb108-structural.yml"

permissions:
  contents: read

jobs:
  # Fast, independently replayed newest SI certificate. The existing full
  # regression below is still mandatory for integration and is not weakened.
  frontier-exact-rational:
    name: Latest frontier exact rational gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay most recent SI validator
        run: |
          f="$(ls scripts/validate_rpb108_si*.py | sort -V | tail -n 1)"
          test -n "$f"
          python -m py_compile "$f"
          python "$f"
  exact-rational-regression:
    name: Exact structural identity regressions
    runs-on: ubuntu-latest
    # SI02–SI27 replay includes the signed full physical 9x9 interval Gram;
    # retain every original validator rather than accepting timeout cancellation.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run all structural validators
        run: |
          for f in scripts/validate_rpb108_si*.py; do
            python -m py_compile "$f"
            python "$f"
          done
