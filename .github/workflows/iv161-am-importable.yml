name: IV234 fresh integrated full-bank and original terminal replay
on:
  push:
    branches: ['staging/iv147-am-kernel-pilot']
    paths: ['.github/workflows/iv161-am-importable.yml']
permissions:
  contents: read
concurrency:
  group: iv147-am-pilot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate source and generate proof modules
        run: |
          set -euo pipefail
          mkdir -p iv234/out
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python research/iv146_am_exp_audit.py custody/iv146-am/am_cells.json iv234/out/exact-audit.json
          python research/iv231_am_full_original_replay.py --generate-only --out iv234/out/replay
          python - <<'PY'
          import re,json
          from pathlib import Path
          a=Path('WeilDefect/Arithmetic')
          d=json.loads(Path('custody/iv146-am/am_cells.json').read_text())
          s=(a/'ActualZetaIV146AMCellData.lean').read_text()
          pairs=re.findall(r'def neutralIV149Chunk(\d{3}) : Array Nat := #\[([^\]]*)\]',s)
          assert [int(i) for i,_ in pairs]==list(range(128))
          chunks=[list(map(int,re.findall(r'\d+',x))) for _,x in pairs]
          h=s.split('def neutralIV146HChunks : Array (Array Nat) := #[',1)[1].split(']',1)[0]
          assert list(map(int,re.findall(r'neutralIV149Chunk(\d{3})',h)))==list(range(128))
          assert len(chunks)==128 and all(len(c)==128 for c in chunks)
          assert [x for c in chunks for x in c]==d['h']
          b=s.split('def neutralIV146Shifts : List (Int × Nat) := [',1)[1].split(']',1)[0]
          assert [list(map(int,x)) for x in re.findall(r'\((-?\d+),\s*(\d+)\)',b)]==d['shifts']
          for p in [a/'ActualZetaIV162AMOriginalPrimeCore.lean',a/'ActualZetaIV157AMOriginalDictionary.lean',a/'ActualZetaIV160AMTerminalReceiver.lean',*list((a/'IV160Bank').glob('*.lean'))]:
              assert not re.search(r'\b(?:sorry|admit|sorryAx|native_decide|axiom)\b',p.read_text()),p
          print('Source preflight PASS')
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Fresh integrated bank and original terminal verification
        run: |
          set -euo pipefail
          python -u research/iv231_am_full_original_replay.py --out iv234/out/replay 2>&1 | tee iv234/out/full-replay.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('iv234/out/replay')
          assert len(json.loads((p/'source-manifest.json').read_text()))==731
          for k in range(8):
              m=json.loads((p/f'sector{k}'/'manifest.json').read_text())
              lo,hi=(32,128) if k==0 else (128*k,128*(k+1))
              assert m['plan']['block_interval']==[lo,hi]
              assert m['plan']['row_interval']==[8*lo,8*hi]
              assert all(r['pass'] for r in m['records'])
          for name in ['RowBank','ActualZetaIV170AMPhysicalTerminal','ActualZetaIV160AMTerminalReceiver','ActualZetaIV215AMOriginalTerminal']:
              assert (p/(name+'.olean')).is_file()
          print('Integrated original terminal artifact preflight PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv234-am-integrated-terminal-replay
          path: iv234/out/
