name: IV222 sector six after sector five acceptance
on:
  push:
    branches: ['staging/iv147-am-kernel-pilot']
    paths: ['.github/workflows/iv161-am-importable.yml']
permissions:
  contents: read
concurrency:
  group: iv147-am-pilot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate source and generate proof modules
        run: |
          set -euo pipefail
          mkdir -p iv222/out
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python research/iv146_am_exp_audit.py custody/iv146-am/am_cells.json iv222/out/exact-audit.json
          python research/iv165_am_sector_sources.py --sector 6
          python - <<'PY'
          import re,json
          from pathlib import Path
          a=Path('WeilDefect/Arithmetic')
          d=json.loads(Path('custody/iv146-am/am_cells.json').read_text())
          s=(a/'ActualZetaIV146AMCellData.lean').read_text()
          pairs=re.findall(r'def neutralIV149Chunk(\d{3}) : Array Nat := #\[([^\]]*)\]',s)
          assert [int(i) for i,_ in pairs]==list(range(128))
          chunks=[list(map(int,re.findall(r'\d+',x))) for _,x in pairs]
          h=s.split('def neutralIV146HChunks : Array (Array Nat) := #[',1)[1].split(']',1)[0]
          assert list(map(int,re.findall(r'neutralIV149Chunk(\d{3})',h)))==list(range(128))
          assert len(chunks)==128 and all(len(c)==128 for c in chunks)
          assert [x for c in chunks for x in c]==d['h']
          b=s.split('def neutralIV146Shifts : List (Int × Nat) := [',1)[1].split(']',1)[0]
          assert [list(map(int,x)) for x in re.findall(r'\((-?\d+),\s*(\d+)\)',b)]==d['shifts']
          for p in [a/'ActualZetaIV162AMOriginalPrimeCore.lean',a/'ActualZetaIV157AMOriginalDictionary.lean',a/'ActualZetaIV160AMTerminalReceiver.lean',*list((a/'IV160Bank').glob('*.lean'))]:
              assert not re.search(r'\b(?:sorry|admit|sorryAx|native_decide|axiom)\b',p.read_text()),p
          print('Source preflight PASS')
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Verify new integer sector six
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaIV159AMRowReceiver
          python research/iv165_am_build_sector.py --sector 6 --out iv222/out/sector6
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('iv222/out/sector6/manifest.json').read_text())
          assert m['plan']['block_interval']==[768,896]
          assert m['plan']['row_interval']==[6144,7168]
          assert len(m['records'])==81
          assert all(r['pass'] for r in m['records'])
          assert sum(len(r['names']) for r in m['records'])==145
          print('Sector 6 complete: 1024 new rows, 145 strict named receipts')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv222-am-sector-six-receipts
          path: iv222/out/
