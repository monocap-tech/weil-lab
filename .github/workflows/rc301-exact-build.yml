name: RC301 exact five-column dual generator
on:
  push:
    branches:
      - research/rpb108-rc301-five-column-dual
    paths:
      - "scripts/validate_rpb108_rc301_five_column_dual_obstruction.py"
      - ".github/workflows/rc301-exact-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited validator requirements
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Generate exact five-column dual witness certificate
        run: |
          python scripts/validate_rpb108_rc301_five_column_dual_obstruction.py --output certificates/rpb108_rc301_five_column_dual_obstruction.json
          python scripts/validate_rpb108_rc301_five_column_dual_obstruction.py --output certificates/rpb108_rc301_five_column_dual_obstruction.json --replay
      - name: Commit exact witness artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc301_five_column_dual_obstruction.json
          if ! git diff --cached --quiet; then
            git commit -m "RC301: materialize exact six-output dual certificates"
            git push origin HEAD:research/rpb108-rc301-five-column-dual
          fi
