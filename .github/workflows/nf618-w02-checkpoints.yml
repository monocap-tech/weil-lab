name: NF618 W02 G3 checkpoint and special receipt recovery
on:
  push:
    branches: [custody/nf618-w02-historical-recovery]
    paths: ['.github/workflows/nf618-w02-checkpoints.yml']
permissions:
  contents: read
concurrency:
  group: nf618-w02-historical-recovery
  cancel-in-progress: false
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 5801507d416e4a699c002920b2441f5aa0c19aef
          path: research
          persist-credentials: false
      - name: Validate special groups and recover checkpoint archives incrementally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -m py_compile checkpoints.py
          python3 checkpoints.py
