name: NF573 original full source graph correction
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaOriginalRealOddSchwartzFullSource.lean"
      - "WeilDefect/Arithmetic/ActualZetaOriginalCanonicalCorrectionFullSource.lean"
      - ".github/workflows/nf573-original-correction-full-source-graph.yml"
  workflow_dispatch:

concurrency:
  group: nf573-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nf573-full-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and restore Mathlib cache
        id: setup
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Real odd compact Schwartz admission to complete original divisor graph
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalRealOddSchwartzFullSource
      - name: Actual canonical finite correction with graph norm continuity and exact physical custody
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalCanonicalCorrectionFullSource
