name: Weil-Lab NF390 original j387 selected moment and odd pole (RH OPEN)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify_nf390_original_j387_selected_moment.py'
      - 'scripts/local_replay/nf390_original_j387_moment_precision_preflight.py'
      - 'notes/provisional/NF390_ORIGINAL_J387_POLE_RESTORED_MOMENT_GATE_20261029.md'
      - '.github/workflows/nf390-original-selected-moment.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-selected-moment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inherited native Arb
        run: pip install --only-binary=:all: python-flint==0.8.0 numpy scipy
      - name: Retrieve exactly SHA-pinned original selected signed archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12776684037/zip" \
            -o artifacts/original_selected_signed_20261028.zip
          echo 'f7b64ceead7500fca389e3b994a208a6e8aae5be1fa1d0  artifacts/original_selected_signed_20261028.zip' | sha256sum -c -
      - name: Exact original source-only candidate moment sensitivity preflight (not signed measurement)
        run: |
          python3 scripts/local_replay/nf390_original_j387_moment_precision_preflight.py \
            --j387 notes/data/provisional/NF387_original_J242_dyadic_candidate.json \
            --nf375 notes/data/provisional/NF375_reduced_cutoff_exact.json \
            --output artifacts/NF390_original_j387_source_only_precision.json
          python3 - <<'PY'
          import json
          from fractions import Fraction as F
          j=json.load(open('artifacts/NF390_original_j387_source_only_precision.json'))
          assert F(j['moment_stop_threshold_strict_upper_exact'])<F(19,10**21)
          assert j['actual_original_signed_selected_moment_measured'] is False
          assert j['W_ODD_NEG']==j['RH']=='OPEN'
          print('NF390 exact source-only sensitivity <1.9e-20 PASS; native moment still required')
          PY
      - name: Original J242 physical replay and pole-restored signed selected moment
        run: |
          python3 -m py_compile scripts/verify_nf390_original_j387_selected_moment.py
          python3 -u scripts/verify_nf390_original_j387_selected_moment.py \
            --rank notes/data/provisional/parents/pr350_original_BS_pruned_rank_bound.json \
            --source notes/data/provisional/nf372_pr355_fields.json \
            --nf369 notes/data/provisional/nf372_nf369_fields.json \
            --nf375 notes/data/provisional/NF375_reduced_cutoff_exact.json \
            --j387 notes/data/provisional/NF387_original_J242_dyadic_candidate.json \
            --archive artifacts/original_selected_signed_20261028.zip \
            --output artifacts/NF390_original_j387_signed_selected_moment.json
          python3 - <<'PY'
          import json
          a=json.load(open('artifacts/NF390_original_j387_signed_selected_moment.json'))
          assert a['original_physical_16_Gram_overlaps'] is True
          assert a['pole_restored_for_selected_test'] is True
          assert a['fresh_original_signed_kernel_cells']==0
          assert a['actual_original_signed_lowband_integral_computed'] is False
          assert a['actual_full_original_lowband_upper_computed'] is False
          assert a['W_ODD_NEG']==a['RH']=='OPEN'
          print('NF390 original selected-moment and pole correction replay PASS')
          print('NF390 specific fixed j387 strictly obstructed?', a['actual_original_j387_specific_NF375_lowband_candidate_stopped'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf390-original-j387-selected-moment
          path: |
            artifacts/NF390_original_j387_source_only_precision.json
            artifacts/NF390_original_j387_signed_selected_moment.json
          if-no-files-found: ignore
