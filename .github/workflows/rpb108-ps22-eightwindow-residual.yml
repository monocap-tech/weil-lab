name: RPB108 PS22 original eight-window complete residual signed Schur

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps22_eightwindow_residual.py"
      - "notes/RPB108_PS22_EIGHTWINDOW_RESIDUAL_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps22-eightwindow-residual.yml"
  workflow_dispatch:

jobs:
  ps22-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original signed eight-window full residual two-stage Schur source replay
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps22_eightwindow_residual.py
          python3 scripts/validate_rpb108_ps22_eightwindow_residual.py
      - name: Keep low residual Schur PSD and RH open
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(value is False for value in p["closures"].values())
          PY
