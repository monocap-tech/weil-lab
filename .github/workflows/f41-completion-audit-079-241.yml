          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROW_PIN: ${{ toJSON(matrix.rows[2]) }}
        run: python3 verification/f41/completion_079_241/pipeline.py audit-one
      - name: Publish row ${{ matrix.rows[2].rr }} independent receipt
