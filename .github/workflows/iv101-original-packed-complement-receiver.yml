permissions:
  contents: read

concurrency:
  group: iv101-original-packed-complement-receiver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-packed-complement-receiver-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Strict IV101 original-source preflight
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("WeilDefect/Arithmetic/ActualZetaIV101OriginalPackedComplementReceiver.lean").read_text()
          names=[
              "neutralIV101Q_add",
              "neutralIV101Packed_collars",
              "neutralIV101Packed_full_margin",
              "neutralIV101Packed_mixed_loss",
              "neutralIV101Packed_complement_nonneg",
          ]
          assert len(names)==len(set(names))==5
          assert set(re.findall(r"(?m)^#print axioms (\w+)$",s))==set(names)
          assert set(re.findall(r"(?m)^theorem (\w+)",s))==set(names)
          assert all(s.splitlines().count("#print axioms "+n)==1 for n in names)
          assert not re.search(r"\b(?:sorry|admit|sorryAx)\b",s)
          print("IV101 strict preflight: five exact original-source bridge declarations")
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          lake exe cache get
      - name: Native fresh Lean source build
        run: |
          set -euo pipefail
          mkdir -p iv101/out
          touch iv101/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV101OriginalPackedComplementReceiver.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV101OriginalPackedComplementReceiver 2>&1 | tee iv101/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV101OriginalPackedComplementReceiver.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV101OriginalPackedComplementReceiver.olean -nt iv101/out/fresh.stamp
      - name: Exact strict named axiom audit
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaIV101OriginalPackedComplementReceiver.lean 2>&1 | tee iv101/out/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          t=Path("iv101/out/axioms.log").read_text()
          names=[
              "neutralIV101Q_add",
              "neutralIV101Packed_collars",
              "neutralIV101Packed_full_margin",
              "neutralIV101Packed_mixed_loss",
              "neutralIV101Packed_complement_nonneg",
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          found={}
          for name in names:
              full="WeilDefect."+name
              pat=re.compile(r"^'"+re.escape(full)+r"' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)\s*$",re.M)
              hits=list(pat.finditer(t))
              assert len(hits)==1, (full,len(hits),t[-1200:])
              axioms=({a.strip() for a in hits[0].group(1).split(",") if a.strip()}
                      if hits[0].group(1) is not None else set())
              assert axioms<=allowed,(full,axioms-allowed)
              found[full]=sorted(axioms)
          assert not re.search(r'(?m)^\s*(?:error:|.*: error:)',t)
          Path("iv101/out/receipts.json").write_text(json.dumps(found,sort_keys=True,indent=2)+"\n")
          print("IV101 five strict source/axiom receipts PASS")
          PY
          git rev-parse HEAD > iv101/out/commit.txt
          sha256sum WeilDefect/Arithmetic/ActualZetaIV101OriginalPackedComplementReceiver.lean \
            WeilDefect/Arithmetic/ActualZetaIV100OriginalAffineCollarPacking.lean \
            WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalSchwartzPolarization.lean \
            WeilDefect/Arithmetic/ActualZetaIV099OriginalFiniteCollarSectorGate.lean \
            WeilDefect/Arithmetic/ActualZetaIV098OriginalReflectedCollarSectorGate.lean \
            WeilDefect/Arithmetic/ActualZetaIV097OriginalSmoothPlateauGate.lean \
            WeilDefect/Arithmetic/ActualZetaIV096OriginalEffectiveCollarCutoffGate.lean \
            WeilDefect/Arithmetic/ActualZetaIV095OriginalUniformCollarSectorGate.lean \
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV101OriginalPackedComplementReceiver.olean > iv101/out/sha256.txt
          sha256sum -c iv101/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv101-original-packed-complement-receiver-native-lean-receipts
          path: |
            iv101/out/
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV101OriginalPackedComplementReceiver.olean
          if-no-files-found: ignore
          include-hidden-files: true
