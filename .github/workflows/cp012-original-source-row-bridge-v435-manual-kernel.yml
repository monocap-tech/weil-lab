name: CP012 MANUAL upstream v4.35 CONDITIONAL indexed source-slot Lean bridge
# Deliberately manual only; original Weil-Lab Phase IV and NF CI stay untouched.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp012-source-index-bridge-v435-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-cp011-and-conditional-cp012-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact external Zeta Lean v4.35 toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Confirm real original upstream Zeta 1e6 SHA and preserved independent toolchains
        working-directory: cp011_zeta_v435
        timeout-minutes: 70
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/Zeta rev-parse HEAD)" = c06b4e13d9c847e50a32c3d738271cbad62ae9f3
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
      - name: ACTUAL full original Lean kernel build for CP011 source + CP012 conditional source slot
        working-directory: cp011_zeta_v435
        timeout-minutes: 145
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build CP011CanonicalRoster CP012RowReceipt 2>&1 | tee cp012-original-conditional-slot-build.log
      - name: Require CP011 genuine source canonical roster four declared theorem standard axioms
        timeout-minutes: 18
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          (cd cp011_zeta_v435 && lake env lean CP011CanonicalRoster.lean 2>&1 | tee cp011-actual-axioms.log)
          python scripts/cp011_original_roster_lean_axiom_audit.py
      - name: Require CP012 genuine conditional source binding theorem standard axioms
        timeout-minutes: 18
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          (cd cp011_zeta_v435 && lake env lean CP012RowReceipt.lean 2>&1 | tee cp012-row-receipt-axioms.log)
          python scripts/cp012_row_bridge_lean_axiom_audit.py
          test -s cp011_zeta_v435/cp012-conditional-row-bridge-kernel-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp012-real-Lean-4.35-CONDITIONAL-source-indexed-receipt-not-row-proof
          path: |
            cp011_zeta_v435/cp012-original-conditional-slot-build.log
            cp011_zeta_v435/cp011-actual-axioms.log
            cp011_zeta_v435/cp012-row-receipt-axioms.log
            cp011_zeta_v435/cp011-canonical-source-roster-kernel.json
            cp011_zeta_v435/cp012-conditional-row-bridge-kernel-receipt.json
            cp011_zeta_v435/.lake/build/lib/lean/CP011CanonicalRoster.olean
            cp011_zeta_v435/.lake/build/lib/lean/CP012RowReceipt.olean
          if-no-files-found: ignore
          include-hidden-files: true
