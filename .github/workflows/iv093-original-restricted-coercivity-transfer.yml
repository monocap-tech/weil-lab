      - "WeilDefect/Arithmetic/ActualZetaIV080GammaLinearEnvelopeGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV078FiniteGammaTruncationGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV079GammaDominatedLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV081GammaWeightedCompactC2Gate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV082CompactC2FourierL1Gate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV084OriginalPolePhysicalGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV085OriginalPrimeFiniteGate.lean"
      - ".github/workflows/iv093-original-restricted-coercivity-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iv093-original-restricted-coercivity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-restricted-coercivity-transfer-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Strict IV093 original-source preflight
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("WeilDefect/Arithmetic/ActualZetaIV093OriginalRestrictedCoercivityTransferGate.lean").read_text()
          names=[
              "neutralIV093GreenDiagonal_real_lower",
              "neutralIV093GreenDiagonal_real_upper",
              "neutralIV093GreenDiagonal_restricted_coercivity",
              "neutralIV093GreenSector_restricted_coercivity",
              "neutralIV093GreenDiagonal_restricted_positive",
              "neutralIV093GreenDiagonal_negative_of_finite",
          ]
          assert all(s.count("#print axioms "+n)==1 for n in names)
          assert not re.search(r"\b(?:sorry|admit|sorryAx)\b",s)
          print("IV093 strict preflight: six exact original-source bridge declarations")
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          lake exe cache get
      - name: Native fresh Lean source build
        run: |
          set -euo pipefail
          mkdir -p iv093/out
          touch iv093/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV093OriginalRestrictedCoercivityTransferGate.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV093OriginalRestrictedCoercivityTransferGate 2>&1 | tee iv093/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV093OriginalRestrictedCoercivityTransferGate.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV093OriginalRestrictedCoercivityTransferGate.olean -nt iv093/out/fresh.stamp
      - name: Exact strict named axiom audit
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaIV093OriginalRestrictedCoercivityTransferGate.lean 2>&1 | tee iv093/out/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          t=Path("iv093/out/axioms.log").read_text()
          names=[
              "neutralIV093GreenDiagonal_real_lower",
              "neutralIV093GreenDiagonal_real_upper",
              "neutralIV093GreenDiagonal_restricted_coercivity",
              "neutralIV093GreenSector_restricted_coercivity",
              "neutralIV093GreenDiagonal_restricted_positive",
              "neutralIV093GreenDiagonal_negative_of_finite",
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          found={}
          for name in names:
              full="WeilDefect."+name
              pat=re.compile(r"^'"+re.escape(full)+r"' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)\s*$",re.M)
              hits=list(pat.finditer(t))
              assert len(hits)==1, (full,len(hits),t[-1200:])
              axioms=({a.strip() for a in hits[0].group(1).split(",") if a.strip()}
                      if hits[0].group(1) is not None else set())
              assert axioms<=allowed,(full,axioms-allowed)
              found[full]=sorted(axioms)
          assert not re.search(r'(?m)^\s*(?:error:|.*: error:)',t)
          Path("iv093/out/receipts.json").write_text(json.dumps(found,sort_keys=True,indent=2)+"\n")
          print("IV093 six strict source/axiom receipts PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv093-original-restricted-coercivity-transfer-native-lean-receipts
          path: |
            iv093/out/
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV093OriginalRestrictedCoercivityTransferGate.olean
          if-no-files-found: ignore
          include-hidden-files: true
