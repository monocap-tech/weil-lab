name: F08-011 true physical normalized smooth mollifier and Fourier contraction Lean gate
on:
  pull_request:
    paths:
      - 'verification/f08/f08_011/**'
      - '.github/workflows/f08-011-original-normalized-mollifier-kernel.yml'
permissions:
  contents: read
jobs:
  source-logarithmic-weight:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout source-pinned actual IV023 research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Verify actual source and stage purely additive Lean module
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCorrelationFourierAgreement.lean)" = 60453bd214c43feedb0fa64d74a15bd452e48998
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCorrelationTransform.lean)" = d5aa1095b2fe64933ad8db64732d232631d3d3b7
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          ! grep -Eq 'sorry|admit|unsafe' candidate/verification/f08/f08_011/F08OriginalNormalizedMollifier.lean
          mkdir -p research/WeilDefect/Generated/F08
          cp candidate/verification/f08/f08_011/F08OriginalNormalizedMollifier.lean research/WeilDefect/Generated/F08/OriginalNormalizedMollifier.lean
      - name: Initialize pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Genuine pinned kernel build plus strict ten-name axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.OriginalNormalizedMollifier 2>&1 | tee f08-011-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.OriginalNormalizedMollifier' '#print axioms WeilDefect.f08_011_complexMollifier_nonneg' '#print axioms WeilDefect.f08_011_complexMollifier_integrable' '#print axioms WeilDefect.f08_011_complexMollifier_integral' '#print axioms WeilDefect.f08_011_complexMollifier_norm' '#print axioms WeilDefect.f08_011_complexMollifier_integral_norm' '#print axioms WeilDefect.f08_011_complexMollifier_support' '#print axioms WeilDefect.f08_011_complexMollifier_hasCompactSupport' '#print axioms WeilDefect.f08_011_complexMollifier_smooth' '#print axioms WeilDefect.f08_011_complexMollifier_support_epsilon' '#print axioms WeilDefect.f08_011_complexMollifier_fourier_norm_le_one' > /tmp/f08-011-axioms.lean
          lake env lean /tmp/f08-011-axioms.lean 2>&1 | tee f08-011-axioms.log
          python3 - <<'PY'
          import pathlib,re
          names={'f08_011_complexMollifier_nonneg','f08_011_complexMollifier_integrable','f08_011_complexMollifier_integral','f08_011_complexMollifier_norm','f08_011_complexMollifier_integral_norm','f08_011_complexMollifier_support','f08_011_complexMollifier_hasCompactSupport','f08_011_complexMollifier_smooth','f08_011_complexMollifier_support_epsilon','f08_011_complexMollifier_fourier_norm_le_one'}
          found={}
          log=pathlib.Path('f08-011-axioms.log').read_text()
          # Lean's axiom pretty printer may wrap a single declaration across lines.
          # Match complete bracketed reports, preserving strict unexplained-output refusal.
          pat=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          for m in re.finditer(pat,log,re.S):
              assert m[1] not in found,('duplicate axiom name',m[1])
              found[m[1]]={x.strip() for x in m[2].split(',') if x.strip()}
          assert not re.sub(pat,'',log,flags=re.S).strip(),('unexpected compiler output',log)
          assert set(found)==names,(found,names)
          assert all(a <= {'propext','Classical.choice','Quot.sound'} for a in found.values()),found
          print('F08-011 original source-physical normalized mollifier: 10/10 standard-only axioms')
          PY
      - name: Archive source and genuine compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-011-original-normalized-mollifier-compiler-evidence
          path: |
            research/f08-011-build.log
            research/f08-011-axioms.log
            research/WeilDefect/Generated/F08/OriginalNormalizedMollifier.lean
          if-no-files-found: ignore
