name: NF720 finish genuine global second HD/A matrix row, packed blocks 024–030
on:
  pull_request:
    paths:
      - "scripts/nf720_complete_original_row_one_shards.py"
      - ".github/workflows/nf720-complete-original-row-one-shards.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf720-parallel-original-matrix-row-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-shards:
    name: Original global row-one remaining blocks ${{ matrix.first }}–${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {first: 24, end: 28}
          - {first: 28, end: 31}
    env:
      FIRST: ${{ matrix.first }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strictly check source-plan syntax and exact packed-coordinate coverage
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/nf715_second_global_matrix_row_driver.py \
            scripts/nf716_second_global_matrix_row_continuation.py \
            scripts/nf720_complete_original_row_one_shards.py
          python scripts/nf720_complete_original_row_one_shards.py preflight --first-block "$FIRST" --end-block "$END"
      - name: Restore immutable NF702 original scaled input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nf720-receipts/{input,cache-proposals,cache-audit,packed-proposals,packed-audit}
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14582437652/zip" -o nf720-input.zip
          echo "258637da71e96468ed7c6ac5b0a4480ce06cdee9989aef8e71a4cd09059789e0  nf720-input.zip" | sha256sum -c -
          unzip -q nf720-input.zip -d nf720-receipts/input
      - name: Restore accepted NF703 full original center cache source proposals
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-proposals
          path: nf720-receipts/cache-proposals
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore NF703 source-bound complete center-cache axiom audit
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-audit
          path: nf720-receipts/cache-audit
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore all accepted NF700 original packed second-row source products
        uses: actions/download-artifact@v4
        with:
          name: nf700-packed-matrix-proposals
          path: nf720-receipts/packed-proposals
          run-id: 44623902055
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore strict NF700 original packed-source 527-declaration kernel audit
        uses: actions/download-artifact@v4
        with:
          name: nf700-complete-packed-matrix-audit
          path: nf720-receipts/packed-audit
          run-id: 44623902055
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate NF715 accepted first second-row 12-theorem kernel source and audit
        uses: actions/download-artifact@v4
        with:
          name: nf715-first-second-global-matrix-row-certificates
          path: nf720-prior
          run-id: 44660635800
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct immutable NF715 source and emit independently bounded actual global product certificates
        run: |
          set -euo pipefail
          python scripts/nf720_complete_original_row_one_shards.py prepare \
            --first-block "$FIRST" --end-block "$END" 2>&1 | tee nf720-preflight.log
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF720')
          m=json.loads((d/'manifest.json').read_text())
          first,end=int(os.environ['FIRST']),int(os.environ['END'])
          assert m['schema']=='NF720-parallel-original-global-row-one-shard-v1'
          assert (m['first_block'],m['end_block'])==(first,end)
          assert (m['original_index'],m['first'],m['end'])==(1,8*first,min(8*end,242))
          assert m['new_HD_gates']==m['new_A_gates']==min(8*end,242)-8*first
          assert m['coordinates']==list(range(8*first,min(8*end,242)))
          assert len(m['files'])==end-first and len(m['audit_theorems'])==8*(end-first)
          for f in m['files']:
              assert hashlib.sha256((d/f['file']).read_bytes()).hexdigest()==f['sha256']
          print('NF720 exact original terminal-block source-bound preflight PASS')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Reuse accepted NF707 compiled original scaled-input objects
        uses: actions/download-artifact@v4
        with:
          name: nf707-compiled-original-input
          path: nf708-compiled-input
          run-id: 44633937710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate producer source and matching Lean environment before compiled object reuse
        run: |
          set -euo pipefail
          python scripts/nf708_global_matrix_attachment_driver.py restore-input
      - name: Compile genuine original center cache and three or four packed product blocks
        timeout-minutes: 245
        run: |
          set -euo pipefail
          /usr/bin/time -o nf720-source-time.log -f 'elapsed=%e user=%U rss_kb=%M exit=%x' \
            lake build WeilDefect.Generated.NF703Cache.Data \
              WeilDefect.Generated.NF715.Common 2>&1 | tee nf720-source-build.log
          for ((i=FIRST;i<END;i++)); do
            printf -v b 'Block%03d' "$i"
            lake build "WeilDefect.Generated.NF700.$b" 2>&1 | tee -a nf720-source-build.log
          done
      - name: Kernel-check bounded final original global HD row-one / A column-one blocks
        timeout-minutes: 95
        run: |
          set -euo pipefail
          for ((i=FIRST;i<END;i++)); do
            printf -v b 'Block%03d' "$i"
            /usr/bin/time -a -o nf720-kernel-time.log -f 'block='$b' elapsed=%e rss_kb=%M exit=%x' \
              lake build "WeilDefect.Generated.NF720.$b" 2>&1 | tee -a nf720-kernel-build.log
          done
      - name: Independently audit exact 32- or 24-name Lean theorems and their source provenance
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python scripts/nf720_complete_original_row_one_shards.py axiom-file \
            --first-block "$FIRST" --end-block "$END"
          lake env lean nf720Audit.lean 2>&1 | tee nf720-axioms.log
          python scripts/nf720_complete_original_row_one_shards.py verify \
            --first-block "$FIRST" --end-block "$END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf720-source-bound-${{ matrix.first }}-${{ matrix.end }}
          path: |
            nf720-*.log
            nf720-*-time.log
            nf720-shard-audit.json
            WeilDefect/Generated/NF720/
          if-no-files-found: ignore
  aggregate:
    needs: source-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore only completed kernel-and-axiom-audited original global shards
        uses: actions/download-artifact@v4
        with:
          pattern: nf720-source-bound-*
          path: nf720-audits
          merge-multiple: false
      - name: Strict source SHA, disjoint-coverage, exact 56-name and standard-axiom aggregate
        run: |
          set -euo pipefail
          python -m py_compile scripts/nf720_parallel_original_row_one_shards.py
          python scripts/nf720_complete_original_row_one_shards.py aggregate \
            --audits nf720-audits
      - uses: actions/upload-artifact@v4
        with:
          name: nf720-complete-original-global-matrix-row-one-last-50-coordinate-audit
          path: nf720-complete-audit.json
          if-no-files-found: error
