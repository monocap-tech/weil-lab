name: NF703 unified concrete receiver
on:
  push:
    branches:
      - research/nf703-unified-concrete-receiver
    paths:
      - ".github/workflows/nf703-unified-concrete-receiver.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  batch:
    name: NF703 all-phase receiver
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          # Pin installer asset independently of the repository's Lean toolchain.
          archive="$RUNNER_TEMP/nf703-elan.tar.gz"
          digest=0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
          fetch_verified() {
            rm -f "$archive"
            curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 180 "$@" -o "$archive" &&
              printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          }
          if ! fetch_verified https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz; then
            fetch_verified -H 'Accept: application/octet-stream' "https://api.github.com/repos/leanprover/elan/releases/assets/763468108?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          mkdir -p "$RUNNER_TEMP/nf703-elan"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nf703-elan"
          "$RUNNER_TEMP/nf703-elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan --version
          cat lean-toolchain
          retry() {
            local n
            for n in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$n" -lt 3 ]; then sleep "$((15*n))"; fi
            done
            return 1
          }
          retry elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          retry lake update
          retry lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
          run-id: 44598398608
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=json.loads(Path('compiled-bank/nf697-bank-binding.json').read_text())
          b=json.loads(Path('nf697-bank-binding.json').read_text())
          for x in (a,b):
              f=x.pop('fingerprint')
              assert hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()==f
          assert a['schema']==b['schema'] and a['environment']==b['environment']
          assert all(b['files'].get(k)==v for k,v in a['files'].items())
          extra=set(b['files'])-set(a['files'])
          assert extra=={'WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.lean'},extra
          # Existing source closure must not reference the newly added module.
          assert all('ActualZetaOriginalPhysicalTriangularCacheAssembly' not in Path(p).read_text()
                     for p in a['files'] if p.endswith('.lean'))
          print('NF705 all producer sources unchanged; exactly one new independent theorem module')
          PY
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
          test ! -e .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.olean
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - name: Authenticate NF703 accepted analytical source and prior slot inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nf703-input
          fetch() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$2/zip" -o "nf703-input/$1.zip"
            echo "$3  nf703-input/$1.zip" | sha256sum -c -
          }
          fetch source 14580099864 fba35eada4a0614260109add6e3762b90447bf047541817c7529348121f33ab3
          fetch audit 14600336183 630efe588bd8cc8481013243c04e9d7e164e6553e364a530f44b1d158f6f8828
          fetch unified 15084125240 5ecdd6e9cccf16359cdc1bdcffbe415256b3b03b5a3066009fa0a44fcffc2513
          fetch pair0-source 15090788784 dc4aebf50150d205c2f8b8a9f8562079e75ef4299705c94f02b9410fafc63a41
          fetch pair0-evidence 15091478511 b952b231f72b08625d834ae4c7334778894c6e4bc8e00065b44bbde4c689ca71
          fetch pair1-source 15091889592 c9354dc7430b923322f9f8a22f1e2fa50ae96525e9baf94501a9d8c1fe69fb2f
          fetch pair1-evidence 15092708383 85aa7fd6c432d93ffddfb4e83fad34f0c814039d7f9af69edffbc3a1ec15d9b0
          fetch pair2-source 15092504278 ac405022ad91c18e6938cc36215e81ff0fdd83c77d5799762c1138f570d9bfdc
          fetch pair2-evidence 15094150805 5f2f7042f07f07f9087d2e52bb8f7be052084a184fbe0596f592bcd258d64e24
          fetch pair3-source 15094106799 11945e450d5836a6f441ad6a12060c79829d316edb17bb04b3a05242fb6f8d02
          fetch pair3-evidence 15094366993 4314b3262ac8c7e58faadf4ac53f226308dfad44c6939e3fcf9f2f411e531f3e
          fetch pair4-source 15094248854 a9a3c6f31d951b8a1dbf73e17e973e3fb6d68f1447299618b3dbd0d905cfe373
          fetch pair4-evidence 15095366780 883d08cd7dbfc1abf0c50caf925647ec0d09ee975e6637e41570a39568c8b4f3
          fetch pair5-source 15095601169 8b923d3636c19c8457b80d0c23723d73ac86d5b62c95ba241a0f6b534e16863d
          fetch pair5-evidence 15096192588 794bc4a9b2933cd1ab1242980d054bb25f5e051b229ef011707444bfd02046ec
          fetch pair6-source 15096417638 9d3f6e48efd7b50031645af45bf8f9775afa1e98f4ae65ae1640f8d541eeca06
          fetch pair6-evidence 15097675331 d562e209107de58212a1533a9980213e5bcb7f489a3249f4da4c6ce407f8dbb3
          fetch pair7-source 15097750129 8e9ffc88656a9451fa46e42b0abe09c486bc2376b5a6c3a384201871fa53ff50
          fetch pair7-evidence 15097573704 497d7bfabdfba4e041a4a91640cf6c978d2d88417e596994e6a32d12564230e5
          fetch pair8-source 15098720264 dc976ff5ec586d3e47b9aaecc6f1418fd02ef572b0e3ae79c605b670081e4ec0
          fetch pair8-evidence 15098339003 b26b550d0d187c85fa8d6a212009f721854b8a5e666b7de022c6df2a076b0c35
          fetch pair9-source 15098847727 55abdc596b336f7b10b5897eb9387066e22050e1c7d2da1784f4b2e8da6b2cfb
          fetch pair9-evidence 15100390082 30bb78410f45189cef0bbe7049647bd035026d8c926fa0e16b5fce94f1df1f58
          fetch pair10-source 15099543256 280d0b8e768f918e9c714b0cd48c77619c87a2c6a2bd1a5d56007553d830fd6a
          fetch pair10-evidence 15100228867 546b368735e0f055c2009130bcaa215be02d642c1f4747a62da155c6b3d67318
          fetch pair11-source 15101295696 cd2775d4127c555adca4e1dc91450f3caab21f900b2b343ed7b7ec253718be1b
          fetch pair11-evidence 15102415394 58a18abc05ba4b696697cae3d7a693de1957909df0603a5d7f74ea4078e0b1a1
          fetch pair12-source 15101473299 aedd5e69d525e700da79e698f3a44e1066a0c74237231bc51e4a0438a61c79a9
          fetch pair12-evidence 15102776198 e2529de29c027fc5ca5f7c1a08db91d9f228f97e2faab36b2c646e5d68461588
          fetch pair13-source 15102009735 12c45284ed5c87d3a2e28bc4b0593c05105234fadddb8355166affa2303f31d7
          fetch pair13-evidence 15103426983 8fed0fd1b240e5a15c76b5284dac62379a3e08a720c0926b0e73ff72a86fcf17
          fetch pair14-source 15104086548 9b845d1865f62e636a3f3a0f0907e5568ee68f1daa5f5ce180e64629e5f05293
          fetch pair14-evidence 15104930686 d6c50da5d34faabfd0cdfd3f3594742c3572dd7bb776a23499d7cf9a900f4788
          fetch pair15-source 15104722402 4c6e253cd74dbc2b060b1a2ec726b50f1cbe035e884332490015ba9b2fc5ea6d
          fetch pair15-evidence 15105092878 81e222e6caadf428a803d719a9a89e8f5c0c51a2aa5d9ccf0501ccc06ef63769
          fetch pair16-source 15106850377 12cf80987f967bff8b6f5c7527993bbcef0f3b7edccd111415ce4d685e4446a3
          fetch pair16-evidence 15105974525 bc8a9bbc5b8b4a30e7ecbeb44305f12e2a749b92df0a080516cd8df9a1d15585
          fetch pair17-source 15107485670 024a7e3f832c5da6df0b1a67c0d13388a66d3464bf4bb50e5f59765be2a88573
          fetch pair17-evidence 15107353113 a2390423611a38a215e4eb8171a0e25eda276e5ea060b8d8ecc1180e61c5ea32
      - name: Authenticate all certified phase sources and reconcile exact original slots
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          from fractions import Fraction as F
          root=Path('WeilDefect/Generated')
          out=root/'NF703Attachment'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          load=lambda p:json.loads(p.read_text())
          def put(p,b):
              p.parent.mkdir(parents=True,exist_ok=True)
              if p.exists(): assert p.read_bytes()==b,p
              else: p.write_bytes(b)
          bank=load(root/'NF690/manifest.json')
          bank_hash=sha((root/'NF690/manifest.json').read_bytes())
          original={r['index']:r for r in bank['slots']}
          assert len(original)==7835
          allowed={'propext','Classical.choice','Quot.sound'}
          with zipfile.ZipFile('nf703-input/unified.zip') as z:
              u=json.loads(z.read('unified-receiver-manifest.json'))
          prior=set(u['slots'])|set(u['prior_slots']); assert len(prior)==1876
          with zipfile.ZipFile('nf703-input/source.zip') as z,zipfile.ZipFile('nf703-input/audit.zip') as q:
              raw=z.read('NF703/manifest.json'); m=json.loads(raw)
              a=json.loads(q.read('nf703-complete-audit.json'))
              assert a['manifest_sha256']==sha(raw)
              assert m['input_sha256']==bank['input_sha256']
              receipts={r['group']:r for r in a['tables']}
              groups={r['group']:r for r in m['groups']}
              assert len(groups)==len(receipts)==1442 and groups.keys()==receipts.keys()
              assert m['rows']==a['new_rows']==5443
              for stage in ('NF632','NF703'):
                  p=stage+'/manifest.json'; put(root/p,z.read(p))
                  for f in json.loads(z.read(p))['files']:
                      n=stage+'/'+f['file']; b=z.read(n)
                      assert sha(b)==f['sha256']; put(root/n,b)
          seen=set(); used=set(); names=set(); hashes={}; allrecords=[]; summaries=[]; chunks={}
          for pair in range(18):
              pfx='nf703-pair00' if pair==0 else 'nf703-pair'
              with zipfile.ZipFile(f'nf703-input/pair{pair}-source.zip') as z,zipfile.ZipFile(f'nf703-input/pair{pair}-evidence.zip') as q:
                  raw=z.read(pfx+'-manifest.json'); m=json.loads(raw)
                  assert raw==q.read(pfx+'-manifest.json')
                  a=json.loads(q.read(pfx+'-audit.json'))
                  assert a['manifest_sha256']==sha(raw)
                  assert m['pair']==pair and m['bank_manifest_sha256']==bank_hash
                  records=m['records']; ids={r['index'] for r in records}
                  assert records==a['records'] and len(ids)==m['tables']==len(records)
                  assert sum(r['rows'] for r in records)==m['rows']
                  assert ids.isdisjoint(seen|prior); seen.update(ids)
                  expected=set(); batcheslots=[]
                  for batch in m['batches']:
                      slots=batch['slots']; assert 1<=len(slots)<=8
                      batcheslots.extend(slots)
                      assert batch['rows']==sum(original[i]['rows'] for i in slots)
                      n={f'nf703AttachmentSlot{i:05d}{suffix}' for i in slots for suffix in ('Key','Length','RowsEq','Sound','PayloadEq','Concrete')}
                      n.add('nf703Attachment'+batch['target']+'Sound')
                      assert set(batch['theorems'])==n and len(batch['theorems'])==len(n)
                      expected.update(n)
                  assert len(batcheslots)==len(ids) and set(batcheslots)==ids
                  assert m['receiver']==f'nf703AttachmentPair{pair:02d}Sound'
                  expected.add(m['receiver'])
                  assert set(a['theorems'])==expected and all(set(v)<=allowed for v in a['theorems'].values())
                  assert len(expected)==6*len(ids)+len(m['batches'])+1 and names.isdisjoint(expected)
                  names.update(expected)
                  for r in records:
                      i=r['index']; t=original[i]; k=r['receipt']; e=groups[k]; v=receipts[k]
                      assert k not in used; used.add(k)
                      assert tuple(map(F,r['key']))==tuple(map(F,t['key']))==tuple(map(F,e['key']))
                      assert (r['chunk'],r['offset'],r['rows'])==(t['chunk'],t['offset'],t['rows'])
                      assert e['rows']==r['rows'] and r['family']==e['family'] and e['family']//2==pair
                      assert all(v[x]==y for x,y in e.items()) and v['theorem']=='nf703'+k+'Moment' and set(v['axioms'])<=allowed
                      source=(root/'NF703'/(k+'.lean')).read_bytes(); assert sha(source)==v['sha256']
                      c=t['chunk']
                      if c not in chunks: chunks[c]=re.findall(r'#\[\n    (.*?)\n  \]',(root/'NF690'/(c+'.lean')).read_text(),re.S)
                      h=re.search(r'def nf703'+k+r'Table : NF624KeyTable := ⟨⟨\(([^:]+):ℚ\),\(([^:]+):ℚ\)⟩, #\[\n    (.*?)\n  \]⟩',source.decode(),re.S)
                      assert h and tuple(map(F,h.group(1,2)))==tuple(map(F,e['key'])) and h[3]==chunks[c][t['offset']]
                  for n,h in m['source_sha256'].items():
                      assert Path(n).name==n and n.endswith('.lean') and n not in hashes
                      b=z.read('WeilDefect/Generated/NF703Attachment/'+n); assert sha(b)==h
                      put(out/n,b); hashes[n]=h
                  allrecords.extend(records)
                  summaries.append({'pair':pair,'tables':len(ids),'rows':m['rows'],'batches':len(m['batches']),'source_manifest_sha256':sha(raw),'receiver':m['receiver']})
          assert len(seen)==len(used)==1442 and used==groups.keys()
          assert len(prior|seen)==3318
          assert sum(r['rows'] for r in allrecords)==5443 and sum(r['batches'] for r in summaries)==186
          assert len(names)==8856 and len(hashes)==1832
          leaves=[(f'nf703AttachmentPair{i:02d}Slots',f'nf703AttachmentPair{i:02d}Sound') for i in range(18)]
          def chain(xs):
              return xs[0][0] if len(xs)==1 else '('+xs[0][0]+' ++ '+chain(xs[1:])+')'
          def elim(xs,h,indent):
              if len(xs)==1: return indent+f'exact {xs[0][1]} i {h}\n'
              return indent+f'rcases List.mem_append.mp {h} with hleft | hright\n'+indent+f'· exact {xs[0][1]} i hleft\n'+indent+'· '+elim(xs[1:],'hright',indent+'  ').lstrip()
          base='WeilDefect.Generated.NF703Attachment.'
          prop='neutralNF690TableSound (neutralNF624BankRead nf690OriginalBank i)'
          body='def nf703AttachmentSlots : List ℕ := '+chain(leaves)+'\n\ntheorem nf703AttachmentSound (i : ℕ) (hi : i ∈ nf703AttachmentSlots) :\n    '+prop+' := by\n  change i ∈ '+chain(leaves)+' at hi\n'+elim(leaves,'hi','  ')
          source=(''.join('import '+base+f'Pair{i:02d}\n' for i in range(18))+'\nnamespace WeilDefect\n\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n\n'+body+'\nend WeilDefect\n').encode()
          put(out/'Receiver.lean',source); hashes['Receiver.lean']=sha(source)
          recv=[r['receiver'] for r in summaries]+['nf703AttachmentSound']
          audit=('import '+base+'Receiver\n'+''.join('#print axioms WeilDefect.'+n+'\n' for n in recv)).encode()
          put(out/'AuditUnified.lean',audit); hashes['AuditUnified.lean']=sha(audit)
          manifest={'schema':'NF703-unified-concrete-receiver-v1','bank_manifest_sha256':bank_hash,'slots':sorted(seen),'prior_slots':sorted(prior),'tables':1442,'rows':5443,'phase_pairs':summaries,'source_sha256':hashes,'previous_theorems':sorted(names),'receiver':'nf703AttachmentSound','audit_names':recv}
          Path('nf703-unified-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('NF703 unified source reconciliation PASS',len(seen),5443,len(names),len(hashes))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf703-unified-receiver-source
          path: |
            nf703-unified-manifest.json
            WeilDefect/Generated/NF703Attachment/
          if-no-files-found: error
      - name: Restore phase modules through bounded Lake builds
        timeout-minutes: 285
        run: |
          set -euo pipefail
          for p in $(seq -w 0 17); do
            lake build "WeilDefect.Generated.NF703Attachment.Pair$p" 2>&1 | tee -a nf703-unified-build.log
            echo "$p" >> nf703-unified-completed.txt
          done
      - name: Compile and audit all-phase receiver
        timeout-minutes: 20
        run: |
          set -euo pipefail
          lake build WeilDefect.Generated.NF703Attachment.Receiver 2>&1 | tee -a nf703-unified-build.log
          lake env lean WeilDefect/Generated/NF703Attachment/AuditUnified.lean 2>&1 | tee nf703-unified-axioms.log
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          p=Path('nf703-unified-manifest.json');m=json.loads(p.read_text())
          assert Path('nf703-unified-completed.txt').read_text().splitlines()==[f'{i:02d}' for i in range(18)]
          expected=set(m['audit_names']);found={}
          s=Path('nf703-unified-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",s):
              if n in expected:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",s):
              if n in expected:
                  assert n not in found
                  found[n]=[]
          assert len(expected)==19 and set(found)==expected and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          Path('nf703-unified-audit.json').write_text(json.dumps({'manifest_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'theorems':found,'slots':1442,'rows':5443,'scope':'All 18 certified NF703 phases composed into one finite receiver; not universal original-bank soundness.'},indent=2)+'\n')
          print('NF703 unified concrete receiver LEAN PASS',1442,5443,len(found))
          PY
      - name: Preserve source-bound compiled phase modules for later integration
        run: |
          set -euo pipefail
          mkdir -p nf703-checkpoint
          python scripts/nf697_compiled_bank_binding.py
          cp nf697-bank-binding.json nf703-checkpoint/
          cp nf703-unified-manifest.json nf703-unified-audit.json nf703-checkpoint/
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=Path('WeilDefect/Generated')
          stages=['NF632','NF703','NF703Attachment']
          m={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for st in stages for p in sorted((r/st).glob('*.lean'))}
          Path('nf703-checkpoint/source-binding.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY
          find .lake/build -type f \( -path '*/WeilDefect/Generated/NF632/*' -o -path '*/WeilDefect/Generated/NF703/*' -o -path '*/WeilDefect/Generated/NF703Attachment/*' \) -print0 > /tmp/nf703-build-files
          test -s /tmp/nf703-build-files
          test -f .lake/build/lib/lean/WeilDefect/Generated/NF703Attachment/Receiver.olean
          tar --null -T /tmp/nf703-build-files -czf nf703-checkpoint/nf703-compiled.tar.gz
          (cd nf703-checkpoint && sha256sum nf703-compiled.tar.gz source-binding.json nf697-bank-binding.json nf703-unified-manifest.json nf703-unified-audit.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: nf703-unified-compiled-checkpoint
          path: nf703-checkpoint/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf703-unified-receiver-evidence
          path: |
            nf703-unified-*.json
            nf703-unified-*.log
            nf703-unified-completed.txt
          if-no-files-found: warn
