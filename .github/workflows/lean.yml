name: Lean

on:
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        shell: bash
        run: lake update

      - name: Fetch mathlib cache
        shell: bash
        run: lake exe cache get

      - name: Record exact source custody
        shell: bash
        run: |
          git rev-parse HEAD
          cat lean-toolchain; echo
          git -C .lake/packages/mathlib rev-parse HEAD
          git ls-tree HEAD WeilDefect/Morphology/NeutralWeilPolePolarization.lean WeilDefect/Morphology/NeutralWeilPoleGrowth.lean

      - name: Build pole polarization audit
        shell: bash
        run: lake build WeilDefect.Morphology.NeutralWeilPolePolarization

      - name: Inspect transitive theorem axioms
        shell: bash
        run: |
          set -o pipefail
          cat > /tmp/rpb107-audit.lean <<'LEAN'
          import WeilDefect.Morphology.NeutralWeilPolePolarization
          #print axioms WeilDefect.neutralWeilSourcePole_pairing
          #print axioms WeilDefect.neutralWeilSourcePole_self_pairing
          #print axioms WeilDefect.complex_bilinear_phase_square
          #print axioms WeilDefect.complex_hermitian_phase_normSq
          LEAN
          lake env lean /tmp/rpb107-audit.lean | tee /tmp/rpb107-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb107-axioms.txt; then exit 1; fi

      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)\b' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
