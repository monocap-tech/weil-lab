name: Lean

on:
  push:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore validation build cache
        id: rpb_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .lake
          key: rpb108-lean434-mathlib5ed296-base71dddf5-v1

      - name: Resolve pinned dependencies
        shell: bash
        run: lake update

      - name: Fetch mathlib cache
        shell: bash
        run: lake exe cache get

      - name: Check current theorem target
        shell: bash
        run: |
          git rev-parse HEAD
          git hash-object WeilDefect/Morphology/NeutralIntegralGrowthGaussian.lean
          lean --version
          lake build WeilDefect.Morphology.NeutralIntegralGrowthGaussian

      - name: Save validation build cache
        if: always() && steps.rpb_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .lake
          key: rpb108-lean434-mathlib5ed296-base71dddf5-v1

      - name: Inspect transitive endpoint axioms
        shell: bash
        run: |
          cat > /tmp/rpb108-integral-growth-audit.lean <<'LEAN'
          import WeilDefect.Morphology.NeutralIntegralGrowthGaussian
          #print axioms WeilDefect.integralGrowth_pairing_bound
          #print axioms WeilDefect.movingGaussianFilteredMode_norm_le_radiusEnvelope
          #print axioms WeilDefect.movingGaussianFilteredMode_weighted_exterior_bound
          #print axioms WeilDefect.integralGrowthGaussian_pairing_bound
          #print axioms WeilDefect.primeShellIntegralGrowthResidual
          #print axioms WeilDefect.integralGrowth_weakIdentity_of_integrableSchwartz
          LEAN
          lake env lean /tmp/rpb108-integral-growth-audit.lean | tee /tmp/rpb108-integral-growth-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-integral-growth-axioms.txt; then exit 1; fi

      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)\b' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
