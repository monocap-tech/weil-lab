name: Lean

on:
  push:
    branches: [main, validation/rpb108-mellin-growth]
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore validation build cache
        id: rpb_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-actual-correlation-fourier-agreement-verified-v1
          restore-keys: |
            rpb108-actual-correlation-regularity-verified-v1
            rpb108-actual-correlation-poles-verified-v1
            rpb108-actual-correlation-transform-verified-v1
            rpb108-actual-source-decomposition-verified-v1
            rpb108-actual-weil-zero-verified-v1
            rpb108-actual-raw-green-verified-v1
            rpb108-actual-green-canonical-verified-v1
            rpb108-actual-green-energy-verified-v1
            rpb108-actual-green-sampling-verified-v1
      - name: Resolve pinned dependencies
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Fetch mathlib cache if compiled dependency is missing
        shell: bash
        run: |
          if [ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/NumberTheory/LSeries/RiemannZeta.olean ]; then
            lake exe cache get
          fi
      - name: Check actual correlation Fourier agreement
        shell: bash
        run: |
          git rev-parse HEAD
          git hash-object WeilDefect/Arithmetic/ActualZetaMellinRepresentation.lean
          lean --version
          lake build WeilDefect.Arithmetic.ActualZetaCorrelationFourierAgreement
          lake build WeilDefect
      - name: Inspect actual correlation Fourier agreement axioms
        shell: bash
        run: |
          cat > /tmp/rpb108-green-energy-audit.lean <<'LEAN'
          import WeilDefect.Arithmetic.ActualZetaCorrelationFourierAgreement
          #print axioms WeilDefect.neutralIntegrableL2_fourier_ae
          #print axioms WeilDefect.neutralActualZetaGreenSynthesis_integrable
          #print axioms WeilDefect.neutralActualZetaGreenSynthesis_fourier_ae
          #print axioms WeilDefect.neutralRawTransform_fourier
          #print axioms WeilDefect.neutralWindowRepresentative_fourier
          #print axioms WeilDefect.neutralActualZetaGreenSynthesis_fourier_window
          #print axioms WeilDefect.neutralActualZetaGreenCorrelation_fourier_spectrum_ae
          #print axioms WeilDefect.neutralActualZetaGreenCorrelation_fourier_integrable
          LEAN
          lake env lean /tmp/rpb108-green-energy-audit.lean | tee /tmp/rpb108-green-energy-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-green-energy-axioms.txt; then exit 1; fi
      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:](]|$)' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
      - name: Save validation dependency cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-actual-correlation-fourier-agreement-verified-v1
