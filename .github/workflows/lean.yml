name: Lean

on:
  push:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        shell: bash
        run: lake update

      - name: Fetch mathlib cache
        shell: bash
        run: lake exe cache get

      - name: Check canonical certificate transport
        shell: bash
        run: |
          set -o pipefail
          lake build WeilDefect.Screening.CanonicalCertificateTransport \
            WeilDefect.Screening.ExactMatrixWitness \
            WeilDefect.Screening.PhysicalResidualTransport \
            WeilDefect.Morphology.NeutralLogMetricLaplace \
            WeilDefect.Morphology.NeutralLogMetricPoisson \
            WeilDefect.Morphology.NeutralLogMetricPoissonMass \
            WeilDefect.Morphology.NeutralLogMetricJumpBounds \
            WeilDefect.Morphology.NeutralLogMetricJumpCap \
            WeilDefect.Morphology.NeutralLogMetricEndpointBounds \
            WeilDefect.Morphology.NeutralLogMetricEndpointLog \
            WeilDefect.Morphology.NeutralLogMetricEndpointMeasurable \
            WeilDefect.Morphology.NeutralLogMetricEndpointL2 \
            WeilDefect.Morphology.NeutralLogMetricCapL2 2>&1 | tee certificate-build.log

      - name: Check complete root library
        shell: bash
        run: |
          set -o pipefail
          lake build WeilDefect 2>&1 | tee root-build.log

      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)\b' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-diagnostics
          path: |
            certificate-build.log
            root-build.log
          if-no-files-found: ignore

