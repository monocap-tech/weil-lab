name: Lean

on:
  push:
    branches: [main, validation/rpb108-mellin-growth]
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore validation build cache
        id: rpb_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-actual-source-graph-verified-v1
          restore-keys: |
            rpb108-retained-unit-gain-custody-verified-v1
            rpb108-actual-native-source-attachment-verified-v1
            rpb108-actual-native-weil-form-verified-v1
      - name: Resolve pinned dependencies
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Fetch mathlib cache if compiled dependency is missing
        shell: bash
        run: |
          if [ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/NumberTheory/LSeries/RiemannZeta.olean ]; then
            lake exe cache get
          fi
      - name: Compile actual source graph
        shell: bash
        run: |
          git rev-parse HEAD
          lean --version
          lake build WeilDefect.Arithmetic.ActualZetaSourceGraph
          lake build WeilDefect
      - name: Audit actual source graph
        shell: bash
        run: |
          cat > /tmp/rpb108-ef-audit.lean <<'LEAN'
          import WeilDefect.Arithmetic.ActualZetaSourceGraph
          #print axioms WeilDefect.neutralActualZetaSourceGraph_isClosed
          #print axioms WeilDefect.neutralActualZetaSourceDomain_complete
          #print axioms WeilDefect.neutralActualZetaSourceAnalysis_sampling
          #print axioms WeilDefect.neutralActualZetaSourceAnalysis_norm_le
          #print axioms WeilDefect.neutralActualZetaGreenSourceLift_physical
          #print axioms WeilDefect.neutralActualZetaGreenSourceLift_energy
          LEAN
          lake env lean /tmp/rpb108-ef-audit.lean | tee /tmp/rpb108-ef-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-ef-axioms.txt; then exit 1; fi
      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:](]|$)' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
      - name: Save validation dependency cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-actual-source-graph-verified-v1
