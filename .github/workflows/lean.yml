name: Lean

on:
  push:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        shell: bash
        run: lake update

      - name: Fetch mathlib cache
        shell: bash
        run: lake exe cache get

      - name: Check current theorem target
        shell: bash
        run: |
          git rev-parse HEAD
          git hash-object WeilDefect/Morphology/NeutralWeilSourceMixedForm.lean
          lean --version
          lake build WeilDefect.Morphology.NeutralWeilSourceMixedForm

      - name: Inspect transitive endpoint axioms
        shell: bash
        run: |
          cat > /tmp/rpb108-mixed-form-audit.lean <<'LEAN'
          import WeilDefect.Morphology.NeutralWeilSourceMixedForm
          #print axioms WeilDefect.integrable_mixedMultiplier
          #print axioms WeilDefect.NeutralSourceFormDomainAttachment.absoluteSymbolEnergy
          #print axioms WeilDefect.NeutralSourceFormDomainAttachment.mixedMultiplier_integrable
          #print axioms WeilDefect.sourceDomainMultiplierForm
          #print axioms WeilDefect.sourceWindowMoment
          #print axioms WeilDefect.sourceWindowMoment_carrier
          #print axioms WeilDefect.sourceDomainWeilForm
          #print axioms WeilDefect.sourceDomainWeilForm_eq_of_diagonal
          LEAN
          lake env lean /tmp/rpb108-mixed-form-audit.lean | tee /tmp/rpb108-mixed-form-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-mixed-form-axioms.txt; then exit 1; fi

      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)\b' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
