name: Lean

on:
  push:
    branches: [main, validation/rpb108-mellin-growth]
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore validation build cache
        id: rpb_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-divisor-summability-compiled-v1
          restore-keys: |
            rpb108-log-growth-compiled-v1
            rpb108-mellin-manifest-final-v1
            rpb108-mellin-factorial-verified-v1
            rpb108-mellin-representation-compiled-v1
      - name: Resolve pinned dependencies
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Fetch mathlib cache if compiled dependency is missing
        shell: bash
        run: |
          if [ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/NumberTheory/LSeries/RiemannZeta.olean ]; then
            lake exe cache get
          fi
      - name: Check actual Mellin tail comparison
        shell: bash
        run: |
          git rev-parse HEAD
          git hash-object WeilDefect/Arithmetic/ActualZetaMellinRepresentation.lean
          lean --version
          lake build WeilDefect.Arithmetic.ActualZetaDivisorSummability
          lake build WeilDefect
      - name: Inspect actual Jensen bridge axioms
        shell: bash
        run: |
          cat > /tmp/rpb108-green-energy-audit.lean <<'LEAN'
          import WeilDefect.Arithmetic.ActualZetaDivisorSummability
          #print axioms WeilDefect.neutralActualZetaDivisorUnitBand_subset
          #print axioms WeilDefect.neutralActualZetaDivisorUnitBand_finite
          #print axioms WeilDefect.neutralActualZetaDivisorUnitBand_partition
          #print axioms WeilDefect.neutralActualZetaDivisorUnitBand_card_bound
          #print axioms WeilDefect.neutralActualZetaDivisorQuarticWeight_band_le
          #print axioms WeilDefect.neutralActualZetaDivisorQuarticWeight_summable
          #print axioms WeilDefect.neutralActualZetaDivisor_norm_summable_of_quartic_bound
          #print axioms WeilDefect.neutralActualZetaDivisor_summable_of_quartic_bound
          LEAN
          lake env lean /tmp/rpb108-green-energy-audit.lean | tee /tmp/rpb108-green-energy-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-green-energy-axioms.txt; then exit 1; fi
      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:](]|$)' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
      - name: Save validation dependency cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-divisor-summability-compiled-v1
