name: Lean

on:
  push:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        shell: bash
        run: lake update

      - name: Fetch mathlib cache
        shell: bash
        run: lake exe cache get

      - name: Check current theorem target
        shell: bash
        run: |
          git rev-parse HEAD
          git hash-object WeilDefect/Morphology/NeutralWeilSourceFormDomain.lean
          lean --version
          lake build WeilDefect.Morphology.NeutralWeilSourceFormDomain

      - name: Inspect transitive endpoint axioms
        shell: bash
        run: |
          cat > /tmp/rpb108-source-domain-audit.lean <<'LEAN'
          import WeilDefect.Morphology.NeutralWeilSourceFormDomain
          #print axioms WeilDefect.sourceFormDomain_polarization
          #print axioms WeilDefect.sourceFormDomain_eq_of_diagonal
          #print axioms WeilDefect.neutralWeilResidualFromCore
          #print axioms WeilDefect.neutralWeilResidualFromCore_weakRealization
          LEAN
          lake env lean /tmp/rpb108-source-domain-audit.lean | tee /tmp/rpb108-source-domain-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-source-domain-axioms.txt; then exit 1; fi

      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)\b' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
