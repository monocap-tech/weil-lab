name: Lean

on:
  push:
    branches: [main, validation/rpb108-mellin-growth]
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-canonical-native-energy-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore validation build cache
        id: rpb_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-actual-native-form-operator-verified-v1
          restore-keys: |
            rpb108-actual-canonical-native-energy-verified-v1
            rpb108-actual-native-log-bounds-verified-v1
            rpb108-actual-hilbert-source-graph-verified-v1
            rpb108-actual-selected-background-verified-v1
            rpb108-actual-source-graph-verified-v1
            rpb108-retained-unit-gain-custody-verified-v1
            rpb108-actual-native-source-attachment-verified-v1
            rpb108-actual-native-weil-form-verified-v1
      - name: Resolve pinned dependencies
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Fetch mathlib cache if compiled dependency is missing
        shell: bash
        run: |
          if [ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/NumberTheory/LSeries/RiemannZeta.olean ]; then
            lake exe cache get
          fi
      - name: Compile actual native form operator
        shell: bash
        run: |
          git rev-parse HEAD
          lean --version
          lake build WeilDefect.Arithmetic.ActualZetaNativeFormOperator
          lake build WeilDefect
      - name: Audit actual native form operator
        shell: bash
        run: |
          cat > /tmp/rpb108-ef-audit.lean <<'LEAN'
          import WeilDefect.Arithmetic.ActualZetaNativeFormOperator
          #print axioms WeilDefect.neutralActualZetaLogSymbolRatio_measurable
          #print axioms WeilDefect.neutralActualZetaLogSymbolRatio_bound
          #print axioms WeilDefect.neutralActualZetaLogSymbolMultiplication_coe
          #print axioms WeilDefect.neutralActualZetaLogSymbolMultiplication_norm_le
          #print axioms WeilDefect.neutralActualZetaLogMultiplierOperator_mixed
          #print axioms WeilDefect.neutralActualZetaLogMultiplierOperator_diagonal
          #print axioms WeilDefect.neutralActualZetaLogWeilFormOperator_mixed
          #print axioms WeilDefect.neutralActualZetaLogWeilFormOperator_diagonal
          #print axioms WeilDefect.neutralActualZetaLogWeilFormOperator_mixed_bound
          #print axioms WeilDefect.neutralActualZetaLogWeilFormOperator_garding
          #print axioms WeilDefect.neutralActualZetaGreenZeroForm_native_operator
          #print axioms WeilDefect.neutralActualZetaGreenSourceForms_native_operator
          #print axioms WeilDefect.neutralActualZetaGreenHilbertSource_native_operator_diagonal
          LEAN
          lake env lean /tmp/rpb108-ef-audit.lean | tee /tmp/rpb108-ef-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-ef-axioms.txt; then exit 1; fi
      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:](]|$)' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
      - name: Save validation dependency cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-actual-native-form-operator-verified-v1
