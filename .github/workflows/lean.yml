name: Lean

on:
  push:
    branches: [main, validation/rpb108-mellin-growth]
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-canonical-native-energy-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore validation build cache
        id: rpb_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-actual-carrier-factorization-verified-v1
          restore-keys: |
            rpb108-actual-green-copy-observability-verified-v1
            rpb108-actual-green-graph-analysis-verified-v1
            rpb108-actual-green-packet-density-verified-v1
            rpb108-actual-green-graph-packets-verified-v1
            rpb108-actual-green-closed-subspace-verified-v1
            rpb108-actual-green-graph-mixed-verified-v1
      - name: Resolve pinned dependencies
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Fetch mathlib cache if compiled dependency is missing
        shell: bash
        run: |
          if [ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/NumberTheory/LSeries/RiemannZeta.olean ]; then
            lake exe cache get
          fi
      - name: Compile actual carrier factorization
        shell: bash
        run: |
          git rev-parse HEAD
          lean --version
          lake build WeilDefect.Arithmetic.ActualZetaCarrierAudit
          lake build WeilDefect
      - name: Audit actual carrier factorization
        shell: bash
        run: |
          cat > /tmp/rpb108-ef-audit.lean <<'LEAN'
          import WeilDefect.Arithmetic.ActualZetaCarrierAudit
          #print axioms WeilDefect.CarrierAudit.quotientObservationNorm_mk
          #print axioms WeilDefect.CarrierAudit.observationMap_dense
          #print axioms WeilDefect.CarrierAudit.kernel_iff_algebraic_descent
          #print axioms WeilDefect.CarrierAudit.domination_iff_unique_contraction
          #print axioms WeilDefect.CarrierAudit.domination_iff_covariance_order
          #print axioms WeilDefect.CarrierAudit.no_contraction_iff_negative_witness
          #print axioms WeilDefect.CarrierAudit.bounded_inverse_iff_coercivity
          #print axioms WeilDefect.CarrierAudit.synthesis_positive_kernel_comparison
          #print axioms WeilDefect.CarrierAudit.domination_gives_wdt10_factor
          #print axioms WeilDefect.CarrierAudit.kernel_inclusion_not_domination
          #print axioms WeilDefect.neutralActualZetaObservationClosure_eq
          #print axioms WeilDefect.neutralActualZetaSynthesis_positive_kernel_comparison
          #print axioms WeilDefect.neutralActualZetaGreenPositive_recovery_iff
          #print axioms WeilDefect.neutralActualZetaBackground_factorization_iff
          #print axioms WeilDefect.neutralActualZetaBackground_no_factor_iff_negative
          #print axioms WeilDefect.neutralActualZetaBackground_kernel_of_nonnegative
          #print axioms WeilDefect.neutralActualZetaBackground_wdt10_of_nonnegative
          LEAN
          lake env lean /tmp/rpb108-ef-audit.lean | tee /tmp/rpb108-ef-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-ef-axioms.txt; then exit 1; fi
      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:](]|$)' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
      - name: Save validation dependency cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .lake
            lake-manifest.json
          key: rpb108-actual-carrier-factorization-verified-v1
