name: Lean

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "WeilDefect.lean"
      - "WeilDefect/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore validation build cache
        id: rpb_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .lake
          key: rpb108-lean434-mathlib5ed296-inner-collar-v1
          restore-keys: |
            rpb108-lean434-mathlib5ed296-base71dddf5-v1
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Check inner collar regularity
        shell: bash
        run: |
          git rev-parse HEAD
          git hash-object WeilDefect/Morphology/NeutralInnerCollarRegularity.lean
          lean --version
          lake build WeilDefect.Morphology.NeutralInnerCollarRegularity
      - name: Inspect inner collar theorem axioms
        shell: bash
        run: |
          cat > /tmp/rpb108-inner-collar-audit.lean <<'LEAN'
          import WeilDefect.Morphology.NeutralInnerCollarRegularity
          #print axioms WeilDefect.neutralWeilSymbolTemperate_at_radius
          #print axioms WeilDefect.neutralInnerCollarResidual_locallyIntegrable
          #print axioms WeilDefect.neutralInnerCollarResidual_exterior_pairing
          #print axioms WeilDefect.neutralInnerCollarResidual_overlap_zero
          #print axioms WeilDefect.neutralInnerCollarResidual_eq_candidate_exterior
          #print axioms WeilDefect.neutralInnerCollarResidual_ae_eq_candidate
          #print axioms WeilDefect.neutralExteriorResidualCandidate_represents_of_central
          #print axioms WeilDefect.neutralCompactSourceDefect_zero_of_central
          #print axioms WeilDefect.neutralExteriorIntegralGrowthResidual_realizes_of_central
          LEAN
          lake env lean /tmp/rpb108-inner-collar-audit.lean | tee /tmp/rpb108-inner-collar-axioms.txt
          if grep -q 'sorryAx' /tmp/rpb108-inner-collar-axioms.txt; then exit 1; fi
      - name: Reject unfinished trusted declarations
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|sorry|admit)\\b' WeilDefect WeilDefect.lean; then
            echo "Unfinished or project-axiom declaration found."
            exit 1
          fi
      - name: Save validation dependency cache
        if: always() && steps.rpb_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .lake
          key: rpb108-lean434-mathlib5ed296-inner-collar-v1
