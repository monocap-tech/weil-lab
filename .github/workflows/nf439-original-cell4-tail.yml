name: Weil-Lab NF439 original cell4 sourcewise 512-tail
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf439_original_cell4_sourcewise_512_tail_exact.py'
      - '.github/workflows/nf439-original-cell4-tail.yml'
permissions:
  contents: read
jobs:
  original-cell4-finite-source-and-image-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original sourcewise full real cell4 model and n512 remainder
        run: |
          python3 -m py_compile scripts/local_replay/nf439_original_cell4_sourcewise_512_tail_exact.py
          python3 scripts/local_replay/nf439_original_cell4_sourcewise_512_tail_exact.py --output artifacts/NF439_original_cell4_real_P511_tail.json
      - name: Strict original cell4 conditional function bound and remaining signed obligations
        run: |
          python3 - <<'PY'
          import sys,json
          sys.set_int_max_str_digits(0)
          from fractions import Fraction as F
          d=json.load(open('artifacts/NF439_original_cell4_real_P511_tail.json'))
          assert d['pass']=='NF439'
          assert d['NF407_original_source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert d['NF406_original_seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert d['original_true_cell4']=='(11/10-log(2),log(5)-11/10)'
          assert d['original_minus_translate_active']==[2,3,4]
          assert d['original_plus_translate_active']==[]
          assert d['original_Chebyshev_accepted_prefix_count_required']==512
          assert d['sourcewise_cheb_tail_starts_at_mode']==512
          assert sum(d['sourcewise_optimal_E2_E3_E4_E5_counts'].values())==273
          assert F(d['original_true_cell4_z_minus_any_accepted_P511_uniform_error_exact_upper'])<F(1,10**38)
          assert not d['original_true_cell4_signed_pz_z2_integrated']
          assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF439 PASS original cell4 source-specific P511 real error CONDITIONAL on 512 native coefficient interval receipt; true signed J4 OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF439-original-cell4-sourcewise-P511-error
          path: artifacts/NF439_original_cell4_real_P511_tail.json
          if-no-files-found: error
