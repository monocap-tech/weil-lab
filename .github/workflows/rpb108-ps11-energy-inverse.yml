name: RPB108 PS11 true original energy inverse channel response

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps11_energy_inverse_channel_response.py"
      - "notes/RPB108_PS11_ENERGY_INVERSE_CHANNEL_RESPONSE_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps11-energy-inverse.yml"
  workflow_dispatch:

jobs:
  ps11-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay original PS10 and certify true source-preconditioned inverse
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps11_energy_inverse_channel_response.py
          python3 scripts/validate_rpb108_ps11_energy_inverse_channel_response.py
      - name: Enforce original W-ODD-NEG custody and no proof promotion
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(value is False for value in p["closures"].values())
          PY
