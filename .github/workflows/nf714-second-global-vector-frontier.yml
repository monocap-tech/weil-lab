name: NF714 second authenticated global vector gates, original rows 16 through 31
on:
  pull_request:
    paths:
      - "scripts/nf714_second_global_vector_driver.py"
      - ".github/workflows/nf714-second-global-vector-frontier.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf714-second-global-vectors-${{ github.ref }}
  cancel-in-progress: true
jobs:
  second-vector-attachment:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate immutable original scaled-input artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nf714-receipts/{input,cache-proposals,cache-audit,vectors,vector-audit}
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14582437652/zip" -o nf714-input.zip
          echo "258637da71e96468ed7c6ac5b0a4480ce06cdee9989aef8e71a4cd09059789e0  nf714-input.zip" | sha256sum -c -
          unzip -q nf714-input.zip -d nf714-receipts/input
      - name: Restore accepted NF703 original cache source
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-proposals
          path: nf714-receipts/cache-proposals
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore certified NF703 source-specific cache audit
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-audit
          path: nf714-receipts/cache-audit
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted original NF680 local vector/defect proof source
        uses: actions/download-artifact@v4
        with:
          name: nf680-original-cache-vector-proposals
          path: nf714-receipts/vectors
          run-id: 44540497550
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore NF680 full 1210-declaration standard-axiom audit
        uses: actions/download-artifact@v4
        with:
          name: nf680-complete-original-cache-vector-audit
          path: nf714-receipts/vector-audit
          run-id: 44540497550
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile exact original source objects and emit next sixteen global vector row attachments
        run: |
          set -euo pipefail
          python -m py_compile scripts/emit_nf709_original_global_vector_attachments.py scripts/nf714_second_global_vector_driver.py
          python scripts/emit_nf709_original_global_vector_attachments.py \
            --inputs nf714-receipts/input \
            --cache nf714-receipts/cache-proposals \
            --vectors nf714-receipts/vectors \
            --input-audit nf714-receipts/input \
            --cache-audit nf714-receipts/cache-audit \
            --vector-audit nf714-receipts/vector-audit \
            --output WeilDefect/Generated/NF709 \
            --first 16 --count 16 2>&1 | tee nf714-source-reconciliation.log
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path('WeilDefect/Generated/NF709')
          m = json.loads((d/'manifest.json').read_text())
          assert m['rows']==list(range(16,32)) and m['count']==16
          assert len(m['theorems']) == 230 and len(m['files'])==17
          PY
      - name: Restore NF709 accepted first sixteen original global vector gate proofs
        uses: actions/download-artifact@v4
        with:
          name: nf709-first-original-global-vector-attachments
          path: nf714-prior
          run-id: 44641913509
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate prior 230-theorem kernel audit and exact shared projection sources
        run: |
          set -euo pipefail
          python scripts/nf714_second_global_vector_driver.py prepare 2>&1 | tee nf714-prior-reconciliation.log
      - name: Install original pinned Lean and Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Reuse NF707 certified compiled original scaled inputs
        uses: actions/download-artifact@v4
        with:
          name: nf707-compiled-original-input
          path: nf708-compiled-input
          run-id: 44633937710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit input producer source environment and restore compiled original input objects
        run: |
          set -euo pipefail
          python scripts/nf708_global_matrix_attachment_driver.py restore-input
      - name: Build actual original global cache and vector bridge
        timeout-minutes: 225
        run: |
          set -euo pipefail
          /usr/bin/time -o nf714-data-time.log -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF703Cache.Data WeilDefect.Generated.NF709.Common 2>&1 | tee nf714-data-build.log
      - name: Kernel-check second sixteen global vector gates independently
        timeout-minutes: 95
        run: |
          set -euo pipefail
          for ((i=16;i<32;i+=2)); do
            printf -v a '%03d' "$i"
            printf -v b '%03d' "$((i+1))"
            lake build "WeilDefect.Generated.NF709.Row$a" "WeilDefect.Generated.NF709.Row$b" 2>&1 | tee -a nf714-vector-build.log
          done
      - name: Strict source-specific 230-theorem Lean axiom audit for next sixteen rows
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python scripts/nf714_second_global_vector_driver.py axiom-file
          lake env lean nf714Audit.lean 2>&1 | tee nf714-axioms.log
          python scripts/nf714_second_global_vector_driver.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf714-second-original-global-vector-attachments
          path: |
            nf714-*.log
            nf714-input-reuse.json
            nf708-input-reuse.json
            nf714-complete-audit.json
            nf714-binding.json
            WeilDefect/Generated/NF709/
          if-no-files-found: ignore
