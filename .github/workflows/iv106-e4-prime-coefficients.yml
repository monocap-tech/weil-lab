name: IV106-E4 prime coefficients and row certificates
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv106/iv106_e4/ActualZetaIV106E4PrimeCoefficients.lean'
      - '.github/workflows/iv106-e4-prime-coefficients.yml'
permissions:
  contents: read
jobs:
  physical-action:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c948f00e850c15cf151d2c0bb82475a78c9fa292
          path: predecessor_e3
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C predecessor_e3 rev-parse HEAD)" = c948f00e850c15cf151d2c0bb82475a78c9fa292
          test "$(git -C predecessor_e3 hash-object verification/iv106/iv106_e3/ActualZetaIV106E3WeightedChains.lean)" = 9dfc0e96baf730f3c88c3869e88a39d427918f28
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106E3WeightedChains.lean
          cp predecessor_e3/verification/iv106/iv106_e3/ActualZetaIV106E3WeightedChains.lean research/WeilDefect/Arithmetic/ActualZetaIV106E3WeightedChains.lean
          test "$(git -C candidate hash-object verification/iv106/iv106_e4/ActualZetaIV106E4PrimeCoefficients.lean)" = 2d0184e8902c012cfd42f3e0b0dd86588e029d5f
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv106/iv106_e4/ActualZetaIV106E4PrimeCoefficients.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.lean
          cp candidate/verification/iv106/iv106_e4/ActualZetaIV106E4PrimeCoefficients.lean research/WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv106-e4/out
          touch iv106-e4/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV106E4PrimeCoefficients 2>&1 | tee iv106-e4/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.olean -nt iv106-e4/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV106E4PrimeCoefficients' '#print axioms WeilDefect.neutralIV106E4Log_upper' '#print axioms WeilDefect.neutralIV106E4Coefficient_receiver' '#print axioms WeilDefect.neutralIV106E4Coefficients' '#print axioms WeilDefect.neutralIV106E4Rows2' '#print axioms WeilDefect.neutralIV106E4Rows3' '#print axioms WeilDefect.neutralIV106E4Rows5' '#print axioms WeilDefect.neutralIV106E4Rows7' '#print axioms WeilDefect.neutralIV106E4Dominated_chain' > /tmp/iv106-e4-axioms.lean
          lake env lean /tmp/iv106-e4-axioms.lean 2>&1 | tee iv106-e4/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv106-e4/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==8 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV106E4Log_upper","neutralIV106E4Coefficient_receiver","neutralIV106E4Coefficients","neutralIV106E4Rows2","neutralIV106E4Rows3","neutralIV106E4Rows5","neutralIV106E4Rows7","neutralIV106E4Dominated_chain"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV106-E4 strict named axioms PASS 8/8')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV106E3WeightedChains.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E3WeightedChains.olean WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.olean > iv106-e4/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv106-e4-physical-action-evidence
          path: |
            research/iv106-e4/out/
            research/WeilDefect/Arithmetic/ActualZetaIV106E3WeightedChains.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E3WeightedChains.olean
            research/WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E4PrimeCoefficients.olean
          include-hidden-files: true
          if-no-files-found: error
