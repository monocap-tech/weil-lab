name: SI29 full original trial physical preconditioner

on:
  push:
    paths:
      - scripts/verify_rpb108_si29_full_trial_preconditioner.py
      - .github/workflows/rpb108-si29-full-trial-preconditioner.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  accepted-native-witness-exact-rational-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accepted GitHub custody and download exact native witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          from verify_rpb108_si29_L2_dyadic_replay import NATIVE_RUN,NATIVE_COMMIT,NATIVE_ARTIFACT,ARCHIVE_SHA256,JSON_SHA256
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:
                  return json.load(r)
          run=get('/actions/runs/'+str(NATIVE_RUN))
          assert run['conclusion']=='success' and run['head_sha']==NATIVE_COMMIT
          artifact=get('/actions/artifacts/'+str(NATIVE_ARTIFACT))
          assert artifact['name']=='si29-original-full-J-L2-normalization'
          assert artifact['workflow_run']['id']==NATIVE_RUN and artifact['workflow_run']['head_sha']==NATIVE_COMMIT
          assert artifact['digest']=='sha256:'+ARCHIVE_SHA256 and artifact['expired'] is False
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(base+'/actions/artifacts/'+str(NATIVE_ARTIFACT)+'/zip',headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # Do not forward the GitHub authorization header to blob storage.
              with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==ARCHIVE_SHA256
          raw=zipfile.ZipFile(io.BytesIO(data)).read('si29_full_J_L2_normalization.json')
          assert hashlib.sha256(raw).hexdigest()==JSON_SHA256
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/si29_full_J_L2_normalization.json').write_bytes(raw)
          print('Accepted native run/source/artifact/archive/JSON custody PASS')
          PY
      - name: Install pinned native ball runtime
        run: python -m pip install python-flint==0.8.0
      - name: Certify complete original 484D trial physical preconditioner
        run: python scripts/verify_rpb108_si29_full_trial_preconditioner.py --certificate artifacts/si29_full_J_L2_normalization.json
      - name: Replay exact rational full-trial bounds
        run: python scripts/verify_rpb108_si29_full_trial_exact_replay.py artifacts/si29_full_trial_preconditioner.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si29-full-trial-preconditioner
          path: artifacts/*.json
          if-no-files-found: warn
