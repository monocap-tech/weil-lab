name: Original BS infinite tail and finite count upper

on:
  push:
    paths:
      - scripts/verify_rpb108_original_BS_infinite_tail.py
      - scripts/verify_rpb108_original_BS_infinite_tail_replay.py
      - .github/workflows/rpb108-original-BS-infinite-tail.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-complete-tail-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged open obligation
        run: python scripts/verify_obligation_manifest.py
      - name: Verify THREE accepted GitHub chains and SIX exact JSONs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:return json.load(r)
          specs=[
            (40419084302,'b24e57ed4bd9eb687008ea03aa73f42f6dcbc180',12697340918,'si29-reference-complement-scalar','d44200d6c444adf48d7b659088f82ddad16915fc1524025c852855fd232b1f87',[
              ('si29_reference_on_J_perp.json','f1149e27da8a0e1d90e48b8ee0eb8a0a0b8ef51d0910499a7fcd19a082efca07'),
              ('si29_full_J_L2_normalization.json','c9ee487f8abe7b633c47d2ef7d72e2cc4f7289bc794b2d8fc02bb61520b25e60'),
              ('si29_full_trial_preconditioner.json','87d6f3ae24cde489adaf9ab3ac7efa612bc82bd78c6c9e94866802fdc550052f')]),
            (40451367065,'30d4597b8c3fd68886899ba89e278e66de661dce',12710727196,'sm40-original-envelope-method-stop','a15f8ff4a6161f3b2a84201ec1ff7fba5591b35f29dd009422848b5bc84166c8',[
              ('sm40_original_envelope_method_stop.json','19af532b6bbd4a808854696b2a993e7ebd966e04da27fdd5f55e8b736668770b')]),
            (40516665209,'8217c8c97520c37f7b1889da340ac13b7cff0594',12738593751,'original-four-mode-critical-block','735ab9b78b6df9b09590ba70a8e51049aa19e73ebb526f22c58797b455cc4968',[
              ('original_four_mode_critical_block.json','a84b19c1fefc4e680c5c19ea643bbe5badce639374cb0a424211ee980020f922'),
              ('original_compact_BS_native_probe.json','2cd494b1558c43790f683d21926e1d1a83cc68a4edfdebd0d6074ac968f85919')])]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          Path('artifacts').mkdir(exist_ok=True)
          for rid,source,aid,name,digest,files in specs:
              run=get('/actions/runs/'+str(rid))
              assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
              artifact=get('/actions/artifacts/'+str(aid))
              assert artifact['name']==name and artifact['expired'] is False
              assert artifact['workflow_run']['id']==rid and artifact['workflow_run']['head_sha']==source
              assert artifact['digest']=='sha256:'+digest
              request=urllib.request.Request(base+'/actions/artifacts/'+str(aid)+'/zip',headers=headers)
              try:
                  with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
              except urllib.error.HTTPError as e:
                  assert e.code in (301,302,303,307,308)
                  # Never forward GitHub authorization to blob storage.
                  with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
              assert hashlib.sha256(data).hexdigest()==digest
              archive=zipfile.ZipFile(io.BytesIO(data))
              for filename,sha in files:
                  raw=archive.read(filename);assert hashlib.sha256(raw).hexdigest()==sha
                  Path('artifacts',filename).write_bytes(raw)
          print('THREE accepted run/source/artifact/archive chains and SIX matched JSONs PASS')
          PY
      - name: Recompose inherited full compressed reference inverse
        run: |
          python scripts/verify_rpb108_si29_reference_complement_scalar.py --certificate artifacts/si29_full_J_L2_normalization.json --trial-certificate artifacts/si29_full_trial_preconditioner.json --output artifacts/reference_replay.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('artifacts/reference_replay.json').read_bytes()).hexdigest()=='f1149e27da8a0e1d90e48b8ee0eb8a0a0b8ef51d0910499a7fcd19a082efca07'
          print('Replayed reference JSON byte identity PASS')
          PY
      - name: Replay inherited COMPLETE original four-mode lower count
        run: python scripts/verify_rpb108_original_four_mode_critical_block_replay.py artifacts/original_four_mode_critical_block.json artifacts/original_compact_BS_native_probe.json certificates/rpb108_original_four_mode_candidates.json
      - name: Compose complete original BS tail, count upper and mixed Schur contract
        run: python scripts/verify_rpb108_original_BS_infinite_tail.py --reference artifacts/si29_reference_on_J_perp.json --envelope artifacts/sm40_original_envelope_method_stop.json --critical artifacts/original_four_mode_critical_block.json
      - name: Independent exact replay and noncommuting projection/mixed regressions
        run: python scripts/verify_rpb108_original_BS_infinite_tail_replay.py artifacts/original_BS_infinite_tail_upper.json artifacts/si29_reference_on_J_perp.json artifacts/sm40_original_envelope_method_stop.json artifacts/original_four_mode_critical_block.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-BS-infinite-tail-upper
          path: artifacts/*.json
          if-no-files-found: error
