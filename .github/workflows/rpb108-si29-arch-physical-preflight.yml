name: SI29 arch physical-shift preflight

on:
  push:
    paths:
      - scripts/verify_rpb108_si29_arch_small_shift_budget.py
      - scripts/verify_rpb108_si29_arch_midpoint_probe.py
      - scripts/verify_rpb108_si29_arch_midpoint_probe_replay.py
      - .github/workflows/rpb108-si29-arch-physical-preflight.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  accepted-native-witness-exact-rational-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accepted GitHub custody and download exact native witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          NATIVE_RUN=40417043904
          NATIVE_COMMIT='0e3321350980247f8cba46cdbb45b717e49ad213'
          NATIVE_ARTIFACT=12694539474
          ARCHIVE_SHA256='e2c6017b35cd85ba404efa8013305d9e7c023d916cc1b2f96dbbcf7a7c8f772a'
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:
                  return json.load(r)
          run=get('/actions/runs/'+str(NATIVE_RUN))
          assert run['conclusion']=='success' and run['head_sha']==NATIVE_COMMIT
          artifact=get('/actions/artifacts/'+str(NATIVE_ARTIFACT))
          assert artifact['name']=='si29-full-trial-preconditioner'
          assert artifact['workflow_run']['id']==NATIVE_RUN and artifact['workflow_run']['head_sha']==NATIVE_COMMIT
          assert artifact['digest']=='sha256:'+ARCHIVE_SHA256 and artifact['expired'] is False
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(base+'/actions/artifacts/'+str(NATIVE_ARTIFACT)+'/zip',headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # Do not forward the GitHub authorization header to blob storage.
              with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==ARCHIVE_SHA256
          files=[('si29_full_J_L2_normalization.json','c9ee487f8abe7b633c47d2ef7d72e2cc4f7289bc794b2d8fc02bb61520b25e60'),('si29_full_trial_preconditioner.json','87d6f3ae24cde489adaf9ab3ac7efa612bc82bd78c6c9e94866802fdc550052f')]
          Path('artifacts').mkdir(exist_ok=True)
          archive=zipfile.ZipFile(io.BytesIO(data))
          for name,sha in files:
              raw=archive.read(name)
              assert hashlib.sha256(raw).hexdigest()==sha
              Path('artifacts',name).write_bytes(raw)
          print('Accepted full-trial run/source/artifact/archive and BOTH matched JSON inputs PASS')
          PY
      - name: Exact complete small-shift operator-error composition
        run: python scripts/verify_rpb108_si29_arch_small_shift_budget.py --frame-certificate artifacts/si29_full_trial_preconditioner.json
      - name: Install pinned native ball runtime
        run: python -m pip install python-flint==0.8.0
      - name: Test complete 470 by 14 arch shift midpoint NODE, not an integral
        run: python scripts/verify_rpb108_si29_arch_midpoint_probe.py --certificate artifacts/si29_full_J_L2_normalization.json
      - name: Replay exact all-entry and joint operator-radius composition
        run: PYTHONPATH=scripts python scripts/verify_rpb108_si29_arch_midpoint_probe_replay.py artifacts/si29_arch_midpoint_node_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si29-arch-physical-preflight
          path: artifacts/*.json
          if-no-files-found: warn
