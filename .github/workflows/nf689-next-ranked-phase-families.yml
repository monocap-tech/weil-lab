name: NF689 next four ranked original analytical phase families
on:
  pull_request:
    paths:
      - "scripts/emit_nf684_second_oscillator_moments.py"
      - "scripts/emit_nf689_next_ranked_phase_families.py"
      - ".github/workflows/nf689-next-ranked-phase-families.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf689-phase-families-${{ github.ref }}
  cancel-in-progress: false
jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate retained original endpoint and certified pi proposals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inputs/bank WeilDefect/Generated/NF632
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14462990552/zip" -o inputs/bank.zip
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14458696200/zip" -o inputs/pi.zip
          echo '2b0e45897c28a1ed8d671b2958c8a51646e818e742ecbcf4ed6fcf02f31ed363  inputs/bank.zip' | sha256sum -c -
          echo 'd1769ab74275cc9c57452d3aa5ad3a30109efc500f7834ee392ed668612d9a37  inputs/pi.zip' | sha256sum -c -
          unzip -q inputs/bank.zip -d inputs/bank
          unzip -q inputs/pi.zip -d WeilDefect/Generated/NF632
          echo 'b4d290d158af245635d17b58f1c8e9f8bfa5076f773c1a35aa7e789bf850b086  WeilDefect/Generated/NF632/manifest.json' | sha256sum -c -
      - uses: actions/download-artifact@v4
        with:
          pattern: nf621-shard-*
          run-id: 44338849733
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/shards
      - name: Reconcile complete original phase schedule and four new ranked family batches
        run: |
          set -euo pipefail
          python -m py_compile scripts/emit_nf689_next_ranked_phase_families.py
          python scripts/emit_nf689_next_ranked_phase_families.py --root . --shards inputs/shards --bank inputs/bank --pi WeilDefect/Generated/NF632 --output WeilDefect/Generated/NF689
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF689')
          m=json.loads((d/'manifest.json').read_text())
          p=json.loads((d/'full-phase-plan.json').read_text())
          assert (p['keys'],p['rows'],p['families'],p['real_leaves'],p['phase_leaves'])==(7835,37994,639,5,1276)
          families=p['families_ranked_by_rows']
          assert len(families)==639
          keys=[tuple(k['key']) for g in families for k in g['keys']]
          assert len(keys)==len(set(keys))==7835
          assert sum(g['rows'] for g in families)==37994
          assert m['full_plan_sha256']==hashlib.sha256((d/'full-phase-plan.json').read_bytes()).hexdigest()
          assert m['previous_nf686_families']==['87/640','3/32']
          fresh=[g for g in families if not g['leaf_family_targeted_before']]
          assert m['selected_families']==[g['abs_phase'] for g in fresh[:4]]
          assert len(set(m['selected_families']))==4
          assert set(m['selected_families']).isdisjoint(m['previous_nf686_families'])
          selected=[g for q in m['selected_families'] for g in families if g['abs_phase']==q]
          assert len(selected)==4
          assert len(m['groups'])==sum(g['tables'] for g in selected)
          assert m['rows']==sum(g['rows'] for g in selected)
          assert m['prefix_checks']==38*m['leaf_count']
          assert m['leaf_count']==len({q for g in selected for q in g['real_parameters']})+len({q for g in selected for q in g['phase_parameters']})
          for i,g in enumerate(selected):
              actual=[r for r in m['groups'] if r['family']==i]
              assert {tuple(r['key']):r['rows'] for r in actual}=={tuple(r['key']):r['rows'] for r in g['keys']}
              assert len(actual)==g['tables'] and sum(r['rows'] for r in actual)==g['rows']
          for v in m['files']:
              assert hashlib.sha256((d/v['file']).read_bytes()).hexdigest()==v['sha256']
          print('NF689 selected',m['selected_families'],len(m['groups']),'original tables;',m['rows'],'moment rows;',m['leaf_count'],'leaves; Lean pending')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf689-shared-phase-proposals
          path: |
            WeilDefect/Generated/NF632/
            WeilDefect/Generated/NF689/
          if-no-files-found: error
  phase-families:
    needs: emit
    name: Shared phase family ${{ matrix.family }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nf689-shared-phase-proposals
          path: WeilDefect/Generated
      - name: Verify all original proposal hashes and selected family
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for name in ('NF632','NF689'):
              d=root/name
              m=json.loads((d/'manifest.json').read_text())
              for r in m['files']:
                  assert h(d/r['file'])==r['sha256']
          assert m['full_plan_sha256']==h(root/'NF689/full-phase-plan.json')
          assert m['pi_manifest_sha256']==h(root/'NF632/manifest.json')
          family=int(os.environ['FAMILY'])
          targets=[r['group'] for r in m['groups'] if r['family']==family]
          assert targets and len(targets)==len(set(targets))
          Path('nf689-targets.txt').write_text('\n'.join(targets)+'\n')
          print('NF689 family',family,'tables',len(targets))
          PY
      - name: Install pinned Lean and cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Check full common phase prefix once and each original table separately
        timeout-minutes: 145
        run: |
          set -euo pipefail
          while read -r target; do
            lake build "WeilDefect.Generated.NF689.$target" 2>&1 | tee -a nf689-build.log
          done < nf689-targets.txt
      - name: Strict audit of every analytic moment theorem in family
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          names=Path('nf689-targets.txt').read_text().splitlines()
          Path('/tmp/nf689Audit.lean').write_text(''.join(f'import WeilDefect.Generated.NF689.{t}\n' for t in names)+''.join(f'#print axioms WeilDefect.nf689{t}Moment\n' for t in names))
          PY
          lake env lean /tmp/nf689Audit.lean 2>&1 | tee nf689-axioms.log
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF689')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((d/'manifest.json').read_text())
          f=int(os.environ['FAMILY'])
          log=Path('nf689-axioms.log').read_text()
          rows=[]
          for t in m['groups']:
              if t['family']!=f: continue
              name=f"nf689{t['group']}Moment"
              found=[s for s in log.splitlines() if f"'WeilDefect.{name}'" in s]
              assert len(found)==1,(name,found)
              s=found[0]
              if 'does not depend on any axioms' in s:
                  axioms=[]
              else:
                  match=re.search(r'depends on axioms: \[([^\]]*)\]',s)
                  assert match,s
                  axioms=[x.strip() for x in match[1].split(',') if x.strip()]
              assert set(axioms)<={'propext','Classical.choice','Quot.sound'}
              assert h(d/(t['group']+'.lean'))==next(v['sha256'] for v in m['files'] if v['file']==t['group']+'.lean')
              rows.append(dict(t,theorem=name,axioms=axioms,sha256=h(d/(t['group']+'.lean'))))
          expected=[t for t in m['groups'] if t['family']==f]
          assert len(rows)==len(expected) and len(rows)>0
          assert sum(t['rows'] for t in rows)==sum(t['rows'] for t in expected)
          Path('nf689-audit.json').write_text(json.dumps({'family':f,'manifest_sha256':h(d/'manifest.json'),'full_plan_sha256':m['full_plan_sha256'],'tables':rows},indent=2)+'\n')
          print('NF689 family',f,'PASS:',len(rows),'tables;',sum(t['rows'] for t in rows),'moment rows')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf689-phase-audit-${{ matrix.family }}
          path: |
            nf689-build.log
            nf689-axioms.log
            nf689-audit.json
          if-no-files-found: ignore
  complete-audit:
    needs: phase-families
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nf689-shared-phase-proposals
          path: proposals
      - uses: actions/download-artifact@v4
        with:
          pattern: nf689-phase-audit-*
          path: audits
      - name: Exact complete new table custody and common leaf source
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('proposals/NF689')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((d/'manifest.json').read_text())
          shards=[json.loads(p.read_text()) for p in Path('audits').rglob('nf689-audit.json')]
          assert sorted(s['family'] for s in shards)==list(range(4))
          assert {s['manifest_sha256'] for s in shards}=={h(d/'manifest.json')}
          assert {s['full_plan_sha256'] for s in shards}=={m['full_plan_sha256']}
          assert h(d/'full-phase-plan.json')==m['full_plan_sha256']
          expected={r['group']:r for r in m['groups']}
          rows=[r for s in shards for r in s['tables']]
          assert len(rows)==len({r['group'] for r in rows})==len(expected)
          assert {r['group'] for r in rows}==set(expected)
          assert len({tuple(r['key']) for r in rows})==len(expected)
          for r in rows:
              t=r['group']
              assert all(r[k]==v for k,v in expected[t].items())
              assert r['theorem']==f'nf689{t}Moment'
              assert h(d/(t+'.lean'))==r['sha256']
              assert set(r['axioms'])<={'propext','Classical.choice','Quot.sound'}
          assert sum(r['rows'] for r in rows)==m['rows']
          Path('nf689-complete-audit.json').write_text(json.dumps({'schema':'NF689-complete-shared-phase-audit-v1','manifest_sha256':h(d/'manifest.json'),'tables':rows,'new_rows':m['rows'],'selected_families':m['selected_families'],'scope':'Four new original phase families; not full-bank or physical entry custody.'},indent=2)+'\n')
          print('NF689',len(rows),'exact original analytic moment tables /',m['rows'],'moment rows PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf689-complete-shared-phase-audit
          path: nf689-complete-audit.json
          if-no-files-found: error
