name: NF635 original indexed endpoint bank
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaOriginalPhysicalIndexedEndpoints.lean"
      - "scripts/emit_nf635_indexed_endpoints.py"
      - ".github/workflows/nf635-original-indexed-endpoint-bank.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf635-${{ github.ref }}
  cancel-in-progress: true
jobs:
  endpoint-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: nf621-shard-*
          path: receipts
          run-id: 44338849733
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: nf621-complete-schedule-coverage
          run-id: 44338849733
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate all 31340 exact parameter routes
        run: |
          python -m py_compile scripts/emit_nf635_indexed_endpoints.py
          python scripts/emit_nf635_indexed_endpoints.py --root . --shards receipts --output /tmp/nf635-keys
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/nf635-keys/manifest.json').read_text())
          c=json.loads(Path('nf621-coverage.json').read_text())
          assert m['input_sha256']=={s['file']:s['sha256'] for s in c['shards']}
          assert (m['key_count'],m['route_count'],m['real_count'],m['phase_count'])==(7835,31340,5,1276)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf635-original-endpoint-key-coverage
          path: /tmp/nf635-keys/
          if-no-files-found: error
      - name: Generate complete shared endpoint proposals once
        run: |
          python scripts/emit_nf635_indexed_endpoints.py --root . --shards receipts --output /tmp/nf635-values --full-values
          cmp /tmp/nf635-keys/routes.json /tmp/nf635-values/routes.json
          cmp /tmp/nf635-keys/Params.lean /tmp/nf635-values/Params.lean
      - uses: actions/upload-artifact@v4
        with:
          name: nf635-original-complete-endpoint-proposals
          path: /tmp/nf635-values/
          if-no-files-found: error
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - run: lake build WeilDefect.Arithmetic.ActualZetaOriginalPhysicalIndexedEndpoints
      - name: Audit generic indexed closure
        run: |
          cat >/tmp/nf635Audit.lean <<'EOF'
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalIndexedEndpoints
          #print axioms WeilDefect.NF635EndpointBank.lookup_eq
          #print axioms WeilDefect.neutralNF635ChunkCoverage_of_keys
          #print axioms WeilDefect.neutralNF635Bank_of_indexed
          EOF
          lake env lean /tmp/nf635Audit.lean
