name: Original four-mode critical BS min-max bound

on:
  push:
    paths:
      - scripts/verify_rpb108_original_four_mode_critical_block.py
      - scripts/verify_rpb108_original_four_mode_critical_block_replay.py
      - scripts/verify_rpb108_original_critical_block_physical.py
      - certificates/rpb108_original_four_mode_candidates.json
      - .github/workflows/rpb108-original-four-mode-critical-block.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  coupled-original-critical-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged open obligation
        run: python scripts/verify_obligation_manifest.py
      - name: Verify accepted original BS witness GitHub custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:return json.load(r)
          run=get('/actions/runs/40461812230')
          source='556a2bdc7a17b6580bd5fc7c216243bddda5e840'
          digest='978000dfecf2ce7e6275790d4c2cc3fae4824caea77dfe604ebee2d37a618e5e'
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
          artifact=get('/actions/artifacts/12714962092')
          assert artifact['name']=='original-compact-BS-native-probe' and artifact['expired'] is False
          assert artifact['workflow_run']['id']==40461812230 and artifact['workflow_run']['head_sha']==source
          assert artifact['digest']=='sha256:'+digest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(base+'/actions/artifacts/12714962092/zip',headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # Never forward GitHub authorization to blob storage.
              with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==digest
          archive=zipfile.ZipFile(io.BytesIO(data));Path('artifacts').mkdir(exist_ok=True)
          for filename,sha in [
            ('original_compact_BS_native_probe.json','2cd494b1558c43790f683d21926e1d1a83cc68a4edfdebd0d6074ac968f85919'),
            ('original_affine_negative_cap.json','8b58972bbdd2f9cb5d00275820ab6d6891feeff3bbd584a1c28231770368f514')]:
              raw=archive.read(filename);assert hashlib.sha256(raw).hexdigest()==sha
              Path('artifacts',filename).write_bytes(raw)
          print('Accepted run/source/artifact/archive and TWO matched JSONs PASS')
          PY
      - name: Independently replay accepted original near-critical witness
        run: python scripts/verify_rpb108_original_compact_BS_probe_replay.py artifacts/original_compact_BS_native_probe.json artifacts/original_affine_negative_cap.json certificates/rpb108_original_compact_BS_probe.json
      - name: Install pinned native arithmetic
        run: python -m pip install python-flint==0.8.0
      - name: Verify coupled critical plane with TEN complete original scalar forms
        run: python scripts/verify_rpb108_original_four_mode_critical_block.py --prior artifacts/original_compact_BS_native_probe.json --candidates certificates/rpb108_original_four_mode_candidates.json
      - name: Independent scalar composition, mixed matrix, physical metric and min-max replay
        run: python scripts/verify_rpb108_original_four_mode_critical_block_replay.py artifacts/original_four_mode_critical_block.json artifacts/original_compact_BS_native_probe.json certificates/rpb108_original_four_mode_candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-four-mode-critical-block
          path: artifacts/*.json
          if-no-files-found: error
