name: NF690 combined certified receiver
on:
  push:
    branches:
      - research/nf690-combined-certified-receiver
    paths:
      - ".github/workflows/nf690-combined-certified-receiver.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  batch:
    name: NF690 combined finite receiver
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          # Pin installer asset independently of the repository's Lean toolchain.
          archive="$RUNNER_TEMP/nf703-elan.tar.gz"
          digest=0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
          fetch_verified() {
            rm -f "$archive"
            curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 180 "$@" -o "$archive" &&
              printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          }
          if ! fetch_verified https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz; then
            fetch_verified -H 'Accept: application/octet-stream' "https://api.github.com/repos/leanprover/elan/releases/assets/763468108?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          mkdir -p "$RUNNER_TEMP/nf703-elan"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nf703-elan"
          "$RUNNER_TEMP/nf703-elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan --version
          cat lean-toolchain
          retry() {
            local n
            for n in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$n" -lt 3 ]; then sleep "$((15*n))"; fi
            done
            return 1
          }
          retry elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          retry lake update
          retry lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
          run-id: 44598398608
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=json.loads(Path('compiled-bank/nf697-bank-binding.json').read_text())
          b=json.loads(Path('nf697-bank-binding.json').read_text())
          for x in (a,b):
              f=x.pop('fingerprint')
              assert hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()==f
          assert a['schema']==b['schema'] and a['environment']==b['environment']
          assert all(b['files'].get(k)==v for k,v in a['files'].items())
          extra=set(b['files'])-set(a['files'])
          assert extra=={'WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.lean'},extra
          # Existing source closure must not reference the newly added module.
          assert all('ActualZetaOriginalPhysicalTriangularCacheAssembly' not in Path(p).read_text()
                     for p in a['files'] if p.endswith('.lean'))
          print('NF705 all producer sources unchanged; exactly one new independent theorem module')
          PY
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
          test ! -e .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.olean
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - name: Authenticate exact source and aggregate evidence archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p receiver-input
          fetch() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$2/zip" -o "receiver-input/$1.zip"
            echo "$3  receiver-input/$1.zip" | sha256sum -c -
          }
          fetch nf705source 14582778463 9d68de97b0b0ce2bbef46239510c094b97a06f6301b7d769fc5a554d1f81d6cb
          fetch nf705audit 14594210703 39bf39110ed79e0ea7daca68bc8367272305ccf64504a9ddfc1440c67da66f68
          fetch pilot 15031976389 df8ce66190dd0b4fd042dafbe646a036ecee3f0efeacfac07a3fde5bd17d6be6
          fetch batch00 15041197414 a0c3ec2140a79ffc01cb7b98bc0d1bd5464461c3d39cb5d0b926ea50844e01c1
          fetch pair6 15070833157 9cffcb2ae4220f041e0658ed4dcfe5533e8912ec393332e08c0e69d53be3a71d
          fetch pair7source 15072009607 ad5fbd72dddd8af33513432eabaabe0d80e5ac77dac443ce55e8edc4d5e65f9e
          fetch pair7audit 15074015403 d05c9bc7ce1b43bacae805b36f442f5e0925d1ff59f0b7cb0c4463cbe546b210
          fetch pair8source 15074942849 8c3e891a09ff6268df6fef56efab58fc89b4ed8e209c6bb97fbe084b6ef338fb
          fetch pair8audit 15075677822 46c9106b4c834a6b3d252f74e76c3a75ade5cfaeb4d96fd423272969d2ef5902
          fetch pair9source 15077310729 f4d1db863ed410363752a959c398c8936e57d27e44213c0f79fe052f8ef85e84
          fetch pair9audit 15076764240 d7ae0f72fecf1d661d6540a068fc1442a615a0eda90d17afb81491add1e94342
          fetch pair10source 15078157802 376ce4cef40175f70efc6b73ce263ccc4bf197b39cb80315a9a294f6dd1c2166
          fetch pair10audit 15079725631 836d329810c35220b72a2d1f04e46b12071d357a85111742d88fde84867f71e8
          fetch pair11source 15078852980 02fb2d1ffb8189b1f91b5f26fcc66b1f352ec43673c785cc007548a9e8b0d1fb
          fetch pair11audit 15079723509 1a56eb0271aaf25f94a1a4376953115955baf1e041d38a73b42077832fffd971
      - name: Reconcile 930 original slots and generate finite receiver
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          from fractions import Fraction as F
          root=Path('WeilDefect/Generated')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def openz(n): return zipfile.ZipFile('receiver-input/'+n+'.zip')
          def get(z,p): return json.loads(z.read(p))
          def put(p,data):
              p.parent.mkdir(parents=True,exist_ok=True)
              if p.exists(): assert p.read_bytes()==data,p
              else: p.write_bytes(data)
          bm=json.loads((root/'NF690/manifest.json').read_text())
          bh=sha((root/'NF690/manifest.json').read_bytes())
          assert (bm['keys'],bm['rows'])==(7835,37994)
          slots=bm['slots']; assert [x['index'] for x in slots]==list(range(7835))
          suffixes=('Key','Length','RowsEq','Sound','PayloadEq','Concrete')
          allowed={'propext','Classical.choice','Quot.sound'}
          seen=set(); names=set(); groups={}; target_records={}; target_phase={}
          def check_audit(records,th,prefix):
              expected={prefix+f"Slot{r['index']:05d}"+v for r in records for v in suffixes}
              assert len(expected)==6*len(records) and set(th)==expected
              assert names.isdisjoint(expected) and all(set(v)<=allowed for v in th.values())
              names.update(expected)
          def register(records,prefix,phase,targets,folder):
              for r in records:
                  i=r['index']; b=slots[i]
                  assert i not in seen; seen.add(i)
                  assert tuple(map(F,r['key']))==tuple(map(F,b['key']))
                  assert (r['rows'],r['chunk'],r['offset'])==(b['rows'],b['chunk'],b['offset'])
                  k=r['receipt']; e=analytic[k]
                  assert e['family']//2==phase and e['rows']==r['rows'] and tuple(map(F,e['key']))==tuple(map(F,r['key']))
                  groups.setdefault(phase,[]).append(r)
              index={r['index']:r for r in records}; got=set()
              for t in targets:
                  p=root/folder/(t+'.lean')
                  ids=[int(i) for i in re.findall(r'^import WeilDefect\.Generated\.'+folder+r'\.Slot(\d+)$',p.read_text(),re.M)]
                  assert ids and len(ids)==len(set(ids)) and set(ids)<=index.keys() and got.isdisjoint(ids)
                  got.update(ids)
                  mod=f'WeilDefect.Generated.{folder}.{t}'
                  assert mod not in target_records
                  for i in ids:
                      assert re.search(r'\btheorem '+prefix+f'Slot{i:05d}Concrete'+r'\b',p.read_text())
                  target_records[mod]=[(i,prefix+f'Slot{i:05d}Concrete') for i in ids]
                  target_phase[mod]=phase
              assert got==index.keys()
          def restore_tail(z,hashes):
              for f,h in hashes.items():
                  assert Path(f).name==f and f.endswith('.lean')
                  data=z.read('WeilDefect/Generated/NF698Tail/'+f)
                  assert sha(data)==h
                  put(root/'NF698Tail'/f,data)
          with openz('nf705source') as z,openz('nf705audit') as q:
              m=get(z,'NF705/manifest.json'); a=get(q,'nf705-complete-audit.json')
              assert m['bank_manifest_sha256']==bh and a['manifest_sha256']==sha(z.read('NF705/manifest.json'))
              assert (m['tables'],m['rows'])==(475,2209)
              assert sorted(m['records'],key=lambda r:r['index'])==sorted(a['records'],key=lambda r:r['index'])
              prior=set()
              for stage,n in [('NF692',271),('NF696',127),('NF701',548)]:
                  p=stage+'/manifest.json'; v=get(z,p)
                  assert m[stage.lower()+'_manifest_sha256']==sha(z.read(p)) and v['bank_manifest_sha256']==bh
                  ids={r['index'] for r in v['records']}
                  assert len(ids)==n and prior.isdisjoint(ids); prior.update(ids)
              assert len(prior)==946
              for stage in ('NF632','NF698','NF687','NF705'):
                  p=stage+'/manifest.json'
                  put(root/p,z.read(p))
                  for f in get(z,p)['files']:
                      path=stage+'/'+f['file']; data=z.read(path)
                      assert sha(data)==f['sha256']
                      put(root/path,data)
              am=get(z,'NF698/manifest.json')
              assert am['input_sha256']==bm['input_sha256']
              analytic={r['group']:r for r in am['groups']}
              assert len(analytic)==930
              check_audit(m['records'],a['theorems'],'nf705')
              for phase in range(6):
                  rs=[r for r in m['records'] if int(r['shard'])==phase]
                  ids={r['index'] for r in rs}
                  targets=[]
                  for p in sorted((root/'NF705').glob('Concrete*.lean')):
                      ii={int(i) for i in re.findall(r'^import WeilDefect\.Generated\.NF705\.Slot(\d+)$',p.read_text(),re.M)}
                      if ii&ids: assert ii<=ids; targets.append(p.stem)
                  register(rs,'nf705',phase,targets,'NF705')
          with openz('pilot') as z:
              a=get(z,'nf698-tail-pilot-audit.json')
              b=get(z,'nf698-tail-reconciliation.json')
              assert a['reconciliation_sha256']==sha(z.read('nf698-tail-reconciliation.json'))
              assert b['bank_manifest_sha256']==bh and (a['slot'],a['rows'])==(85,4)
              r=b['record']; sl=b['bank_slot']
              rs=[dict(index=85,key=r['key'],rows=4,receipt=r['group'],chunk=sl['chunk'],offset=sl['offset'])]
              check_audit(rs,a['theorems'],'nf698Tail'); restore_tail(z,a['source_sha256'])
              register(rs,'nf698Tail',6,['ConcretePilot'],'NF698Tail')
          with openz('batch00') as z:
              a=get(z,'nf698-tail-batch00-audit.json'); b=get(z,'nf698-tail-batch-reconciliation.json')
              assert a['reconciliation_sha256']==sha(z.read('nf698-tail-batch-reconciliation.json'))
              assert a['records']==b['records'] and b['bank_manifest_sha256']==bh and a['rows']==35
              check_audit(a['records'],a['theorems'],'nf698Tail'); restore_tail(z,a['source_sha256'])
              register(a['records'],'nf698Tail',6,['ConcretePair06Batch00'],'NF698Tail')
          with openz('pair6') as z:
              path='nf698-tail-remainder-manifest.json'; raw=z.read(path); m=get(z,path)
              restore_tail(z,m['source_sha256'])
              for b in m['batches']:
                  a=get(z,'nf698-tail-remainder-evidence/'+b['target']+'-audit.json')
                  assert a['manifest_sha256']==sha(raw) and a['records']==b['records']
                  assert set(a['theorems'])==set(b['expected_theorems'])
                  check_audit(a['records'],a['theorems'],'nf698Tail')
                  register(a['records'],'nf698Tail',6,[b['target']],'NF698Tail')
          for phase in range(7,12):
              with openz(f'pair{phase}source') as z,openz(f'pair{phase}audit') as q:
                  path='nf698-tail-final-manifest.json'; raw=z.read(path); m=get(z,path); a=get(q,'nf698-tail-final-pair-audit.json')
                  assert m['pair']==a['pair']==phase and a['manifest_sha256']==sha(raw)
                  assert a['records']==[r for b in m['batches'] for r in b['records']]
                  assert set(a['theorems'])=={n for b in m['batches'] for n in b['expected_theorems']}
                  restore_tail(z,m['source_sha256'])
                  check_audit(a['records'],a['theorems'],'nf698Tail')
                  register(a['records'],'nf698Tail',phase,[b['target'] for b in m['batches']],'NF698Tail')
          expected=[(80,382),(81,374),(78,370),(77,365),(77,363),(82,355),(82,349),(80,344),(70,342),(73,339),(74,338),(76,334)]
          assert [(len(groups[p]),sum(r['rows'] for r in groups[p])) for p in range(12)]==expected
          assert len(seen)==930 and prior.isdisjoint(seen) and len(prior|seen)==1876
          assert len(names)==5580 and {r['receipt'] for rs in groups.values() for r in rs}==set(analytic)
          out=root/'NF698Unified'; out.mkdir(exist_ok=True)
          mod='WeilDefect.Generated.NF698Unified.'
          prop='neutralNF690TableSound (neutralNF624BankRead nf690OriginalBank i)'
          opt='namespace WeilDefect\n\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n\n'
          emitted={}; audit=[]
          def emit(file,imports,body):
              data=(''.join('import '+x+'\n' for x in imports)+'\n'+opt+body+'\nend WeilDefect\n').encode()
              put(out/(file+'.lean'),data); emitted[file+'.lean']=sha(data)
          def cases(items):
              return ' | '.join(items)
          phases=[]
          for p in range(12):
              leaves=[]
              for j,(target,rs) in enumerate((x for x in target_records.items() if target_phase[x[0]]==p)):
                  file=f'Pair{p:02d}Batch{j:02d}'; d='nf698Unified'+file+'Slots'; t='nf698Unified'+file+'Sound'
                  ls='['+', '.join(str(i) for i,_ in rs)+']'
                  body=f'def {d} : List ℕ := {ls}\n\ntheorem {t} (i : ℕ) (hi : i ∈ {d}) :\n    {prop} := by\n'
                  body+=f'  simp only [{d}, List.mem_cons, List.not_mem_nil, or_false] at hi\n'
                  if len(rs)==1: body+='  subst i\n'
                  else: body+='  rcases hi with '+cases(['rfl']*len(rs))+'\n'
                  for _,name in rs: body+=('  exact ' if len(rs)==1 else '  · exact ')+name+'\n'
                  emit(file,[target],body); leaves.append((file,d,t)); audit.append(t)
              file=f'Pair{p:02d}'; d='nf698Unified'+file+'Slots'; t='nf698Unified'+file+'Sound'
              def combine(file,d,t,leaves):
                  # Make the append tree explicit and eliminate exactly one binary
                  # membership disjunction at a time. Do not destruct List.Mem.
                  def chain(xs):
                      return xs[0][1] if len(xs)==1 else '('+xs[0][1]+' ++ '+chain(xs[1:])+')'
                  body=f'def {d} : List ℕ := '+chain(leaves)+'\n\n'
                  body+=f'theorem {t} (i : ℕ) (hi : i ∈ {d}) :\n    {prop} := by\n'
                  body+=f'  change i ∈ {chain(leaves)} at hi\n'
                  def eliminate(xs,h,indent):
                      if len(xs)==1:
                          return indent+f'exact {xs[0][2]} i {h}\n'
                      return (indent+f'rcases List.mem_append.mp {h} with hleft | hright\n'
                              +indent+f'· exact {xs[0][2]} i hleft\n'
                              +indent+'· '+eliminate(xs[1:],'hright',indent+'  ').lstrip())
                  body+=eliminate(leaves,'hi','  ')
                  emit(file,[mod+x[0] for x in leaves],body)
              combine(file,d,t,leaves); phases.append((file,d,t)); audit.append(t)
          combine('Receiver','nf698UnifiedSlots','nf698UnifiedSound',phases)
          audit.append('nf698UnifiedSound')
          p=out/'Audit.lean'
          put(p,('import '+mod+'Receiver\n'+''.join('#print axioms WeilDefect.'+n+'\n' for n in audit)).encode())
          emitted[p.name]=sha(p.read_bytes())
          Path('unified-receiver-manifest.json').write_text(json.dumps({'slots':sorted(seen),'prior_slots':sorted(prior),'rows':4255,'attachment_theorems':sorted(names),'source_sha256':emitted,'receiver_theorems':audit},indent=2)+'\n')
          Path('unified-targets.txt').write_text('\n'.join(mod+f for f,_,_ in phases)+'\n')
          print('NF698 unified source reconciliation PASS: 930 distinct slots / 4255 rows / 5580 previously certified attachment declarations')
          PY
      - name: Authenticate prior local receipts and concrete source proposals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p prior-input
          fetch() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$2/zip" -o "prior-input/$1.zip"
            echo "$3  prior-input/$1.zip" | sha256sum -c -
          }
          fetch source692 14560118454 b7209e4fee4d9309cf86f2551f57f2ff0fe75f47931e8c3dd721a42c3e2ec7b2
          fetch audit692 14568861192 e0b10f84227688ac39b143996a10cf31760d31dbc2cf3abce067856dbefb7048
          fetch source696 14565840709 ccfdfabd15e85e5564c7c5bf7c88de6a9f270174dd3e16f490f50c750173c81e
          fetch audit696 14567980736 f11ecfb1493e1990954f0dec8b3a129a50c985286014fb34abc0f43db84ef497
          fetch unified 15084125240 5ecdd6e9cccf16359cdc1bdcffbe415256b3b03b5a3066009fa0a44fcffc2513
      - name: Verify 398 local receipts and generate bounded concrete receiver
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          from fractions import Fraction as F
          root=Path('WeilDefect/Generated')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def put(p,b):
              p.parent.mkdir(parents=True,exist_ok=True)
              if p.exists(): assert p.read_bytes()==b,p
              else: p.write_bytes(b)
          def load(p): return json.loads(p.read_text())
          bm=load(root/'NF690/manifest.json')
          bh=sha((root/'NF690/manifest.json').read_bytes())
          slots=bm['slots']; assert [r['index'] for r in slots]==list(range(7835))
          allowed={'propext','Classical.choice','Quot.sound'}
          seen=set(); names=[]; targets=[]; out=root/'NF696Concrete'; emitted={}
