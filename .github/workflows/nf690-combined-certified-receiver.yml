          src+='\nnamespace WeilDefect\n\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n\n'
          src+='def nf690CombinedPilotSlots : List ℕ := ['+', '.join(map(str,pilot))+']\n\n'
          src+='theorem nf690CombinedPilotSound (i : ℕ) (hi : i ∈ nf690CombinedPilotSlots) :\n    '+prop+' := by\n  simp only [nf690CombinedPilotSlots, List.mem_cons, List.not_mem_nil, or_false] at hi\n'
          src+='  rcases hi with '+' | '.join(['rfl']*len(pilot))+'\n'
          src+=''.join(f'  · exact nf618FourthRootSlot{i:05d}Concrete\n' for i in pilot)
          leaves=[('nf692696ConcreteSlots','nf692696ConcreteSound'),('nf698UnifiedSlots','nf698UnifiedSound'),('nf701UnifiedSlots','nf701UnifiedSound'),('nf703AttachmentSlots','nf703AttachmentSound'),('nf690CombinedPilotSlots','nf690CombinedPilotSound')]
          def chain(xs):return xs[0][0] if len(xs)==1 else '('+xs[0][0]+' ++ '+chain(xs[1:])+')'
          def elim(xs,h,indent):
              if len(xs)==1:return indent+f'exact {xs[0][1]} i {h}\n'
              return indent+f'rcases List.mem_append.mp {h} with hleft | hright\n'+indent+f'· exact {xs[0][1]} i hleft\n'+indent+'· '+elim(xs[1:],'hright',indent+'  ').lstrip()
          src+='\ndef nf690CombinedCertifiedSlots : List ℕ := '+chain(leaves)+'\n\n'
          src+='theorem nf690CombinedCertifiedSound (i : ℕ) (hi : i ∈ nf690CombinedCertifiedSlots) :\n    '+prop+' := by\n  change i ∈ '+chain(leaves)+' at hi\n'+elim(leaves,'hi','  ')
          src+='\nend WeilDefect\n'
          put(out/'Receiver.lean',src.encode())
          names=[t for _,t in leaves]+['nf690CombinedCertifiedSound']
          put(out/'Audit.lean',('import WeilDefect.Generated.NF690Combined.Receiver\n'+''.join('#print axioms WeilDefect.'+n+'\n' for n in names)).encode())
          residual=sorted(original.keys()-seen)
          assert len(residual)==4508 and sum(original[i]['rows'] for i in residual)==22944
          manifest={'schema':'NF690-combined-certified-receiver-v1','bank_manifest_sha256':sha(bankraw),'banks':{n:sorted(v) for n,v in banks},'slots':sorted(seen),'residual_slots':residual,'tables':3327,'rows':15050,'audit_names':names,'source_sha256':{p.name:fsha(p) for p in out.glob('*.lean')}}
          Path('nf690-combined-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('NF690 all source/environment reconciliation PASS',len(seen),15050,len(residual))
          PY
      - name: Restore source-bound compiled modules without replacing common NF632 cache
        run: |
          set -euo pipefail
          tar -xzf combined-input/nf703/nf703-compiled.tar.gz
          tar --exclude='*/WeilDefect/Generated/NF632/*' -xzf combined-input/nf701/nf701-compiled.tar.gz
          for m in NF703Attachment NF701Unified; do
            test -f ".lake/build/lib/lean/WeilDefect/Generated/$m/Receiver.olean"
            /usr/bin/time -a -o combined-checkpoint-time.txt -f "$m elapsed=%e user=%U rss=%M" lake build "WeilDefect.Generated.$m.Receiver" 2>&1 | tee -a combined-checkpoint-build.log
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nf690-combined-receiver-source
          path: |
            nf690-combined-manifest.json
            WeilDefect/Generated/NF690Combined/
          if-no-files-found: error
      - name: Rebuild earlier finite receivers from authenticated source
        timeout-minutes: 245
        run: |
          set -euo pipefail
          while read -r target; do lake build "$target" 2>&1 | tee -a combined-build.log; done < prior-concrete-targets.txt
          lake build WeilDefect.Generated.NF696Concrete.Receiver 2>&1 | tee -a combined-build.log
          while read -r target; do lake build "$target" 2>&1 | tee -a combined-build.log; done < unified-targets.txt
          lake build WeilDefect.Generated.NF698Unified.Receiver 2>&1 | tee -a combined-build.log
          while read -r target; do lake build "WeilDefect.Generated.NF618FourthRoot.$target" 2>&1 | tee -a combined-build.log; done < combined-pilot-targets.txt
      - name: Kernel-check combined finite receiver and strict axiom audit
        timeout-minutes: 25
        run: |
          set -euo pipefail
          lake build WeilDefect.Generated.NF690Combined.Receiver 2>&1 | tee -a combined-build.log
          lake env lean WeilDefect/Generated/NF690Combined/Audit.lean 2>&1 | tee combined-axioms.log
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          p=Path('nf690-combined-manifest.json');m=json.loads(p.read_text())
          expected=set(m['audit_names']);found={}
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",Path('combined-axioms.log').read_text()):
              if n in expected:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          assert len(expected)==6 and set(found)==expected and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          Path('nf690-combined-audit.json').write_text(json.dumps({'manifest_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'theorems':found,'tables':3327,'rows':15050,'scope':'Finite certified slots only, not universal original-bank soundness'},indent=2)+'\n')
          print('NF690 combined finite receiver LEAN PASS',3327,15050,6)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf690-combined-receiver-evidence
          path: |
            nf690-combined-*.json
            combined-*.log
            combined-*.txt
          if-no-files-found: warn
