name: RPB108 PS18 true complementary low spectral rank bottleneck

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps18_spectral_rank_obstruction.py"
      - "notes/RPB108_PS18_SPECTRAL_RANK_OBSTRUCTION_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps18-spectral-rank.yml"
  workflow_dispatch:

jobs:
  ps18-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned original source replay and minmax native low rank
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps18_spectral_rank_obstruction.py
          python3 scripts/validate_rpb108_ps18_spectral_rank_obstruction.py
      - name: No fake matrix eigenvalues and original canonical theorem remains open
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
