name: F08-072 independent F08-069 fixed window assembly custody (5 named axioms)
on:
  pull_request:
    paths:
      - 'verification/f08/f08_072/**'
      - '.github/workflows/f08-072-fixed-window-assembly-custody.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-original-source-custody:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      F08_RUN: '45619949163'
      F08_ARTIFACT: '15026537270'
      F08_ARTIFACT_SHA: '5cce0e11a6b64e9ed0f51c08a362429bac80bbfc3751bb584a719441ea7f1bcd'
      F08_HEAD: '39ee7430bd6d1293daf0b4a9eb4a2ac2d69e4a0b'
    steps:
      - name: Checkout independent F08-072 auditor
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout exact verified producer
        uses: actions/checkout@v4
        with:
          ref: 39ee7430bd6d1293daf0b4a9eb4a2ac2d69e4a0b
          path: producer
      - name: Checkout exact frozen original research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Independently pin source blobs, Lean version and adversarial verifier controls
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C producer rev-parse HEAD)" = 39ee7430bd6d1293daf0b4a9eb4a2ac2d69e4a0b
          test "$(git -C producer hash-object verification/f08/f08_069/F08OriginalFixedWindowAssemblyReceiver.lean)" = b8f15156f6fa2b45b934517e5277527aab074406
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralLogFormGraph.lean)" = 6a25651c2c54d7ff9e4d20d4b410b56b7d5047a3
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralLogHilbertCarrier.lean)" = 679d58b8f0cfa6b4f7d28c48ce844a41cdce2844
          python3 -m py_compile candidate/verification/f08/f08_072/audit_069.py
          python3 candidate/verification/f08/f08_072/audit_069.py --selftest
      - name: Authenticate real successful producer run and immutable artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p f08-072-receipt
          python3 - <<'PY'
          import json,os,urllib.request
          root=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers=headers),timeout=30) as response:
                  return json.load(response)
          run_id=int(os.environ['F08_RUN'])
          artifact_id=int(os.environ['F08_ARTIFACT'])
          run=get('/actions/runs/'+str(run_id))
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==os.environ['F08_HEAD']
          assert run['head_repository']['full_name']=='monocap-tech/weil-lab'
          assert run['name']=="F08-069 original fixed window assembly receiver kernel"
          jobs=get('/actions/runs/'+str(run_id)+'/jobs')
          assert any(j['conclusion']=='success' and
              any(s['name']=="Compile original fixed window assembly receiver and strict named axioms"
                  and s['conclusion']=='success' for s in j['steps'])
              for j in jobs['jobs']), 'direct original Lean kernel step absent or failed'
          artifact=get('/actions/artifacts/'+str(artifact_id))
          assert artifact['workflow_run']['id']==run_id
          assert artifact['workflow_run']['head_sha']==os.environ['F08_HEAD']
          assert artifact['name']=="f08-069-original-fixed-window-assembly-receiver-compiler-evidence"
          assert artifact['digest']=='sha256:'+os.environ['F08_ARTIFACT_SHA']
          assert artifact['size_in_bytes']>0 and not artifact['expired']
          info={'producer_commit':os.environ['F08_HEAD'], 'producer_run':run_id,
                'artifact_id':artifact_id, 'sha256':os.environ['F08_ARTIFACT_SHA'],
                'producer_success':True, 'direct_compiler_and_axioms_success':True}
          with open('f08-072-receipt/producer-metadata.json','w') as f:
              json.dump(info,f,sort_keys=True,indent=2)
          print('F08-072 authenticated actual original direct F08-069 producer and immutable artifact')
          PY
      - name: Download and independently audit actual entire original compiler archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$F08_ARTIFACT/zip" -o f08-072-receipt/original-producer.zip
          echo "$F08_ARTIFACT_SHA  f08-072-receipt/original-producer.zip" | sha256sum -c -
          python3 candidate/verification/f08/f08_072/audit_069.py --archive f08-072-receipt/original-producer.zip --producer-metadata f08-072-receipt/producer-metadata.json --out f08-072-receipt/independent-fixed-window-assembly.json
      - name: Archive independent source-only custody receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-072-independent-original-fixed-window-assembly-custody
          path: |
            f08-072-receipt/producer-metadata.json
            f08-072-receipt/independent-fixed-window-assembly.json
          if-no-files-found: ignore
