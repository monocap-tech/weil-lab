name: RC311 all-degree endpoint core identity
on:
  push:
    branches:
      - research/rpb108-rc311-endpoint-core-identity
    paths:
      - "scripts/validate_rpb108_rc311_endpoint_core_identity.py"
      - ".github/workflows/rc311-endpoint-core-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install symbolic and inherited exact dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 sympy==1.13.3
      - name: Generate and reverse-replay universal endpoint polynomial-core identity
        run: |
          python scripts/validate_rpb108_rc311_endpoint_core_identity.py --output certificates/rpb108_rc311_endpoint_core_identity.json
          python scripts/validate_rpb108_rc311_endpoint_core_identity.py --output certificates/rpb108_rc311_endpoint_core_identity.json --replay
      - name: Commit verified exact certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc311_endpoint_core_identity.json
          if ! git diff --cached --quiet; then
            git commit -m "RC311: freeze all-degree endpoint multiplier and exact contact identity"
            git pull --rebase origin research/rpb108-rc311-endpoint-core-identity
            git push origin HEAD:research/rpb108-rc311-endpoint-core-identity
          fi
