name: Original compact BS near-critical witness and affine cap stop

on:
  push:
    paths:
      - scripts/pilot_rpb108_original_compact_BS.py
      - scripts/verify_rpb108_original_compact_BS_probe.py
      - scripts/verify_rpb108_original_compact_BS_probe_replay.py
      - certificates/rpb108_original_compact_BS_probe.json
      - .github/workflows/rpb108-original-compact-BS-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bounded-original-compact-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged open obligation
        run: python scripts/verify_obligation_manifest.py
      - name: Verify accepted affine-cap GitHub custody and all exact inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:return json.load(r)
          run=get('/actions/runs/40454006262')
          source='71c5b0c00640f31e7f6a89d97e658a44de15bf81'
          digest='c853b66001e3a36346ce1310df3b60ca694b3b458e8d658a3e6955cf5a14291e'
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
          artifact=get('/actions/artifacts/12712076196')
          assert artifact['name']=='original-affine-negative-cap-feasibility' and artifact['expired'] is False
          assert artifact['workflow_run']['id']==40454006262 and artifact['workflow_run']['head_sha']==source
          assert artifact['digest']=='sha256:'+digest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(base+'/actions/artifacts/12712076196/zip',headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # Never forward GitHub authorization to blob storage.
              with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==digest
          archive=zipfile.ZipFile(io.BytesIO(data));Path('artifacts').mkdir(exist_ok=True)
          files=[
            ('original_affine_negative_cap.json','8b58972bbdd2f9cb5d00275820ab6d6891feeff3bbd584a1c28231770368f514'),
            ('si29_original_negative_mixed_budget.json','a693261c31f01a4a1e11ea6400e5173435a8260b41b1f6b43aa6f67f784ccb7f'),
            ('sm40_original_envelope_method_stop.json','19af532b6bbd4a808854696b2a993e7ebd966e04da27fdd5f55e8b736668770b'),
            ('mg07_original_signed_two_dimensional_SPD.json','264fd853ca006a578d76369ac5bd4588a2097145b829fbba7036693f29b04044')]
          for filename,sha in files:
              raw=archive.read(filename);assert hashlib.sha256(raw).hexdigest()==sha
              Path('artifacts',filename).write_bytes(raw)
          print('Accepted run/source/artifact/archive and FOUR matched JSONs PASS')
          PY
      - name: Replay accepted replacement-cap construction
        run: python scripts/verify_rpb108_original_affine_negative_cap_replay.py artifacts/original_affine_negative_cap.json artifacts/sm40_original_envelope_method_stop.json artifacts/mg07_original_signed_two_dimensional_SPD.json artifacts/si29_original_negative_mixed_budget.json
      - name: Install pinned numerical and native arithmetic
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 python-flint==0.8.0
      - name: Fixed-size NUMERICAL matched inverse diagnostic (not an upper certificate)
        run: python scripts/pilot_rpb108_original_compact_BS.py --cap artifacts/original_affine_negative_cap.json --negative artifacts/si29_original_negative_mixed_budget.json
      - name: Verify fixed rational candidate with native original physical functional
        run: python scripts/verify_rpb108_original_compact_BS_probe.py --cap artifacts/original_affine_negative_cap.json --probe certificates/rpb108_original_compact_BS_probe.json
      - name: Independently replay exact BS lower and GLOBAL affine-cap obstruction
        run: python scripts/verify_rpb108_original_compact_BS_probe_replay.py artifacts/original_compact_BS_native_probe.json artifacts/original_affine_negative_cap.json certificates/rpb108_original_compact_BS_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-compact-BS-native-probe
          path: artifacts/*.json
          if-no-files-found: error
