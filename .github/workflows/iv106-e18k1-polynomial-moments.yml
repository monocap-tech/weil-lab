name: IV106-E18K1 polynomial moments
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv106/iv106_e18k1/ActualZetaIV106E18K1PolynomialMoments.lean'
      - '.github/workflows/iv106-e18k1-polynomial-moments.yml'
permissions:
  contents: read
jobs:
  polynomial-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C candidate hash-object verification/iv106/iv106_e18k1/ActualZetaIV106E18K1PolynomialMoments.lean)" = 6ef66ff129d068c15e320dfb8e048c0544ab8476
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv106/iv106_e18k1/ActualZetaIV106E18K1PolynomialMoments.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.lean
          cp candidate/verification/iv106/iv106_e18k1/ActualZetaIV106E18K1PolynomialMoments.lean research/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.lean
          cmp candidate/verification/iv106/iv106_e18k1/ActualZetaIV106E18K1PolynomialMoments.lean research/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv106-e18k1/out
          touch iv106-e18k1/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV106E18K1PolynomialMoments 2>&1 | tee iv106-e18k1/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.olean -nt iv106-e18k1/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV106E18K1PolynomialMoments' '#print axioms WeilDefect.neutralIV106E18K1Jets' '#print axioms WeilDefect.neutralIV106E18K1Endpoints' '#print axioms WeilDefect.neutralIV106E18K1Primitive_deriv' '#print axioms WeilDefect.neutralIV106E18K1Transform' '#print axioms WeilDefect.neutralIV106E18K1Zero' > /tmp/iv106-e18k1-axioms.lean
          lake env lean /tmp/iv106-e18k1-axioms.lean 2>&1 | tee iv106-e18k1/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv106-e18k1/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==5 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV106E18K1Jets","neutralIV106E18K1Endpoints","neutralIV106E18K1Primitive_deriv","neutralIV106E18K1Transform","neutralIV106E18K1Zero"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV106-E18K1 strict named axioms PASS 5/5')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.olean > iv106-e18k1/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv106-e18k1-polynomial-moments-evidence
          path: |
            research/iv106-e18k1/out/
            research/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18K1PolynomialMoments.olean
          include-hidden-files: true
          if-no-files-found: error
