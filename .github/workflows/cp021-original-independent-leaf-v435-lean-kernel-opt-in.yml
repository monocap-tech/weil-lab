name: CP021 OPT-IN genuine Zeta 4.35 leaf-only compiler, 13 standard axiom receipts
# Does NOT build any CP013–CP020 source draft, despite parent PR stack.
# Explicit label/manual dispatch only; protect original IV/NF queued CI.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: cp021-upstream-original-Zeta435-two-independent-leaves-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-original-Zeta435-two-leaf-kernel:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'cp021-leaf-lean' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine external Zeta4.35 compiler
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pin original source immutable SHA and exact 13-leaf theorem gates
        working-directory: cp011_zeta_v435
        timeout-minutes: 65
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/Zeta rev-parse HEAD)" = c06b4e13d9c847e50a32c3d738271cbad62ae9f3
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          python ../scripts/cp021_independent_leaf_v435_source_kernel_gate.py \
            --self-test --source-check \
            --original-zeta .lake/packages/Zeta \
            --original-mathlib .lake/packages/mathlib \
            2>&1 | tee cp021-actual-original-Zeta-source-gate.log
      - name: CP027 FIRST isolated original two-point Borwein source LEAF — no CP013–CP026 imports
        working-directory: cp011_zeta_v435
        timeout-minutes: 65
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build CP027PointwiseBorwein 2>&1 \
            | tee cp027-actual-original-two-point-Borwein-leaf-build.log
          lake env lean CP027PointwiseBorwein.lean \
            2>&1 | tee CP027PointwiseBorwein-actual-source-axioms.log
      - name: Actual original v4.35 compile the simpler ζ=EM germ leaf after CP027 pointwise
        working-directory: cp011_zeta_v435
        timeout-minutes: 100
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
          lake build CP021GermLeaf 2>&1 \
            | tee cp022-first-actual-upstream-germ-leaf-build.log
      - name: Compile the independent harder Borwein leaf only AFTER germ passes
        working-directory: cp011_zeta_v435
        timeout-minutes: 110
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build CP021BorweinLeaf 2>&1 \
            | tee cp022-second-actual-upstream-borwein-leaf-build.log
      - name: REAL standard-only 13 axioms, require both compiled leaf oleans
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          (
            cd cp011_zeta_v435
            lake env lean CP021BorweinLeaf.lean
            lake env lean CP021GermLeaf.lean
          ) 2>&1 | tee cp011_zeta_v435/cp021-real-original-leaf-axioms.log
          python scripts/cp021_independent_leaf_v435_source_kernel_gate.py --kernel-audit
          test -s cp011_zeta_v435/cp021-independent-original-leaf-actual-kernel.json
      - name: CP026 source original Hardy-Z finite error to strict sign and OPEN interval zero — conditional isolated Lean v4.35 target
        working-directory: cp011_zeta_v435
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build CP026OriginalPointBridge 2>&1 \
            | tee cp026-actual-original-conditional-root-bridge-build.log
      - name: Genuine CP026 four-theorem standard-only axiom output — 4 numerical premises remain UNPAID
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          (
            cd cp011_zeta_v435
            lake env lean CP026OriginalPointBridge.lean
          ) 2>&1 | tee cp011_zeta_v435/cp026-actual-original-point-bridge-axioms.log
          python scripts/cp026_original_point_receipt_replay_and_conditional_lean_gate.py \
            --kernel-audit
          grep -F "depends on axioms:" \
            cp011_zeta_v435/cp026-actual-original-point-bridge-axioms.log
      - name: CP027 two-final-finite-sign bridge, actual original v4.35 compile and 12 genuine standard-only axiom check
        working-directory: cp011_zeta_v435
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build CP027TwoFiniteSigns 2>&1 \
            | tee cp027-actual-two-finitemargin-conditional-bridge-build.log
          lake env lean CP027TwoFiniteSigns.lean \
            2>&1 | tee CP027TwoFiniteSigns-actual-source-axioms.log
          python ../scripts/cp027_original_center_borwein_328_over_27_source_gate.py \
            --kernel-audit
      - name: CP028 ORIGINAL simple finite interval boxes imply 2 source finite HardyZ signs — conditional v4.35 compiler only
        working-directory: cp011_zeta_v435
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build CP028CoarseFiniteBoxes 2>&1 \
            | tee cp028-actual-original-coarse-finite-source-bridge-build.log
          lake env lean CP028CoarseFiniteBoxes.lean 2>&1 \
            | tee CP028CoarseFiniteBoxes-actual-source-axioms.log
          python ../scripts/cp028_original_coarse_finite_boxes_source_gate.py \
            --kernel-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp021-actual-standalone-original-Zeta435-13-theorem-LEAF-kernel
          path: |
            cp011_zeta_v435/cp021-actual-original-Zeta-source-gate.log
            cp011_zeta_v435/cp022-first-actual-upstream-germ-leaf-build.log
            cp011_zeta_v435/cp022-second-actual-upstream-borwein-leaf-build.log
            cp011_zeta_v435/cp021-real-original-leaf-axioms.log
            cp011_zeta_v435/cp021-independent-original-leaf-actual-kernel.json
            cp011_zeta_v435/.lake/build/lib/lean/CP021BorweinLeaf.olean
            cp011_zeta_v435/.lake/build/lib/lean/CP021GermLeaf.olean
            cp011_zeta_v435/cp026-actual-original-conditional-root-bridge-build.log
            cp011_zeta_v435/cp026-actual-original-point-bridge-axioms.log
            cp011_zeta_v435/.lake/build/lib/lean/CP026OriginalPointBridge.olean
            cp011_zeta_v435/cp027-actual-original-two-point-Borwein-leaf-build.log
            cp011_zeta_v435/CP027PointwiseBorwein-actual-source-axioms.log
            cp011_zeta_v435/cp027-actual-two-finitemargin-conditional-bridge-build.log
            cp011_zeta_v435/CP027TwoFiniteSigns-actual-source-axioms.log
            cp011_zeta_v435/.lake/build/lib/lean/CP027PointwiseBorwein.olean
            cp011_zeta_v435/.lake/build/lib/lean/CP027TwoFiniteSigns.olean
            cp011_zeta_v435/cp028-actual-original-coarse-finite-source-bridge-build.log
            cp011_zeta_v435/CP028CoarseFiniteBoxes-actual-source-axioms.log
            cp011_zeta_v435/.lake/build/lib/lean/CP028CoarseFiniteBoxes.olean
          if-no-files-found: ignore
          include-hidden-files: true
