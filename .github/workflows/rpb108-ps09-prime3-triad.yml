name: RPB108 PS09 true log3-log9 prime IMS triad

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps09_prime3_triad.py"
      - "notes/RPB108_PS09_PRIME3_TRIAD_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps09-prime3-triad.yml"
  workflow_dispatch:

jobs:
  ps09-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recheck original PS07 and prove rational prime-3/9 triad geometry
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps09_prime3_triad.py
          python3 scripts/validate_rpb108_ps09_prime3_triad.py
      - name: Preserve original canonical objective
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(x is False for x in p["closures"].values())
          PY
