      - name: Reproduce all 93 frozen remaining Lean files
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,re
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF698Tail')
          records=json.loads(Path('nf698-tail-remainder-records.json').read_text())
          local=(d/'Slot00085.lean').read_text()
          concrete=(d/'ConcretePilot.lean').read_text()
          body=concrete.split('set_option maxHeartbeats 0\n\n',1)[1].removesuffix('\nend WeilDefect\n')
          assert body.endswith('\n')
          def subst(s,r):
              s=s.replace('Slot00085','@SLOT@').replace('Key475','@RECEIPT@').replace('Chunk005','@CHUNK@').replace('[5]?','[@OFFSET@]?')
              s=re.sub(r'\b85\b','@INDEX@',s)
              return s.replace('@SLOT@',f"Slot{r['index']:05d}").replace('@RECEIPT@',r['receipt']).replace('@CHUNK@',r['chunk']).replace('@OFFSET@',str(r['offset'])).replace('@INDEX@',str(r['index']))
          hashes={}; batches=[]
          def emit(name,s):
              q=d/(name+'.lean')
              assert not q.exists()
              q.write_text(s)
              hashes[q.name]=hashlib.sha256(q.read_bytes()).hexdigest()
          for j in range(0,len(records),8):
              group=records[j:j+8]; target=f'ConcretePair06Batch{1+j//8:02d}'; audit=target.replace('Concrete','Audit',1)
              names=[]; imports=[]; bodies=[]
              for r in group:
                  slot=f"Slot{r['index']:05d}"; z='nf698Tail'+slot
                  emit(slot,subst(local,r))
                  imports.append('import WeilDefect.Generated.NF698Tail.'+slot)
                  bodies.append(subst(body,r))
                  names.extend(z+v for v in ('Key','Length','RowsEq','Sound','PayloadEq','Concrete'))
              assert len(names)==len(set(names))==6*len(group)
              emit(target,'import WeilDefect.Generated.NF690.Bank\n'+'\n'.join(imports)+'\n\nnamespace WeilDefect\n\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n\n'+'\n'.join(bodies)+'\nend WeilDefect\n')
              emit(audit,'import WeilDefect.Generated.NF698Tail.'+target+'\n'+''.join('#print axioms WeilDefect.'+n+'\n' for n in names))
              batches.append(dict(target=target,audit=audit,records=group,expected_theorems=names))
          assert len(hashes)==93 and len(batches)==10
          assert hashlib.sha256(''.join(f'{p} {hashes[p]}\n' for p in sorted(hashes)).encode()).hexdigest()=='2e33f823373299aaae6cde6baa95c80b2a9df0a5c9ce0bebb2bcadd881ea5007'
          assert len({n for b in batches for n in b['expected_theorems']})==438
          Path('nf698-tail-remainder-manifest.json').write_text(json.dumps({'batches':batches,'source_sha256':hashes},indent=2)+'\n')
          print('NF698 pair06 remainder 93 frozen source hashes PASS')
          PY
      - name: Compile and checkpoint ten bounded batches sequentially
        timeout-minutes: 150
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,re,hashlib
          from pathlib import Path
          m=json.loads(Path('nf698-tail-remainder-manifest.json').read_text())
          out=Path('nf698-tail-remainder-evidence'); out.mkdir()
          all_names=set()
          def run(args,log):
              with log.open('w') as f:
                  with subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1) as p:
                      for line in p.stdout:
                          f.write(line); print(line,end='',flush=True)
                      assert p.wait()==0, args
          for b in m['batches']:
              name=b['target']
              run(['lake','build','WeilDefect.Generated.NF698Tail.'+name],out/(name+'-build.log'))
              log=out/(name+'-axioms.log')
              run(['lake','env','lean','WeilDefect/Generated/NF698Tail/'+b['audit']+'.lean'],log)
              expected=set(b['expected_theorems']); found={}
              text=log.read_text()
              for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",text):
                  if n in expected:
                      assert n not in found
                      found[n]=[v.strip() for v in x.split(',') if v.strip()]
              for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",text):
                  if n in expected:
                      assert n not in found
                      found[n]=[]
              assert set(found)==expected and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
              assert all_names.isdisjoint(found); all_names.update(found)
              (out/(name+'-audit.json')).write_text(json.dumps({'records':b['records'],'theorems':found,'manifest_sha256':hashlib.sha256(Path('nf698-tail-remainder-manifest.json').read_bytes()).hexdigest()},indent=2)+'\n')
              print('NF698 bounded batch PASS',name,len(b['records']),len(found),flush=True)
          assert len(all_names)==438
          print('NF698 phase-pair 06 remainder LEAN PASS: 73 slots / 310 rows / 438 declarations')
          PY
