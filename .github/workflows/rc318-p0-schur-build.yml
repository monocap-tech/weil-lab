name: RC318 signed P0 Schur replay
on:
  push:
    branches:
      - research/rpb108-rc318-p0-signed-schur
    paths:
      - "scripts/validate_rpb108_rc318_p0_signed_schur.py"
      - ".github/workflows/rc318-p0-schur-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original signed P0 high-projection Parseval and Schur certificate
        run: |
          python scripts/validate_rpb108_rc318_p0_signed_schur.py --output certificates/rpb108_rc318_p0_signed_schur.json
          python scripts/validate_rpb108_rc318_p0_signed_schur.py --output certificates/rpb108_rc318_p0_signed_schur.json --replay
      - name: Freeze certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc318_p0_signed_schur.json
          if ! git diff --cached --quiet; then
            git commit -m "RC318: freeze original signed P0 scalar Schur certificate"
            git fetch origin research/rpb108-rc318-p0-signed-schur
            git rebase origin/research/rpb108-rc318-p0-signed-schur
            git push origin HEAD:research/rpb108-rc318-p0-signed-schur
          fi
