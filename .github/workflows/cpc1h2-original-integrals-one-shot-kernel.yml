name: CP-C1H2 original frozen plus-minus log9 integral and prime phase kernel
on:
  push:
    branches:
      - research/cpc1b-original-iv009-nine-probe-source
    paths:
      - ".github/workflows/cpc1h2-original-integrals-one-shot-kernel.yml"
      - "WeilDefect/Arithmetic/CP_C1H2_OriginalFrozenCorrelationIntegrals.lean"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpc1h2-original-frozen-integral-Lean434
  cancel-in-progress: false
jobs:
  frozen-original-integral-kernel:
    if: github.ref == 'refs/heads/research/cpc1b-original-iv009-nine-probe-source'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source plus three upstream blob pins and strict axiom parser selftests
        run: |
          set -euo pipefail
          python3 scripts/cpc1h2_original_integral_kernel_gate.py preflight
          python3 scripts/cpc1h2_original_integral_kernel_gate.py selftest
      - name: Install Lean and pinned Lake environment
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.0"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
      - name: Actual source B through H1 and original H2 direct Lean build and axiom audit
        timeout-minutes: 175
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/cpc1h2_original_integral_local_kernel_lane.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpc1h2-original-frozen-integral-Lean434
          if-no-files-found: warn
          retention-days: 30
          path: |
            cpc1h1-*log
            cpc1h2-*log
            cpc1h1-*.json
            cpc1h2-*.json
            .lake/build/lib/lean/WeilDefect/Arithmetic/CP_C1H_OriginalPointwisePrimeCorrelation.olean
            .lake/build/lib/lean/WeilDefect/Arithmetic/CP_C1H2_OriginalFrozenCorrelationIntegrals.olean
