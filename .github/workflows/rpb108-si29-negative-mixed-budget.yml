name: SI29 complete original negative mixed budget

on:
  push:
    paths:
      - scripts/verify_rpb108_si29_original_negative_mixed_budget.py
      - .github/workflows/rpb108-si29-negative-mixed-budget.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  accepted-native-witness-exact-rational-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accepted GitHub custody and download exact native witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:
                  return json.load(r)
          specs=[
              (40404177269,'e8e3b6c9ca39ffcef13175a58be3d17d3c7fafa0',12691365151,'si29-normalized-negative-cluster','8f17cb9fc18fed1b241d51e3d77c93b5c6439d05a5a1dd843f82950c8eb44b12','a8f0ad60bf61914669d5cb19d36c070345745f2cd0fb54917231a3a1383331f3','si29_normalized_negative_cluster.json'),
              (40417043904,'0e3321350980247f8cba46cdbb45b717e49ad213',12694539474,'si29-full-trial-preconditioner','e2c6017b35cd85ba404efa8013305d9e7c023d916cc1b2f96dbbcf7a7c8f772a','87d6f3ae24cde489adaf9ab3ac7efa612bc82bd78c6c9e94866802fdc550052f','si29_full_trial_preconditioner.json'),
              (40419084302,'b24e57ed4bd9eb687008ea03aa73f42f6dcbc180',12697340918,'si29-reference-complement-scalar','d44200d6c444adf48d7b659088f82ddad16915fc1524025c852855fd232b1f87','f1149e27da8a0e1d90e48b8ee0eb8a0a0b8ef51d0910499a7fcd19a082efca07','si29_reference_on_J_perp.json')]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          Path('artifacts').mkdir(exist_ok=True)
          for run_id,commit,artifact_id,name,archive_sha,json_sha,json_name in specs:
              run=get('/actions/runs/'+str(run_id))
              assert run['conclusion']=='success' and run['head_sha']==commit
              artifact=get('/actions/artifacts/'+str(artifact_id))
              assert artifact['name']==name and artifact['expired'] is False
              assert artifact['workflow_run']['id']==run_id and artifact['workflow_run']['head_sha']==commit
              assert artifact['digest']=='sha256:'+archive_sha
              request=urllib.request.Request(base+'/actions/artifacts/'+str(artifact_id)+'/zip',headers=headers)
              try:
                  with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
              except urllib.error.HTTPError as e:
                  assert e.code in (301,302,303,307,308)
                  # Do not forward GitHub authorization to blob storage.
                  with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
              assert hashlib.sha256(data).hexdigest()==archive_sha
              raw=zipfile.ZipFile(io.BytesIO(data)).read(json_name)
              assert hashlib.sha256(raw).hexdigest()==json_sha
              Path('artifacts',json_name).write_bytes(raw)
              print('Accepted run/source/artifact/archive/JSON custody PASS',run_id,artifact_id)
          PY
      - name: Compose complete squared negative action and mixed budget with exact Fractions
        run: python scripts/verify_rpb108_si29_original_negative_mixed_budget.py --negative-certificate artifacts/si29_normalized_negative_cluster.json --frame-certificate artifacts/si29_full_trial_preconditioner.json --schur-certificate artifacts/si29_reference_on_J_perp.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si29-original-negative-mixed-budget
          path: artifacts/*.json
          if-no-files-found: warn
