name: RC303 native direct polynomial prime generator
on:
  push:
    branches:
      - research/rpb108-rc303-direct-polynomial-prime
    paths:
      - "scripts/validate_rpb108_rc303_direct_polynomial_prime.py"
      - ".github/workflows/rc303-direct-prime-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited validator dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Generate and replay exact direct polynomial source action
        run: |
          python scripts/validate_rpb108_rc303_direct_polynomial_prime.py --output certificates/rpb108_rc303_direct_polynomial_prime.json
          python scripts/validate_rpb108_rc303_direct_polynomial_prime.py --output certificates/rpb108_rc303_direct_polynomial_prime.json --replay
      - name: Commit and push certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc303_direct_polynomial_prime.json
          if ! git diff --cached --quiet; then
            git commit -m "RC303: freeze exact native direct polynomial prime response"
            git push origin HEAD:research/rpb108-rc303-direct-polynomial-prime
          fi
