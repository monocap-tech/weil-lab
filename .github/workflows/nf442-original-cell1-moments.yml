name: Weil-Lab NF442 original J1 principal-zero signed moments
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf442_original_cell1_signed_p512_dx1023_native.py'
      - '.github/workflows/nf442-original-cell1-moments.yml'
permissions:
  contents: read
jobs:
  true-J1-original-principal-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install python-flint==0.8.0
      - name: True original J1 q only, r zero 512 p and raw dx1023
        run: |
          python3 -m py_compile scripts/local_replay/nf442_original_cell1_signed_p512_dx1023_native.py
          python3 scripts/local_replay/nf442_original_cell1_signed_p512_dx1023_native.py --precision 2048 --degree 511 --log-modes 110 --output artifacts/NF442_original_true_J1_moments.json
      - name: Strict independent original NF410 p0 control and none r jumps
        run: |
          python3 - <<'PY'
          import json,sys
          sys.set_int_max_str_digits(0)
          from fractions import Fraction as F
          d=json.load(open('artifacts/NF442_original_true_J1_moments.json'))
          assert d['pass']=='NF442'
          assert d['original_nf407_source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert d['original_nf406_seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert d['original_true_cell1']=='(0,11/10-log(3))'
          assert d['original_active_minus_prime_powers']==[2,3] and d['original_active_plus_prime_powers']==[2,3]
          assert d['original_inactive_prime_powers']==[4,5,7,8,9]
          assert d['original_principal_jump_weights_active']==[]
          assert d['original_principal_jump_weights_inactive']==[2,3,4,5,7,8,9]
          assert d['original_principal_jump_weight_multiplicities']=={}
          assert d['original_regular_z_has_both_n2_n3_signed_translates_but_principal_jumps_none']
          assert d['original_nf410_independent_true_cell1_signed_p0_overlap']
          assert d['original_native_precision_bits']==2048
          assert len(d['original_source_signed_p_cheb_moments_n0_to_n511'])==512
          assert len(d['original_cell1_raw_dx_cheb_moments_n0_to_n1022'])==1023
          assert F(d['original_endpoint_log_uniform_tail_exact'])<F(1,10**110)
          assert all(F(v[1])-F(v[0])<F(1,10**25) for v in d['original_source_signed_p_cheb_moments_n0_to_n511'])
          assert all(F(v[1])-F(v[0])<F(1,10**35) for v in d['original_cell1_raw_dx_cheb_moments_n0_to_n1022'])
          assert d['original_cell1_signed_p0_negative']
          assert not d['original_true_cell1_signed_pz_z2_integrated']
          assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF442 exact original J1 source-native moment check PASS; no principal jump')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF442-original-J1-native-p512-rawdx1023
          path: artifacts/NF442_original_true_J1_moments.json
          if-no-files-found: error
