name: MASTER-RECON V06A

on:
  push:
    branches: [master-recon-001-neutral-shell]
    paths:
      - "WeilDefect/MasterRecon/V06A.lean"
      - ".github/workflows/master-recon-v06a.yml"
  pull_request:
    paths:
      - "WeilDefect/MasterRecon/V06A.lean"
      - ".github/workflows/master-recon-v06a.yml"

permissions:
  contents: read

jobs:
  abstract-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile V06A and inspect axioms
        shell: bash
        run: |
          set -euo pipefail
          lake build WeilDefect.MasterRecon.V04
          lake env lean WeilDefect/MasterRecon/V06A.lean 2>&1 | tee v06a-lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path("v06a-lean.log").read_text()
          names = ["translatedBlock_analytic", "translatedForm_analytic", "translatedForm_zero", "local_analytic_inverse", "coercive_translated_inverse"]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              m = re.search(r"'WeilDefect\.MasterRecon\.V06A\."+name+r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if f"'WeilDefect.MasterRecon.V06A.{name}' does not depend on any axioms" in s:
                      continue
                  raise SystemExit("Missing axiom audit: " + name)
              axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f"Unexpected axioms for {name}: {axioms - allowed}")
          print("V06A strict axiom audit PASS")
          PY
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-recon-v06a-lean
          path: v06a-lean.log
