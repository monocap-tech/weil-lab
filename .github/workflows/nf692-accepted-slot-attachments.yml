name: NF692 exact original analytical slot attachments
on:
  pull_request:
    paths:
      - "scripts/emit_nf692_accepted_slot_attachments.py"
      - ".github/workflows/nf692-accepted-slot-attachments.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf692-attachments-${{ github.ref }}
  cancel-in-progress: false
jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original payload, compact reader and accepted analytical sources and audits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p staging WeilDefect/Generated audits
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "staging/$name.zip"
            echo "$digest  staging/$name.zip" | sha256sum -c -
            mkdir -p "$dest"
            unzip -q "staging/$name.zip" -d "$dest"
          }
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14546727896 p684 98230a6ce56e8cc086801e80b6a63f13d5cf9ddb1e67430103d9fc0cda9c8c9d staging/p684
          fetch 14548317489 p685 1f47f18bbcdd4a88ad899a1d90a689027ff15758271253383053446e47a52c5c staging/p685
          fetch 14549586926 p686 667cd34759d3107e885edcab2409666940e2ec8dc6389dd9887cd43cb962928d staging/p686
          fetch 14557788232 p689 884794a31fe17370d994ab73cb6caf91b402f2827cef127b39ad59f69e0b3acf staging/p689
          fetch 14552942335 a684 e319b52a65726935a680fc7889a35285993dafc80ca317695299e51d60e85be4 audits/684
          fetch 14554320801 a685 5886b20eca98b9b7d08f0d7bf24b4610adf8625ffa14c33e4c7e200670b58774 audits/685
          fetch 14552717604 a686 7a160e76c547aace99fd66db7cfd305130f920e5df8997ce8bcda1ec1277466a audits/686
          fetch 14559916397 a6890 f2f6856e02bc4ba48324148bb1a85408773f6ddf1b4b07365612412ed1ef1f2b audits/689-0
          fetch 14560441005 a6891 968b9273056716d4bb5bd71a5744f388187ce37d3103aeeb1e34c0cc38b9d617 audits/689-1
          python - <<'PY'
          import shutil
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          for name in ('p684','p685','p686','p689'):
              for p in (Path('staging')/name).rglob('*'):
                  if not p.is_file(): continue
                  rel=p.relative_to(Path('staging')/name)
                  assert rel.parts[0] in {'NF632','NF684','NF685','NF686','NF689'},rel
                  d=root/rel
                  d.parent.mkdir(parents=True,exist_ok=True)
                  if d.exists():
                      assert p.read_bytes()==d.read_bytes(),rel
                  else:
                      shutil.copyfile(p,d)
          PY
      - name: Generate exact local and concrete original bank slot attachment proposals
        run: |
          set -euo pipefail
          python -m py_compile scripts/emit_nf692_accepted_slot_attachments.py
          python scripts/emit_nf692_accepted_slot_attachments.py --generated WeilDefect/Generated --audits audits --output WeilDefect/Generated/NF692
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((root/'NF692/manifest.json').read_text())
          assert (m['tables'],m['rows'])==(271,2124)
          assert len({r['index'] for r in m['records']})==271
          for r in m['files']: assert h(root/'NF692'/r['file'])==r['sha256']
          for name in ('NF632','NF684','NF685','NF686','NF689','NF687','NF692'):
              shutil.copytree(root/name,Path('proposals')/name)
          d=Path('proposals/NF690')
          d.mkdir()
          for name in {'manifest.json'}|{r['chunk']+'.lean' for r in m['records']}:
              shutil.copyfile(root/'NF690'/name,d/name)
          print('NF692 exact original slot reconciliation PASS; no new kernel proof asserted')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf692-original-slot-proposals
          path: proposals/
          if-no-files-found: error
  local-slot-audit:
    needs: emit
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['684','685','686','689-0','689-1']
    name: Original slot attachments ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nf692-original-slot-proposals
          path: WeilDefect/Generated
      - name: Verify exact source digests and selected original slot inventory
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((root/'NF692/manifest.json').read_text())
          assert m['bank_manifest_sha256']==h(root/'NF690/manifest.json')
          for name in ('NF632','NF684','NF685','NF686','NF689','NF687','NF692'):
              d=root/name
              for f in json.loads((d/'manifest.json').read_text())['files']:
                  assert h(d/f['file'])==f['sha256']
          records=[r for r in m['records'] if r['shard']==os.environ['SHARD']]
          bank={r['file']:r['sha256'] for r in json.loads((root/'NF690/manifest.json').read_text())['files']}
          for name in {r['chunk']+'.lean' for r in records}:assert h(root/'NF690'/name)==bank[name]
          Path('nf692-targets.txt').write_text('\n'.join(r['module'] for r in records)+'\n')
          print('NF692',os.environ['SHARD'],len(records),'literal table slots')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Build accepted receipt sources and exact chunk-local attachments
        timeout-minutes: 130
        run: |
          set -euo pipefail
          while read -r target; do
            lake build "WeilDefect.Generated.NF692.$target" 2>&1 | tee -a nf692-build.log
          done < nf692-targets.txt
      - name: Strict audit of all exact key, length, row equality and soundness declarations
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          ms=Path('nf692-targets.txt').read_text().splitlines()
          names=['nf692'+m+s for m in ms for s in ('Key','Length','RowsEq','Sound')]
          Path('/tmp/nf692Audit.lean').write_text(''.join(f'import WeilDefect.Generated.NF692.{m}\n' for m in ms)+''.join(f'#print axioms WeilDefect.{n}\n' for n in names))
          Path('nf692-names.txt').write_text('\n'.join(names)+'\n')
          PY
          lake env lean /tmp/nf692Audit.lean 2>&1 | tee nf692-axioms.log
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF692')
          m=json.loads((d/'manifest.json').read_text())
          names=set(Path('nf692-names.txt').read_text().splitlines())
          found={}
          s=Path('nf692-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",s):
              if n in names:
                  assert n not in found
                  found[n]=[a.strip() for a in x.split(',') if a.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",s):
              if n in names:
                  assert n not in found
                  found[n]=[]
          assert set(found)==names
          assert all(set(x)<={'propext','Classical.choice','Quot.sound'} for x in found.values())
          records=[r for r in m['records'] if r['shard']==os.environ['SHARD']]
          assert len(found)==4*len(records)
          Path('nf692-audit.json').write_text(json.dumps({'shard':os.environ['SHARD'],'manifest_sha256':hashlib.sha256((d/'manifest.json').read_bytes()).hexdigest(),'records':records,'theorems':found},indent=2)+'\n')
          print('NF692 shard',os.environ['SHARD'],'PASS:',len(records),'table slots;',sum(r['rows'] for r in records),'rows')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf692-local-audit-${{ matrix.shard }}
          path: |
            nf692-build.log
            nf692-axioms.log
            nf692-audit.json
          if-no-files-found: ignore
  complete-audit:
    needs: local-slot-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nf692-original-slot-proposals
          path: proposals
      - uses: actions/download-artifact@v4
        with:
          pattern: nf692-local-audit-*
          path: audits
      - name: Exact unique original slot coverage and strict receipt audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('proposals/NF692')
          m=json.loads((d/'manifest.json').read_text())
          rs=[json.loads(p.read_text()) for p in Path('audits').rglob('nf692-audit.json')]
          assert len(rs)==5 and {s['shard'] for s in rs}=={'684','685','686','689-0','689-1'}
          sha=hashlib.sha256((d/'manifest.json').read_bytes()).hexdigest()
          assert {s['manifest_sha256'] for s in rs}=={sha}
          expected={r['index']:r for r in m['records']}
          found={};theorems={}
          for s in rs:
              for r in s['records']:
                  i=r['index'];assert i not in found and r==expected[i];found[i]=r
              assert set(s['theorems'])=={'nf692'+r['module']+t for r in s['records'] for t in ('Key','Length','RowsEq','Sound')}
              for n,a in s['theorems'].items():
                  assert n not in theorems and set(a)<={'propext','Classical.choice','Quot.sound'};theorems[n]=a
          assert set(found)==set(expected) and len(found)==271 and sum(r['rows'] for r in found.values())==2124
          assert len(theorems)==1084
          Path('nf692-complete-audit.json').write_text(json.dumps({'schema':'NF692-local-slot-audit-v1','manifest_sha256':sha,'records':list(found.values()),'theorems':theorems,'scope':'Exact local slot receipts, conditional on full-bank payload projection. Concrete projection modules not built by this workflow.'},indent=2)+'\n')
          print('NF692 271 original local slot attachments / 2124 moment rows / 1084 declarations: LEAN PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf692-complete-local-slot-audit
          path: nf692-complete-audit.json
          if-no-files-found: error
