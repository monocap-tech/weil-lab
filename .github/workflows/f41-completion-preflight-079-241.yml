name: F41 completion source-only preflight
on:
  pull_request:
    paths:
      - 'verification/f41/completion_079_241/**'
      - '.github/workflows/f41-completion-*-079-241.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check exact draft blobs, all source selftests and metadata controls
        run: python3 verification/f41/completion_079_241/pipeline.py preflight
