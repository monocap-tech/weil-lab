name: RC329 native signed outside high covariance
on:
  push:
    branches:
      - research/rpb108-rc329-native-outside-covariance
    paths:
      - "scripts/validate_rpb108_rc329_native_outside_covariance.py"
      - ".github/workflows/rc329-native-outside-build.yml"
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Certify first omitted original high signed covariance and full residual
        run: |
          python scripts/validate_rpb108_rc329_native_outside_covariance.py --output certificates/rpb108_rc329_native_outside_covariance.json
          python scripts/validate_rpb108_rc329_native_outside_covariance.py --output certificates/rpb108_rc329_native_outside_covariance.json --replay
      - name: Freeze exact rational covariance certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc329_native_outside_covariance.json
          if ! git diff --cached --quiet; then
            git commit -m "RC329: freeze signed original omitted-high covariance"
            git fetch origin research/rpb108-rc329-native-outside-covariance
            git rebase origin/research/rpb108-rc329-native-outside-covariance
            git push origin HEAD:research/rpb108-rc329-native-outside-covariance
          fi
