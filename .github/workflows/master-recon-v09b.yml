name: MASTER-RECON V09B

on:
  push:
    branches: [master-recon-001-neutral-shell]
    paths:
      - "WeilDefect/MasterRecon/V09B.lean"
      - ".github/workflows/master-recon-v09b.yml"
  pull_request:
    paths:
      - "WeilDefect/MasterRecon/V09B.lean"
      - ".github/workflows/master-recon-v09b.yml"

permissions:
  contents: read

jobs:
  abstract-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile V09B and inspect axioms
        shell: bash
        run: |
          set -euo pipefail
          lake build WeilDefect.MasterRecon.V09A
          lake env lean WeilDefect/MasterRecon/V09B.lean 2>&1 | tee v09b-lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path("v09b-lean.log").read_text()
          names = ["kernel_norm_bound","mellin_integrand_bound","mellin_integrand_measurable","mellin_integrand_integrable","mellin_derivative_bound","mellin_hasDerivAt","mellin_entire","mellin_exponential_type","mellin_imaginary_axis","physical_zero_of_mellin_zero","carrier_zero_of_mellin_zero"]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              m = re.search(r"'WeilDefect\.MasterRecon\.V09B\."+name+r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if f"'WeilDefect.MasterRecon.V09B.{name}' does not depend on any axioms" in s:
                      continue
                  raise SystemExit("Missing axiom audit: " + name)
              axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f"Unexpected axioms for {name}: {axioms - allowed}")
          print("V09B strict axiom audit PASS")
          PY
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-recon-v09b-lean
          path: v09b-lean.log
