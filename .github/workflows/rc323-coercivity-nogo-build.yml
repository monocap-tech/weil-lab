name: RC323 original signed coarse-floor obstruction
on:
  push:
    branches:
      - research/rpb108-rc323-coercivity-nogo
    paths:
      - "scripts/validate_rpb108_rc323_coercivity_nogo.py"
      - ".github/workflows/rc323-coercivity-nogo-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Certify signed P0/P2/P4 finite high original source and coarse-floor no-go
        run: |
          python scripts/validate_rpb108_rc323_coercivity_nogo.py --output certificates/rpb108_rc323_coercivity_nogo.json
          python scripts/validate_rpb108_rc323_coercivity_nogo.py --output certificates/rpb108_rc323_coercivity_nogo.json --replay
      - name: Freeze verified certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc323_coercivity_nogo.json
          if ! git diff --cached --quiet; then
            git commit -m "RC323: freeze signed high finite-subspace floor obstruction"
            git fetch origin research/rpb108-rc323-coercivity-nogo
            git rebase origin/research/rpb108-rc323-coercivity-nogo
            git push origin HEAD:research/rpb108-rc323-coercivity-nogo
          fi
