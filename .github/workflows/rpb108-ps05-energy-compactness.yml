name: RPB108 PS05 original edge energy-dual compactness

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps05_energy_dual_compactness.py"
      - "notes/RPB108_PS05_EDGE_ENERGY_DUAL_COMPACTNESS_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps05-energy-compactness.yml"
  workflow_dispatch:

jobs:
  ps05-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rational source-verified energy compactness and both parent replays
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps05_energy_dual_compactness.py
          python3 scripts/validate_rpb108_ps05_energy_dual_compactness.py
      - name: Canonical research obligation remains open
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(value is False for value in p["closures"].values())
          PY
