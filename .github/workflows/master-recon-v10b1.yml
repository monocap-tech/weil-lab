name: MASTER-RECON V10B1

on:
  push:
    branches: [master-recon-001-neutral-shell]
    paths:
      - "WeilDefect/MasterRecon/V10B1.lean"
      - ".github/workflows/master-recon-v10b1.yml"
  pull_request:
    paths:
      - "WeilDefect/MasterRecon/V10B1.lean"
      - ".github/workflows/master-recon-v10b1.yml"

permissions:
  contents: read

jobs:
  abstract-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile V10B1 and inspect axioms
        shell: bash
        run: |
          set -euo pipefail
          lake build WeilDefect.MasterRecon.V10A2
          lake env lean WeilDefect/MasterRecon/V10B1.lean 2>&1 | tee v10b1-lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path("v10b1-lean.log").read_text()
          names = ["ordered_oscillation","unit_eval_majorant","unit_eval_real","unit_eval_complex"]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              m = re.search(r"'WeilDefect\.MasterRecon\.V10B1\."+name+r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if f"'WeilDefect.MasterRecon.V10B1.{name}' does not depend on any axioms" in s:
                      continue
                  raise SystemExit("Missing axiom audit: " + name)
              axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f"Unexpected axioms for {name}: {axioms - allowed}")
          print("V10B1 strict axiom audit PASS")
          PY
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-recon-v10b1-lean
          path: v10b1-lean.log
