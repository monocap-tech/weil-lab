name: RC308 bounded regular and pole exact certificate
on:
  push:
    branches:
      - research/rpb108-rc308-bounded-arch-pole
    paths:
      - "scripts/validate_rpb108_rc308_bounded_arch_pole.py"
      - ".github/workflows/rc308-arch-pole-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited replay dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Exact original regular convolution and pole operator replay
        run: |
          python scripts/validate_rpb108_rc308_bounded_arch_pole.py --output certificates/rpb108_rc308_bounded_arch_pole.json
          python scripts/validate_rpb108_rc308_bounded_arch_pole.py --output certificates/rpb108_rc308_bounded_arch_pole.json --replay
      - name: Commit verified rational certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc308_bounded_arch_pole.json
          if ! git diff --cached --quiet; then
            git commit -m "RC308: freeze common bounded L2 archimedean-pole-prime contract"
            git pull --rebase origin research/rpb108-rc308-bounded-arch-pole
            git push origin HEAD:research/rpb108-rc308-bounded-arch-pole
          fi
