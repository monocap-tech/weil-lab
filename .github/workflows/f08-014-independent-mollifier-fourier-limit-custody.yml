name: F08-014 independent original-source mollifier Fourier pointwise limit custody
on:
  pull_request:
    paths:
      - 'verification/f08/f08_014/**'
      - '.github/workflows/f08-014-independent-mollifier-fourier-limit-custody.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-original-log-weight:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      F08_RUN: '45255052261'
      F08_ARTIFACT: '14858976919'
      F08_ARTIFACT_SHA: '3d12ddc1550d0c91b724834491abc8f4dd9b73bf49aae9727946c238f90ef2d4'
    steps:
      - uses: actions/checkout@v4
      - name: Source-only preflight and four negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile verification/f08/f08_014/f08_014_independent_fourier_limit_audit.py
          python3 verification/f08/f08_014/f08_014_independent_fourier_limit_audit.py --selftest
      - name: Independently validate actual producer Lean run and artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p f08-014-receipt
          python3 - <<'PY'
          import json,os,urllib.request
          root=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          head='3b5eab1b348b4139498c68928e18a4fc133e14be'
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers=hdr),timeout=30) as r:return json.load(r)
          run=get('/actions/runs/'+os.environ['F08_RUN'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==head and run['head_repository']['full_name']=='monocap-tech/weil-lab'
          assert run['name']=='F08-013 genuine physical shrinking mollifier Fourier -2pi pointwise limit Lean gate'
          jobs=get('/actions/runs/'+os.environ['F08_RUN']+'/jobs')
          assert any(j['conclusion']=='success' and any(
              s['name']=='Genuine pinned kernel build plus strict four-name axiom audit' and s['conclusion']=='success'
              for s in j['steps']) for j in jobs['jobs'])
          artifact=get('/actions/artifacts/'+os.environ['F08_ARTIFACT'])
          assert artifact['workflow_run']['id']==int(os.environ['F08_RUN'])
          assert artifact['name']=='f08-013-original-mollifier-fourier-limit-compiler-evidence'
          assert artifact['digest']=='sha256:'+os.environ['F08_ARTIFACT_SHA']
          assert artifact['size_in_bytes']>0 and not artifact['expired']
          with open('f08-014-receipt/source-producer.json','w') as f:json.dump(
              {'producer_commit_sha':head,'run_id':int(os.environ['F08_RUN']),'artifact_id':int(os.environ['F08_ARTIFACT']),
               'outer_zip_sha256':os.environ['F08_ARTIFACT_SHA'],'successful':True},f,sort_keys=True,indent=2)
          print('F08-014 independently confirmed successful pinned Lean source and artifact digest')
          PY
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$F08_ARTIFACT/zip" -o f08-014-receipt/f08-013-producer.zip
          echo "$F08_ARTIFACT_SHA  f08-014-receipt/f08-013-producer.zip" | sha256sum -c -
          python3 verification/f08/f08_014/f08_014_independent_fourier_limit_audit.py --archive f08-014-receipt/f08-013-producer.zip --out f08-014-receipt/f08-014-original-independent-axiom-audit.json
      - name: Archive independent source-only custody
        uses: actions/upload-artifact@v4
        with:
          name: f08-014-original-mollifier-fourier-limit-independent-source-audit
          path: |
            f08-014-receipt/source-producer.json
            f08-014-receipt/f08-014-original-independent-axiom-audit.json
          if-no-files-found: error
