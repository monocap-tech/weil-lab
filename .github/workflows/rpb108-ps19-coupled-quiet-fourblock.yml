name: RPB108 PS19 four-window true signed complementary Schur with n2

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps19_coupled_quiet_fourblock.py"
      - "notes/RPB108_PS19_COUPLED_QUIET_FOURBLOCK_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps19-coupled-quiet-fourblock.yml"
  workflow_dispatch:

jobs:
  ps19-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full original signed source replay and four-window Schur
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps19_coupled_quiet_fourblock.py
          python3 scripts/validate_rpb108_ps19_coupled_quiet_fourblock.py
      - name: Reject false global Schur and RH promotion
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(flag is False for flag in p["closures"].values())
          PY
