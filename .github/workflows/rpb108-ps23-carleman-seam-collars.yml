name: RPB108 PS23 original signed noncompact Carleman seam absorption

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps23_carleman_seam_collars.py"
      - "notes/RPB108_PS23_CARLEMAN_SEAM_COLLARS_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps23-carleman-seam-collars.yml"
  workflow_dispatch:

jobs:
  ps23-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full original signed source replay plus genuine Carleman seam Schur test
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps23_carleman_seam_collars.py
          python3 scripts/validate_rpb108_ps23_carleman_seam_collars.py
      - name: Preserve W-ODD-NEG and whole residual OPEN custody
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(flag is False for flag in p["closures"].values())
          PY
