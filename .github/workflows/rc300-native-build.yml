name: RC300 native P8 high projection generator
on:
  push:
    branches:
      - research/rpb108-rc300-p8-projection
    paths:
      - "scripts/validate_rpb108_rc300_native_p8_high_projection.py"
      - ".github/workflows/rc300-native-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact inherited dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Produce and replay P8 original high-output certificate
        run: |
          python scripts/validate_rpb108_rc300_native_p8_high_projection.py --output certificates/rpb108_rc300_native_p8_high_projection.json
          python scripts/validate_rpb108_rc300_native_p8_high_projection.py --output certificates/rpb108_rc300_native_p8_high_projection.json --replay
      - name: Commit generated certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc300_native_p8_high_projection.json
          if ! git diff --cached --quiet; then
            git commit -m "RC300: freeze complete exact P8 high-output certificate"
            git push origin HEAD:research/rpb108-rc300-p8-projection
          fi
