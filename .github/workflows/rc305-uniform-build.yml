name: RC305 signed-uniform analytic suboperator bounds
on:
  push:
    branches:
      - research/rpb108-rc305-signed-uniform-tail
    paths:
      - "scripts/validate_rpb108_rc305_signed_uniform_tail.py"
      - ".github/workflows/rc305-uniform-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inherited exact validator dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Generate and replay signed-uniform exact suboperator bounds
        run: |
          python scripts/validate_rpb108_rc305_signed_uniform_tail.py --output certificates/rpb108_rc305_signed_uniform_tail.json
          python scripts/validate_rpb108_rc305_signed_uniform_tail.py --output certificates/rpb108_rc305_signed_uniform_tail.json --replay
      - name: Commit generated exact certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc305_signed_uniform_tail.json
          if ! git diff --cached --quiet; then
            git commit -m "RC305: freeze sign-robust degree-indexed suboperator certificate"
            git pull --rebase origin research/rpb108-rc305-signed-uniform-tail
            git push origin HEAD:research/rpb108-rc305-signed-uniform-tail
          fi
