        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact SI10 469-source arch Laplace signed outward partial
        run: |
          python -m py_compile scripts/validate_rpb108_ef26_original_even_arch_laplace.py
          python scripts/validate_rpb108_ef26_original_even_arch_laplace.py
      - name: Original canonical obligation governance
        run: python scripts/verify_obligation_manifest.py
