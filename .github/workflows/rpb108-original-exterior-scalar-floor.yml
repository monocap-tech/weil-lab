name: Actual exterior coupling probes and scalar floor method stop

on:
  push:
    paths:
      - scripts/verify_rpb108_original_exterior_scalar_floor.py
      - scripts/verify_rpb108_original_exterior_scalar_floor_replay.py
      - .github/workflows/rpb108-original-exterior-scalar-floor.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bounded-actual-exterior-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged open obligation
        run: python scripts/verify_obligation_manifest.py
      - name: Verify accepted original rank custody and THIRTEEN exact JSONs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:return json.load(r)
          run=get('/actions/runs/40594831624')
          source='43a2c9e0053a51e9b2a7d9686cdda6724611d016'
          digest='89dca44de17d67862c58c1eb9b9bd0ea83dfa3bf7a74730cbbb3f9509052c006'
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
          artifact=get('/actions/artifacts/12776295683')
          assert artifact['name']=='original-selected-signed-matrix' and artifact['expired'] is False
          assert artifact['workflow_run']['id']==40594831624 and artifact['workflow_run']['head_sha']==source
          assert artifact['digest']=='sha256:'+digest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(base+'/actions/artifacts/12776295683/zip',headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # Never forward GitHub authorization to blob storage.
              with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==digest
          archive=zipfile.ZipFile(io.BytesIO(data));Path('artifacts').mkdir(exist_ok=True)
          for filename,sha in [
            ('original_selected_signed_matrix.json','33b52b01e813982bd1a73b9bb81b0ca79f76e4bfd5af0821c4e13b4360bb40fa'),
            ('original_selected_signed_matrix_validation.json','d6fe8bf60a340691d07b63d2f8d30de383015c483238c76cc5b12240eaa3d568'),
            ('original_selected_signed_split_candidates.json','983b23eecc8b304c0b86827d4397e9a6783b94c6dd3d3e4b5a8d9d5707764bf8'),
            ('original_signed_joint_frame_budget.json','eececa96d8db2ab1625c79bf3a13d2ce14d2de97c921c9dec967834281f16e90'),
            ('original_signed_refined_critical_block.json','d6e18f252ad1ce417d6d40ed96e7f2cef96c41884c2187a74d9a60d8189bf5ef'),
            ('original_signed_frame_transport.json','e78c29dc930274e5522c665d073044a6de6ac1fee832cac65c13128f57fe80d4'),
            ('original_signed_critical_mixed_block.json','2cb869033f2c6722d356e769f35fc0e1b041ae46a8c11360e66cd7d2c694c548'),
            ('original_signed_kernel_validation.json','6d65f5f3d2338fb98d7f6397f4bcacd6e0c6bb0acb669b918c1fdf08e5e9bd4c'),
            ('original_BS_pruned_rank_bound.json','9b9820a0163e5e8bf08dd1c2525c757ff67214b49a40cb093d00bc611c9ff9e2'),
            ('original_four_mode_critical_block.json','a84b19c1fefc4e680c5c19ea643bbe5badce639374cb0a424211ee980020f922'),
            ('si29_full_J_L2_normalization.json','c9ee487f8abe7b633c47d2ef7d72e2cc4f7289bc794b2d8fc02bb61520b25e60'),
            ('sm40_original_envelope_method_stop.json','19af532b6bbd4a808854696b2a993e7ebd966e04da27fdd5f55e8b736668770b'),
            ('original_BS_infinite_tail_upper.json','931e5c64db19b28201ce96958495a8bfd8337eb7ebe08096466d86db29a1f801')]:
              raw=archive.read(filename);assert hashlib.sha256(raw).hexdigest()==sha
              Path('artifacts',filename).write_bytes(raw)
          print('Accepted run/source/artifact/archive and THIRTEEN matched JSONs PASS')
          PY
      - name: Replay accepted original reduced rank and complete leakage
        run: python scripts/verify_rpb108_original_BS_pruned_rank_replay.py artifacts/original_BS_pruned_rank_bound.json artifacts/si29_full_J_L2_normalization.json artifacts/sm40_original_envelope_method_stop.json artifacts/original_BS_infinite_tail_upper.json
      - name: Install pinned native arithmetic
        run: python -m pip install python-flint==0.8.0
      - name: Replay accepted signed block and independent validation
        run: python scripts/verify_rpb108_original_signed_critical_mixed_replay.py artifacts/original_signed_critical_mixed_block.json artifacts/original_signed_kernel_validation.json artifacts/original_BS_pruned_rank_bound.json artifacts/original_four_mode_critical_block.json
      - name: Replay accepted joint one-sided frame budget
        run: python scripts/verify_rpb108_original_signed_joint_frame_budget_replay.py artifacts/original_signed_joint_frame_budget.json artifacts/original_signed_refined_critical_block.json artifacts/original_signed_frame_transport.json artifacts/original_signed_critical_mixed_block.json artifacts/original_BS_pruned_rank_bound.json artifacts/original_four_mode_critical_block.json
      - name: Replay accepted complete signed matrix and finite Schur
        run: python scripts/verify_rpb108_original_selected_signed_matrix_replay.py artifacts/original_selected_signed_matrix.json artifacts/original_selected_signed_matrix_validation.json artifacts/original_signed_frame_transport.json artifacts/original_BS_pruned_rank_bound.json artifacts/original_signed_joint_frame_budget.json artifacts/original_signed_critical_mixed_block.json artifacts/original_selected_signed_split_candidates.json
      - name: Refine only the existing critical mixed block at the joint full precision
        run: python scripts/verify_rpb108_original_signed_critical_mixed_block.py --rank artifacts/original_BS_pruned_rank_bound.json --critical artifacts/original_four_mode_critical_block.json --precision 3072 --laplace-terms 384 --output artifacts/original_exterior_refined_mixed.json
      - name: Exact physical residual projection and actual exterior coupling diagnostic
        run: python scripts/verify_rpb108_original_exterior_scalar_floor.py --matrix artifacts/original_selected_signed_matrix.json --frame artifacts/original_signed_frame_transport.json --rank artifacts/original_BS_pruned_rank_bound.json --critical artifacts/original_four_mode_critical_block.json --mixed artifacts/original_exterior_refined_mixed.json --output artifacts/original_exterior_scalar_floor_stop.json
      - name: Independent rational variational and finite inverse-action replay
        run: python scripts/verify_rpb108_original_exterior_scalar_floor_replay.py artifacts/original_exterior_scalar_floor_stop.json artifacts/original_selected_signed_matrix.json artifacts/original_signed_frame_transport.json artifacts/original_BS_pruned_rank_bound.json artifacts/original_four_mode_critical_block.json artifacts/original_exterior_refined_mixed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-exterior-scalar-floor-stop
          path: artifacts/*.json
          if-no-files-found: error
