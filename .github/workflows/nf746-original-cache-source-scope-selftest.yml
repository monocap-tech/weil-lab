name: NF746 original accepted NF703 cache source-scope recovery self-tests
on:
  pull_request:
    paths:
      - "scripts/nf743_reuse_accepted_original_nf703_cache.py"
      - "scripts/nf743_original_indexzero_056_063_cached_kernel.py"
      - "scripts/nf746_original_cache_source_scope_selftest.py"
      - "docs/NF746_ORIGINAL_CACHE_REPAIR_AND_NEW_KERNEL_SUCCESSES.md"
      - ".github/workflows/nf746-original-cache-source-scope-selftest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-scope-tests-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repaired source-verifier and execute eight fail-closed synthetic cache-only equivalence tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/nf743_reuse_accepted_original_nf703_cache.py scripts/nf743_original_indexzero_056_063_cached_kernel.py scripts/nf746_original_cache_source_scope_selftest.py
          python scripts/nf746_original_cache_source_scope_selftest.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("nf746-original-cache-source-scope-selftest.json").read_text())
          assert len(m["passed_cases"])==8
          assert m["real_original_NF728_NF737_artifact_compared"] is False
          assert m["real_original_numerical_Lean_kernel_checked"] is False
          assert m["global_Weil_positivity_proved"] is False
          assert m["RH_proved"] is False
          print("NF746 eight synthetic tests passed; no real source or numerical Lean kernel theorem promoted")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf746-original-cache-source-scope-selftest-receipt
          path: nf746-original-cache-source-scope-selftest.json
          if-no-files-found: ignore
