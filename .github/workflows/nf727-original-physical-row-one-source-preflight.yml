name: NF727 source-bound original HD/A complete index-one Lean proof preparation preflight
on:
  pull_request:
    paths:
      - ".github/workflows/nf727-original-physical-row-one-source-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf727-exact-original-source-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source-reconstruction-only:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate immutable NF702 complete original scaled input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nf723-receipts/{input,cache-proposals,cache-audit,packed-proposals,packed-audit}
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14582437652/zip" -o nf723-original-input.zip
          echo "258637da71e96468ed7c6ac5b0a4480ce06cdee9989aef8e71a4cd09059789e0  nf723-original-input.zip" | sha256sum -c -
          unzip -q nf723-original-input.zip -d nf723-receipts/input
      - name: Restore accepted nf703-original-cache-proposals
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-proposals
          path: nf723-receipts/cache-proposals
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf703-original-cache-audit
        uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-audit
          path: nf723-receipts/cache-audit
          run-id: 44627666710
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf700-packed-matrix-proposals
        uses: actions/download-artifact@v4
        with:
          name: nf700-packed-matrix-proposals
          path: nf723-receipts/packed-proposals
          run-id: 44623902055
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf700-complete-packed-matrix-audit
        uses: actions/download-artifact@v4
        with:
          name: nf700-complete-packed-matrix-audit
          path: nf723-receipts/packed-audit
          run-id: 44623902055
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require completed upstream kernel runs and exact immutable audit artifact IDs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          api=lambda p:json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{p}'],text=True))
          expected=json.loads('{"44660635800":{"nf715-first-second-global-matrix-row-certificates":14597076473},"44664511419":{"nf716-second-original-global-matrix-row-continuation":14599006475},"44679426067":{"nf717-independent-original-global-matrix-row-attachment":14605916738},"44665952640":{"nf718-source-bound-8-12":14599636962,"nf718-source-bound-12-16":14600315333,"nf718-complete-original-global-matrix-row-one-64-coordinate-audit":14600591151},"44666765580":{"nf719-source-bound-16-20":14599913564,"nf719-source-bound-20-24":14600668002,"nf719-complete-original-global-matrix-row-one-64-coordinate-audit":14599649777},"44670251345":{"nf720-source-bound-24-28":14602630283,"nf720-source-bound-28-31":14601806691},"44679385691":{"nf720-recovered-complete-final-50-original-global-matrix-audit":14603193591},"44685250801":{"nf721-accepted-original-row-one-source-specific-inventory":14606522853}}')
          for run,exp in expected.items():
            obj=api(f'actions/runs/{run}')
            if run=='44670251345':
              jobs=api(f'actions/runs/{run}/jobs?per_page=100')['jobs']
              good={j['name'] for j in jobs if j['conclusion']=='success'}
              assert {'Original global row-one remaining blocks 24–28','Original global row-one remaining blocks 28–31'}<=good,run
            else:
              assert obj['status']=='completed' and obj['conclusion']=='success',(run,obj['conclusion'])
            arts=api(f'actions/runs/{run}/artifacts?per_page=100')['artifacts']
            got={a['name']:a['id'] for a in arts if a['name'] in exp and not a['expired']}
            assert got==exp,(run,got,exp)
          print('NF723 all previously accepted original source-specific product theorem and aggregate artifacts authenticated')
          PY
      - name: Restore accepted nf715-first-second-global-matrix-row-certificates
        uses: actions/download-artifact@v4
        with:
          name: nf715-first-second-global-matrix-row-certificates
          path: nf723-accepted/nf715
          run-id: 44660635800
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf716-second-original-global-matrix-row-continuation
        uses: actions/download-artifact@v4
        with:
          name: nf716-second-original-global-matrix-row-continuation
          path: nf723-accepted/nf716
          run-id: 44664511419
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf717-independent-original-global-matrix-row-attachment
        uses: actions/download-artifact@v4
        with:
          name: nf717-independent-original-global-matrix-row-attachment
          path: nf723-accepted/nf717
          run-id: 44679426067
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf718-source-bound-8-12
        uses: actions/download-artifact@v4
        with:
          name: nf718-source-bound-8-12
          path: nf723-accepted/nf718-a
          run-id: 44665952640
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf718-source-bound-12-16
        uses: actions/download-artifact@v4
        with:
          name: nf718-source-bound-12-16
          path: nf723-accepted/nf718-b
          run-id: 44665952640
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf719-source-bound-16-20
        uses: actions/download-artifact@v4
        with:
          name: nf719-source-bound-16-20
          path: nf723-accepted/nf719-a
          run-id: 44666765580
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf719-source-bound-20-24
        uses: actions/download-artifact@v4
        with:
          name: nf719-source-bound-20-24
          path: nf723-accepted/nf719-b
          run-id: 44666765580
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf720-source-bound-24-28
        uses: actions/download-artifact@v4
        with:
          name: nf720-source-bound-24-28
          path: nf723-accepted/nf720-a
          run-id: 44670251345
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf720-source-bound-28-31
        uses: actions/download-artifact@v4
        with:
          name: nf720-source-bound-28-31
          path: nf723-accepted/nf720-b
          run-id: 44670251345
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf718-complete-original-global-matrix-row-one-64-coordinate-audit
        uses: actions/download-artifact@v4
        with:
          name: nf718-complete-original-global-matrix-row-one-64-coordinate-audit
          path: nf723-aggregates/nf718
          run-id: 44665952640
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf719-complete-original-global-matrix-row-one-64-coordinate-audit
        uses: actions/download-artifact@v4
        with:
          name: nf719-complete-original-global-matrix-row-one-64-coordinate-audit
          path: nf723-aggregates/nf719
          run-id: 44666765580
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore accepted nf720-recovered-complete-final-50-original-global-matrix-audit
        uses: actions/download-artifact@v4
        with:
          name: nf720-recovered-complete-final-50-original-global-matrix-audit
          path: nf723-aggregates/nf720
          run-id: 44679385691
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore independently accepted NF721 210-coordinate original proof inventory
        uses: actions/download-artifact@v4
        with:
          name: nf721-accepted-original-row-one-source-specific-inventory
          path: nf723-accepted-ledger
          run-id: 44685250801
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate original NF702/NF703/NF700 source and reconcile every accepted stage
        run: |
          set -euo pipefail
          python -m py_compile scripts/nf715_second_global_matrix_row_driver.py scripts/nf723_original_full_row_one_driver.py
          python scripts/nf715_second_global_matrix_row_driver.py prepare --receipts nf723-receipts --output WeilDefect/Generated/NF715 2>&1 | tee nf723-source-reconstruction.log
          python scripts/nf723_original_full_row_one_driver.py prepare 2>&1 | tee nf723-accepted-source-binding.log
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('WeilDefect/Generated/NF723/manifest.json').read_text())
          assert m['accepted_prior_theorem_declarations']==252
          assert m['accepted_original_coordinate_pairs']==242
          assert sum(len(r['theorems']) for r in m['accepted_stages'])==252
          assert len(m['accepted_stages'])==9
          assert m['new_universal_theorems']==['nf723OriginalHDRowOneAll','nf723OriginalAColumnOneAll']
          print('NF723 31 accepted source-specific blocks and two actual global row theorem candidates reconciled')
          PY
      - name: Audit actual original source-specific 31-block Lean theorem candidate imports and original 484 gate names
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF723')
          m=json.loads((d/'manifest.json').read_text())
          src=(d/'OriginalRowOne.lean').read_text()
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(d/'OriginalRowOne.lean')==m['new_source_sha256']
          assert m['accepted_prior_theorem_declarations']==252
          assert m['accepted_original_coordinate_pairs']==242
          assert len(m['accepted_stages'])==9
          assert m['nf717_newly_closed_coordinate_interval']==[32,64]
          assert m['new_universal_theorems']==['nf723OriginalHDRowOneAll','nf723OriginalAColumnOneAll']
          assert 'theorem nf723OriginalHDRowOneAll' in src
          assert 'theorem nf723OriginalAColumnOneAll' in src
          assert len(re.findall(r'^import WeilDefect.Generated.NF7[0-9]+.Block[0-9]{3}$',src,re.M))==31
          assert len(re.findall(r'^    nf7[0-9]+Block[0-9]{3}GlobalHD$',src,re.M))==31
          assert len(re.findall(r'^    nf7[0-9]+Block[0-9]{3}GlobalA$',src,re.M))==31
          assert all(x['source_files'] for x in m['accepted_stages'])
          assert not any(tok in src for tok in ('sorry','admit'))
          print('NF727 authentic original 31 index-one packed certificate source files and two full-row Lean theorem candidates: SOURCE-BOUND PREPARE PASS; new complete row proof KERNEL PENDING')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf727-exact-original-31-block-source-only-HD-A-attachment-preflight
          path: |
            nf723-source-reconstruction.log
            nf723-accepted-source-binding.log
            nf723-binding.json
            WeilDefect/Generated/NF723/
          if-no-files-found: ignore
