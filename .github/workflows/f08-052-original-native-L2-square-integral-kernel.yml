name: F08-052 original native L2 squared norm integral identity kernel
on:
  pull_request:
    paths:
      - 'verification/f08/f08_052/**'
      - '.github/workflows/f08-052-original-native-L2-square-integral-kernel.yml'
permissions:
  contents: read
jobs:
  native-original-L2-square-integral:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout frozen original IV023 research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Pin original domain and exact F08-030 predecessor plus pointwise candidate
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C candidate hash-object verification/f08/f08_027/F08NativeFrequencyScalingMeasure.lean)" = eecfe2a849fa79aa13810ede85e9ba625eba7777
          test "$(git -C candidate hash-object verification/f08/f08_029/F08NativeL2PushforwardNorm.lean)" = 4da65f9b9df7cae6ea30a4a7f25d3e6c1606c294
          test "$(git -C candidate hash-object verification/f08/f08_030/F08NativeFrequencyDilation.lean)" = 5c260b69f464f5793e095f9b5448c90f7984617f
          test "$(git -C candidate hash-object verification/f08/f08_052/F08OriginalNativeL2SquareIntegral.lean)" = 16a7053b3a1ea6f0e0f91a89de6e40a91987cd92
          for x in f08_027/F08NativeFrequencyScalingMeasure.lean f08_029/F08NativeL2PushforwardNorm.lean f08_030/F08NativeFrequencyDilation.lean f08_052/F08OriginalNativeL2SquareIntegral.lean; do
            ! grep -Eq '\b(sorry|admit|unsafe)\b' "candidate/verification/f08/$x"
          done
          mkdir -p research/WeilDefect/Generated/F08
          cp candidate/verification/f08/f08_027/F08NativeFrequencyScalingMeasure.lean research/WeilDefect/Generated/F08/NativeFrequencyScalingMeasure.lean
          cp candidate/verification/f08/f08_029/F08NativeL2PushforwardNorm.lean research/WeilDefect/Generated/F08/NativeL2PushforwardNorm.lean
          cp candidate/verification/f08/f08_030/F08NativeFrequencyDilation.lean research/WeilDefect/Generated/F08/NativeFrequencyDilation.lean
          cp candidate/verification/f08/f08_052/F08OriginalNativeL2SquareIntegral.lean research/WeilDefect/Generated/F08/OriginalNativeL2SquareIntegral.lean
      - name: Install original frozen Lean 4.34.0 and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Build original native norm identities and two exact axiom reports
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.OriginalNativeL2SquareIntegral 2>&1 | tee f08-052-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.OriginalNativeL2SquareIntegral' '#print axioms WeilDefect.f08_052_originalL2_norm_sq_eq_integral' '#print axioms WeilDefect.f08_052_originalSchwartz_nativeDifference_norm_sq' > /tmp/f08-052-axioms.lean
          lake env lean /tmp/f08-052-axioms.lean 2>&1 | tee f08-052-axioms.log
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('f08-052-axioms.log').read_text()
          pattern=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]|'WeilDefect\.(\w+)' does not depend on any axioms"
          matches=list(re.finditer(pattern,s,re.S))
          assert len(matches)==2,('expected exactly two source theorems',s)
          assert not re.sub(pattern,'',s,flags=re.S).strip(),('extra original Lean output',s)
          assert {m[1] or m[3] for m in matches}=={'f08_052_originalL2_norm_sq_eq_integral','f08_052_originalSchwartz_nativeDifference_norm_sq'}
          for m in matches:
              axs={x.strip() for x in (m[2] or '').split(',') if x.strip()}
              assert axs <= {'propext','Classical.choice','Quot.sound'},('nonstandard axiom',axs)
          print('F08-052 original native L2 norm identities 2/2 standard-only axioms PASS')
          PY
      - name: Archive entire real original source/compiler/axiom artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-052-original-native-L2-square-integral-compiler-evidence
          path: |
            research/f08-052-build.log
            research/f08-052-axioms.log
            research/WeilDefect/Generated/F08/NativeFrequencyScalingMeasure.lean
            research/WeilDefect/Generated/F08/NativeL2PushforwardNorm.lean
            research/WeilDefect/Generated/F08/NativeFrequencyDilation.lean
            research/WeilDefect/Generated/F08/OriginalNativeL2SquareIntegral.lean
          if-no-files-found: ignore
