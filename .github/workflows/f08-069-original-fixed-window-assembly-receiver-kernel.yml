name: F08-069 original fixed window assembly receiver kernel
on:
  pull_request:
    paths:
      - 'verification/f08/f08_069/**'
      - '.github/workflows/f08-069-original-fixed-window-assembly-receiver-kernel.yml'
permissions:
  contents: read
jobs:
  genuine-original-L2-continuity-dense-transfer:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout frozen original IV023 research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Pin original research, actual predecessors and candidate theorem
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralLogFormGraph.lean)" = 6a25651c2c54d7ff9e4d20d4b410b56b7d5047a3
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralLogHilbertCarrier.lean)" = 679d58b8f0cfa6b4f7d28c48ce844a41cdce2844
          mkdir -p research/WeilDefect/Generated/F08
          test "$(git -C candidate hash-object verification/f08/f08_069/F08OriginalFixedWindowAssemblyReceiver.lean)" = b8f15156f6fa2b45b934517e5277527aab074406
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_069/F08OriginalFixedWindowAssemblyReceiver.lean
          cp candidate/verification/f08/f08_069/F08OriginalFixedWindowAssemblyReceiver.lean research/WeilDefect/Generated/F08/OriginalFixedWindowAssemblyReceiver.lean
      - name: Install original frozen Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile original fixed window assembly receiver and strict named axioms
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.OriginalFixedWindowAssemblyReceiver 2>&1 | tee f08-069-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.OriginalFixedWindowAssemblyReceiver' '#print axioms WeilDefect.f08_069_strictInward_exists_of_tendsto' '#print axioms WeilDefect.f08_069_eventualCollar_choice' '#print axioms WeilDefect.f08_069_canonicalDomain_mono' '#print axioms WeilDefect.f08_069_canonicalWiden_weighted_eq' '#print axioms WeilDefect.f08_069_strictCollar_subset' > /tmp/f08-069-axioms.lean
          lake env lean /tmp/f08-069-axioms.lean 2>&1 | tee f08-069-axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('f08-069-axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==5,('five declarations required',s)
          assert not re.sub(p,'',s,flags=re.S).strip(),('unrecognized compiler output',s)
          assert {m[1] for m in ms}=={'f08_069_strictInward_exists_of_tendsto','f08_069_eventualCollar_choice','f08_069_canonicalDomain_mono','f08_069_canonicalWiden_weighted_eq','f08_069_strictCollar_subset'}
          for m in ms:
              a={x.strip() for x in m[2].split(',') if x.strip()}
              assert a <= {'propext','Classical.choice','Quot.sound'},('nonstandard axioms',a)
          print('F08-069 fixed window assembly receiver: 5/5 standard-only axioms PASS')
          PY
      - name: Archive complete exact original source and actual Lean compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-069-original-fixed-window-assembly-receiver-compiler-evidence
          path: |
            research/f08-069-build.log
            research/f08-069-axioms.log
            research/WeilDefect/Generated/F08/OriginalFixedWindowAssemblyReceiver.lean
          if-no-files-found: ignore
