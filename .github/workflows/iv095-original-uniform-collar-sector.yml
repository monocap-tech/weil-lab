permissions:
  contents: read

concurrency:
  group: iv095-original-uniform-sector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-uniform-collar-sector-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Strict IV095 original-source preflight
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("WeilDefect/Arithmetic/ActualZetaIV095OriginalUniformCollarSectorGate.lean").read_text()
          names=[
              "neutralIV095DiagonalTail_data",
              "neutralIV095TailProfile_sum_le",
              "neutralIV095DiagonalTail_sum_le",
              "neutralIV095DiagonalTailTrace_eventual",
              "neutralIV095OriginalCollarSpan_uniform_finite_margin",
              "neutralIV095OriginalCollarRay_uniform_finite_margin",
              "neutralIV095ExistsOriginalCollarRay",
          ]
          assert all(s.count("#print axioms "+n)==1 for n in names)
          assert not re.search(r"\b(?:sorry|admit|sorryAx)\b",s)
          print("IV095 strict preflight: seven exact original-source bridge declarations")
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          lake exe cache get
      - name: Native fresh Lean source build
        run: |
          set -euo pipefail
          mkdir -p iv095/out
          touch iv095/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV095OriginalUniformCollarSectorGate.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV095OriginalUniformCollarSectorGate 2>&1 | tee iv095/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV095OriginalUniformCollarSectorGate.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV095OriginalUniformCollarSectorGate.olean -nt iv095/out/fresh.stamp
      - name: Exact strict named axiom audit
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaIV095OriginalUniformCollarSectorGate.lean 2>&1 | tee iv095/out/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          t=Path("iv095/out/axioms.log").read_text()
          names=[
              "neutralIV095DiagonalTail_data",
              "neutralIV095TailProfile_sum_le",
              "neutralIV095DiagonalTail_sum_le",
              "neutralIV095DiagonalTailTrace_eventual",
              "neutralIV095OriginalCollarSpan_uniform_finite_margin",
              "neutralIV095OriginalCollarRay_uniform_finite_margin",
              "neutralIV095ExistsOriginalCollarRay",
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          found={}
          for name in names:
              full="WeilDefect."+name
              pat=re.compile(r"^'"+re.escape(full)+r"' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)\s*$",re.M)
              hits=list(pat.finditer(t))
              assert len(hits)==1, (full,len(hits),t[-1200:])
              axioms=({a.strip() for a in hits[0].group(1).split(",") if a.strip()}
                      if hits[0].group(1) is not None else set())
              assert axioms<=allowed,(full,axioms-allowed)
              found[full]=sorted(axioms)
          assert not re.search(r'(?m)^\s*(?:error:|.*: error:)',t)
          Path("iv095/out/receipts.json").write_text(json.dumps(found,sort_keys=True,indent=2)+"\n")
          print("IV095 seven strict source/axiom receipts PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv095-original-uniform-collar-sector-native-lean-receipts
          path: |
            iv095/out/
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV095OriginalUniformCollarSectorGate.olean
          if-no-files-found: ignore
          include-hidden-files: true
