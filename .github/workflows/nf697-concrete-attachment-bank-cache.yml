name: NF697 concrete original slot attachment and reusable compiled bank pilot
on:
  pull_request:
    paths:
      - "scripts/nf697_compiled_bank_binding.py"
      - ".github/workflows/nf697-concrete-attachment-bank-cache.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf697-concrete-bank-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Bind exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - name: Verify structural shape and block-local exact lookup transport
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup 2>&1 | tee nf691-generic.log
      - name: Compile all original numeric payload chunks in bounded batches
        timeout-minutes: 205
        run: |
          set -euo pipefail
          : > nf691-completed-chunks.txt
          : > nf691-chunk-times.txt
          for ((first=0;first<490;first+=4)); do
            targets=()
            ids=()
            for ((i=first;i<first+4 && i<490;i++)); do
              printf -v n '%03d' "$i"
              targets+=("WeilDefect.Generated.NF690.Chunk$n")
              ids+=("$n")
            done
            echo "CHUNKS ${ids[*]}" | tee -a nf691-chunk-times.txt
            /usr/bin/time -a -o nf691-chunk-times.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build "${targets[@]}" 2>&1 | tee -a nf691-chunks.log
            printf '%s\n' "${ids[@]}" >> nf691-completed-chunks.txt
          done
      - name: Compile the complete actual bank, all source coverage and concrete lookup equality
        timeout-minutes: 70
        run: |
          set -euo pipefail
          lake build WeilDefect.Generated.NF690.Bank 2>&1 | tee nf691-bank.log
          for ((i=0;i<68;i++)); do
            printf -v group '%02d' "$i"
            lake build "WeilDefect.Generated.NF687.Group$group" 2>&1 | tee -a nf691-coverage.log
          done
          lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf691-aggregate.log
      - name: Audit actual original bank coverage and lookup with standard axioms only
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          names=['neutralNF690FitRows_eq','neutralNF690Bank_size','neutralNF690Bank_read','neutralNF690Bank_shape',
                 'neutralNF690Bank_index','neutralNF691Read_eq','neutralNF691Lookup_eq','nf687CoverageOnBank',
                 'nf690OriginalBank_size','nf690OriginalBank_shape','nf690OriginalBank_index',
                 'nf690OriginalCoverage','nf691OriginalLookup_eq','nf691OriginalCoverage']
          Path('/tmp/nf691Audit.lean').write_text('import WeilDefect.Generated.NF691.OriginalLookup\n'+''.join(f'#print axioms WeilDefect.{n}\n' for n in names))
          Path('nf691-names.txt').write_text('\n'.join(names)+'\n')
          PY
          lake env lean /tmp/nf691Audit.lean 2>&1 | tee nf691-axioms.log
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((root/'NF690/manifest.json').read_text())
          names=set(Path('nf691-names.txt').read_text().splitlines())
          found={}
          s=Path('nf691-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",s):
              if n in names:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",s):
              if n in names:
                  assert n not in found
                  found[n]=[]
          assert set(found)==names and len(found)==14,(len(found),len(names))
          assert all(set(x)<={'propext','Classical.choice','Quot.sound'} for x in found.values())
          assert Path('nf691-completed-chunks.txt').read_text().splitlines()==[f'{i:03d}' for i in range(490)]
          for f in m['files']:
              assert sha(root/'NF690'/f['file'])==f['sha256']
          Path('nf691-complete-audit.json').write_text(json.dumps({
              'schema':'NF691-full-shaped-bank-coverage-audit-v1','keys':7835,'rows':37994,'chunks':490,
              'payload_manifest_sha256':sha(root/'NF690/manifest.json'),
              'compact_manifest_sha256':sha(root/'NF687/manifest.json'),
              'lookup_source_sha256':sha(root/'NF691/OriginalLookup.lean'),
              'theorems':found,
              'scope':'Concrete complete original bank shape, original coverage Boolean and exact block-local numeric lookup equality. No assertion of complete mathematical moment validity or full table identity to other sources.'
          },indent=2)+'\n')
          print('NF691 complete actual original shaped bank and exact original coverage: LEAN PASS')
          PY
      - name: Package audited project build and binding for independent runner
        run: |
          set -euo pipefail
          tar -czf nf697-project-build.tar.gz .lake/build
          sha256sum nf697-project-build.tar.gz > nf697-project-build.sha256
          du -h nf697-project-build.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          compression-level: 0
          path: |
            nf697-project-build.tar.gz
            nf697-project-build.sha256
            nf697-bank-binding.json
            nf691-complete-audit.json
            nf691-axioms.log
            nf691-chunk-times.txt
          if-no-files-found: error
  consume:
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          cmp nf697-bank-binding.json compiled-bank/nf697-bank-binding.json
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - name: Restore accepted NF692 local receipts and exact concrete proposals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fetch() {
            local id="$1" name="$2" digest="$3"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            mkdir -p "$name"
            unzip -q "$name.zip" -d "$name"
          }
          fetch 14560118454 local-proposals b7209e4fee4d9309cf86f2551f57f2ff0fe75f47931e8c3dd721a42c3e2ec7b2
          fetch 14563383750 accepted-684 7a3ae63a653e8a76567287999646a88d8722dc114eb5b96e6d8325d2fdc45b42
          fetch 14565145682 accepted-685 6cbe5822b35a5a5560a4f5ee0fef94293d3c7cc8a260946473bccfde1ffa384a
          python - <<'PY'
          import hashlib,json,re,shutil
          from pathlib import Path
          src=Path('local-proposals')
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((src/'NF692/manifest.json').read_text())
          assert m['bank_manifest_sha256']==sha(root/'NF690/manifest.json')
          assert (m['tables'],m['rows'])==(271,2124)
          assert len({r['index'] for r in m['records']})==271
          for name in ('NF632','NF684','NF685','NF686','NF689','NF687','NF692'):
              d=src/name
              for f in json.loads((d/'manifest.json').read_text())['files']:
                  assert sha(d/f['file'])==f['sha256']
          records=[r for r in m['records'] if r['shard'] in {'684','685'}]
          assert (len(records),sum(r['rows'] for r in records))==(92,601)
          for shard in ('684','685'):
              paths=list(Path('accepted-'+shard).rglob('nf692-audit.json'))
              assert len(paths)==1
              a=json.loads(paths[0].read_text())
              assert a['shard']==shard and a['manifest_sha256']==sha(src/'NF692/manifest.json')
              expected=[r for r in records if r['shard']==shard]
              assert a['records']==expected
              assert set(a['theorems'])=={'nf692'+r['module']+s for r in expected for s in ('Key','Length','RowsEq','Sound')}
              assert all(set(x)<={'propext','Classical.choice','Quot.sound'} for x in a['theorems'].values())
          for p in src.rglob('*'):
              if not p.is_file(): continue
              q=root/p.relative_to(src)
              q.parent.mkdir(parents=True,exist_ok=True)
              if q.exists(): assert p.read_bytes()==q.read_bytes(),str(q)
              else: shutil.copyfile(p,q)
          # Select concrete modules by actual slot imports, not file ordering.
          selected={r['module'] for r in records}
          done=set();targets=[]
          for p in sorted((root/'NF692').glob('Concrete*.lean')):
              slots=set(re.findall(r'^import WeilDefect\.Generated\.NF692\.(Slot\d+)$',p.read_text(),re.M))
              assert slots
              if not slots&selected: continue
              assert slots<=selected and not slots&done
              done|=slots;targets.append(p.stem)
          assert done==selected and len(targets)==12
          Path('nf697-targets.txt').write_text('\n'.join(targets)+'\n')
          Path('nf697-records.json').write_text(json.dumps(records,indent=2)+'\n')
          print('NF697 92 accepted local receipts / 601 rows bound to 12 concrete target modules')
          PY
      - name: Kernel-check concrete original bank slot projections and soundness
        timeout-minutes: 100
        run: |
          set -euo pipefail
          while read -r name; do
            lake build "WeilDefect.Generated.NF692.$name" 2>&1 | tee -a nf697-concrete.log
          done < nf697-targets.txt
      - name: Strict audit of concrete bank attachments and cache replay
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          records=json.loads(Path('nf697-records.json').read_text())
          names=['nf692'+r['module']+s for r in records for s in ('PayloadEq','Concrete')]
          imports=Path('nf697-targets.txt').read_text().splitlines()
          Path('/tmp/nf697ConcreteAudit.lean').write_text(''.join(f'import WeilDefect.Generated.NF692.{n}\n' for n in imports)+''.join(f'#print axioms WeilDefect.{n}\n' for n in names))
          Path('nf697-names.txt').write_text('\n'.join(names)+'\n')
          PY
          lake env lean /tmp/nf697ConcreteAudit.lean 2>&1 | tee nf697-concrete-axioms.log
          python - <<'PY'
          import json,re
          from pathlib import Path
          def audit(path,names):
              found={}
              s=Path(path).read_text()
              for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",s):
                  if n in names:
                      assert n not in found
                      found[n]=[v.strip() for v in x.split(',') if v.strip()]
              for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",s):
                  if n in names:
                      assert n not in found
                      found[n]=[]
              assert set(found)==names
              assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in found.values())
              return found
          names=set(Path('nf697-names.txt').read_text().splitlines())
          assert len(names)==184
          bank=audit('nf697-bank-axioms.log',{'nf691OriginalCoverage','nf691OriginalLookup_eq'})
          found=audit('nf697-concrete-axioms.log',names)
          records=json.loads(Path('nf697-records.json').read_text())
          # A successful restore is not by itself proof that Lake avoided rebuilding.
          replay=Path('nf697-reuse.log').read_text()
          rebuilt=len(re.findall(r'Built WeilDefect\.Generated\.NF690\.Chunk\d+',replay))
          Path('nf697-complete-audit.json').write_text(json.dumps({
              'schema':'NF697-concrete-attachment-and-reuse-audit-v1',
              'fingerprint':json.loads(Path('nf697-bank-binding.json').read_text())['fingerprint'],
              'records':records,'theorems':found,'bank_axioms':bank,
              'observed_chunk_build_lines':rebuilt,
              'reuse_time':Path('nf697-reuse-time.txt').read_text().strip(),
              'scope':'92 concrete bank table soundness theorems; no full bank soundness or physical entry custody.'
          },indent=2)+'\n')
          print('NF697 concrete original bank 92 table slots / 601 moment rows: LEAN PASS; observed chunk build lines',rebuilt)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf697-concrete-bank-attachment-audit
          path: |
            nf697-*.log
            nf697-*.txt
            nf697-*.json
          if-no-files-found: ignore
