name: NF529 full source graph closure Lean proof

on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaSourceQuadraticClosure.lean"
      - "WeilDefect/Arithmetic/ActualZetaSmoothLiteralFormula.lean"
      - "WeilDefect/Arithmetic/ActualZetaSmoothLiteralFormulaAutomatic.lean"
      - "WeilDefect/Arithmetic/ActualZetaSmoothCorrelationRegularity.lean"
      - "WeilDefect/Arithmetic/ActualZetaOriginalCollarSmoothL2.lean"
      - "WeilDefect/Arithmetic/ActualZetaOddPhysicalSampleSummability.lean"
      - "WeilDefect/Arithmetic/ActualZetaFullSourceLiftOfSquareSummable.lean"
      - "WeilDefect/Arithmetic/ActualZetaRawSamplesToFullSourceGraph.lean"
      - "WeilDefect/Arithmetic/ActualZetaRawPairNormalizedEnergy.lean"
      - ".github/workflows/nf529-source-graph-closure.yml"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
  workflow_dispatch:

jobs:
  check-nf529:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean via Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        shell: bash
        run: lake update
      - name: Restore Mathlib cache
        shell: bash
        run: lake exe cache get
      - name: Build and typecheck NF529 source-graph closure with local imports
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaSourceQuadraticClosure
      - name: Build and typecheck generic NF530 window correlation explicit formula
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaSmoothLiteralFormula
      - name: Build and typecheck NF533 automatic all-multiplicity summability
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaSmoothLiteralFormulaAutomatic
      - name: Build genuine NF534 correlation C2 regularity and actual EF attachment
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaSmoothCorrelationRegularity
      - name: Build NF535 authentic original smooth collar physical L2 embedding and EF
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaOriginalCollarSmoothL2
      - name: Build NF536 real-odd raw actual zero divisor sample square summability
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaOddPhysicalSampleSummability
      - name: Build NF536 universal actual source-graph lift from l2 source samples
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaFullSourceLiftOfSquareSummable
      - name: Build NF537 original raw-to-PN l2 transport and real-odd full-graph lift
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaRawSamplesToFullSourceGraph
      - name: Build NF537 exact both-sqrt2 raw P-N energy normalization identity
        shell: bash
        run: lake build WeilDefect.Arithmetic.ActualZetaRawPairNormalizedEnergy
      - name: Reject placeholders in the NF529 target
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)\b' WeilDefect/Arithmetic/ActualZetaSourceQuadraticClosure.lean WeilDefect/Arithmetic/ActualZetaSmoothLiteralFormula.lean WeilDefect/Arithmetic/ActualZetaSmoothLiteralFormulaAutomatic.lean WeilDefect/Arithmetic/ActualZetaSmoothCorrelationRegularity.lean WeilDefect/Arithmetic/ActualZetaOriginalCollarSmoothL2.lean WeilDefect/Arithmetic/ActualZetaOddPhysicalSampleSummability.lean WeilDefect/Arithmetic/ActualZetaFullSourceLiftOfSquareSummable.lean WeilDefect/Arithmetic/ActualZetaRawSamplesToFullSourceGraph.lean WeilDefect/Arithmetic/ActualZetaRawPairNormalizedEnergy.lean; then
            echo "NF529 target contains an unfinished declaration."
            exit 1
          fi
