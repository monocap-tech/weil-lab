name: NF529 full source graph closure Lean proof

on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaSourceQuadraticClosure.lean"
      - ".github/workflows/nf529-source-graph-closure.yml"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
  workflow_dispatch:

jobs:
  check-nf529:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean via Elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        shell: bash
        run: lake update
      - name: Restore Mathlib cache
        shell: bash
        run: lake exe cache get
      - name: Typecheck NF529 source-graph closure lemmas
        shell: bash
        run: lake env lean WeilDefect/Arithmetic/ActualZetaSourceQuadraticClosure.lean
      - name: Reject placeholders in the NF529 target
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)\b' WeilDefect/Arithmetic/ActualZetaSourceQuadraticClosure.lean; then
            echo "NF529 target contains an unfinished declaration."
            exit 1
          fi
