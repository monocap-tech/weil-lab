name: IV106-E2 literal Gamma lower envelope
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv106/iv106_e2/ActualZetaIV106E2GammaEnvelope.lean'
      - '.github/workflows/iv106-e2-gamma-envelope.yml'
permissions:
  contents: read
jobs:
  physical-action:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaNativeSymbolSign.lean)" = a0e4c27abd712dde032bb2a8b551d420b6f29afb
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaNativeLogBounds.lean)" = f8728d020bff9d0427ae6e4969da355f37182224
          test "$(git -C research hash-object WeilDefect/External/Zeta23/Theorems/Thm_Zeta23_DigammaSeries_hasSum_digamma_series.lean)" = c4d8e801c201a0dbdba34bb1f0b8033ef25aba3c
          test "$(git -C research hash-object WeilDefect/External/Zeta23/Theorems/Thm_Zeta23_StirlingVert_digamma_stirling.lean)" = 87eb18a6d6a4011aa938862636c57cdbc3a1bbee
          test "$(git -C candidate hash-object verification/iv106/iv106_e2/ActualZetaIV106E2GammaEnvelope.lean)" = 6de2fac49ed3631ccbad02273121e79a8ac0cef6
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv106/iv106_e2/ActualZetaIV106E2GammaEnvelope.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.lean
          cp candidate/verification/iv106/iv106_e2/ActualZetaIV106E2GammaEnvelope.lean research/WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv106-e2/out
          touch iv106-e2/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV106E2GammaEnvelope 2>&1 | tee iv106-e2/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.olean -nt iv106-e2/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV106E2GammaEnvelope' '#print axioms WeilDefect.neutralIV106E2Inv_re' '#print axioms WeilDefect.neutralIV106E2Quarter' '#print axioms WeilDefect.neutralIV106E2High' '#print axioms WeilDefect.neutralIV106E2Global' > /tmp/iv106-e2-axioms.lean
          lake env lean /tmp/iv106-e2-axioms.lean 2>&1 | tee iv106-e2/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv106-e2/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==4 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV106E2Inv_re","neutralIV106E2Quarter","neutralIV106E2High","neutralIV106E2Global"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV106-E2 strict named axioms PASS 4/4')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.olean > iv106-e2/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv106-e2-physical-action-evidence
          path: |
            research/iv106-e2/out/
            research/WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E2GammaEnvelope.olean
          include-hidden-files: true
          if-no-files-found: error
