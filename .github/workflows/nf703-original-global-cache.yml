name: NF703 complete original center cache and first result projections
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaOriginalPhysicalPackedProducts.lean"
      - "scripts/emit_nf703_original_global_cache.py"
      - ".github/workflows/nf703-original-global-cache.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf703-global-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-flint==0.8.0
      - name: Authenticate retained original archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          fetch() {
            local id="$1" name="$2" digest="$3"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "inputs/$name.zip"
            echo "$digest  inputs/$name.zip" | sha256sum -c -
            unzip -q "inputs/$name.zip" -d "inputs/$name"
          }
          fetch 14443252637 frame 3621906bd54c007900ca082ae1d2ee783d05d28ab5f3caab78b4a870b33abc7c
          fetch 14459025571 entries e91a83cae117e98608aefa6849dac178e4ddb58dd1dffbfe37304ad248af9ed9
          fetch 14457911117 cache bb89b0c7b9bc4017b8c855f0e30474ee8b2f0589e29f99747fff965f44f3b1a7
          fetch 14458146136 payments 8cbae72a7714dc555c0183edfbbda077096ef910b1e284d4abc91c4960d95e6e
          fetch 14541229354 frontier 13c2c0e296633ab5368b6e1be09c4e9b69d527001e0f3969ffc2f0af0c611ef5
          fetch 14546201664 receipt 86971af267f490dce4bcdba3403f3b566522f1cb9b38f9f77a10821b3772afb4
      - name: Bind accepted NF681 audit and emit complete exact original cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('inputs/frontier/manifest.json')
          m=json.loads(p.read_text())
          a=json.loads(next(Path('inputs/receipt').rglob('nf681-complete-audit.json')).read_text())
          assert a['manifest_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert set(a['theorems'])=={f'nf681Col{i:03d}{s}' for i in range(242) for s in ('HD','A')}
          assert all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in a['theorems'].values())
          PY
          python -m py_compile scripts/emit_nf703_original_global_cache.py
          python scripts/emit_nf703_original_global_cache.py --root . --historical inputs/frame/nf623-historical-entries.jsonl.gz --entries inputs/entries/nf631-widened-entries.jsonl.gz --payments inputs/payments/nf631-widened-payments.json --cache inputs/cache/nf631-center-cache.jsonl.gz --frontier inputs/frontier --output WeilDefect/Generated/NF703Cache
          mkdir -p WeilDefect/Generated/NF681
          cp inputs/frontier/Common.lean WeilDefect/Generated/NF681/
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF703Cache')
          m=json.loads((d/'manifest.json').read_text())
          assert (m['rows'],m['HD_entries'],m['A_lower_entries'],m['external_A_symmetry'],m['external_vector_products'],m['frontier_projections'])==(242,58564,29403,29161,968,726)
          assert len(m['data_modules'])==61 and len(m['audit_theorems'])==7
          for r in m['files']: assert hashlib.sha256((d/r['file']).read_bytes()).hexdigest()==r['sha256']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf703-original-cache-proposals
          path: |
            WeilDefect/Generated/NF703Cache/
            WeilDefect/Generated/NF681/Common.lean
          if-no-files-found: error
  kernel:
    needs: emit
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nf703-original-cache-proposals
          path: WeilDefect/Generated
      - name: Verify all cache source proposal hashes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF703Cache')
          m=json.loads((d/'manifest.json').read_text())
          for r in m['files']: assert hashlib.sha256((d/r['file']).read_bytes()).hexdigest()==r['sha256']
          PY
      - name: Install pinned Lean and cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile exact complete original cache in bounded data modules
        timeout-minutes: 190
        run: |
          set -euo pipefail
          for ((i=0;i<242;i+=4)); do
            printf -v n '%03d' "$i"
            lake build "WeilDefect.Generated.NF703Cache.Rows$n" 2>&1 | tee -a nf703-cache-build.log
          done
          lake build WeilDefect.Generated.NF703Cache.Data 2>&1 | tee -a nf703-cache-build.log
          lake build WeilDefect.Generated.NF703Cache.Frontier 2>&1 | tee -a nf703-cache-build.log
      - name: Strict complete original cache object and frontier projection audit
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF703Cache')
          m=json.loads((d/'manifest.json').read_text())
          Path('/tmp/nf703Audit.lean').write_text('import WeilDefect.Generated.NF703Cache.Frontier\n'+''.join(f'#print axioms WeilDefect.{n}\n' for n in m['audit_theorems']))
          PY
          lake env lean /tmp/nf703Audit.lean 2>&1 | tee nf703-cache-axioms.log
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF703Cache')
          m=json.loads((d/'manifest.json').read_text())
          names=set(m['audit_theorems']);found={}
          s=Path('nf703-cache-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",s):
              if n in names:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",s):
              if n in names:
                  assert n not in found
                  found[n]=[]
          assert set(found)==names and len(found)==7
          assert all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for r in m['files']:assert sha(d/r['file'])==r['sha256']
          m['axioms']=found
          m['manifest_sha256']=sha(d/'manifest.json')
          Path('nf703-cache-complete-audit.json').write_text(json.dumps(m,indent=2)+'\n')
          print('NF703 complete original cache object and 726 exact result projections LEAN PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf703-original-cache-audit
          path: |
            nf703-cache-*.log
            nf703-cache-complete-audit.json
          if-no-files-found: ignore
