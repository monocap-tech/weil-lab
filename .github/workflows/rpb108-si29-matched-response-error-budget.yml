name: SI29 matched response error budget

on:
  push:
    paths:
      - scripts/verify_rpb108_si29_matched_response_error_budget.py
      - .github/workflows/rpb108-si29-matched-response-error-budget.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-matched-response-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONINTMAXSTRDIGITS: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accepted GitHub custody and download exact native witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          NATIVE_RUN=40423854196
          NATIVE_COMMIT='fa7986b3fd83b8fd93014c886eb26943807e0202'
          NATIVE_ARTIFACT=12699072252
          ARCHIVE_SHA256='1e63931e6e64d8fa6e7926ccf905b46dc906d62be2c9624d36376ed27b0184c4'
          base='https://api.github.com/repos/monocap-tech/weil-lab'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as r:
                  return json.load(r)
          run=get('/actions/runs/'+str(NATIVE_RUN))
          assert run['conclusion']=='success' and run['head_sha']==NATIVE_COMMIT
          artifact=get('/actions/artifacts/'+str(NATIVE_ARTIFACT))
          assert artifact['name']=='si29-original-negative-mixed-budget'
          assert artifact['workflow_run']['id']==NATIVE_RUN and artifact['workflow_run']['head_sha']==NATIVE_COMMIT
          assert artifact['digest']=='sha256:'+ARCHIVE_SHA256 and artifact['expired'] is False
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(base+'/actions/artifacts/'+str(NATIVE_ARTIFACT)+'/zip',headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request) as r:data=r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # Do not forward the GitHub authorization header to blob storage.
              with urllib.request.urlopen(e.headers['Location']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==ARCHIVE_SHA256
          files=[('si29_full_trial_preconditioner.json','87d6f3ae24cde489adaf9ab3ac7efa612bc82bd78c6c9e94866802fdc550052f'),('si29_reference_on_J_perp.json','f1149e27da8a0e1d90e48b8ee0eb8a0a0b8ef51d0910499a7fcd19a082efca07'),('si29_original_negative_mixed_budget.json','a693261c31f01a4a1e11ea6400e5173435a8260b41b1f6b43aa6f67f784ccb7f')]
          Path('artifacts').mkdir(exist_ok=True)
          archive=zipfile.ZipFile(io.BytesIO(data))
          for name,sha in files:
              raw=archive.read(name)
              assert hashlib.sha256(raw).hexdigest()==sha
              Path('artifacts',name).write_bytes(raw)
          print('Accepted run/source/artifact/archive and THREE matched budget inputs PASS')
          PY
      - name: Derive matched Schur sensitivity and component allocation contract
        run: python scripts/verify_rpb108_si29_matched_response_error_budget.py --frame-certificate artifacts/si29_full_trial_preconditioner.json --schur-certificate artifacts/si29_reference_on_J_perp.json --negative-certificate artifacts/si29_original_negative_mixed_budget.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si29-matched-response-error-budget
          path: artifacts/*.json
          if-no-files-found: warn
