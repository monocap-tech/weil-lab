name: IV015 original frozen collar nonzero complex Schwartz prime-free bump
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalNonzeroPrimeFreeSchwartzBump.lean"
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalTwoCollarPrimeFreeBump.lean"
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalActivePrimeSupportGeometry.lean"
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalSchwartzPolarization.lean"
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalCrossSupportPhaseCancellation.lean"
      - "scripts/iv015_frozen_collar_exact_log_gap.py"
      - "scripts/iv015_original_nonzero_two_collar_schwartz_audit.py"
      - ".github/workflows/iv015-original-nonzero-two-collar-schwartz-bump.yml"
      - "docs/IV015_PHASE_IV_ORIGINAL_TWO_COLLAR_NONZERO_BUMP.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iv015-nonzero-original-schwartz-collar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-exact-frozen-two-collar-nonzero-schwartz:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently certify exact rational original ±log(n) two-collar geometry and negative counterfactuals — NOT Lean
        run: |
          set -euo pipefail
          python -m py_compile scripts/iv015_frozen_collar_exact_log_gap.py scripts/iv015_original_nonzero_two_collar_schwartz_audit.py
          python scripts/iv015_frozen_collar_exact_log_gap.py selftest
          python scripts/iv015_frozen_collar_exact_log_gap.py preflight
          test -s iv015-frozen-collar-exact-rational-log-gap.json
      - name: Original two-Schwartz-module source-only preflight — NOT kernel
        run: |
          set -euo pipefail
          python scripts/iv015_original_nonzero_two_collar_schwartz_audit.py preflight
      - name: Install exact pinned original Lean Mathlib toolchain and cache
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Direct Lean kernel build of actual nonzero COMPLEX Schwartz compact bump source
        timeout-minutes: 85
        run: |
          set -euo pipefail
          /usr/bin/time -a -o iv015-resources.log -f 'phase=complex-bump elapsed=%e rss_kb=%M exit=%x' \
            lake build WeilDefect.Arithmetic.ActualZetaPhaseIVOriginalNonzeroPrimeFreeSchwartzBump 2>&1 | tee iv015-nonzero-original-bump-build.log
      - name: Direct Lean kernel build of frozen actual NF543 original two-collar arithmetic witness
        timeout-minutes: 75
        run: |
          set -euo pipefail
          /usr/bin/time -a -o iv015-resources.log -f 'phase=two-original-collars elapsed=%e rss_kb=%M exit=%x' \
            lake build WeilDefect.Arithmetic.ActualZetaPhaseIVOriginalTwoCollarPrimeFreeBump 2>&1 | tee iv015-original-two-collar-build.log
      - name: Direct Lean standard-axiom audits on both physical source modules and exact Fraction receipt binding
        timeout-minutes: 35
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalNonzeroPrimeFreeSchwartzBump.lean 2>&1 | tee iv015-nonzero-schwartz-bump-axioms.log
          lake env lean WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalTwoCollarPrimeFreeBump.lean 2>&1 | tee iv015-original-two-collar-bump-axioms.log
          python scripts/iv015_original_nonzero_two_collar_schwartz_audit.py verify
          test -s iv015-original-two-collar-nonzero-schwartz-kernel-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv015-original-frozen-two-collar-nonzero-prime-free-Schwartz-kernel-audit
          path: |
            iv015-frozen-collar-exact-rational-log-gap.json
            iv015-resources.log
            iv015-nonzero-original-bump-build.log
            iv015-original-two-collar-build.log
            iv015-nonzero-schwartz-bump-axioms.log
            iv015-original-two-collar-bump-axioms.log
            iv015-original-two-collar-nonzero-schwartz-kernel-audit.json
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalNonzeroPrimeFreeSchwartzBump.olean
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalTwoCollarPrimeFreeBump.olean
          if-no-files-found: ignore
          include-hidden-files: true
