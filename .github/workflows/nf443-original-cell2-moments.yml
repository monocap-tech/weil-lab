name: Weil-Lab NF443 original J2 three-panel signed p and raw dx moments
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf443_original_cell2_three_panel_p512_dx1023_native.py'
      - '.github/workflows/nf443-original-cell2-moments.yml'
permissions:
  contents: read
jobs:
  original-three-piece-principal-moments:
    strategy:
      fail-fast: false
      matrix:
        panel: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install python-flint==0.8.0
      - name: Native true J2 piece p512 and raw dx1023 moments, no false internal jumps
        run: |
          python3 -m py_compile scripts/local_replay/nf443_original_cell2_three_panel_p512_dx1023_native.py
          python3 scripts/local_replay/nf443_original_cell2_three_panel_p512_dx1023_native.py \
            --panel ${{ matrix.panel }} --degree 511 --log-modes 110 --precision 2048 \
            --output artifacts/NF443_original_J2_panel${{ matrix.panel }}_principal_p512_dx1023.json
      - name: Original four true principal jumps and moment width gate
        env:
          PANEL: ${{ matrix.panel }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          sys.set_int_max_str_digits(0)
          from fractions import Fraction as F
          p=int(os.environ['PANEL'])
          d=json.load(open(f'artifacts/NF443_original_J2_panel{p}_principal_p512_dx1023.json'))
          assert d['pass']=='NF443' and d['original_panel_number']==p
          assert d['original_nf407_source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert d['original_nf406_seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert d['original_true_cell2']=='(11/10-log(3),log(4)-11/10)'
          assert d['original_active_minus_prime_powers']==[2,3]
          assert d['original_active_plus_prime_powers']==[2]
          assert d['original_principal_jump_weights_active']==[3]
          assert d['original_principal_jump_weights_inactive']==[2,4,5,7,8,9]
          assert d['original_regular_z_n2_both_n3_minus_but_principal_n3_only_on_all_panels']
          assert d['original_nf410_full_true_cell2_p0_overlap_requires_all_three_panels']
          assert d['number_original_signed_p_moments']==512
          assert d['number_original_raw_dx_moments']==1023
          assert F(d['original_endpoint_log_uniform_tail_exact'])<F(1,10**70)
          assert all(F(b)-F(a)<F(1,10**25) for a,b in d['original_source_signed_p_cheb_moments_n0_to_n511'])
          assert all(F(b)-F(a)<F(1,10**35) for a,b in d['original_cell2_raw_dx_cheb_moments_n0_to_n1022'])
          assert not d['original_true_cell2_signed_pz_z2_integrated']
          assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF443 original J2 piece',p,'native principal p512 dx1023 PASS; aggregate NF410 control and signed J2 still OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF443-original-J2-panel${{ matrix.panel }}-principal-p512-dx1023
          path: artifacts/NF443_original_J2_panel${{ matrix.panel }}_principal_p512_dx1023.json
          if-no-files-found: error
