name: CP021 OPT-IN original upstream-only Borwein/germ leaf source gate
# Exactly source/Fraction, no kernel; no ordinary push/PR-runner fanout.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  true-independent-leaf-source-audit-NOT-LEAN:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'cp021-leaf-source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact Fraction and genuine two-leaf direct original imports only
        run: |
          set -euo pipefail
          python -m py_compile scripts/cp021_independent_leaf_v435_source_kernel_gate.py
          python scripts/cp021_independent_leaf_v435_source_kernel_gate.py \
            --self-test --source-check 2>&1 | tee cp021-fraction-and-leaf-source.log
          grep -F 'CP021 ORIGINAL-ZETA/ORIGINAL-MATHLIB-ONLY LEAF DEPENDENCY CUT' cp021-fraction-and-leaf-source.log
      - name: Exact CP023 phase-aware complex zeta remainder derivative/curvature interface (NOT LEAN)
        run: |
          set -euo pipefail
          python -m py_compile scripts/cp023_original_phase_remainder_fraction_budget.py
          python scripts/cp023_original_phase_remainder_fraction_budget.py \
            --self-test --source-contract \
            --receipt cp023-exact-phase-remainder-budget-NOT-LEAN.json \
            | tee cp023-exact-phase-remainder-NOT-LEAN.log
          grep -F 'CP023 EXACT PHASE/COMPLEX-EM-REMAINDER JET BUDGET: PASS NOT LEAN' cp023-exact-phase-remainder-NOT-LEAN.log
          grep -F 'CP023 ORIGINAL HARDY-Z PHASE-JET / ZETA LEAF SOURCE CONTRACT: PASS NOT LEAN' cp023-exact-phase-remainder-NOT-LEAN.log
          test -s cp023-exact-phase-remainder-budget-NOT-LEAN.json
      - name: Download seven actual frozen Zeta/Mathlib primary sources
        run: |
          set -euo pipefail
          ref=c06b4e13d9c847e50a32c3d738271cbad62ae9f3
          for path in \
            Zeta/EulerMaclaurin/Continuation.lean \
            Zeta/EulerMaclaurin/ErrorBound.lean; do
            mkdir -p "cp021-frozen-zeta/$(dirname "$path")"
            curl -fLSs --retry 3 \
              "https://raw.githubusercontent.com/smmercuri/zeta/$ref/$path" \
              -o "cp021-frozen-zeta/$path"
          done
          for path in \
            Mathlib/RingTheory/Polynomial/Pochhammer.lean \
            Mathlib/NumberTheory/Bernoulli.lean \
            Mathlib/Analysis/Calculus/IteratedDeriv/Lemmas.lean \
            Mathlib/Analysis/Complex/Norm.lean \
            Mathlib/Analysis/SpecialFunctions/Pow/Real.lean; do
            mkdir -p "cp021-frozen-mathlib/$(dirname "$path")"
            curl -fLSs --retry 3 \
              "https://raw.githubusercontent.com/leanprover-community/mathlib4/v4.35.0/$path" \
              -o "cp021-frozen-mathlib/$path"
          done
      - name: Seven verified primary Git blobs and genuine theorem API signatures
        run: |
          set -euo pipefail
          python scripts/cp021_independent_leaf_v435_source_kernel_gate.py \
            --original-zeta cp021-frozen-zeta \
            --original-mathlib cp021-frozen-mathlib \
            | tee cp021-upstream-source-five-sha-only.log
          grep -F 'CP022 SEVEN FROZEN UPSTREAM ORIGINAL GIT BLOB+API GATES: 7/7 PASS NOT LEAN' cp021-upstream-source-five-sha-only.log
      - name: Download ORIGINAL pinned Stirling/digamma and exponential/Cauchy proof APIs
        run: |
          set -euo pipefail
          ref=c06b4e13d9c847e50a32c3d738271cbad62ae9f3
          for path in \
            Zeta/Gamma/DigammaStirling.lean \
            Zeta/Gamma/TrigammaDecay.lean \
            Zeta/Gram/Averaging.lean; do
            mkdir -p "cp021-frozen-zeta/$(dirname "$path")"
            curl -fLSs --retry 3 \
              "https://raw.githubusercontent.com/smmercuri/zeta/$ref/$path" \
              -o "cp021-frozen-zeta/$path"
          done
          for path in \
            Mathlib/Analysis/Complex/Liouville.lean \
            Mathlib/Analysis/Complex/ExponentialBounds.lean; do
            mkdir -p "cp021-frozen-mathlib/$(dirname "$path")"
            curl -fLSs --retry 3 \
              "https://raw.githubusercontent.com/leanprover-community/mathlib4/v4.35.0/$path" \
              -o "cp021-frozen-mathlib/$path"
          done
      - name: CP024 ORIGINAL Stirling/Cauchy theta prime and second phase envelopes, exact and SHA-pinned NOT LEAN
        run: |
          set -euo pipefail
          python -m py_compile scripts/cp024_source_digamma_stirling_cauchy_phase_bounds.py
          python scripts/cp024_source_digamma_stirling_cauchy_phase_bounds.py \
            --self-test --source-contract \
            --original-zeta cp021-frozen-zeta \
            --original-mathlib cp021-frozen-mathlib \
            --receipt cp024-original-phase-Stirling-Cauchy-NOT-LEAN.json \
            2>&1 | tee cp024-original-phase-Stirling-Cauchy-NOT-LEAN.log
          grep -F 'CP024 ORIGINAL STIRLING/CAUCHY PHASE EXACT RATIONAL PREFLIGHT: PASS NOT LEAN' cp024-original-phase-Stirling-Cauchy-NOT-LEAN.log
          grep -F 'CP024 SIX ORIGINAL DIGAMMA/CAUCHY/LOG-BOUND GIT-BLOB AND API CHECKS: 6/6 PASS NOT LEAN' cp024-original-phase-Stirling-Cauchy-NOT-LEAN.log
          grep -F 'CP024 SOURCE_BASED_STIRLING_CAUCHY_PHASE_BUDGET_PASS_NOT_LEAN' cp024-original-phase-Stirling-Cauchy-NOT-LEAN.log
          test -s cp024-original-phase-Stirling-Cauchy-NOT-LEAN.json
      - name: Fetch two ADDITIONAL real original Hardy theta/order-two Gamma source files
        run: |
          set -euo pipefail
          ref=c06b4e13d9c847e50a32c3d738271cbad62ae9f3
          for path in \
            Zeta/Zeros/HardyZ.lean \
            Zeta/Gamma/LogGammaStirling.lean; do
            mkdir -p "cp021-frozen-zeta/$(dirname "$path")"
            curl -fLSs --retry 3 \
              "https://raw.githubusercontent.com/smmercuri/zeta/$ref/$path" \
              -o "cp021-frozen-zeta/$path"
          done
      - name: CP025 genuine original M6N256 255-term integer-directed root-sign and derivative-anchor interval certificate NOT LEAN
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m py_compile scripts/cp025_original_EM_integer_directed_firstjet_root_bracket.py
          python scripts/cp025_original_EM_integer_directed_firstjet_root_bracket.py \
            --self-test \
            --original-zeta cp021-frozen-zeta \
            --receipt cp025-external-original-source-anchor-and-narrow-sign-interval-NOT-LEAN.json \
            2>&1 | tee cp025-external-original-source-integer-interval-NOT-LEAN.log
          grep -F 'CP025 ORIGINAL M6N256 INTEGER DIRECTED FIRST-JET + NARROW BRACKET: PASS NOT LEAN' cp025-external-original-source-integer-interval-NOT-LEAN.log
          grep -F 'CP025 SIX ORIGINAL A/PHASE SOURCE GIT SHA+THEOREM GATES: 6/6 PASS NOT LEAN' cp025-external-original-source-integer-interval-NOT-LEAN.log
          grep -F 'CP025_EXTERNAL_INTEGER_DIRECTED_ORIGINAL_M6N256_INTERVAL_PASS_NOT_LEAN' cp025-external-original-source-integer-interval-NOT-LEAN.log
          test -s cp025-external-original-source-anchor-and-narrow-sign-interval-NOT-LEAN.json
      - name: CP026 original HardyZ source bridge four explicit UNPAID Lean premises and independent 3-point integer-directed replay (NOT LEAN)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m py_compile scripts/cp026_original_point_receipt_replay_and_conditional_lean_gate.py
          python scripts/cp026_original_point_receipt_replay_and_conditional_lean_gate.py \
            --source-check --self-test \
            --original-zeta cp021-frozen-zeta \
            --receipt cp026-original-point-bridge-conditional-source-replay-NOT-LEAN.json \
            2>&1 | tee cp026-original-point-bridge-source-replay-NOT-LEAN.log
          grep -F 'CP026 ORIGINAL HARDYZ SOURCE ZERO-BRIDGE FOUR-EXPLICIT-PREMISE LEAN CANDIDATES: 4/4 SOURCE CHECK PASS NOT LEAN' cp026-original-point-bridge-source-replay-NOT-LEAN.log
          grep -F 'CP026 THREE ORIGINAL POINTS 10^55 INTEGER-DIRECTED SOURCE REPLAY: PASS NOT LEAN' cp026-original-point-bridge-source-replay-NOT-LEAN.log
          grep -F 'CP026_TRUE_ORIGINAL_UPSTREAM_SOURCE_BRIDGE_AND_DIRECTED_POINT_REPLAY_PASS_NOT_LEAN' cp026-original-point-bridge-source-replay-NOT-LEAN.log
          test -s cp026-original-point-bridge-conditional-source-replay-NOT-LEAN.json
      - name: CP027 TWO genuine source-point Borwein cap discharge candidates and exact 328/27 Fraction arithmetic NOT LEAN
        run: |
          set -euo pipefail
          python -m py_compile scripts/cp027_original_center_borwein_328_over_27_source_gate.py
          python scripts/cp027_original_center_borwein_328_over_27_source_gate.py \
            --self-test --source-check \
            --original-zeta cp021-frozen-zeta \
            --original-mathlib cp021-frozen-mathlib \
            --receipt cp027-original-two-center-Borwein-NOT-LEAN.json \
            2>&1 | tee cp027-original-two-center-Borwein-NOT-LEAN.log
          grep -F 'CP027 ORIGINAL TWO POINTS B14/POC13/328div27 FRACTION BOUND: PASS NOT LEAN' cp027-original-two-center-Borwein-NOT-LEAN.log
          grep -F 'CP027 UPSTREAM-ONLY POINT LEAF AND TWO FINITE SIGN BRIDGE SOURCE: 12/12 CONTRACT PASS NOT LEAN' cp027-original-two-center-Borwein-NOT-LEAN.log
          grep -F 'CP027 FIVE IMMUTABLE ORIGINAL ZETA/MATHLIB SOURCE GATES: 5/5 PASS NOT LEAN' cp027-original-two-center-Borwein-NOT-LEAN.log
          test -s cp027-original-two-center-Borwein-NOT-LEAN.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp021-standalone-Zeta435-original-upstream-only-13-source-check-NOT-KERNEL
          path: |
            cp021-fraction-and-leaf-source.log
            cp023-exact-phase-remainder-NOT-LEAN.log
            cp023-exact-phase-remainder-budget-NOT-LEAN.json
            cp021-upstream-source-five-sha-only.log
            cp024-original-phase-Stirling-Cauchy-NOT-LEAN.json
            cp024-original-phase-Stirling-Cauchy-NOT-LEAN.log
            cp025-external-original-source-integer-interval-NOT-LEAN.log
            cp025-external-original-source-anchor-and-narrow-sign-interval-NOT-LEAN.json
            cp026-original-point-bridge-conditional-source-replay-NOT-LEAN.json
            cp026-original-point-bridge-source-replay-NOT-LEAN.log
            cp027-original-two-center-Borwein-NOT-LEAN.log
            cp027-original-two-center-Borwein-NOT-LEAN.json
          if-no-files-found: ignore
