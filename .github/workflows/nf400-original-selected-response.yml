name: Weil-Lab NF400 original 242D selected response column
on:
  push:
    branches:
      - research/nf400-original-complete-selected-response-column
    paths:
      - '.github/workflows/nf400-original-selected-response.yml'
      - 'scripts/verify_nf400_original_selected_full_column.py'
      - 'scripts/local_replay/nf400_original_selected_column_exact_receipt.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: nf400-original-242-selected-column
  cancel-in-progress: false
jobs:
  original-native-column:
    if: github.repository == 'monocap-tech/weil-lab' && github.ref == 'refs/heads/research/nf400-original-complete-selected-response-column'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nf400-original-complete-selected-response-column
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original NF399 exact source regression and compile native
        run: |
          mkdir -p artifacts
          echo exact-source-preflight > artifacts/phase.txt
          python3 scripts/local_replay/nf399_original_selected_cone_gate.py --output artifacts/NF399_source_replay.json
          python3 -m py_compile scripts/verify_nf400_original_selected_full_column.py scripts/local_replay/nf400_original_selected_column_exact_receipt.py
          echo original-arb-install > artifacts/phase.txt
      - name: Install pinned original 4096-bit Arb
        run: |
          pip install --only-binary=:all: python-flint==0.8.0 numpy scipy
          echo original-archive-hash > artifacts/phase.txt
      - name: Recover original complete WJJ/WJF archive with SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12776684037/zip" \
            -o artifacts/original_selected_signed_20261028.zip
          echo 'f7b64ceead7500fca389e3b994a208a6e8aae5be3270b750ab586e5ebe1fa1d0  artifacts/original_selected_signed_20261028.zip' | sha256sum -c -
          echo native-original-column > artifacts/phase.txt
      - name: Compute full original 242D pole-restored signed response column
        run: |
          python3 -u scripts/verify_nf400_original_selected_full_column.py \
            --rank notes/data/provisional/parents/pr350_original_BS_pruned_rank_bound.json \
            --source notes/data/provisional/nf372_pr355_fields.json \
            --nf369 notes/data/provisional/nf372_nf369_fields.json \
            --nf375 notes/data/provisional/NF375_reduced_cutoff_exact.json \
            --j387 notes/data/provisional/NF387_original_J242_dyadic_candidate.json \
            --archive artifacts/original_selected_signed_20261028.zip \
            --output artifacts/NF400_original_j387_scalar_crosscheck_native.json \
            --projection-output artifacts/NF400_original_selected_column_native.json
          echo exact-independent-column-receipt > artifacts/phase.txt
      - name: Independently attest 242D signed projection with frozen original j387
        run: |
          python3 scripts/local_replay/nf400_original_selected_column_exact_receipt.py \
            --native artifacts/NF400_original_selected_column_native.json \
            --output artifacts/NF400_original_selected_column_acceptance.json
          echo original-selected-column-source-verified > artifacts/phase.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf400-original-selected-column-evidence
          if-no-files-found: ignore
          path: |
            artifacts/phase.txt
            artifacts/NF400_original_selected_column_native.json
            artifacts/NF400_original_selected_column_acceptance.json
            artifacts/NF400_original_j387_scalar_crosscheck_native.json
  durable-receipt:
    if: always() && github.repository == 'monocap-tech/weil-lab' && github.ref == 'refs/heads/research/nf400-original-complete-selected-response-column'
    needs: original-native-column
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nf400-original-complete-selected-response-column
          persist-credentials: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nf400-original-selected-column-evidence
          path: artifacts
      - name: Preserve typed actual execution and verified evidence only
        env:
          SOURCE_RESULT: ${{ needs['original-native-column'].result }}
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path('artifacts')
          result=os.environ['SOURCE_RESULT']
          names=['NF400_original_selected_column_native.json',
                 'NF400_original_selected_column_acceptance.json',
                 'NF400_original_j387_scalar_crosscheck_native.json']
          if result=='success':
              for n in names:
                  x=p/n
                  assert x.exists(),'Native success missing accepted original file '+n
                  target=Path('notes/data/provisional')/n
                  if target.exists():
                      assert x.read_bytes()==target.read_bytes(),'Refuse original evidence overwrite'
                  else:target.write_bytes(x.read_bytes())
          status={
            'pass':'NF400','standing':'ORIGINAL SELECTED 242D METHOD EVIDENCE ONLY',
            'run_id':os.environ['SOURCE_RUN'],'source_sha':os.environ['SOURCE_HEAD'],
            'native_job_result':result,
            'last_saved_phase':(p/'phase.txt').read_text().strip() if (p/'phase.txt').exists() else 'NO_STAGE_EVIDENCE',
            'original_complete_selected_column_accepted':result=='success',
            'native_sha256':hashlib.sha256((p/names[0]).read_bytes()).hexdigest() if result=='success' else None,
            'original_full_lowband_upper':False,
            'all_selected_candidates_excluded':False,
            'W_ODD_NEG':'OPEN','RH':'OPEN'
          }
          target=Path('notes/data/provisional/NF400_native_execution_status.json')
          if target.exists():
              old=json.loads(target.read_text())
              assert old.get('native_job_result')!='success' or old==status,'Refuse accepted receipt overwrite'
          target.write_text(json.dumps(status,indent=2)+'\n')
          print('NF400 execution',result,'phase',status['last_saved_phase'])
          PY
      - name: Commit additive typed native/status records only on unmerged branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/data/provisional/NF400_native_execution_status.json
          for n in NF400_original_selected_column_native.json NF400_original_selected_column_acceptance.json NF400_original_j387_scalar_crosscheck_native.json; do
            if test -f notes/data/provisional/$n; then git add notes/data/provisional/$n; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'NF400 source-authenticated 242D selected column or typed execution receipt'
            git pull --rebase origin research/nf400-original-complete-selected-response-column
            git push origin HEAD:refs/heads/research/nf400-original-complete-selected-response-column
          fi
