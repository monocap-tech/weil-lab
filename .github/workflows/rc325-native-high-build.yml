name: RC325 original signed non-diagonal high block
on:
  push:
    branches:
      - research/rpb108-rc325-native-high-2x2
    paths:
      - "scripts/validate_rpb108_rc325_native_high_2x2.py"
      - ".github/workflows/rc325-native-high-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original 244/246 signed native overlap and rigorous two-mode Ritz
        run: |
          python scripts/validate_rpb108_rc325_native_high_2x2.py --output certificates/rpb108_rc325_native_high_2x2.json
          python scripts/validate_rpb108_rc325_native_high_2x2.py --output certificates/rpb108_rc325_native_high_2x2.json --replay
      - name: Freeze rigorous rational certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc325_native_high_2x2.json
          if ! git diff --cached --quiet; then
            git commit -m "RC325: freeze original high 244/246 signed block and coupled Ritz"
            git fetch origin research/rpb108-rc325-native-high-2x2
            git rebase origin/research/rpb108-rc325-native-high-2x2
            git push origin HEAD:research/rpb108-rc325-native-high-2x2
          fi
