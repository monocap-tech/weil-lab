name: NF707 full original payment physical rows 8 to 47
on:
  pull_request:
    paths:
      - "scripts/emit_nf707_full_payment_row_attachments.py"
      - ".github/workflows/nf707-full-payment-physical-attachments.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf707-full-payment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
          run-id: 44598398608
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=json.loads(Path('compiled-bank/nf697-bank-binding.json').read_text())
          b=json.loads(Path('nf697-bank-binding.json').read_text())
          for x in (a,b):
              f=x.pop('fingerprint')
              assert hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()==f
          assert a['schema']==b['schema'] and a['environment']==b['environment']
          assert all(b['files'].get(k)==v for k,v in a['files'].items())
          extra=set(b['files'])-set(a['files'])
          assert extra=={'WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.lean'},extra
          # Existing source closure must not reference the newly added module.
          assert all('ActualZetaOriginalPhysicalTriangularCacheAssembly' not in Path(p).read_text()
                     for p in a['files'] if p.endswith('.lean'))
          print('NF705 all producer sources unchanged; exactly one new independent theorem module')
          PY
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
          test ! -e .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaOriginalPhysicalTriangularCacheAssembly.olean
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-flint==0.8.0
      - name: Authenticate complete input and accepted original physical row source archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p receipts
          fetch() {
            local id="$1" name="$2" digest="$3"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "receipts/$name.zip"
            echo "$digest  receipts/$name.zip" | sha256sum -c -
            mkdir -p "receipts/$name"
            unzip -q "receipts/$name.zip" -d "receipts/$name"
          }
          fetch 14582437652 input 258637da71e96468ed7c6ac5b0a4480ce06cdee9989aef8e71a4cd09059789e0
          fetch 14577476562 rows698 98f124f794b15def1b2dd51957cac47eae44362640f2911332b334da93374bf0
          fetch 14583015625 rows701 2979f409f4179499e7f5cd499b402d678f507cf1188d88ef373a34843ef915c3
          python -m py_compile scripts/emit_nf707_full_payment_row_attachments.py
          python scripts/emit_nf707_full_payment_row_attachments.py --input receipts/input --row698 receipts/rows698 --row701 receipts/rows701 --output WeilDefect/Generated/NF707
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          for name,stage in (('input','NF702Inputs'),('rows698','NF698Physical'),('rows701','NF701Physical')):
              paths=[p.parent for p in (Path('receipts')/name).rglob('manifest.json') if p.parent.name==stage]
              assert len(paths)==1
              shutil.copytree(paths[0],root/stage)
          d=root/'NF707'
          m=json.loads((d/'manifest.json').read_text())
          assert [r['row'] for r in m['records']]==list(range(8,48))
          assert len(m['files'])==40
          for f in m['files']: assert hashlib.sha256((d/f['file']).read_bytes()).hexdigest()==f['sha256']
          PY
      - name: Replay accepted complete input data once and retain compiled artifacts
        timeout-minutes: 120
        run: |
          set -euo pipefail
          for ((i=0;i<242;i+=4)); do
            printf -v n '%03d' "$i"
            lake build "WeilDefect.Generated.NF702Inputs.Rows$n" 2>&1 | tee -a nf707-input-build.log
          done
          lake build WeilDefect.Generated.NF702Inputs.Data 2>&1 | tee -a nf707-input-build.log
          mkdir -p compiled-input
          find .lake/build -type d -path '*/WeilDefect/Generated/NF702Inputs' -print | sort > compiled-input/paths.txt
          test -s compiled-input/paths.txt
          tar -czf compiled-input/nf707-input-build.tar.gz -T compiled-input/paths.txt
          (cd compiled-input && sha256sum nf707-input-build.tar.gz > nf707-input-build.sha256)
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF702Inputs')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          b=json.loads(Path('nf697-bank-binding.json').read_text())
          m=json.loads((d/'manifest.json').read_text())
          files={str(d/r['file']):sha(d/r['file']) for r in m['files'] if r['file']=='Data.lean' or r['file'].startswith('Rows')}
          assert len(files)==62
          p={'schema':'NF707-compiled-input-binding-v1','bank_source_environment':b,'input_manifest_sha256':sha(d/'manifest.json'),'input_sources':files,'compiled_tar_sha256':sha(Path('compiled-input/nf707-input-build.tar.gz'))}
          Path('compiled-input/nf707-input-binding.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf707-compiled-original-input
          path: compiled-input/
          if-no-files-found: error
      - name: Attach forty accepted original physical row receipts to full payment
        timeout-minutes: 180
        run: |
          set -euo pipefail
          for ((i=8;i<48;i++)); do
            printf -v n '%03d' "$i"
            lake build "WeilDefect.Generated.NF707.Attach$n" 2>&1 | tee -a nf707-attachments.log
          done
      - name: Strict source-specific full-payment row gate audit
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF707')
          m=json.loads((d/'manifest.json').read_text())
          names=[n for r in m['records'] for n in r['theorems']]
          assert len(names)==len(set(names))==240
          Path('/tmp/nf707Audit.lean').write_text(''.join(f"import WeilDefect.Generated.NF707.{r['module']}\n" for r in m['records'])+''.join(f'#print axioms WeilDefect.{n}\n' for n in names))
          Path('nf707-names.txt').write_text('\n'.join(names)+'\n')
          PY
          lake env lean /tmp/nf707Audit.lean 2>&1 | tee nf707-axioms.log
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF707')
          m=json.loads((d/'manifest.json').read_text())
          names=set(Path('nf707-names.txt').read_text().splitlines())
          found={}
          log=Path('nf707-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",log):
              if n in names:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",log):
              if n in names:
                  assert n not in found
                  found[n]=[]
          assert set(found)==names and len(found)==240
          assert all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for r in m['files']: assert sha(d/r['file'])==r['sha256']
          assert m['input_manifest_sha256']==sha(Path('WeilDefect/Generated/NF702Inputs/manifest.json'))
          m['axioms']=found
          m['manifest_sha256']=sha(d/'manifest.json')
          Path('nf707-complete-audit.json').write_text(json.dumps(m,indent=2)+'\n')
          print('NF707 40 additional unconditional original full-payment physical row gates LEAN PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf707-original-full-payment-attachments
          path: |
            nf707-*.log
            nf707-complete-audit.json
            WeilDefect/Generated/NF707/
          if-no-files-found: ignore
