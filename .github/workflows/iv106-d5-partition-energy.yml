name: IV106-D5 global partition energy
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv106/iv106_d5/ActualZetaIV106D5PartitionEnergy.lean'
      - '.github/workflows/iv106-d5-partition-energy.yml'
permissions:
  contents: read
jobs:
  physical-action:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5c5ae2b1763bfe18f07e61026b55f06c311633ba
          path: predecessor_d4
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C predecessor_d4 rev-parse HEAD)" = 5c5ae2b1763bfe18f07e61026b55f06c311633ba
          test "$(git -C predecessor_d4 hash-object verification/iv106/iv106_d4/ActualZetaIV106D4CellEnergy.lean)" = 72fa49efb8090c2cec660da35ffc34a638d3370a
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.lean
          cp predecessor_d4/verification/iv106/iv106_d4/ActualZetaIV106D4CellEnergy.lean research/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.lean
          test "$(git -C candidate hash-object verification/iv106/iv106_d5/ActualZetaIV106D5PartitionEnergy.lean)" = a9bdf14c3c7698e0593f0eff6d9ff1e4a1cd9165
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv106/iv106_d5/ActualZetaIV106D5PartitionEnergy.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.lean
          cp candidate/verification/iv106/iv106_d5/ActualZetaIV106D5PartitionEnergy.lean research/WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv106-d5/out
          touch iv106-d5/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV106D5PartitionEnergy 2>&1 | tee iv106-d5/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.olean -nt iv106-d5/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV106D5PartitionEnergy' '#print axioms WeilDefect.neutralIV106D5Closed_cell' '#print axioms WeilDefect.neutralIV106D5Cell_energy' '#print axioms WeilDefect.neutralIV106D5Partition_energy' > /tmp/iv106-d5-axioms.lean
          lake env lean /tmp/iv106-d5-axioms.lean 2>&1 | tee iv106-d5/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv106-d5/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==3 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV106D5Closed_cell","neutralIV106D5Cell_energy","neutralIV106D5Partition_energy"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV106-D5 strict named axioms PASS 3/3')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.olean WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.olean > iv106-d5/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv106-d5-physical-action-evidence
          path: |
            research/iv106-d5/out/
            research/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D4CellEnergy.olean
            research/WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D5PartitionEnergy.olean
          include-hidden-files: true
          if-no-files-found: error
