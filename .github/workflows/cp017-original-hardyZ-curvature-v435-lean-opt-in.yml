name: CP017 OPT-IN original Zeta 4.35 HardyZ curvature conditional genuine kernel
# Explicit label only: preserve independent IV###/NF### queued compiler capacity.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: cp017-external-zeta-original-435-curvature-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-conditional-curvature-lean-kernel:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'cp017-curvature-lean' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Zeta-v1-1e6 external Lean v4.35
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pin original external Zeta commit and source existence; verify the FOUR genuine SHA blobs
        working-directory: cp011_zeta_v435
        timeout-minutes: 65
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/Zeta rev-parse HEAD)" = c06b4e13d9c847e50a32c3d738271cbad62ae9f3
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          python ../scripts/cp017_hardyZ_curvature_budget_preflight.py \
            --self-test --zeta .lake/packages/Zeta --mathlib .lake/packages/mathlib \
            --receipt cp017-real-original-source-analytic-premises.json
      - name: ACTUAL original kernel build of all source rank and curvature dependencies
        working-directory: cp011_zeta_v435
        timeout-minutes: 155
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build CP013RSOnly CP013Seam CP014FiniteCut CP014ZetaCut \
            CP014HardyRank CP015SourceWitnesses CP016FirstRSRank \
            CP016MonotoneAttach CP017CurvatureBudget 2>&1 \
            | tee cp017-original-real-lean-build.log
      - name: Real Lean 4.35 conditional curvature .olean and six standard axiom receipts
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          (cd cp011_zeta_v435 && lake env lean CP017CurvatureBudget.lean) 2>&1 \
            | tee cp011_zeta_v435/cp017-real-source-curvature-axioms.log
          python scripts/cp017_original_curvature_lean_axiom_audit.py
          test -s cp011_zeta_v435/cp017-conditional-original-hardyZ-curvature-kernel-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp017-external-Zeta4.35-curvature-conditional-only-real-kernel
          path: |
            cp011_zeta_v435/cp017-real-original-source-analytic-premises.json
            cp011_zeta_v435/cp017-original-real-lean-build.log
            cp011_zeta_v435/cp017-real-source-curvature-axioms.log
            cp011_zeta_v435/cp017-conditional-original-hardyZ-curvature-kernel-receipt.json
            cp011_zeta_v435/.lake/build/lib/lean/CP017CurvatureBudget.olean
          if-no-files-found: ignore
          include-hidden-files: true
