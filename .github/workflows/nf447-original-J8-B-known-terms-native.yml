name: Weil-Lab NF447 original J8 B known source terms native
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf447_original_B_all_nonintegral_terms_native.py'
      - '.github/workflows/nf447-original-J8-B-known-terms-native.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-all-physical-source-prime-powers-at-B:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install python-flint==0.8.0
      - name: Retrieve original NF445 source and exact derivative kernel certificates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/{nf445,derivative}
          gh run download 41387527946 --repo "$GITHUB_REPOSITORY" --name NF445-original-correlated-Rm-Laplace-source-native --dir artifacts/nf445
          gh run download 41393532381 --repo "$GITHUB_REPOSITORY" --name NF447-original-B-exact-weighted-derivative-kernel --dir artifacts/derivative
          printf '%s  %s\n' 51b8e0850c678085580940b3ab9afeff8277f446d4407c0200fb75754970db32 artifacts/nf445/NF445_original_source_correlated_Rm_laplace.json | sha256sum --check
          printf '%s  %s\n' ee5238adc9313428244c8f019b965bd994328f7e890e999ca45a9fd7b63c7bca artifacts/derivative/NF447_original_true_B_derivative_kernel_exact.json | sha256sum --check
      - name: Independent source-native all original B prime-power correct von Mangoldt weights
        run: |
          python3 -m py_compile scripts/local_replay/nf447_original_B_all_nonintegral_terms_native.py
          python3 scripts/local_replay/nf447_original_B_all_nonintegral_terms_native.py \
            --nf445 artifacts/nf445/NF445_original_source_correlated_Rm_laplace.json \
            --nf447-derivative artifacts/derivative/NF447_original_true_B_derivative_kernel_exact.json \
            --precision 2048 --output artifacts/NF447_original_B_all_known_terms_native.json
      - name: True original B source known part certified but no signed or resolved integral
        run: |
          python3 - <<'PY'
          import json,sys
          from fractions import Fraction as F
          sys.set_int_max_str_digits(0)
          d=json.load(open('artifacts/NF447_original_B_all_known_terms_native.json'))
          assert d['pass']=='NF447'
          assert d['original_nf407_source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert d['original_nf445_full_native_json_sha256']=='51b8e0850c678085580940b3ab9afeff8277f446d4407c0200fb75754970db32'
          assert d['original_nf447_true_derivative_certificate_sha256']=='ee5238adc9313428244c8f019b965bd994328f7e890e999ca45a9fd7b63c7bca'
          assert d['original_original_source_246_selected_critical']==246
          assert d['original_source_273_frequency_order']==273
          assert d['original_arb_precision_bits']==2048
          assert d['original_active_regular_minus_prime_powers']==[2,3,4,5,7,8,9]
          assert d['original_active_regular_plus_prime_powers']==[]
          assert d['original_shifted_source_von_mangoldt_weight_typed']
          assert [(x['n'],x['original_von_mangoldt_prime']) for x in d['original_source_shift_terms']]==[(2,2),(3,3),(4,2),(5,5),(7,7),(8,2),(9,3)]
          a,b=map(F,d['original_all_known_joint_arch_scalar_prime_and_center_interval'])
          assert a<=b and b-a<F(1,10**25)
          x,y=map(F,d['original_true_J8_B_z_conservative_interval'])
          assert x<=y and y-x<1805
          assert d['original_unevaluated_compact_derivative_integral_abs_lt']==902
          assert not d['original_numerical_true_J8_B_integral_value_resolved']
          assert not d['original_true_J8_signed_continuous_integral_decided']
          assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF447 original full source J8 B known terms',float(a),float(b),'full z(B) conservative ±902',float(x),float(y))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF447-original-J8-B-all-known-source-native
          path: artifacts/NF447_original_B_all_known_terms_native.json
          if-no-files-found: error
