name: NF618 W02 Batch26 exact qualification
on:
  push:
    branches: [research/nf618-w02-batch26-qualification]
    paths: ['.github/workflows/nf618-w02-batch26-qualification.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5801507d416e4a699c002920b2441f5aa0c19aef
          path: research
          sparse-checkout: |
            scripts/verify_nf620_physical_key_tables.py
            notes/provisional/NF618Batch26Plan.json
            notes/provisional/NF618W02RootAttachment/FrequencyDecomposition.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: dea274a9554f9705bea2202b82c72e144b15d159
          path: historical
          sparse-checkout: |
            custody/run_46076027949-attempt_1/recovery.json
            custody/run_46076027949-attempt_1/nf690-payload/
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 6450fff605d60ac3e9fef1a9ff774ed98281a01b
          path: release
          sparse-checkout: |
            notes/provisional/NF618CustodyHold.json
            notes/provisional/NF618CertifiedSlotLedgerBatch24R1.json
            notes/provisional/NF618CertifiedSlotLedgerBatch25.json
            notes/provisional/NF618W02Batch25Admission.json
            scripts/local_replay/NF618W02AdvanceBatch25.py
          sparse-checkout-cone-mode: false
      - name: Exact external Batch26 qualification with historical evaluator control
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git hash-object research/notes/provisional/NF618Batch26Plan.json)" = 26aef7a4b21aa2985fbbd72675f16be131202a99
          test "$(git hash-object research/notes/provisional/NF618W02RootAttachment/FrequencyDecomposition.json)" = 1558a62fe99f3a10e34eb75106cab6028b3997ad
          test "$(git hash-object release/notes/provisional/NF618CustodyHold.json)" = cae9fe7d42c32ad7269348b8f0176863c9149986
          python3 release/scripts/local_replay/NF618W02AdvanceBatch25.py | tee evidence/parent-ledger-replay.log
          cp qualification.py evidence/
          cp research/scripts/verify_nf620_physical_key_tables.py evidence/
          python3 qualification.py 2>&1 | tee evidence/qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf618-w02-batch26-qualification
          path: evidence/
          if-no-files-found: error
  custody:
    needs: diagnose
    if: always() && needs.diagnose.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nf618-w02-batch26-qualification
      - name: Preserve exact diagnostic receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.diagnose.result }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          d="custody/run_$GITHUB_RUN_ID-attempt_$GITHUB_RUN_ATTEMPT"
          mkdir -p "$d"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq -e '[.artifacts[] | select(.name=="nf618-w02-batch26-qualification" and .expired==false)] | if length==1 then .[0] else error("missing evidence") end' > "$d/metadata.json"
          id=$(jq -er .id "$d/metadata.json")
          hash=$(jq -er '.digest | sub("^sha256:";"")' "$d/metadata.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$d/evidence.zip"
          echo "$hash  $d/evidence.zip" | sha256sum -c -
          python3 -m zipfile -t "$d/evidence.zip"
          printf 'diagnose_result=%s\nhead=Batch25\nnew_admissions=0\nuniversal_hold=unchanged\n' "$RESULT" > "$d/status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if python3 -m zipfile -l "$d/evidence.zip" | grep -q 'summary.json'; then unzip -p "$d/evidence.zip" summary.json > "$d/summary.json"; fi
          git add "$d"
          git commit -m 'NF618 preserve exact Batch26 qualification [skip ci]'
          git push origin "HEAD:refs/heads/research/nf618-w02-batch26-qualification"
          git fetch --no-tags origin "research/nf618-w02-batch26-qualification"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          test "$(git show "FETCH_HEAD:$d/evidence.zip" | sha256sum | cut -d' ' -f1)" = "$hash"
