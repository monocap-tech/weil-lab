name: NF702 complete original scaled inputs and first full-payment rows
on:
  pull_request:
    paths:
      - "scripts/emit_nf702_original_global_inputs.py"
      - ".github/workflows/nf702-original-global-input-projection.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf702-global-inputs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original full numeric payload and accepted compact coverage source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p WeilDefect/Generated/NF690
          fetch() {
            local id="$1" name="$2" digest="$3" dest="$4"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$name.zip"
            echo "$digest  $name.zip" | sha256sum -c -
            unzip -q "$name.zip" -d "$dest"
          }
          fetch 14551493244 compact 37be910efa7d204c9db35f62bf9d5f818ece77c7026d94d9c84e4ddba0df41a5 WeilDefect/Generated
          fetch 14558233793 payload 2327fbf952d4894c9f28f81cad9e94d226c93131d9ef2fafa14c35f482211b70 WeilDefect/Generated/NF690
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('WeilDefect/Generated')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          d=root/'NF690'
          m=json.loads((d/'manifest.json').read_text())
          assert (m['keys'],m['rows'],m['chunks'],m['chunk_width'])==(7835,37994,490,16)
          assert [r['index'] for r in m['slots']]==list(range(7835))
          assert len({tuple(r['key']) for r in m['slots']})==7835
          assert sum(r['rows'] for r in m['slots'])==37994
          assert m['metadata_sha256']==sha(root/'NF679/Metadata.lean')
          assert m['compact_manifest_sha256']==sha(root/'NF687/manifest.json')
          for name in ('NF682','NF687','NF690'):
              p=root/name
              for f in json.loads((p/'manifest.json').read_text())['files']:
                  assert sha(p/f['file'])==f['sha256']
                  if 'bytes' in f: assert (p/f['file']).stat().st_size==f['bytes']
          assert {f'Chunk{i:03d}.lean' for i in range(490)}|{'Bank.lean','Coverage.lean'} <= {f['file'] for f in m['files']}
          out=root/'NF691'
          out.mkdir(exist_ok=True)
          (out/'OriginalLookup.lean').write_text("""import WeilDefect.Generated.NF690.Coverage
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalBlockLocalLookup

          namespace WeilDefect

          def nf691OriginalLookup : NF622Moments :=
            neutralNF691Lookup nf687Read nf687Size nf690Payload

          theorem nf691OriginalLookup_eq :
              neutralNF624Lookup nf690OriginalBank (neutralNF624Index nf690OriginalBank) =
                nf691OriginalLookup :=
            neutralNF691Lookup_eq nf687Read nf687Size nf690Payload

          theorem nf691OriginalCoverage :
              neutralNF624CoverageCheck nf690OriginalBank (neutralNF624Index nf690OriginalBank)=true :=
            nf690OriginalCoverage

          #print axioms nf691OriginalLookup_eq
          #print axioms nf691OriginalCoverage

          end WeilDefect
          """)
          print('NF691 authenticated all 490 original chunks and exact coverage sources')
          PY
      - name: Install pinned Lean and Mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Bind independently restored exact bank source and Lean environment
        run: python scripts/nf697_compiled_bank_binding.py
      - uses: actions/download-artifact@v4
        with:
          name: nf697-audited-compiled-bank
          path: compiled-bank
          run-id: 44598398608
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify producer binding and audit before restoring compiled objects
        run: |
          set -euo pipefail
          cmp nf697-bank-binding.json compiled-bank/nf697-bank-binding.json
          (cd compiled-bank && sha256sum -c nf697-project-build.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('compiled-bank/nf691-complete-audit.json')
          m=json.loads(p.read_text())
          assert (m['keys'],m['rows'],m['chunks'])==(7835,37994,490)
          assert len(m['theorems'])==14
          assert {'nf691OriginalCoverage','nf691OriginalLookup_eq'}<=set(m['theorems'])
          assert all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in m['theorems'].values())
          PY
          tar -xzf compiled-bank/nf697-project-build.tar.gz
      - name: Measure restored bank Lake build and audit imported exact bank
        timeout-minutes: 120
        run: |
          set -euo pipefail
          /usr/bin/time -o nf697-reuse-time.txt -f 'elapsed=%e user=%U rss_kb=%M exit=%x' lake build WeilDefect.Generated.NF691.OriginalLookup 2>&1 | tee nf697-reuse.log
          cat >/tmp/nf697BankAudit.lean <<'EOF'
          import WeilDefect.Generated.NF691.OriginalLookup
          #print axioms WeilDefect.nf691OriginalCoverage
          #print axioms WeilDefect.nf691OriginalLookup_eq
          EOF
          lake env lean /tmp/nf697BankAudit.lean 2>&1 | tee nf697-bank-axioms.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-flint==0.8.0
      - name: Bind original frame, widened entries, payments and accepted NF695 receipts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          fetch() {
            local id="$1" name="$2" digest="$3"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "inputs/$name.zip"
            echo "$digest  inputs/$name.zip" | sha256sum -c -
            mkdir -p "inputs/$name"
            unzip -q "inputs/$name.zip" -d "inputs/$name"
          }
          fetch 14443252637 frame 3621906bd54c007900ca082ae1d2ee783d05d28ab5f3caab78b4a870b33abc7c
          fetch 14459025571 entries e91a83cae117e98608aefa6849dac178e4ddb58dd1dffbfe37304ad248af9ed9
          fetch 14458146136 payments 8cbae72a7714dc555c0183edfbbda077096ef910b1e284d4abc91c4960d95e6e
          fetch 14569367307 accepted 68a5fafe7ba038639ae628ab87baed86f7e68a07e90a07976633a4dede681015
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path('inputs/accepted')
          found=[p for p in root.rglob('manifest.json') if p.parent.name=='NF695']
          assert len(found)==1
          d=found[0].parent
          m=json.loads(found[0].read_text())
          receipts=list(root.rglob('nf695-complete-audit.json'))
          assert len(receipts)==1
          a=json.loads(receipts[0].read_text())
          assert a['rows']==m['rows'] and [r['row'] for r in m['rows']]==list(range(8))
          names={'nf691OriginalCoverage','nf691OriginalLookup_eq'}|{n for r in m['rows'] for n in r['theorems']}
          assert set(a['axioms'])==names and len(names)==26
          assert all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in a['axioms'].values())
          for r in m['rows']:
              assert hashlib.sha256((d/r['file']).read_bytes()).hexdigest()==r['sha256']
          shutil.copytree(d,Path('WeilDefect/Generated/NF695'))
          PY
          python -m py_compile scripts/emit_nf702_original_global_inputs.py
          python scripts/emit_nf702_original_global_inputs.py --root . --historical inputs/frame/nf623-historical-entries.jsonl.gz --entries inputs/entries/nf631-widened-entries.jsonl.gz --payments inputs/payments/nf631-widened-payments.json --prior WeilDefect/Generated/NF695 --output WeilDefect/Generated/NF702Inputs
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF702Inputs')
          m=json.loads((d/'manifest.json').read_text())
          assert m['rows']==242 and len(m['input_modules'])==61
          assert [r['row'] for r in m['projection_rows']]==list(range(8))
          assert all(len(r['theorems'])==6 for r in m['projection_rows'])
          for r in m['files']: assert hashlib.sha256((d/r['file']).read_bytes()).hexdigest()==r['sha256']
          PY
      - name: Compile the complete exact original input data in bounded chunks
        timeout-minutes: 150
        run: |
          set -euo pipefail
          for ((i=0;i<242;i+=4)); do
            printf -v n '%03d' "$i"
            lake build "WeilDefect.Generated.NF702Inputs.Rows$n" 2>&1 | tee -a nf702-input-build.log
          done
          lake build WeilDefect.Generated.NF702Inputs.Data 2>&1 | tee -a nf702-input-build.log
      - name: Attach accepted physical row receipts to the complete original scaled payment
        timeout-minutes: 115
        run: |
          set -euo pipefail
          for ((i=0;i<8;i++)); do
            printf -v n '%03d' "$i"
            lake build "WeilDefect.Generated.NF702Inputs.Attach$n" 2>&1 | tee -a nf702-projections.log
          done
      - name: Strict global input and actual payment row proof audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF702Inputs')
          m=json.loads((d/'manifest.json').read_text())
          names=['nf702InputH_symm','nf702OriginalW']+[n for r in m['projection_rows'] for n in r['theorems']]
          Path('/tmp/nf702InputsAudit.lean').write_text(''.join(f"import WeilDefect.Generated.NF702Inputs.{r['module']}\n" for r in m['projection_rows'])+''.join(f'#print axioms WeilDefect.{n}\n' for n in names))
          Path('nf702-input-names.txt').write_text('\n'.join(names)+'\n')
          PY
          lake env lean /tmp/nf702InputsAudit.lean 2>&1 | tee nf702-input-axioms.log
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          d=Path('WeilDefect/Generated/NF702Inputs')
          m=json.loads((d/'manifest.json').read_text())
          names=set(Path('nf702-input-names.txt').read_text().splitlines())
          found={}
          log=Path('nf702-input-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",log):
              if n in names:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",log):
              if n in names:
                  assert n not in found
                  found[n]=[]
          assert set(found)==names and len(found)==50
          assert all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for r in m['files']: assert sha(d/r['file'])==r['sha256']
          m['axioms']=found
          m['manifest_sha256']=sha(d/'manifest.json')
          Path('nf702-input-complete-audit.json').write_text(json.dumps(m,indent=2)+'\n')
          print('NF702 complete original input object and eight unconditional payment row gates LEAN PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf702-original-global-input-projection
          path: |
            nf702-input-*.log
            nf702-projections.log
            nf702-input-complete-audit.json
            WeilDefect/Generated/NF702Inputs/
          if-no-files-found: ignore
