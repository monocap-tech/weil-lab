name: IV090 original integrated Gamma error — kernel gate

on:
  push:
    branches:
      - research/iv090-original-integrated-gamma-error-gate
    paths:
      - "WeilDefect/Arithmetic/ActualZetaIV090OriginalIntegratedGammaErrorGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV089OriginalGammaQuadraticTailGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV086OriginalPhysicalWeilLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalMixedHermitian.lean"
      - "WeilDefect/Arithmetic/ActualZetaSmoothCorrelationRegularity.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV071GammaFinitePrelude.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV080GammaLinearEnvelopeGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV078FiniteGammaTruncationGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV079GammaDominatedLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV081GammaWeightedCompactC2Gate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV082CompactC2FourierL1Gate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV084OriginalPolePhysicalGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV085OriginalPrimeFiniteGate.lean"
      - ".github/workflows/iv090-original-integrated-gamma-error.yml"
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaIV090OriginalIntegratedGammaErrorGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV089OriginalGammaQuadraticTailGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV086OriginalPhysicalWeilLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaPhaseIVOriginalMixedHermitian.lean"
      - "WeilDefect/Arithmetic/ActualZetaSmoothCorrelationRegularity.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV071GammaFinitePrelude.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV080GammaLinearEnvelopeGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV078FiniteGammaTruncationGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV079GammaDominatedLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV081GammaWeightedCompactC2Gate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV082CompactC2FourierL1Gate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV084OriginalPolePhysicalGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV085OriginalPrimeFiniteGate.lean"
      - ".github/workflows/iv090-original-integrated-gamma-error.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iv090-original-paperft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-integrated-gamma-error-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Strict IV090 original-source preflight
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("WeilDefect/Arithmetic/ActualZetaIV090OriginalIntegratedGammaErrorGate.lean").read_text()
          names=[
              "neutralIV090ErrorIntegrand_bound",
              "neutralIV090GammaProduct_integrable_compactC2",
              "neutralIV090WeilError_eq_integral",
              "neutralIV090WeilError_bound",
          ]
          assert all(s.count("#print axioms "+n)==1 for n in names)
          assert not re.search(r"\b(?:sorry|admit|sorryAx)\b",s)
          print("IV090 strict preflight: four exact original-source bridge declarations")
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          lake exe cache get
      - name: Native fresh Lean source build
        run: |
          set -euo pipefail
          mkdir -p iv090/out
          touch iv090/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV090OriginalIntegratedGammaErrorGate.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV090OriginalIntegratedGammaErrorGate 2>&1 | tee iv090/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV090OriginalIntegratedGammaErrorGate.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV090OriginalIntegratedGammaErrorGate.olean -nt iv090/out/fresh.stamp
      - name: Exact strict named axiom audit
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaIV090OriginalIntegratedGammaErrorGate.lean 2>&1 | tee iv090/out/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          t=Path("iv090/out/axioms.log").read_text()
          names=[
              "neutralIV090ErrorIntegrand_bound",
              "neutralIV090GammaProduct_integrable_compactC2",
              "neutralIV090WeilError_eq_integral",
              "neutralIV090WeilError_bound",
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          found={}
          for name in names:
              full="WeilDefect."+name
              pat=re.compile(r"^'"+re.escape(full)+r"' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)\s*$",re.M)
              hits=list(pat.finditer(t))
              assert len(hits)==1, (full,len(hits),t[-1200:])
              axioms=({a.strip() for a in hits[0].group(1).split(",") if a.strip()}
                      if hits[0].group(1) is not None else set())
              assert axioms<=allowed,(full,axioms-allowed)
              found[full]=sorted(axioms)
          assert not re.search(r'(?m)^\s*(?:error:|.*: error:)',t)
          Path("iv090/out/receipts.json").write_text(json.dumps(found,sort_keys=True,indent=2)+"\n")
          print("IV090 four strict source/axiom receipts PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv090-original-integrated-gamma-error-native-lean-receipts
          path: |
            iv090/out/
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV090OriginalIntegratedGammaErrorGate.olean
          if-no-files-found: ignore
          include-hidden-files: true
