name: Weil-Lab NF441 original J1 J2 J8 native principal p0
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf441_original_cells1_2_8_principal_p0_native.py'
      - '.github/workflows/nf441-original-cells1-2-8-principal-p0.yml'
permissions:
  contents: read
jobs:
  original-principal-log-endpoint-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install python-flint==0.8.0
      - name: Source-original true p0 on J1 J2 and J8 with log endpoint limit
        run: |
          python3 -m py_compile scripts/local_replay/nf441_original_cells1_2_8_principal_p0_native.py
          python3 scripts/local_replay/nf441_original_cells1_2_8_principal_p0_native.py --precision 2048 --output artifacts/NF441_original_true_J1_J2_J8_principal_p0.json
      - name: Source-pinned original J8 log endpoint and NF410 independent p0
        run: |
          python3 - <<'PY'
          import json,sys
          sys.set_int_max_str_digits(0)
          from fractions import Fraction as F
          d=json.load(open('artifacts/NF441_original_true_J1_J2_J8_principal_p0.json'))
          assert d['pass']=='NF441' and d['original_precision_bits']==2048
          assert d['original_source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert d['original_seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert d['cells']['1']['original_r_jump_active']==[]
          assert d['cells']['2']['original_r_jump_active']==[3]
          assert d['cells']['8']['original_r_jump_active']==[2,3,4,5,7,8,9]
          assert d['cells']['8']['original_q_log_endpoint_integrated_by_limit']
          for c in d['cells'].values():
              assert c['independent_NF410_p0_overlap'] and c['signed_p0_strict_negative']
              a,b=map(F,c['source_original_p0_interval'])
              assert a<=b<0 and b-a<F(1,10**30)
              assert not c['complete_true_signed_J_integral']
          assert not d['original_true_J1_J2_J8_signed_pz_z2_integrated']
          assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF441 PASS source-original independent p0 for 1/2/8, endpoint log integrated by limit; z and signed D OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF441-original-true-J1-J2-J8-principal-p0
          path: artifacts/NF441_original_true_J1_J2_J8_principal_p0.json
          if-no-files-found: error
