name: Weil-Lab NF436 original cell3 source-native high Chebyshev modes 256 to 511
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf436_original_cell3_correlated_cheb256to511_native.py'
      - '.github/workflows/nf436-original-cell3-high256-and-overlap.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-cell3-native-high256-and-parent-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-native rigorous Arb and Acb
        run: python3 -m pip install python-flint==0.8.0
      - name: Original physical cell3 a256..a511 - 256 new native source coefficients
        run: |
          python3 -m py_compile scripts/local_replay/nf436_original_cell3_correlated_cheb256to511_native.py
          python3 scripts/local_replay/nf436_original_cell3_correlated_cheb256to511_native.py \
            --start 256 --stop 512 --precision 2048 \
            --output artifacts/NF436_original_cell3_Chebyshev_256_to_511_native.json
      - name: Independent short-padding original-source high-index overlap n248..255
        run: |
          python3 scripts/local_replay/nf436_original_cell3_correlated_cheb256to511_native.py \
            --start 248 --stop 256 --precision 2048 \
            --output artifacts/NF436_original_cell3_short_high8_overlap.json
      - name: Retrieve accepted NF435 source-coefficient artifact exactly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/nf435
          gh run download 41280032835 --repo "$GITHUB_REPOSITORY" \
            --name NF435-original-true-cell3-native-Chebyshev-modes32to255 --dir artifacts/nf435
      - name: SHA-pinned source, n248..255 independent overlap, high256 widths and original scope
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from fractions import Fraction as F
          p_raw=Path('artifacts/nf435/NF435_original_cell3_cheb32to255_native.json').read_bytes()
          assert hashlib.sha256(p_raw).hexdigest()=='23be9e821235569c9b8075b3916c843376dbdd742cd71063e49025260bda7546'
          p=json.loads(p_raw)
          h=json.load(open('artifacts/NF436_original_cell3_Chebyshev_256_to_511_native.json'))
          c=json.load(open('artifacts/NF436_original_cell3_short_high8_overlap.json'))
          assert p['pass']=='NF435' and h['pass']==c['pass']=='NF436'
          assert h['source_sha256']==c['source_sha256']==p['source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert h['seams_sha256']==c['seams_sha256']==p['seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert h['original_true_cell3']==c['original_true_cell3']==p['original_true_cell3']=='(log(4)-11/10,11/10-log(2))'
          assert h['original_exact_NF404_dyadic_center']==c['original_exact_NF404_dyadic_center']==p['original_exact_NF404_dyadic_center']
          assert (h['mode_start_inclusive'],h['mode_stop_exclusive'])==(256,512)
          assert (c['mode_start_inclusive'],c['mode_stop_exclusive'])==(248,256)
          assert len(h['coefficients'])==256 and [v['n'] for v in h['coefficients']]==list(range(256,512))
          assert len(c['coefficients'])==8 and [v['n'] for v in c['coefficients']]==list(range(248,256))
          key='true_original_cell3_fixed_branch_coefficient_outward_interval'
          def ball(v):
              a,b=map(F,v[key])
              assert a<=b and b-a<F(1,10**25)
              return a,b
          for v in h['coefficients']:ball(v)
          for i,v in enumerate(c['coefficients']):
              a,b=ball(v)
              x,y=ball(p['coefficients'][248+i-32])
              assert a<=y and x<=b,('NF435/NF436 distinct absolute padded source coefficient mismatch',248+i)
          for d in [h,c]:
              assert d['original_four_selected_plus_critical_count']==246
              assert d['original_minus_translate_primes']==[2,3,4] and d['original_plus_translate_primes']==[2]
              assert d['original_neither_prime_branches']==[5,7,8,9]
              assert d['original_signed_prime_translate_terms']==4
              assert d['original_independent_direct_source_both_n2_prime_overlap_pass']
              assert d['original_independent_direct_source_endpoint_overlap_pass']
              assert d['common_endpoint_image_indices']==2048
              assert d['original_native_precision_bits']==2048
              assert not d['true_cell3_full_uniform_tail_n512_onward_certified']
              assert not d['true_cell3_signed_pz_and_z2_integrated']
              assert not d['NF404_complete_signed_scalar_decided']
              assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF436 PASS a256..a511 256 NEW original source cell3 + 8 independent parent overlaps, 512 cumulative; true full cell3 signed still OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF436-original-cell3-fullsource-native-high256-n256to511
          path: artifacts/NF436_original_cell3_Chebyshev_256_to_511_native.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NF436-original-cell3-independent-n248to255-overlap
          path: artifacts/NF436_original_cell3_short_high8_overlap.json
          if-no-files-found: error
