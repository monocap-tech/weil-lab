name: NF458 original matched joint-arch finite endpoint part
on:
  pull_request:
  workflow_dispatch:
jobs:
  original-matched-finitepart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - name: Original true J8 full-source finite regular endpoint coefficient, 1600 Laplace modes
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf458_original_J8_matched_arch_finitepart_native.py --output nf458-original-J8-endpoint-finitepart.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf458-original-J8-endpoint-finitepart
          path: nf458-original-J8-endpoint-finitepart.json
          retention-days: 90
