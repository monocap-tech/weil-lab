name: Weil-Lab NF447 true J8 B weighted derivative kernel exact
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf447_original_B_weighted_derivative_kernel_exact.py'
      - '.github/workflows/nf447-original-J8-B-derivative-exact.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-source-real-B-removable-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover ORIGINAL NF445 full 4096bit native source and unsuccessful NF447 ACB pilot, byte pinned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/{nf445,nf447}
          gh run download 41387527946 --repo "$GITHUB_REPOSITORY" --name NF445-original-correlated-Rm-Laplace-source-native --dir artifacts/nf445
          gh run download 41393081856 --repo "$GITHUB_REPOSITORY" --name NF447-original-J8-B-joint-compact-native --dir artifacts/nf447
          printf '%s  %s\n' 51b8e0850c678085580940b3ab9afeff8277f446d4407c0200fb75754970db32 artifacts/nf445/NF445_original_source_correlated_Rm_laplace.json | sha256sum --check
          printf '%s  %s\n' 468678b2c3d8f83deaebb129987d38843abf231faa250f53a4f48fb54941c4ca artifacts/nf447/NF447_original_J8_B_compact_native.json | sha256sum --check
      - name: Exact F-rational derivative source kernel and true original finite endpoint
        run: |
          python3 -m py_compile scripts/local_replay/nf447_original_B_weighted_derivative_kernel_exact.py
          python3 scripts/local_replay/nf447_original_B_weighted_derivative_kernel_exact.py \
            --nf445 artifacts/nf445/NF445_original_source_correlated_Rm_laplace.json \
            --nf447-attempt artifacts/nf447/NF447_original_J8_B_compact_native.json \
            --output artifacts/NF447_original_true_B_derivative_kernel_exact.json
      - name: Independent source and standing checks; numerical signed D7 D8 remain OPEN
        run: |
          python3 - <<'PY'
          import json,sys
          from fractions import Fraction as F
          sys.set_int_max_str_digits(0)
          d=json.load(open('artifacts/NF447_original_true_B_derivative_kernel_exact.json'))
          assert d['pass']=='NF447'
          assert d['original_source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert d['original_nf406_seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert d['original_nf445_4096bit_source_native_sha256']=='51b8e0850c678085580940b3ab9afeff8277f446d4407c0200fb75754970db32'
          assert d['original_nf447_failed_acb_pilot_sha256']=='468678b2c3d8f83deaebb129987d38843abf231faa250f53a4f48fb54941c4ca'
          assert d['original_true_Uprime_B_sup_lt']=='1e-6'
          assert d['original_true_Udoubleprime_L2_upper']==256
          assert d['original_all_weighted_Uprime_arguments_inside_original_compact_support']
          assert d['original_resummed_tK_at_zero_exact_limit']=='1'
          assert F(d['original_exact_integral_I_B_bound'])<902
          assert d['original_certified_integral_I_B_absolute_lt']==902
          assert d['original_original_joint_arch_at_B_absolute_lt']==916
          assert d['original_full_true_physical_zB_absolute_lt']==7300
          assert d['original_small_t_original_ACB_pilot_status']=='METHOD_STOP_NONFINITE_OR_IMAG_NOT_ZERO'
          assert d['original_source_original_acb_pilot_not_a_point_certificate']
          assert not d['original_true_signed_J7_certified']
          assert not d['original_true_signed_J8_certified']
          assert not d['original_full_NF410_NF404_scalar_decided']
          assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF447 TRUE original endpoint derivative identity plus strict z(B)<7300 PASS, native acb nan preserved and signs OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF447-original-B-exact-weighted-derivative-kernel
          path: artifacts/NF447_original_true_B_derivative_kernel_exact.json
          if-no-files-found: error
