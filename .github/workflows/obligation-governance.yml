name: Weil-Lab obligation-first governance

on:
  push:
    branches:
      - research/rpb108-route-consolidation
      - 'governance/obligation-first-*'
    paths:
      - 'research/obligations.json'
      - 'docs/OBLIGATION_FIRST_PROGRESSION.md'
      - 'docs/ACTIVE_FRONTIER.md'
      - 'scripts/verify_obligation_manifest.py'
      - 'scripts/test_obligation_manifest.py'
      - '.github/workflows/obligation-governance.yml'
  pull_request:
    branches:
      - research/rpb108-route-consolidation
    paths:
      - 'research/obligations.json'
      - 'docs/OBLIGATION_FIRST_PROGRESSION.md'
      - 'docs/ACTIVE_FRONTIER.md'
      - 'scripts/verify_obligation_manifest.py'
      - 'scripts/test_obligation_manifest.py'
      - '.github/workflows/obligation-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obligation-contract:
    name: Active obligation custody and declared checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed manifest and dependency tests
        run: |
          python -m unittest discover -s scripts -p test_obligation_manifest.py -v
          python scripts/verify_obligation_manifest.py
      - name: Replay declared active-obligation evidence checks
        run: python scripts/verify_obligation_manifest.py --run-active
