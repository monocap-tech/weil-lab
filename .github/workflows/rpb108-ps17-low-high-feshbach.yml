name: RPB108 PS17 original signed complement low-high Feshbach

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps17_low_high_feshbach.py"
      - "notes/RPB108_PS17_LOW_HIGH_FESHBACH_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps17-low-high-feshbach.yml"
  workflow_dispatch:

jobs:
  ps17-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: True original signed source Schur and low-high Feshbach bounds
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps17_low_high_feshbach.py
          python3 scripts/validate_rpb108_ps17_low_high_feshbach.py
      - name: Enforce no complement PSD or RH promotion
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(value is False for value in p["closures"].values())
          PY
