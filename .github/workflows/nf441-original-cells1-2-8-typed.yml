name: Weil-Lab NF441 original J1 J2 J8 exact source typing
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf441_original_cells1_2_8_typed_geometry_exact.py'
      - '.github/workflows/nf441-original-cells1-2-8-typed.yml'
permissions:
  contents: read
jobs:
  exact-original-source-and-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original NF405/406/407 regular principal source panels
        run: |
          python3 -m py_compile scripts/local_replay/nf441_original_cells1_2_8_typed_geometry_exact.py
          python3 scripts/local_replay/nf441_original_cells1_2_8_typed_geometry_exact.py --output artifacts/NF441_original_J1_J2_J8_typed_geometry.json
      - name: Strict original exact support and true +B boundary STOP
        run: |
          python3 - <<'PY'
          import json,sys
          from fractions import Fraction as F
          sys.set_int_max_str_digits(0)
          d=json.load(open('artifacts/NF441_original_J1_J2_J8_typed_geometry.json'))
          assert d['pass']=='NF441'
          assert d['source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert d['seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          x=d['source_physical_cells']
          assert x['1']['original_regular_minus']==[2,3] and x['1']['original_regular_plus']==[2,3]
          assert x['1']['original_principal_jump_active']==[]
          assert x['2']['original_regular_minus']==[2,3] and x['2']['original_regular_plus']==[2]
          assert x['2']['original_principal_jump_active']==[3]
          assert x['8']['original_regular_minus']==x['8']['original_principal_jump_active']==[2,3,4,5,7,8,9]
          assert x['8']['original_regular_plus']==[]
          assert len(x['1']['panels'])==1 and len(x['2']['panels'])==3
          assert all(sum(z['source_optimal_rho_counts'].values())==273 for y in ('1','2') for z in x[y]['panels'])
          assert all(F(v['original_NF410_p0_interval'][1])<0 for v in x.values())
          assert x['8']['original_2048_image_geometric_ratio_tends_to_1_as_x_to_B']
          assert x['8']['original_principal_q_has_log_B_over_B_minus_x_unbounded']
          assert not d['original_signed_J1_J2_J8_certified']
          assert d['W_ODD_NEG']==d['RH']=='OPEN'
          print('NF441 SOURCE-EXACT J1/J2/J8 typed panels and true B singularity method STOP PASS, signed OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF441-original-cells1-2-8-source-typed-geometry
          path: artifacts/NF441_original_J1_J2_J8_typed_geometry.json
          if-no-files-found: error
