name: IV106-E18M plateau mass
on:
  pull_request:
    branches: [main]
    paths:
      - 'verification/iv106/iv106_e18m/ActualZetaIV106E18MPlateauMass.lean'
      - '.github/workflows/iv106-e18m-plateau-mass.yml'
permissions:
  contents: read
jobs:
  plateau-mass:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          path: research
          persist-credentials: false
      - name: Immutable source preflight
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 018f7e59f4129ce521cd3ae86d1afd59d3b64b5f
          test "$(git -C research rev-parse HEAD^{tree})" = f038d8ff25d8f18fbe56a641ab6abded0b6ec8e9
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C candidate hash-object verification/iv106/iv106_e18m/ActualZetaIV106E18MPlateauMass.lean)" = b578bb62636493a471843fa5e296d23207a34fa1
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/iv106/iv106_e18m/ActualZetaIV106E18MPlateauMass.lean
          test ! -e research/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.lean
          cp candidate/verification/iv106/iv106_e18m/ActualZetaIV106E18MPlateauMass.lean research/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.lean
          cmp candidate/verification/iv106/iv106_e18m/ActualZetaIV106E18MPlateauMass.lean research/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv106-e18m/out
          touch iv106-e18m/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV106E18MPlateauMass 2>&1 | tee iv106-e18m/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.olean -nt iv106-e18m/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV106E18MPlateauMass' '#print axioms WeilDefect.neutralIV106E18MBox_integrable' '#print axioms WeilDefect.neutralIV106E18MBox_mass' '#print axioms WeilDefect.neutralIV106E18MPlateau_nonneg' '#print axioms WeilDefect.neutralIV106E18MPlateau_convolution' '#print axioms WeilDefect.neutralIV106E18MPlateau_mass' '#print axioms WeilDefect.neutralIV106E18MCarrier_real' '#print axioms WeilDefect.neutralIV106E18MProfile_nonneg' '#print axioms WeilDefect.neutralIV106E18MProfile_mass' '#print axioms WeilDefect.neutralIV106E18MProfile_translate' '#print axioms WeilDefect.neutralIV106E18MProfile_compact' '#print axioms WeilDefect.neutralIV106E18MProfile_weight_pos' '#print axioms WeilDefect.neutralIV106E18MProfile_weight_translate' > /tmp/iv106-e18m-axioms.lean
          lake env lean /tmp/iv106-e18m-axioms.lean 2>&1 | tee iv106-e18m/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv106-e18m/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==12 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV106E18MBox_integrable","neutralIV106E18MBox_mass","neutralIV106E18MPlateau_nonneg","neutralIV106E18MPlateau_convolution","neutralIV106E18MPlateau_mass","neutralIV106E18MCarrier_real","neutralIV106E18MProfile_nonneg","neutralIV106E18MProfile_mass","neutralIV106E18MProfile_translate","neutralIV106E18MProfile_compact","neutralIV106E18MProfile_weight_pos","neutralIV106E18MProfile_weight_translate"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV106-E18M strict named axioms PASS 12/12')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.olean > iv106-e18m/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv106-e18m-plateau-mass-evidence
          path: |
            research/iv106-e18m/out/
            research/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106E18MPlateauMass.olean
          include-hidden-files: true
          if-no-files-found: error
