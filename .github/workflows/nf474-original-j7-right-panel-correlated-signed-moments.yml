name: NF474 original J7 right [53/50,27/25] 12000-image signed moments
on:
  pull_request:
  workflow_dispatch:
jobs:
  central:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf471_original_J7_joint_arch_mean_native.py candidate/scripts/local_replay/nf474_original_J7_right_macro_signed_native.py native/scripts/local_replay/
      - name: Original 246-source central digamma, pole, dyadic center and principal logarithm
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf474_original_J7_right_macro_signed_native.py --part central --output nf474-central.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf474-original-central
          path: native/nf474-central.json
          retention-days: 90
  primes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf471_original_J7_joint_arch_mean_native.py candidate/scripts/local_replay/nf474_original_J7_right_macro_signed_native.py native/scripts/local_replay/
      - name: Original six true physical J7 negative prime translations, full 273 group
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf474_original_J7_right_macro_signed_native.py --part primes --output nf474-primes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf474-original-primes
          path: native/nf474-primes.json
          retention-days: 90
  image-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - start: 0
            stop: 1000
          - start: 1000
            stop: 2000
          - start: 2000
            stop: 3000
          - start: 3000
            stop: 4000
          - start: 4000
            stop: 5000
          - start: 5000
            stop: 6000
          - start: 6000
            stop: 7000
          - start: 7000
            stop: 8000
          - start: 8000
            stop: 9000
          - start: 9000
            stop: 10000
          - start: 10000
            stop: 11000
          - start: 11000
            stop: 12000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf471_original_J7_joint_arch_mean_native.py candidate/scripts/local_replay/nf474_original_J7_right_macro_signed_native.py native/scripts/local_replay/
      - name: Both original J7 endpoint images source-correlated Taylor coefficient block
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf474_original_J7_right_macro_signed_native.py --part images --start ${{ matrix.start }} --stop ${{ matrix.stop }} --output nf474-images-${{ matrix.start }}-${{ matrix.stop }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf474-original-images-${{ matrix.start }}-${{ matrix.stop }}
          path: native/nf474-images-${{ matrix.start }}-${{ matrix.stop }}.json
          retention-days: 90
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf474_original_J7_left_boundary_compact_joint_native.py native/scripts/local_replay/
      - name: Independent original physical x=53/50 joint compact kernel point
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf474_original_J7_left_boundary_compact_joint_native.py --mode joint-node --x 53/50 --output nf474-original-J7-left-boundary-point.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf474-original-left-boundary-compact-point
          path: native/nf474-original-J7-left-boundary-point.json
          retention-days: 90
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [central, primes, image-chunk, boundary]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: nf474-original-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: nf474-original-left-boundary-compact-point
          path: boundary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf471_original_J7_joint_arch_mean_native.py candidate/scripts/local_replay/nf474_original_J7_right_macro_signed_native.py native/scripts/local_replay/
      - name: Original J7 [53/50,27/25] 12000-image full-source coefficient sum, signed moments and independent physical left boundary
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf474_original_J7_right_macro_signed_native.py --part assemble --input-dir ../results --nf474-boundary-receipt ../boundary/nf474-original-J7-left-boundary-point.json --nf471-receipt ../candidate/notes/data/provisional/NF471_original_J7_complete_macroscopic_mean_custody.json --output ../nf474-original-J7-source-signed-moments.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf474-original-J7-signed-moments
          path: nf474-original-J7-source-signed-moments.json
          retention-days: 90
