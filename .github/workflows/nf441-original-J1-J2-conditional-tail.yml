name: Weil-Lab NF441 original J1 J2 conditional 512 source tails
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local_replay/nf441_original_J1_J2_512_tail_conditional_exact.py'
      - '.github/workflows/nf441-original-J1-J2-conditional-tail.yml'
permissions:
  contents: read
jobs:
  original-source-J1-J2-conditional-response:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original 273 source groups and analytic image/pole/log conditional tails
        run: |
          python3 -m py_compile scripts/local_replay/nf441_original_J1_J2_512_tail_conditional_exact.py
          python3 scripts/local_replay/nf441_original_J1_J2_512_tail_conditional_exact.py --output artifacts/NF441_original_J1_J2_conditional_tail.json
      - name: Require original unchanged source and conditional status
        run: |
          python3 - <<'PY'
          import json,sys
          sys.set_int_max_str_digits(0)
          from fractions import Fraction as F
          x=json.load(open('artifacts/NF441_original_J1_J2_conditional_tail.json'))
          assert x['pass']=='NF441'
          assert x['original_source_sha256']=='0a83cdb71c7d7d0b412f30564aff34fb560140300e02fe08b28302d940b2fcce'
          assert x['original_seams_sha256']=='c2731e3bc422786a28cee7c058c1b41078e80935a6417ba1a149fba14c640675'
          assert len(x['cells']['1'])==1 and len(x['cells']['2'])==3
          for cells in x['cells'].values():
              for p in cells:
                  assert sum(p['best_rho_counts'].values())==273
                  assert F(p['original_512_midpoint_fee_conditional'])==512*F(5,10**45)
                  assert F(p['original_uniform_z_P511_conditional_bound'])<F(1,10**38)
                  assert not p['original_native_512_accepted']
          assert not x['original_J1_J2_512_native_source_coefficients_complete']
          assert x['W_ODD_NEG']==x['RH']=='OPEN'
          print('NF441 PASS original J1/J2 four sourcewise conditional 512 remainder candidates, 512 actual native coeffs still OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NF441-original-J1-J2-conditional-512-source-tails
          path: artifacts/NF441_original_J1_J2_conditional_tail.json
          if-no-files-found: error
