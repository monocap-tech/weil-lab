name: NF618 W02 seed and admitted-row pilot
on:
  push:
    branches: [formalization/nf618-w02-native-gate]
    paths: ['.github/workflows/nf618-w02-seed-pilot.yml']
permissions:
  contents: read
concurrency:
  group: nf618-w02-native-gate
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5801507d416e4a699c002920b2441f5aa0c19aef
          path: research
          persist-credentials: false
      - name: Authenticate next-gate inputs and G0 receipt
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git hash-object next/NF618W02Seeds.lean)" = 7473827470835126492dea0f9353ae05dbcc76c9
          test "$(git hash-object next/generate.py)" = 1f37fb33247e99896ee64b2feb4eb14d205b9f2f
          test "$(git hash-object next/run.sh)" = 570cd782a9efc096c39bffd13497de4c4735f47c
          test "$(git hash-object next/audit.py)" = 8d64f2f244c0ebea20e7a497675f59cecbb6994d
          echo 'acd29eca20951286d1ff675c940dca2b5f2100bf09c207ff794f69bac9ce1cc4  custody/nf618-w02-native/run_46073540886-attempt_1.zip' | sha256sum -c -
          bash -n next/run.sh
          python3 -m py_compile next/generate.py next/audit.py
          cp next/*.{lean,py,sh,md} evidence/
          printf 'workflow_head=%s\nrun_id=%s\nresearch_head=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(git -C research rev-parse HEAD)" > evidence/environment.txt
      - name: Install pinned Elan
        shell: bash
        run: |
          set -euo pipefail
          {
            archive="$RUNNER_TEMP/elan.tar.gz"
            digest=0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
            fetch_verified() {
              rm -f "$archive"
              curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 180 "$@" -o "$archive" &&
                printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
            }
            if ! fetch_verified https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz; then
              fetch_verified -H 'Accept: application/octet-stream' "https://api.github.com/repos/leanprover/elan/releases/assets/763468108?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            fi
            mkdir -p "$RUNNER_TEMP/elan"
            tar -xzf "$archive" -C "$RUNNER_TEMP/elan"
            "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            "$HOME/.elan/bin/elan" --version
          } 2>&1 | tee evidence/elan-install.log
      - name: Seed proof, checkpoint and four admitted table pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash next/run.sh 2>&1 | tee evidence/console.log
      - name: Export native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf618-w02-seed-pilot-evidence
          path: evidence/
          if-no-files-found: error
          include-hidden-files: true
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Recover three exact historical producer ZIPs independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical
          fetch() {
            local name="$1" id="$2" digest="$3"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "historical/$name.meta.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "historical/$name.zip"
            printf '%s  %s\n' "$digest" "historical/$name.zip" | sha256sum -c -
            python3 -m zipfile -t "historical/$name.zip"
          }
          fetch hybrid 15149930460 96bd3e816d227a41ce60ee643fae020c05107384e770ff26043db521713b1918
          fetch batch24-source 15167620333 72b366246a55f5e2bc4defca1441623075dc651d7b6c20d718ae97b0c27fdba3
          fetch batch24-evidence 15167052822 18bc48a722598212a9fe1090bc728efa5e15baf06985c1499efe637f7b1c88ce
          printf 'Three historical archives recovered; no full custody release or independent batch admission implied.\n' > historical/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf618-w02-historical-evidence
          path: historical/
          if-no-files-found: error
  custody:
    needs: [native, historical]
    if: always() && needs.native.result != 'cancelled' && needs.historical.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: formalization/nf618-w02-native-gate
          fetch-depth: 1
      - name: Preserve evidence with digest-checked chunks and remote readback
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          NATIVE_RESULT: ${{ needs.native.result }}
          HISTORICAL_RESULT: ${{ needs.historical.result }}
        shell: bash
        run: |
          set -euo pipefail
          branch=formalization/nf618-w02-native-gate
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          d="custody/nf618-w02-next/run_$GITHUB_RUN_ID-attempt_$GITHUB_RUN_ATTEMPT"
          mkdir -p "$d"
          for name in nf618-w02-seed-pilot-evidence nf618-w02-historical-evidence; do
            meta="$d/$name.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq -e --arg n "$name" '[.artifacts[] | select(.name == $n and .expired == false)] | if length == 1 then .[0] else error("expected one artifact") end' > "$meta"
            id=$(jq -er .id "$meta")
            digest=$(jq -er '.digest | select(startswith("sha256:")) | sub("^sha256:";"")' "$meta")
            tmp="$RUNNER_TEMP/$name.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$tmp"
            test "$(wc -c < "$tmp")" -eq "$(jq -er .size_in_bytes "$meta")"
            printf '%s  %s\n' "$digest" "$tmp" | sha256sum -c -
            python3 -m zipfile -t "$tmp"
            split -b 32M -d -a 4 "$tmp" "$d/$name.part"
            test "$(cat "$d/$name.part"* | sha256sum | cut -d' ' -f1)" = "$digest"
            rm "$tmp"
          done
          printf 'native_result=%s\nhistorical_result=%s\nmathematical_head=Batch24R1\nnew_moment_admissions=0\n' "$NATIVE_RESULT" "$HISTORICAL_RESULT" > "$d/status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$d"
          git commit -m 'NF618 W02 preserve seed/pilot and historical custody evidence [skip ci]'
          git push origin "HEAD:refs/heads/$branch"
          git fetch --no-tags origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          for name in nf618-w02-seed-pilot-evidence nf618-w02-historical-evidence; do
            digest=$(jq -er '.digest | sub("^sha256:";"")' "$d/$name.json")
            got=$(for p in "$d/$name.part"*; do git show "FETCH_HEAD:$p"; done | sha256sum | cut -d' ' -f1)
            test "$got" = "$digest"
          done
