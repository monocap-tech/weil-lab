name: RC326 original signed three-mode high Ritz and full residual
on:
  push:
    branches:
      - research/rpb108-rc326-native-high-3x3-residual
    paths:
      - "scripts/validate_rpb108_rc326_native_high_3x3_residual.py"
      - ".github/workflows/rc326-native-high-3x3-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original native high 3x3 rational certificate and reversed replay
        run: |
          python scripts/validate_rpb108_rc326_native_high_3x3_residual.py --output certificates/rpb108_rc326_native_high_3x3_residual.json
          python scripts/validate_rpb108_rc326_native_high_3x3_residual.py --output certificates/rpb108_rc326_native_high_3x3_residual.json --replay
      - name: Freeze reproduced rational certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc326_native_high_3x3_residual.json
          if ! git diff --cached --quiet; then
            git commit -m "RC326: freeze original high 3x3 signed native Ritz and infinite residual"
            git fetch origin research/rpb108-rc326-native-high-3x3-residual
            git rebase origin/research/rpb108-rc326-native-high-3x3-residual
            git push origin HEAD:research/rpb108-rc326-native-high-3x3-residual
          fi
