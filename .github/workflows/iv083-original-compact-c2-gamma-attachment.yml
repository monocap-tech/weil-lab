name: IV083 original compact C2 finite-to-infinite Gamma attachment — kernel gate

on:
  push:
    branches:
      - research/iv083-compact-c2-original-gamma-finite-to-infinite-gate
    paths:
      - "WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV071GammaFinitePrelude.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV078FiniteGammaTruncationGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV079GammaDominatedLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV081GammaWeightedCompactC2Gate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV082CompactC2FourierL1Gate.lean"
      - ".github/workflows/iv083-original-compact-c2-gamma-attachment.yml"
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV071GammaFinitePrelude.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV078FiniteGammaTruncationGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV079GammaDominatedLimitGate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV081GammaWeightedCompactC2Gate.lean"
      - "WeilDefect/Arithmetic/ActualZetaIV082CompactC2FourierL1Gate.lean"
      - ".github/workflows/iv083-original-compact-c2-gamma-attachment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iv083-original-paperft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-compact-c2-gamma-attachment-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Strict IV083 original-source preflight
        run: |
          set -euo pipefail
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.lean").read_text()
          names=[
              "neutralIV083FiniteGamma_pairing_compactC2",
              "neutralIV083GammaEnvelope_integrable_compactC2",
              "neutralIV083FiniteSpatial_tendsto_compactC2",
          ]
          assert all(s.count("#print axioms "+n)==1 for n in names)
          assert not re.search(r"\b(?:sorry|admit|sorryAx)\b",s)
          print("IV083 strict preflight: three exact original-source bridge declarations")
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
          lake exe cache get
      - name: Native fresh Lean source build
        run: |
          set -euo pipefail
          mkdir -p iv083/out
          touch iv083/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV083CompactC2OriginalGammaLimitGate 2>&1 | tee iv083/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.olean -nt iv083/out/fresh.stamp
      - name: Exact strict named axiom audit
        run: |
          set -euo pipefail
          lake env lean WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.lean 2>&1 | tee iv083/out/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          t=Path("iv083/out/axioms.log").read_text()
          names=[
              "neutralIV083FiniteGamma_pairing_compactC2",
              "neutralIV083GammaEnvelope_integrable_compactC2",
              "neutralIV083FiniteSpatial_tendsto_compactC2",
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          found={}
          for name in names:
              full="WeilDefect."+name
              pat=re.compile(r"^'"+re.escape(full)+r"' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)\s*$",re.M)
              hits=list(pat.finditer(t))
              assert len(hits)==1, (full,len(hits),t[-1200:])
              axioms=({a.strip() for a in hits[0].group(1).split(",") if a.strip()}
                      if hits[0].group(1) is not None else set())
              assert axioms<=allowed,(full,axioms-allowed)
              found[full]=sorted(axioms)
          assert not re.search(r'(?m)^\s*(?:error:|.*: error:)',t)
          Path("iv083/out/receipts.json").write_text(json.dumps(found,sort_keys=True,indent=2)+"\n")
          print("IV083 three strict source/axiom receipts PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv083-original-compact-c2-gamma-attachment-native-lean-receipts
          path: |
            iv083/out/
            .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV083CompactC2OriginalGammaLimitGate.olean
          if-no-files-found: ignore
          include-hidden-files: true
