name: F08-006 independent original log-multiplier Lean source ZIP axiom custody
on:
  pull_request:
    paths:
      - 'verification/f08/f08_006/**'
      - '.github/workflows/f08-006-independent-weighted-dct-custody.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-original-log-weight:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      F08_RUN: '45220909373'
      F08_ARTIFACT: '14841811812'
      F08_ARTIFACT_SHA: '984c3302fc7da41ebfc34fac824ba6054ca22549bc3ff804511c9b44b62482e8'
    steps:
      - uses: actions/checkout@v4
      - name: Source-only preflight and four negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile verification/f08/f08_006/f08_006_independent_weighted_dct_audit.py
          python3 verification/f08/f08_006/f08_006_independent_weighted_dct_audit.py --selftest
      - name: Independently validate actual producer Lean run and artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p f08-006-receipt
          python3 - <<'PY'
          import json,os,urllib.request
          root=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          head='4391c564089ff82b1bc6aead906c54acb4eb1b1f'
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers=hdr),timeout=30) as r:return json.load(r)
          run=get('/actions/runs/'+os.environ['F08_RUN'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==head and run['head_repository']['full_name']=='monocap-tech/weil-lab'
          assert run['name']=='F08-005 source-exact weighted Fourier multiplier convergence Lean gate'
          jobs=get('/actions/runs/'+os.environ['F08_RUN']+'/jobs')
          assert any(j['conclusion']=='success' and any(
              s['name']=='Genuine pinned kernel build plus strict three-name axiom audit' and s['conclusion']=='success'
              for s in j['steps']) for j in jobs['jobs'])
          artifact=get('/actions/artifacts/'+os.environ['F08_ARTIFACT'])
          assert artifact['workflow_run']['id']==int(os.environ['F08_RUN'])
          assert artifact['name']=='f08-005-original-log-weight-compiler-evidence'
          assert artifact['digest']=='sha256:'+os.environ['F08_ARTIFACT_SHA']
          assert artifact['size_in_bytes']>0 and not artifact['expired']
          with open('f08-006-receipt/source-producer.json','w') as f:json.dump(
              {'producer_commit_sha':head,'run_id':int(os.environ['F08_RUN']),'artifact_id':int(os.environ['F08_ARTIFACT']),
               'outer_zip_sha256':os.environ['F08_ARTIFACT_SHA'],'successful':True},f,sort_keys=True,indent=2)
          print('F08-006 independently confirmed successful pinned Lean source and artifact digest')
          PY
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$F08_ARTIFACT/zip" -o f08-006-receipt/f08-005-producer.zip
          echo "$F08_ARTIFACT_SHA  f08-006-receipt/f08-005-producer.zip" | sha256sum -c -
          python3 verification/f08/f08_006/f08_006_independent_weighted_dct_audit.py --archive f08-006-receipt/f08-005-producer.zip --out f08-006-receipt/f08-006-original-independent-axiom-audit.json
      - name: Archive independent source-only custody
        uses: actions/upload-artifact@v4
        with:
          name: f08-006-original-log-weight-independent-source-audit
          path: |
            f08-006-receipt/source-producer.json
            f08-006-receipt/f08-006-original-independent-axiom-audit.json
          if-no-files-found: error
