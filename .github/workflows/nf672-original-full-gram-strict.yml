name: NF672 strict original 242-source physical Gram and genuine 227-Schur nondegeneracy
on:
  pull_request:
    paths:
      - "WeilDefect/Arithmetic/ActualZetaOriginalPhysicalGramStrictWitness.lean"
      - "WeilDefect/Generated/NF672/OriginalPhysicalFullGramStrict.lean"
      - ".github/workflows/nf672-original-full-gram-strict.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nf672-original-strict-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generic-strict-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and mathlib cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Exact interval Gram strict positivity from source-separating witness
        run: |
          lake build WeilDefect.Arithmetic.ActualZetaOriginalPhysicalGramStrictWitness
      - name: Strict-witness standard axiom audit
        run: |
          cat >/tmp/nf672GenericAudit.lean <<'EOF'
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalGramStrictWitness
          #print axioms WeilDefect.neutralNF672IntegralGram_pos_of_witness
          #print axioms WeilDefect.neutralNF672IntegralGram_pos_of_separation
          EOF
          lake env lean /tmp/nf672GenericAudit.lean
  original-physical-full-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned exact original source and prior accepted proof artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inputs/archives
          get() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              -o "inputs/archives/$2.zip"
          }
          get 14476203337 nf648-Pole
          get 14476327246 nf648-Osc
          get 14478132104 nf648-Mixed
          get 14443955726 nf621-shard0
          get 14443029185 nf621-shard1
          get 14442993898 nf621-shard2
          get 14443875632 nf621-shard3
          get 14443830605 nf621-shard4
          get 14443726709 nf621-shard5
          get 14441839748 nf621-shard6
          get 14442134710 nf621-shard7
          get 14459025571 nf631-widened
          get 14458696200 nf632-pi
          echo 'e91a83cae117e98608aefa6849dac178e4ddb58dd1dffbfe37304ad248af9ed9  inputs/archives/nf631-widened.zip' | sha256sum -c -
          echo 'd1769ab74275cc9c57452d3aa5ad3a30109efc500f7834ee392ed668612d9a37  inputs/archives/nf632-pi.zip' | sha256sum -c -
          mkdir -p WeilDefect/Generated/NF632
          unzip -q inputs/archives/nf632-pi.zip -d WeilDefect/Generated/NF632
      - name: Rebuild NF655 original analytic Gram sources and NF657 compact witness
        run: |
          python scripts/prepare_nf655_certified_moment_gram.py inputs/archives WeilDefect/Generated
          python scripts/emit_nf657_compact_congruence.py inputs/archives/nf631-widened.zip inputs/nf663-compact.json
          python scripts/verify_nf657_compact_congruence.py inputs/nf663-compact.json inputs/archives/nf631-widened.zip
          python scripts/emit_nf658_original_gram_widenings.py --archive inputs/archives/nf631-widened.zip --witness inputs/nf663-compact.json --output WeilDefect/Generated/NF658
      - name: Recreate all 450 exact NF659 integer gates and 225 original NF662 real entry proofs
        run: |
          python scripts/emit_nf659_gram_transformed_gates.py inputs/nf663-compact.json WeilDefect/Generated/NF659
          python scripts/emit_nf662_original_real_intervals.py WeilDefect/Generated/NF662
          python -m py_compile scripts/emit_nf663_original_real_scale_gates.py
          python scripts/emit_nf663_original_real_scale_gates.py WeilDefect/Generated/NF663
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('WeilDefect/Generated/NF663')
          m=json.loads((p/'manifest.json').read_text())
          assert m['center_gate_references']==225
          assert m['radius_gate_references']==225
          assert len(m['files'])==16
          for x in m['files']:
              assert hashlib.sha256((p/x['file']).read_bytes()).hexdigest()==x['sha256']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nf663-real-physical-attachment-source-proposals
          path: |
            WeilDefect/Generated/NF663/manifest.json
            inputs/nf663-compact.json
          if-no-files-found: error
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Original actual H proof bank and representative exact NF659 gate bindings
        timeout-minutes: 35
        run: |
          lake build WeilDefect.Generated.NF662.Complete WeilDefect.Generated.NF663.Row00 WeilDefect.Generated.NF663.Row07 WeilDefect.Generated.NF663.Row14
      - name: Full original 225 transformed REAL entries in NF659 exact integer balls
        timeout-minutes: 35
        run: |
          lake build WeilDefect.Generated.NF663.Complete
      - name: Actual original physical transformed Gram coercivity from 15 integer margins
        timeout-minutes: 20
        run: |
          lake build WeilDefect.Generated.NF664.OriginalTransformedCoercivity
      - name: Original 15-generator physical real coercivity from authenticated integer and frame certificates
        timeout-minutes: 25
        run: |
          lake build WeilDefect.Generated.NF665.OriginalPhysicalCoercivity
      - name: Exact 242-source dictionary, original 15+227 partition and authentic Schur blocks
        timeout-minutes: 20
        run: |
          lake build WeilDefect.Generated.NF669.OriginalPhysicalComplementDictionary
      - name: Original full 242-source quadratic reindexing and exact 15+227 block identity
        timeout-minutes: 30
        run: |
          lake build WeilDefect.Generated.NF670.OriginalPhysicalFullQuadratic
      - name: Actual original A-matrix invertibility, 227-source Riesz existence, cross identity and Schur gate
        timeout-minutes: 30
        run: |
          lake build WeilDefect.Generated.NF670.OriginalPhysicalRieszResponse
      - name: Full original 242-source physical Schur identity and exact complementary sign equivalence
        timeout-minutes: 25
        run: |
          lake build WeilDefect.Generated.NF670.OriginalPhysicalFullSchur
      - name: Original NF606 242-generator physical integral square and genuine Schur nonnegativity
        timeout-minutes: 30
        run: |
          lake build WeilDefect.Generated.NF671.OriginalPhysicalFullGramPSD
      - name: Original full physical strict Gram and cofinite Schur theorem
        timeout-minutes: 35
        run: |
          lake build WeilDefect.Generated.NF672.OriginalPhysicalFullGramStrict
      - name: Complete NF672 strict source-specific standard axiom audit
        run: |
          cat >/tmp/nf672StrictAudit.lean <<'EOF'
          import WeilDefect.Generated.NF672.OriginalPhysicalFullGramStrict
          import WeilDefect.Arithmetic.ActualZetaOriginalJ242CanonicalGramPositivity
          #print axioms WeilDefect.neutralNF672IntegralGram_pos_of_witness
          #print axioms WeilDefect.neutralNF672IntegralGram_pos_of_separation
          #print axioms WeilDefect.nf672OriginalCombination_cast
          #print axioms WeilDefect.nf672OriginalPhysical_intervalWitness
          #print axioms WeilDefect.nf672OriginalFullPhysicalGram_strict
          #print axioms WeilDefect.nf672OriginalAssemble_nonzero_of_complement
          #print axioms WeilDefect.nf672ActualPhysicalSchur_strict
          #print axioms WeilDefect.neutralNF569OriginalRealCombination_globalIndependence
          #print axioms WeilDefect.neutralNF569OriginalCollarSeparatesJ242
          #print axioms WeilDefect.nf671OriginalPhysicalH_energy_eq_square
          #print axioms WeilDefect.nf671ActualPhysicalSchur_eq_integral_square
          #print axioms WeilDefect.nf670AssembleOriginal_source
          #print axioms WeilDefect.nf665OriginalPhysical_coercivity
          EOF
          set -o pipefail
          lake env lean /tmp/nf672StrictAudit.lean | tee /tmp/nf672-strict-audit.txt
          python - <<'PY'
          from pathlib import Path
          content = Path('/tmp/nf672-strict-audit.txt').read_text()
          names = ["neutralNF672IntegralGram_pos_of_witness", "neutralNF672IntegralGram_pos_of_separation", "nf672OriginalCombination_cast", "nf672OriginalPhysical_intervalWitness", "nf672OriginalFullPhysicalGram_strict", "nf672OriginalAssemble_nonzero_of_complement", "nf672ActualPhysicalSchur_strict", "neutralNF569OriginalRealCombination_globalIndependence", "neutralNF569OriginalCollarSeparatesJ242", "nf671OriginalPhysicalH_energy_eq_square", "nf671ActualPhysicalSchur_eq_integral_square", "nf670AssembleOriginal_source", "nf665OriginalPhysical_coercivity"]
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in names:
              prefix = f"'WeilDefect.{name}'"
              rows = [line for line in content.splitlines() if prefix in line]
              if len(rows) != 1:
                  raise SystemExit(f"Missing/duplicate axiom audit for {name}: {len(rows)}")
              line = rows[0]
              if "does not depend on any axioms" in line:
                  continue
              marker = prefix + " depends on axioms: ["
              if marker not in line:
                  raise SystemExit(f"Unrecognized axiom audit: {line}")
              raw = line.split(marker,1)[1].split(']',1)[0]
              used = {x.strip() for x in raw.split(',') if x.strip()}
              if not used <= allowed:
                  raise SystemExit(f"Unacceptable axioms for {name}: {used - allowed}")
          print(f"NF672 original physical Gram strictness and 227-Schur strictness: {len(names)} audited")
          PY
