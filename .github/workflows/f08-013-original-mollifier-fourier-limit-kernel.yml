name: F08-013 genuine physical shrinking mollifier Fourier -2pi pointwise limit Lean gate
on:
  pull_request:
    paths:
      - 'verification/f08/f08_013/**'
      - '.github/workflows/f08-013-original-normalized-mollifier-kernel.yml'
permissions:
  contents: read
jobs:
  source-logarithmic-weight:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout source-pinned actual IV023 research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Verify actual source and stage purely additive Lean module
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCorrelationFourierAgreement.lean)" = 60453bd214c43feedb0fa64d74a15bd452e48998
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCorrelationTransform.lean)" = d5aa1095b2fe64933ad8db64732d232631d3d3b7
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          ! grep -Eq 'sorry|admit|unsafe' candidate/verification/f08/f08_013/F08OriginalMollifierFourierLimit.lean
          mkdir -p research/WeilDefect/Generated/F08
          test "$(git -C candidate hash-object verification/f08/f08_011/F08OriginalNormalizedMollifier.lean)" = b1f53459762df682f6d1d358aae9c82b5396c5a7
          ! grep -Eq 'sorry|admit|unsafe' candidate/verification/f08/f08_011/F08OriginalNormalizedMollifier.lean
          cp candidate/verification/f08/f08_011/F08OriginalNormalizedMollifier.lean research/WeilDefect/Generated/F08/OriginalNormalizedMollifier.lean
          cp candidate/verification/f08/f08_013/F08OriginalMollifierFourierLimit.lean research/WeilDefect/Generated/F08/OriginalMollifierFourierLimit.lean
      - name: Initialize pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Genuine pinned kernel build plus strict four-name axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.OriginalMollifierFourierLimit 2>&1 | tee f08-013-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.OriginalMollifierFourierLimit' '#print axioms WeilDefect.f08_013_original_fourier_phase_error' '#print axioms WeilDefect.f08_013_original_mollifier_character_error' '#print axioms WeilDefect.f08_013_original_mollifier_fourier_error_bound' '#print axioms WeilDefect.f08_013_original_mollifier_fourier_tendsto_one' > /tmp/f08-013-axioms.lean
          lake env lean /tmp/f08-013-axioms.lean 2>&1 | tee f08-013-axioms.log
          python3 - <<'PY'
          import pathlib,re
          names={'f08_013_original_fourier_phase_error','f08_013_original_mollifier_character_error','f08_013_original_mollifier_fourier_error_bound','f08_013_original_mollifier_fourier_tendsto_one'}
          found={}
          log=pathlib.Path('f08-013-axioms.log').read_text()
          # Lean's axiom pretty printer may wrap a single declaration across lines.
          # Match complete bracketed reports, preserving strict unexplained-output refusal.
          pat=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          for m in re.finditer(pat,log,re.S):
              assert m[1] not in found,('duplicate axiom name',m[1])
              found[m[1]]={x.strip() for x in m[2].split(',') if x.strip()}
          assert not re.sub(pat,'',log,flags=re.S).strip(),('unexpected compiler output',log)
          assert set(found)==names,(found,names)
          assert all(a <= {'propext','Classical.choice','Quot.sound'} for a in found.values()),found
          print('F08-013 actual -2pi source-mollifier Fourier limit: 4/4 standard-only axioms')
          PY
      - name: Archive source and genuine compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-013-original-mollifier-fourier-limit-compiler-evidence
          path: |
            research/f08-013-build.log
            research/f08-013-axioms.log
            research/WeilDefect/Generated/F08/OriginalMollifierFourierLimit.lean
            research/WeilDefect/Generated/F08/OriginalNormalizedMollifier.lean
          if-no-files-found: ignore
