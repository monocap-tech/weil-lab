name: RPB108 PS12 complete original signed graph IMS frame

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps12_arch_ims_hs_frame.py"
      - "notes/RPB108_PS12_ARCH_IMS_HS_FRAME_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps12-arch-ims-frame.yml"
  workflow_dispatch:

jobs:
  ps12-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source-replayed exact original arch HS and full signed graph frame
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps12_arch_ims_hs_frame.py
          python3 scripts/validate_rpb108_ps12_arch_ims_hs_frame.py
      - name: Canonical odd obligation remains open
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
