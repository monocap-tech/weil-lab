name: NF476 original J7 [log8-B,1] irrational n8 seam signed moments
on:
  pull_request:
  workflow_dispatch:
jobs:
  central:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf471_original_J7_joint_arch_mean_native.py candidate/scripts/local_replay/nf476_original_J7_irrational_left_seam_signed_native.py native/scripts/local_replay/
      - name: Original 246-source central digamma, pole, original NF404 and true principal
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf476_original_J7_irrational_left_seam_signed_native.py --part central --output nf476-central.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf476-original-central
          path: native/nf476-central.json
          retention-days: 90
  primes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf471_original_J7_joint_arch_mean_native.py candidate/scripts/local_replay/nf476_original_J7_irrational_left_seam_signed_native.py native/scripts/local_replay/
      - name: Original six true physical J7 negative prime translations, full 273 group
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf476_original_J7_irrational_left_seam_signed_native.py --part primes --output nf476-primes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf476-original-primes
          path: native/nf476-primes.json
          retention-days: 90
  image-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - start: 0
            stop: 1000
          - start: 1000
            stop: 2000
          - start: 2000
            stop: 3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf471_original_J7_joint_arch_mean_native.py candidate/scripts/local_replay/nf476_original_J7_irrational_left_seam_signed_native.py native/scripts/local_replay/
      - name: Both original J7 matched endpoint images source-correlated Taylor coefficient block
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf476_original_J7_irrational_left_seam_signed_native.py --part images --start ${{ matrix.start }} --stop ${{ matrix.stop }} --output nf476-images-${{ matrix.start }}-${{ matrix.stop }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf476-original-images-${{ matrix.start }}-${{ matrix.stop }}
          path: native/nf476-images-${{ matrix.start }}-${{ matrix.stop }}.json
          retention-days: 90
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [central, primes, image-chunk]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: nf476-original-*
          path: results
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - run: cp candidate/scripts/local_replay/nf471_original_J7_joint_arch_mean_native.py candidate/scripts/local_replay/nf476_original_J7_irrational_left_seam_signed_native.py native/scripts/local_replay/
      - name: Original J7 irrational [log8-B,1] complete source-moment sum, exact Arb log8 physical endpoint and n8 odd seam
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf476_original_J7_irrational_left_seam_signed_native.py --part assemble --input-dir ../results --nf471-receipt ../candidate/notes/data/provisional/NF471_original_J7_complete_macroscopic_mean_custody.json --output ../nf476-original-J7-source-signed-moments.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf476-original-J7-signed-moments
          path: nf476-original-J7-source-signed-moments.json
          retention-days: 90
