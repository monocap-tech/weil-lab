# F40 NF785 terminal original [240,242) source verification only — NO Lean or predecessor promotion
name: F40 NF785 terminal 240-241 source-only syntax and NF737 archive admission
on:
  pull_request:
    paths:
      - 'verification/f40/nf785/**'
      - '.github/workflows/f40-nf785-source-admission.yml'
permissions:
  contents: read
  actions: read
jobs:
  admission:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact terminal shard two-source syntax and fail-closed import guard selftest
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile verification/f40/nf785/*.py
          python verification/f40/nf785/nf785_original_indexzero_import_order_guard.py selftest
          python - <<'PY'
          from pathlib import Path
          import ast
          root=Path('verification/f40/nf785')
          for f in root.glob('*.py'): ast.parse(f.read_text())
          source=(root/'nf785_original_indexzero_240_241_source_preflight.py').read_text()
          guard=(root/'nf785_original_indexzero_import_order_guard.py').read_text()
          assert 'FIRST, STOP = 240, 242' in source
          assert 'assert (FIRST, STOP) in source737.SHARDS' in source
          assert 'len(NAMES) == 11' in source
          assert '"new_gate_instances":4' in source
          assert '"new_declarations":8' in source
          assert 'source737.verify()' in source
          assert 'range(240,242)' in guard
          assert 'NF785-source-actual-original-indexzero-240-241-import-DAG-v1' in guard
          assert not (root/'NF785_ONE_SHOT_COMPILE_REQUEST.txt').exists()
          print('NF785 terminal shard [240,242): exact two source modules/4 HD-A instances/11 axiom queries scope PASS; NO LEAN')
          PY
  original-nf737-source-authentication:
    if: github.event_name == 'pull_request' && github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout immutable NF769 research source without pushing any historical branch
        uses: actions/checkout@v4
        with:
          ref: 'a431f903254000bb5ad8edbc276ccc8599da98f5'
          path: original
          persist-credentials: false
      - name: Checkout exact NF785 candidate revision for isolated source driver overlay
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original 242-column artifact identity and exact two source revisions (NO Lean)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C original rev-parse HEAD)" = 'a431f903254000bb5ad8edbc276ccc8599da98f5'
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat original/lean-toolchain)" = 'leanprover/lean4:v4.34.0'
          python - <<'PY'
          import json, subprocess
          repo = "monocap-tech/weil-lab"
          run = json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/44791346863"],text=True))
          assert run["status"] == "completed" and run["conclusion"] == "success"
          jobs = json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/44791346863/jobs?per_page=100"],text=True))["jobs"]
          assert any(j["id"] == 136479519760 and j["name"] == "authenticate-and-emit-remaining-original-indexzero" and j["conclusion"] == "success" for j in jobs)
          arts=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/44791346863/artifacts?per_page=100"],text=True))["artifacts"]
          exact=[a for a in arts if a["id"]==14660147684 and a["name"]=="nf737-authenticated-original-indexzero-242-full-source-and-28-shard-candidates" and a.get("digest")=="sha256:11e31531cfd29187b648b207d85269c8b2a0a065a387b9182023a425e645a42f" and a["size_in_bytes"]==227348147 and not a["expired"]]
          assert len(exact)==1
          print("Immutable NF737 artifact/job/run SHA-256 metadata PASS")
          PY
      - name: Restore original NF737 source ZIP only after authenticating full archive bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14660147684/zip" -o nf785-original-nf737-source.zip
          echo "11e31531cfd29187b648b207d85269c8b2a0a065a387b9182023a425e645a42f  nf785-original-nf737-source.zip" | sha256sum -c -
          sha256sum nf785-original-nf737-source.zip | tee nf785-full-original-source-archive-sha256.txt
          cd original
          unzip -q ../nf785-original-nf737-source.zip
          test -s WeilDefect/Generated/NF704Frontier/Col240.lean
          test -s WeilDefect/Generated/NF704Frontier/Col241.lean
          test -s WeilDefect/Generated/NF704Frontier/manifest.json
          rm -f ../nf785-original-nf737-source.zip
      - name: Verify all 242 recovered original NF737 source modules and exact NF785 240–241 11-name queries
        shell: bash
        run: |
          set -euo pipefail
          for f in nf785_original_indexzero_240_241_source_preflight.py nf785_original_indexzero_import_order_guard.py; do
            test -s "candidate/verification/f40/nf785/$f"
            cp "candidate/verification/f40/nf785/$f" "original/scripts/$f"
          done
          (
            cd original
            python -m py_compile scripts/nf737_original_indexzero_complete_source_shard_schedule.py scripts/nf785_original_indexzero_240_241_source_preflight.py
            python scripts/nf737_original_indexzero_complete_source_shard_schedule.py verify | tee ../nf785-full-original-nf737-242-source-verification.log
            python scripts/nf785_original_indexzero_240_241_source_preflight.py | tee ../nf785-original-indexzero-240-241-source-only-preflight.log
            python - <<'PY'
          import json,hashlib
          from pathlib import Path
          b=json.loads(Path("nf785-indexzero-240-241-source-binding.json").read_text())
          assert b["schema"]=="NF785-authentic-original-global-indexzero-240-241-source-v1"
          assert b["new_indices_HD"]==b["new_indices_A"]==list(range(240,242))
          assert b["new_gate_instances"]==4 and b["new_declarations"]==8
          assert len(b["strict_axiom_names"])==11
          assert b["new_numerical_kernel_accepted"] is False
          assert len(b["actual_original_new_col_module_sha256"])==2
          q=Path("nf785OriginalIndexZero240Audit.lean").read_text()
          assert q.count("#print axioms WeilDefect.")==11
          assert q.count("import WeilDefect.Generated.NF704Frontier.Col")==2
          print("SOURCE HASH FULL 242 + ORIGINAL COL240–241 + 11 exact axiom queries PASS; NO KERNEL")
          PY
          )
      - name: Preserve genuine source binding and queries but NO new numerical certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf785-original-nf737-source-240-241-authenticated-no-lean
          path: |
            nf785-full-original-source-archive-sha256.txt
            nf785-full-original-nf737-242-source-verification.log
            nf785-original-indexzero-240-241-source-only-preflight.log
            original/nf785-indexzero-240-241-source-binding.json
            original/nf785OriginalIndexZero240Audit.lean
          if-no-files-found: ignore
