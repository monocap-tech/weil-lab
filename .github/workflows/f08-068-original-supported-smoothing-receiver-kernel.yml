name: F08-068 original supported smoothing receiver kernel
on:
  pull_request:
    paths:
      - 'verification/f08/f08_068/**'
      - '.github/workflows/f08-068-original-supported-smoothing-receiver-kernel.yml'
permissions:
  contents: read
jobs:
  genuine-original-L2-continuity-dense-transfer:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout frozen original IV023 research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Pin original research, actual predecessors and candidate theorem
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCorrelationFourierAgreement.lean)" = 60453bd214c43feedb0fa64d74a15bd452e48998
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCorrelationTransform.lean)" = d5aa1095b2fe64933ad8db64732d232631d3d3b7
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralLogFormGraph.lean)" = 6a25651c2c54d7ff9e4d20d4b410b56b7d5047a3
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralLogHilbertCarrier.lean)" = 679d58b8f0cfa6b4f7d28c48ce844a41cdce2844
          mkdir -p research/WeilDefect/Generated/F08
          test "$(git -C candidate hash-object verification/f08/f08_005/F08WeightedMollifierMultiplier.lean)" = 2a8199ff817f59d1437fa173518a588cbbd467b9
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_005/F08WeightedMollifierMultiplier.lean
          cp candidate/verification/f08/f08_005/F08WeightedMollifierMultiplier.lean research/WeilDefect/Generated/F08/OriginalWeightedMollifierMultiplier.lean
          test "$(git -C candidate hash-object verification/f08/f08_007/F08OriginalWindowMollifierFourier.lean)" = 606d324ca9fcfd53d059efe1b57d1b0e30349476
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_007/F08OriginalWindowMollifierFourier.lean
          cp candidate/verification/f08/f08_007/F08OriginalWindowMollifierFourier.lean research/WeilDefect/Generated/F08/OriginalWindowMollifierFourier.lean
          test "$(git -C candidate hash-object verification/f08/f08_009/F08OriginalWindowConvolutionSupport.lean)" = 6badab7f17605d3131ee414282683d390c6f1964
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_009/F08OriginalWindowConvolutionSupport.lean
          cp candidate/verification/f08/f08_009/F08OriginalWindowConvolutionSupport.lean research/WeilDefect/Generated/F08/OriginalWindowConvolutionSupport.lean
          test "$(git -C candidate hash-object verification/f08/f08_011/F08OriginalNormalizedMollifier.lean)" = b1f53459762df682f6d1d358aae9c82b5396c5a7
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_011/F08OriginalNormalizedMollifier.lean
          cp candidate/verification/f08/f08_011/F08OriginalNormalizedMollifier.lean research/WeilDefect/Generated/F08/OriginalNormalizedMollifier.lean
          test "$(git -C candidate hash-object verification/f08/f08_013/F08OriginalMollifierFourierLimit.lean)" = 7b91eda87ce5a0d7691fdc643865e72fb153287c
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_013/F08OriginalMollifierFourierLimit.lean
          cp candidate/verification/f08/f08_013/F08OriginalMollifierFourierLimit.lean research/WeilDefect/Generated/F08/OriginalMollifierFourierLimit.lean
          test "$(git -C candidate hash-object verification/f08/f08_015/F08ActualMollifierWeightedDCT.lean)" = f1969dede41f0d799788411420c0cb2a63c5e53a
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_015/F08ActualMollifierWeightedDCT.lean
          cp candidate/verification/f08/f08_015/F08ActualMollifierWeightedDCT.lean research/WeilDefect/Generated/F08/ActualMollifierWeightedDCT.lean
          test "$(git -C candidate hash-object verification/f08/f08_017/F08ExplicitShrinkingPhysicalMollifier.lean)" = b767da47b302734c9b1de0bd0fde38b727c84b20
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_017/F08ExplicitShrinkingPhysicalMollifier.lean
          cp candidate/verification/f08/f08_017/F08ExplicitShrinkingPhysicalMollifier.lean research/WeilDefect/Generated/F08/ExplicitShrinkingPhysicalMollifier.lean
          test "$(git -C candidate hash-object verification/f08/f08_019/F08OriginalSmoothedWindow.lean)" = efe3260cbd8798ad7192142c1e656f31a6729d13
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_019/F08OriginalSmoothedWindow.lean
          cp candidate/verification/f08/f08_019/F08OriginalSmoothedWindow.lean research/WeilDefect/Generated/F08/OriginalSmoothedWindow.lean
          test "$(git -C candidate hash-object verification/f08/f08_021/F08OriginalSmoothedWindowNativeFourier.lean)" = f7f769dd120810645a6bed9fa3ef379c94986a77
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_021/F08OriginalSmoothedWindowNativeFourier.lean
          cp candidate/verification/f08/f08_021/F08OriginalSmoothedWindowNativeFourier.lean research/WeilDefect/Generated/F08/OriginalSmoothedWindowNativeFourier.lean
          test "$(git -C candidate hash-object verification/f08/f08_027/F08NativeFrequencyScalingMeasure.lean)" = eecfe2a849fa79aa13810ede85e9ba625eba7777
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_027/F08NativeFrequencyScalingMeasure.lean
          cp candidate/verification/f08/f08_027/F08NativeFrequencyScalingMeasure.lean research/WeilDefect/Generated/F08/NativeFrequencyScalingMeasure.lean
          test "$(git -C candidate hash-object verification/f08/f08_029/F08NativeL2PushforwardNorm.lean)" = 4da65f9b9df7cae6ea30a4a7f25d3e6c1606c294
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_029/F08NativeL2PushforwardNorm.lean
          cp candidate/verification/f08/f08_029/F08NativeL2PushforwardNorm.lean research/WeilDefect/Generated/F08/NativeL2PushforwardNorm.lean
          test "$(git -C candidate hash-object verification/f08/f08_030/F08NativeFrequencyDilation.lean)" = 5c260b69f464f5793e095f9b5448c90f7984617f
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_030/F08NativeFrequencyDilation.lean
          cp candidate/verification/f08/f08_030/F08NativeFrequencyDilation.lean research/WeilDefect/Generated/F08/NativeFrequencyDilation.lean
          test "$(git -C candidate hash-object verification/f08/f08_052/F08OriginalNativeL2SquareIntegral.lean)" = 16a7053b3a1ea6f0e0f91a89de6e40a91987cd92
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_052/F08OriginalNativeL2SquareIntegral.lean
          cp candidate/verification/f08/f08_052/F08OriginalNativeL2SquareIntegral.lean research/WeilDefect/Generated/F08/OriginalNativeL2SquareIntegral.lean
          test "$(git -C candidate hash-object verification/f08/f08_064/F08OriginalFormDomainEnergyReceiver.lean)" = 9423bc10b0db9d07078299bdedbe60b585fede7d
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_064/F08OriginalFormDomainEnergyReceiver.lean
          cp candidate/verification/f08/f08_064/F08OriginalFormDomainEnergyReceiver.lean research/WeilDefect/Generated/F08/OriginalFormDomainEnergyReceiver.lean
          test "$(git -C candidate hash-object verification/f08/f08_023/F08OriginalWindowNativeWeightedSmoothing.lean)" = b0712d54ff2c5a3c3c5496f5c007559abf946bf3
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_023/F08OriginalWindowNativeWeightedSmoothing.lean
          cp candidate/verification/f08/f08_023/F08OriginalWindowNativeWeightedSmoothing.lean research/WeilDefect/Generated/F08/OriginalWindowNativeWeightedSmoothing.lean
          test "$(git -C candidate hash-object verification/f08/f08_068/F08OriginalSupportedSmoothingReceiver.lean)" = c30f57a1d581c9a8be44ecd9dfccd5ea2e9f6e43
          ! grep -Eq '\b(sorry|admit|unsafe)\b' candidate/verification/f08/f08_068/F08OriginalSupportedSmoothingReceiver.lean
          cp candidate/verification/f08/f08_068/F08OriginalSupportedSmoothingReceiver.lean research/WeilDefect/Generated/F08/OriginalSupportedSmoothingReceiver.lean
      - name: Install original frozen Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile original supported smoothing receiver and strict named axioms
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.OriginalSupportedSmoothingReceiver 2>&1 | tee f08-068-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.OriginalSupportedSmoothingReceiver' '#print axioms WeilDefect.f08_068_supportedWindow_eq' '#print axioms WeilDefect.f08_068_smoothedDomain_mem' '#print axioms WeilDefect.f08_068_weightedSmoothing_tendsto' > /tmp/f08-068-axioms.lean
          lake env lean /tmp/f08-068-axioms.lean 2>&1 | tee f08-068-axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('f08-068-axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==3,('three declarations required',s)
          assert not re.sub(p,'',s,flags=re.S).strip(),('unrecognized compiler output',s)
          assert {m[1] for m in ms}=={'f08_068_supportedWindow_eq','f08_068_smoothedDomain_mem','f08_068_weightedSmoothing_tendsto'}
          for m in ms:
              a={x.strip() for x in m[2].split(',') if x.strip()}
              assert a <= {'propext','Classical.choice','Quot.sound'},('nonstandard axioms',a)
          print('F08-068 supported smoothing receiver: 3/3 standard-only axioms PASS')
          PY
      - name: Archive complete exact original source and actual Lean compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-068-original-supported-smoothing-receiver-compiler-evidence
          path: |
            research/f08-068-build.log
            research/f08-068-axioms.log
            research/WeilDefect/Generated/F08/OriginalWeightedMollifierMultiplier.lean
            research/WeilDefect/Generated/F08/OriginalWindowMollifierFourier.lean
            research/WeilDefect/Generated/F08/OriginalWindowConvolutionSupport.lean
            research/WeilDefect/Generated/F08/OriginalNormalizedMollifier.lean
            research/WeilDefect/Generated/F08/OriginalMollifierFourierLimit.lean
            research/WeilDefect/Generated/F08/ActualMollifierWeightedDCT.lean
            research/WeilDefect/Generated/F08/ExplicitShrinkingPhysicalMollifier.lean
            research/WeilDefect/Generated/F08/OriginalSmoothedWindow.lean
            research/WeilDefect/Generated/F08/OriginalSmoothedWindowNativeFourier.lean
            research/WeilDefect/Generated/F08/NativeFrequencyScalingMeasure.lean
            research/WeilDefect/Generated/F08/NativeL2PushforwardNorm.lean
            research/WeilDefect/Generated/F08/NativeFrequencyDilation.lean
            research/WeilDefect/Generated/F08/OriginalNativeL2SquareIntegral.lean
            research/WeilDefect/Generated/F08/OriginalFormDomainEnergyReceiver.lean
            research/WeilDefect/Generated/F08/OriginalWindowNativeWeightedSmoothing.lean
            research/WeilDefect/Generated/F08/OriginalSupportedSmoothingReceiver.lean
          if-no-files-found: ignore
