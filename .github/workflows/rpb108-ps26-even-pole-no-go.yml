name: RPB108 PS26 global even-pole no-go and parity carrier

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps26_even_pole_global_no_go.py"
      - "notes/RPB108_PS26_EVEN_POLE_GLOBAL_NO_GO_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps26-even-pole-no-go.yml"
  workflow_dispatch:

jobs:
  ps26-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay actual original source and certify partition-independent pole-blind obstruction
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps26_even_pole_global_no_go.py
          python3 scripts/validate_rpb108_ps26_even_pole_global_no_go.py
      - name: Safeguard original signed full Schur and canonical RH OPEN
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
