      - name: Install original frozen Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile exact dense core transfer and strict named axioms
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.OriginalDenseCoreTransfer 2>&1 | tee f08-076-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.OriginalDenseCoreTransfer' '#print axioms WeilDefect.f08_076_physical_injective' '#print axioms WeilDefect.f08_076_core_dense' '#print axioms WeilDefect.f08_076_lift_identification' '#print axioms WeilDefect.f08_076_native_nonneg_iff_core' > /tmp/f08-076-axioms.lean
          lake env lean /tmp/f08-076-axioms.lean 2>&1 | tee f08-076-axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('f08-076-axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==4 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["f08_076_physical_injective","f08_076_core_dense","f08_076_lift_identification","f08_076_native_nonneg_iff_core"])
          for m in ms:
              assert {x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          print('F08-076 strict named axioms PASS 4/4')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-076-original-dense-core-compiler-evidence
          path: |
            research/f08-076-build.log
            research/f08-076-axioms.log
            research/WeilDefect/Generated/F08/*.lean
          if-no-files-found: error
