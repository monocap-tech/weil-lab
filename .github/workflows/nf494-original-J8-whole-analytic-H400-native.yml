name: NF494 original full J8 joint-compact analytic H400 source native
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-original-4096bit-analytic-H400:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f50e49cdc02b5e1eaacce7f8a66733fce9bc6f05
          path: native
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-flint==0.8.0
      - name: Copy ONLY NF494 full original matched analytic H source evaluator, original NF407/406/411/450 immutable
        run: cp candidate/scripts/local_replay/nf494_original_J8_whole_analytic_H400_native.py native/scripts/local_replay/
      - name: Actual original 246 source 273-group true J8 H400 complete digamma/polygamma finite-window and authentic both-moving-cutoff beta coefficients, physical zB and original Hdelta checks
        working-directory: native
        run: python -u -X int_max_str_digits=0 scripts/local_replay/nf494_original_J8_whole_analytic_H400_native.py --output ../nf494-original-J8-source-H400-joint-compact-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf494-original-J8-whole-analytic-H400-native
          path: nf494-original-J8-source-H400-joint-compact-native.json
          retention-days: 90
