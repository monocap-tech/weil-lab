      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Native fresh source and strict named axiom audit
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p iv106-d6/out
          touch iv106-d6/out/fresh.stamp
          rm -f .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D6ActualPrimitive.olean
          lake build WeilDefect.Arithmetic.ActualZetaIV106D6ActualPrimitive 2>&1 | tee iv106-d6/out/build.log
          test -s .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D6ActualPrimitive.olean
          test .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D6ActualPrimitive.olean -nt iv106-d6/out/fresh.stamp
          printf '%s\n' 'import WeilDefect.Arithmetic.ActualZetaIV106D6ActualPrimitive' '#print axioms WeilDefect.neutralIV106D6Endpoint_zero' '#print axioms WeilDefect.neutralIV106D6Endpoint_last' '#print axioms WeilDefect.neutralIV106D6Endpoint_width' '#print axioms WeilDefect.neutralIV106D6Actual_means' '#print axioms WeilDefect.neutralIV106D6Window_mass' '#print axioms WeilDefect.neutralIV106D6Actual_primitive' '#print axioms WeilDefect.neutralIV106D6Reciprocal_integrable' '#print axioms WeilDefect.neutralIV106D6Actual_reciprocal' > /tmp/iv106-d6-axioms.lean
          lake env lean /tmp/iv106-d6-axioms.lean 2>&1 | tee iv106-d6/out/axioms.log
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('iv106-d6/out/axioms.log').read_text()
          p=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          ms=list(re.finditer(p,s,re.S))
          assert len(ms)==8 and not re.sub(p,'',s,flags=re.S).strip()
          assert {m[1] for m in ms}==set(["neutralIV106D6Endpoint_zero","neutralIV106D6Endpoint_last","neutralIV106D6Endpoint_width","neutralIV106D6Actual_means","neutralIV106D6Window_mass","neutralIV106D6Actual_primitive","neutralIV106D6Reciprocal_integrable","neutralIV106D6Actual_reciprocal"])
          assert all({x.strip() for x in m[2].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for m in ms)
          print('IV106-D6 strict named axioms PASS 8/8')
          PY
          sha256sum WeilDefect/Arithmetic/ActualZetaIV106D6ActualPrimitive.lean .lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D6ActualPrimitive.olean > iv106-d6/out/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv106-d6-physical-action-evidence
          path: |
            research/iv106-d6/out/
            research/WeilDefect/Arithmetic/ActualZetaIV106D6ActualPrimitive.lean
            research/.lake/build/lib/lean/WeilDefect/Arithmetic/ActualZetaIV106D6ActualPrimitive.olean
          include-hidden-files: true
          if-no-files-found: error
