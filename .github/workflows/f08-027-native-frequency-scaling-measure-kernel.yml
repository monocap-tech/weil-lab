name: F08-027 actual original native L2 frequency scaling measure Lean gate
on:
  pull_request:
    paths:
      - 'verification/f08/f08_027/**'
      - '.github/workflows/f08-027-native-frequency-scaling-measure-kernel.yml'
permissions:
  contents: read
jobs:
  native-frequency-scaling:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout pinned IV023 original research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Pin original mathematical source and stage additive native L2 file
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          ! grep -Eq 'sorry|admit|unsafe' candidate/verification/f08/f08_027/F08NativeFrequencyScalingMeasure.lean
          mkdir -p research/WeilDefect/Generated/F08
          cp candidate/verification/f08/f08_027/F08NativeFrequencyScalingMeasure.lean research/WeilDefect/Generated/F08/NativeFrequencyScalingMeasure.lean
      - name: Install pinned Lean and Mathlib
        working-directory: research
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Build genuine native L2 frequency scaling and audit four named axioms
        working-directory: research
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build WeilDefect.Generated.F08.NativeFrequencyScalingMeasure 2>&1 | tee f08-027-build.log
          printf '%s\n' 'import WeilDefect.Generated.F08.NativeFrequencyScalingMeasure' '#print axioms WeilDefect.f08_027_scale_measurePreserving' '#print axioms WeilDefect.f08_027_scaledFrequencyMeasure_jacobian' '#print axioms WeilDefect.f08_027_nativeFrequencyPullback_norm' '#print axioms WeilDefect.f08_027_nativeFrequencyPullback_ae' > /tmp/f08-027-axioms.lean
          lake env lean /tmp/f08-027-axioms.lean 2>&1 | tee f08-027-axioms.log
          python3 - <<'PY'
          import pathlib,re
          names={'f08_027_scale_measurePreserving','f08_027_scaledFrequencyMeasure_jacobian','f08_027_nativeFrequencyPullback_norm','f08_027_nativeFrequencyPullback_ae'}
          found={}
          log=pathlib.Path('f08-027-axioms.log').read_text()
          pat=r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]"
          for m in re.finditer(pat,log,re.S):
              assert m[1] not in found,('duplicate name',m[1])
              found[m[1]]={x.strip() for x in m[2].split(',') if x.strip()}
          assert not re.sub(pat,'',log,flags=re.S).strip(),('unexpected compiler output',log)
          assert set(found)==names,(found,names)
          assert all(a <= {'propext','Classical.choice','Quot.sound'} for a in found.values()),found
          print('F08-027 original true native L2 frequency pullback: 4/4 standard-only axioms')
          PY
      - name: Preserve original staged source and full compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-027-native-frequency-scaling-compiler-evidence
          path: |
            research/f08-027-build.log
            research/f08-027-axioms.log
            research/WeilDefect/Generated/F08/NativeFrequencyScalingMeasure.lean
          if-no-files-found: ignore
