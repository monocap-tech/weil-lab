name: RC309 weighted endpoint Schur exact certificate
on:
  push:
    branches:
      - research/rpb108-rc309-endpoint-schur
    paths:
      - "scripts/validate_rpb108_rc309_endpoint_schur.py"
      - ".github/workflows/rc309-endpoint-build.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native exact dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Generate and reverse replay endpoint Schur certificate
        run: |
          python scripts/validate_rpb108_rc309_endpoint_schur.py --output certificates/rpb108_rc309_endpoint_schur.json
          python scripts/validate_rpb108_rc309_endpoint_schur.py --output certificates/rpb108_rc309_endpoint_schur.json --replay
      - name: Commit the verified exact certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rpb108_rc309_endpoint_schur.json
          if ! git diff --cached --quiet; then
            git commit -m "RC309: freeze endpoint Schur and bounded conditional native model"
            git pull --rebase origin research/rpb108-rc309-endpoint-schur
            git push origin HEAD:research/rpb108-rc309-endpoint-schur
          fi
