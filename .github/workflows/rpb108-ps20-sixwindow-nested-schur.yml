name: RPB108 PS20 six-window source-aware nested Schur

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps20_sixwindow_nested_schur.py"
      - "notes/RPB108_PS20_SIXWINDOW_NESTED_SCHUR_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps20-sixwindow-nested-schur.yml"
  workflow_dispatch:

jobs:
  ps20-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original signed six-window Schur and all 1092 prime geometries
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps20_sixwindow_nested_schur.py
          python3 scripts/validate_rpb108_ps20_sixwindow_nested_schur.py
      - name: Preserve source custody and keep residual Schur and RH open
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(value is False for value in p["closures"].values())
          PY
