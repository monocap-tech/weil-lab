name: NF618 W02 G3 historical source and evidence recovery
on:
  push:
    branches: [custody/nf618-w02-historical-recovery]
    paths: ['.github/workflows/nf618-w02-historical-recovery.yml']
permissions:
  contents: read
concurrency:
  group: nf618-w02-historical-recovery
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 5801507d416e4a699c002920b2441f5aa0c19aef
          path: research
          persist-credentials: false
      - name: Byte recovery and independent historical replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p custody
          d="custody/run_$GITHUB_RUN_ID-attempt_$GITHUB_RUN_ATTEMPT"
          python3 -m py_compile recover.py
          python3 recover.py research "$d"
      - name: Commit preserved results and verify remote archive bytes
        if: always()
        run: |
          set -euo pipefail
          branch=custody/nf618-w02-historical-recovery
          d="custody/run_$GITHUB_RUN_ID-attempt_$GITHUB_RUN_ATTEMPT"
          test -s "$d/recovery.json"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$d"
          git commit -m 'NF618 W02 G3 preserve original historical archive bytes and replay receipts [skip ci]'
          git push origin "HEAD:refs/heads/$branch"
          git fetch --no-tags origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python3 - "$d" <<'PY'
          import json,hashlib,subprocess,sys
          from pathlib import Path
          d=Path(sys.argv[1]); rows=json.loads((d/'recovery.json').read_text())['records']
          for r in rows:
              if r['status']!='BYTE_PASS':continue
              h=hashlib.sha256()
              for p in r['chunks']:
                  data=subprocess.check_output(['git','show',f"FETCH_HEAD:{d/p['file']}"])
                  assert len(data)==p['bytes'] and hashlib.sha256(data).hexdigest()==p['sha256']
                  h.update(data)
              assert h.hexdigest()==r['sha256']
          print('Remote byte readback PASS',sum(r['status']=='BYTE_PASS' for r in rows))
          PY
      - name: Require complete bounded recovery and report replay gaps
        run: |
          set -euo pipefail
          d="custody/run_$GITHUB_RUN_ID-attempt_$GITHUB_RUN_ATTEMPT"
          cat "$d/summary.json"
          jq -e '.archives_byte_pass == .archives_target and .batch_source_evidence_replay_pass == .batch_replay_target' "$d/summary.json"
