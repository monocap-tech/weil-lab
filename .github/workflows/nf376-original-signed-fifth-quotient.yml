name: Weil-Lab NF376 original fifth exterior signed lowband probe (NOT lowband norm acceptance)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify_nf376_original_signed_lowband_probe.py'
      - 'notes/provisional/NF376_ORIGINAL_SIGNED_FIFTH_EXTERIOR_LOWBAND_PREFLIGHT.md'
      - '.github/workflows/nf376-original-signed-fifth-quotient.yml'
permissions:
  contents: read
jobs:
  verify-original-fifth-exterior:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original Arb interface
        run: "pip install --only-binary=:all: python-flint==0.8.0"
      - name: Execute physical exterior witness and genuine signed multiplier knot test
        run: |
          python3 -m py_compile scripts/verify_nf376_original_signed_lowband_probe.py
          python3 -u scripts/verify_nf376_original_signed_lowband_probe.py \
            --rank notes/data/provisional/parents/pr350_original_BS_pruned_rank_bound.json \
            --source notes/data/provisional/nf372_pr355_fields.json \
            --nf369 notes/data/provisional/nf372_nf369_fields.json \
            --bits 4096 \
            --output artifacts/nf376_original_fifth_quotient_signed_lowband.json
      - name: Retain explicit method scope and no theorem promotion
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('artifacts/nf376_original_fifth_quotient_signed_lowband.json'))
          assert x['parent_16_original_physical_quotient_ball_overlap']
          assert len(x['actual_original_signed_point_samples'])==10
          assert x['diagnostic_is_new_selected_source'] is False
          assert x['original_lowband_integrated_signed_coupling_computed'] is False
          assert x['full_original_lowband_H_i_norm_computed'] is False
          assert x['W_ODD_NEG']==x['RH']=='OPEN'
          print('PASS one independent actual exterior quotient and ten original signed multiplier knots only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf376-original-fifth-quotient-signed-lowband-report
          path: artifacts/nf376_original_fifth_quotient_signed_lowband.json
          if-no-files-found: ignore
