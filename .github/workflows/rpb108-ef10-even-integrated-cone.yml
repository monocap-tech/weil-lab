name: RPB108 EF10 original even cap triangular-integral lower
on:
  pull_request:
    branches:
      - research/rpb108-even-form-ef09-cap-lower
      - research/rpb108-route-consolidation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-triangular-cap-lower:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile scripts/validate_rpb108_ef10_even_integrated_cone_lower.py
          python scripts/validate_rpb108_ef10_even_integrated_cone_lower.py
