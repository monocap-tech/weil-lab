name: IV154 pointwise and zero-safe integral attachment
on:
  push:
    branches: ['staging/iv147-am-kernel-pilot']
    paths: ['.github/workflows/iv147-am-pilot.yml']
permissions:
  contents: read
concurrency:
  group: iv147-am-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate literal bank and source preflight
        run: |
          set -euo pipefail
          mkdir -p iv154/out
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python research/iv146_am_exp_audit.py custody/iv146-am/am_cells.json iv154/out/shift-receipt.json | tee iv154/out/exact-audit.log
          python - <<'PY'
          import json,re
          from pathlib import Path
          a=Path('WeilDefect/Arithmetic')
          d=json.loads(Path('custody/iv146-am/am_cells.json').read_text())
          s=(a/'ActualZetaIV146AMCellData.lean').read_text()
          pairs=re.findall(r'def neutralIV149Chunk(\d{3}) : Array Nat := #\[([^\]]*)\]',s)
          assert [int(i) for i,_ in pairs]==list(range(128))
          chunks=[list(map(int,re.findall(r'\d+',x))) for _,x in pairs]
          h=s.split('def neutralIV146HChunks : Array (Array Nat) := #[',1)[1].split(']',1)[0]
          assert list(map(int,re.findall(r'neutralIV149Chunk(\d{3})',h)))==list(range(128))
          assert len(chunks)==128 and all(len(c)==128 for c in chunks)
          assert [x for c in chunks for x in c]==d['h']
          b=s.split('def neutralIV146Shifts : List (Int × Nat) := [',1)[1].split(']',1)[0]
          assert [list(map(int,x)) for x in re.findall(r'\((-?\d+),\s*(\d+)\)',b)]==d['shifts']
          for stem in ['ActualZetaIV146AMCellData','ActualZetaIV147AMPilot','ActualZetaIV147AMRealCaps','ActualZetaIV150AMConcreteCaps','ActualZetaIV151AMActualCaps','ActualZetaIV151AMScalingProbe','ActualZetaIV152AMPhysicalEnvelope','ActualZetaIV152AMIntegralReceiver','ActualZetaIV153AMPointwiseSum','ActualZetaIV153AMSignedIntegral','ActualZetaIV154AMSupport','ActualZetaIV154AMIntegrability']:
              t=(a/(stem+'.lean')).read_text()
              assert not re.search(r'\b(?:sorry|admit|sorryAx|native_decide|axiom)\b',t),stem
          print('Literal arrays and pilot source preflight PASS')
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Build literal data
        id: data
        run: |
          set -euo pipefail
          timeout 600 lake build WeilDefect.Arithmetic.ActualZetaIV146AMCellData 2>&1 | tee iv154/out/data.log
      - name: Build certified physical envelope
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaIV152AMPhysicalEnvelope
      - name: Pointwise aggregation
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV153AMPointwiseSum.lean 2>&1 | tee iv154/out/pointwise.log
      - name: Signed integral
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV153AMSignedIntegral.lean 2>&1 | tee iv154/out/signed.log
      - name: Physical support
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV154AMSupport.lean 2>&1 | tee iv154/out/support.log
      - name: Generic integrability and complex comparison
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV154AMIntegrability.lean 2>&1 | tee iv154/out/integrability.log
      - name: Strict named axiom receipt
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,json
          from pathlib import Path
          allowed={'propext','Classical.choice','Quot.sound'}
          failures=[]
          for name, stage, expected in [["pointwise","153",["Fold_sum","Row_sum","Cast_sum","Pair_sum","Pointwise"]],["signed","153",["Young","ZeroSafeYoung","Reverse_integral","Cross_symmetry","Signed_integral"]],["support","154",["Measurable_weight","Window_index","Window_pos","Zero_compatible"]],["integrability","154",["Density_integrable","Translated_integrable","Complex_cross"]]]:
              p=Path('iv154/out/'+name+'.log')
              s=p.read_text() if p.exists() else ''
              for suffix in expected:
                  n='WeilDefect.neutralIV'+stage+suffix
                  m=re.findall(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
                  no=re.findall(r"'"+re.escape(n)+r"' does not depend on any axioms",s)
                  ok=len(m)+len(no)==1 and (not m or set(x.strip() for x in m[0].split(',') if x.strip())<=allowed)
                  print(n,'PASS' if ok else 'FAIL')
                  if not ok: failures.append(n)
          Path('iv154/out/audit.json').write_text(json.dumps({'expected':17,'failures':failures}))
          assert not failures,failures
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv154-am-receipts
          path: iv154/out/
