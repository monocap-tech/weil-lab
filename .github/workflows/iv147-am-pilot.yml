name: IV159 physical and reflection repair with bounded certificate shards
on:
  push:
    branches: ['staging/iv147-am-kernel-pilot']
    paths: ['.github/workflows/iv147-am-pilot.yml']
permissions:
  contents: read
concurrency:
  group: iv147-am-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate literal bank and source preflight
        run: |
          set -euo pipefail
          mkdir -p iv159/out
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python research/iv146_am_exp_audit.py custody/iv146-am/am_cells.json iv159/out/shift-receipt.json | tee iv159/out/exact-audit.log
          python - <<'PY'
          import json,re
          from pathlib import Path
          a=Path('WeilDefect/Arithmetic')
          d=json.loads(Path('custody/iv146-am/am_cells.json').read_text())
          s=(a/'ActualZetaIV146AMCellData.lean').read_text()
          pairs=re.findall(r'def neutralIV149Chunk(\d{3}) : Array Nat := #\[([^\]]*)\]',s)
          assert [int(i) for i,_ in pairs]==list(range(128))
          chunks=[list(map(int,re.findall(r'\d+',x))) for _,x in pairs]
          h=s.split('def neutralIV146HChunks : Array (Array Nat) := #[',1)[1].split(']',1)[0]
          assert list(map(int,re.findall(r'neutralIV149Chunk(\d{3})',h)))==list(range(128))
          assert len(chunks)==128 and all(len(c)==128 for c in chunks)
          assert [x for c in chunks for x in c]==d['h']
          b=s.split('def neutralIV146Shifts : List (Int × Nat) := [',1)[1].split(']',1)[0]
          assert [list(map(int,x)) for x in re.findall(r'\((-?\d+),\s*(\d+)\)',b)]==d['shifts']
          for stem in ['ActualZetaIV146AMCellData','ActualZetaIV147AMPilot','ActualZetaIV147AMRealCaps','ActualZetaIV150AMConcreteCaps','ActualZetaIV151AMActualCaps','ActualZetaIV151AMScalingProbe','ActualZetaIV152AMPhysicalEnvelope','ActualZetaIV152AMIntegralReceiver','ActualZetaIV153AMPointwiseSum','ActualZetaIV153AMSignedIntegral','ActualZetaIV154AMSupport','ActualZetaIV154AMIntegrability','ActualZetaIV155AMSchurReceiver','ActualZetaIV156AMGeneric','ActualZetaIV156AMPhysicalForm','ActualZetaIV157AMReflection','ActualZetaIV157AMSymmetryPilot','ActualZetaIV158AMSymmetry','ActualZetaIV158AMRowProbe','ActualZetaIV157AMOriginalDictionary','ActualZetaIV159AMRowReceiver']:
              t=(a/(stem+'.lean')).read_text()
              assert not re.search(r'\b(?:sorry|admit|sorryAx|native_decide|axiom)\b',t),stem
          print('Literal arrays and pilot source preflight PASS')
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Build literal data
        id: data
        run: |
          set -euo pipefail
          timeout 600 lake build WeilDefect.Arithmetic.ActualZetaIV146AMCellData 2>&1 | tee iv159/out/data.log
      - name: Build certified analytic dependencies
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaIV155AMSchurReceiver WeilDefect.Arithmetic.ActualZetaIV153AMPointwiseSum WeilDefect.Arithmetic.ActualZetaIV154AMSupport
      - name: Generic complex and ratio receivers
        run: |
          set -euo pipefail
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV156AMGeneric.lean 2>&1 | tee iv159/out/generic.log
      - name: Original finite Schwartz form
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaIV156AMGeneric
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV156AMPhysicalForm.lean 2>&1 | tee iv159/out/physical.log
      - name: Reflection reduction
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV157AMReflection.lean 2>&1 | tee iv159/out/reflection.log
      - name: Literal symmetry pilot
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV157AMSymmetryPilot.lean 2>&1 | tee iv159/out/sympilot.log
      - name: Zero-extended symmetry receiver
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaIV157AMSymmetryPilot
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV158AMSymmetry.lean 2>&1 | tee iv159/out/symmetry.log
      - name: Bounded row process scaling
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV158AMRowProbe.lean 2>&1 | tee iv159/out/probe.log
      - name: Half-row receiver
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaIV158AMSymmetry
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV159AMRowReceiver.lean 2>&1 | tee iv159/out/receiver.log
      - name: Complete half-window literal symmetry shards
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python research/iv159_am_shards.py --kind sym --stop 128 --out iv159/out/sym-shards
      - name: First 256 exact integer rows in bounded processes
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaIV159AMRowReceiver
          python research/iv159_am_shards.py --kind row --stop 32 --out iv159/out/row-shards
      - name: Strict named axiom receipt
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,json
          from pathlib import Path
          allowed={'propext','Classical.choice','Quot.sound'}
          failures=[]
          for name, stage, expected in [('generic','156',['Ratio_cap','Real_form','Complex_form']),('physical','156',['Nodup','Prime_pos','Physical_row','Endpoint','Schwartz_cross','Physical_form']),('reflection','157',['Mirror_max','Mirror_pair','Mirror_list','Mirror_row','Half_bank']),('sympilot','157',['SymPilot']),('symmetry','158',['Outside','Extend','Sym_at','Symmetry']),('probe','158',['ProbeA','ProbeB']),('receiver','159',['Row_at','HalfRows'])]:
              p=Path('iv159/out/'+name+'.log')
              s=p.read_text() if p.exists() else ''
              for suffix in expected:
                  n='WeilDefect.neutralIV'+stage+suffix
                  m=re.findall(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
                  no=re.findall(r"'"+re.escape(n)+r"' does not depend on any axioms",s)
                  ok=len(m)+len(no)==1 and (not m or set(x.strip() for x in m[0].split(',') if x.strip())<=allowed)
                  print(n,'PASS' if ok else 'FAIL')
                  if not ok: failures.append(n)
          Path('iv159/out/audit.json').write_text(json.dumps({'expected':23,'failures':failures}))
          assert not failures,failures
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv159-am-receipts
          path: iv159/out/
