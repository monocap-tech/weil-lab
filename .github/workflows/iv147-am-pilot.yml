name: IV147 AM kernel pilot
on:
  push:
    branches: ['staging/iv147-am-kernel-pilot']
    paths: ['.github/workflows/iv147-am-pilot.yml']
permissions:
  contents: read
concurrency:
  group: iv147-am-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate literal bank and source preflight
        run: |
          set -euo pipefail
          mkdir -p iv147/out
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python research/iv146_am_exp_audit.py custody/iv146-am/am_cells.json iv147/out/shift-receipt.json | tee iv147/out/exact-audit.log
          python - <<'PY'
          import json,re
          from pathlib import Path
          a=Path('WeilDefect/Arithmetic')
          d=json.loads(Path('custody/iv146-am/am_cells.json').read_text())
          s=(a/'ActualZetaIV146AMCellData.lean').read_text()
          h=s.split('def neutralIV146H : Array Nat := #[',1)[1].split(']',1)[0]
          assert list(map(int,re.findall(r'\d+',h)))==d['h']
          b=s.split('def neutralIV146Shifts : List (Int × Nat) := [',1)[1].split(']',1)[0]
          assert [list(map(int,x)) for x in re.findall(r'\((-?\d+),\s*(\d+)\)',b)]==d['shifts']
          for stem in ['ActualZetaIV146AMCellData','ActualZetaIV147AMPilot','ActualZetaIV147AMRealCaps']:
              t=(a/(stem+'.lean')).read_text()
              assert not re.search(r'\b(?:sorry|admit|sorryAx|native_decide|axiom)\b',t),stem
          print('Literal arrays and pilot source preflight PASS')
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Build literal data
        run: |
          set -euo pipefail
          timeout 600 lake build WeilDefect.Arithmetic.ActualZetaIV146AMCellData 2>&1 | tee iv147/out/data.log
      - name: Single block and worst row kernel pilot
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout 900 lake env lean WeilDefect/Arithmetic/ActualZetaIV147AMPilot.lean 2>&1 | tee iv147/out/pilot.log
      - name: Generic real caps
        run: |
          set -euo pipefail
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV147AMRealCaps.lean 2>&1 | tee iv147/out/real.log
      - name: Strict named axiom receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          allowed={'propext','Classical.choice','Quot.sound'}
          for name, expected in [('pilot',['Data_size','Shifts_size','Pilot_row','Pilot_block']),('real',['Log_endpoints','Signed_floor','Weight_cap'])]:
              s=Path('iv147/out/'+name+'.log').read_text()
              for suffix in expected:
                  n='WeilDefect.neutralIV147'+suffix
                  m=re.findall(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
                  no=re.findall(r"'"+re.escape(n)+r"' does not depend on any axioms",s)
                  assert len(m)+len(no)==1,n
                  if m: assert set(x.strip() for x in m[0].split(',') if x.strip())<=allowed,(n,m)
                  print(n,'PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv147-am-pilot-receipts
          path: iv147/out/
