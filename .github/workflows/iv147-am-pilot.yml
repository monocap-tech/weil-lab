name: IV151 literal von Mangoldt and eight-row scaling probe
on:
  push:
    branches: ['staging/iv147-am-kernel-pilot']
    paths: ['.github/workflows/iv147-am-pilot.yml']
permissions:
  contents: read
concurrency:
  group: iv147-am-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate literal bank and source preflight
        run: |
          set -euo pipefail
          mkdir -p iv151/out
          grep -Fx 'leanprover/lean4:v4.34.0' lean-toolchain
          python research/iv146_am_exp_audit.py custody/iv146-am/am_cells.json iv151/out/shift-receipt.json | tee iv151/out/exact-audit.log
          python - <<'PY'
          import json,re
          from pathlib import Path
          a=Path('WeilDefect/Arithmetic')
          d=json.loads(Path('custody/iv146-am/am_cells.json').read_text())
          s=(a/'ActualZetaIV146AMCellData.lean').read_text()
          pairs=re.findall(r'def neutralIV149Chunk(\d{3}) : Array Nat := #\[([^\]]*)\]',s)
          assert [int(i) for i,_ in pairs]==list(range(128))
          chunks=[list(map(int,re.findall(r'\d+',x))) for _,x in pairs]
          h=s.split('def neutralIV146HChunks : Array (Array Nat) := #[',1)[1].split(']',1)[0]
          assert list(map(int,re.findall(r'neutralIV149Chunk(\d{3})',h)))==list(range(128))
          assert len(chunks)==128 and all(len(c)==128 for c in chunks)
          assert [x for c in chunks for x in c]==d['h']
          b=s.split('def neutralIV146Shifts : List (Int × Nat) := [',1)[1].split(']',1)[0]
          assert [list(map(int,x)) for x in re.findall(r'\((-?\d+),\s*(\d+)\)',b)]==d['shifts']
          for stem in ['ActualZetaIV146AMCellData','ActualZetaIV147AMPilot','ActualZetaIV147AMRealCaps','ActualZetaIV150AMConcreteCaps','ActualZetaIV151AMActualCaps','ActualZetaIV151AMScalingProbe']:
              t=(a/(stem+'.lean')).read_text()
              assert not re.search(r'\b(?:sorry|admit|sorryAx|native_decide|axiom)\b',t),stem
          print('Literal arrays and pilot source preflight PASS')
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake exe cache get
      - name: Build literal data
        id: data
        run: |
          set -euo pipefail
          timeout 600 lake build WeilDefect.Arithmetic.ActualZetaIV146AMCellData 2>&1 | tee iv151/out/data.log
      - name: Eight-row scaling probe
        id: probe
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV151AMScalingProbe.lean 2>&1 | tee iv151/out/probe.log
      - name: Actual von Mangoldt cap build
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaIV150AMConcreteCaps
          timeout 300 lake env lean WeilDefect/Arithmetic/ActualZetaIV151AMActualCaps.lean 2>&1 | tee iv151/out/actual.log
      - name: Strict named axiom receipt
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          allowed={'propext','Classical.choice','Quot.sound'}
          for name, expected in [('actual',["Weight_nonneg","PrimePower","Actual_2","Actual_3","Actual_4","Actual_5","Actual_7","Actual_8","Actual_9","Actual_11","Actual_13","Actual_16","Actual_17","Actual_19","Actual_23","Actual_25","Actual_27","Actual_29","Actual_31","Actual_32","Actual_37","Actual_41","Actual_43","Actual_47","Actual_49","Actual_53"]),('probe',['EightRows'])]:
              s=Path('iv151/out/'+name+'.log').read_text()
              for suffix in expected:
                  n='WeilDefect.neutralIV151'+suffix
                  m=re.findall(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
                  no=re.findall(r"'"+re.escape(n)+r"' does not depend on any axioms",s)
                  assert len(m)+len(no)==1,n
                  if m: assert set(x.strip() for x in m[0].split(',') if x.strip())<=allowed,(n,m)
                  print(n,'PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv151-am-receipts
          path: iv151/out/
