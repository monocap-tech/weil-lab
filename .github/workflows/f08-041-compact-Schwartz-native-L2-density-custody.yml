name: F08-041 independently verify original compact-Schwartz native L2 density archive/source/1 axiom
on:
  pull_request:
    paths:
      - 'verification/f08/f08_041/**'
      - '.github/workflows/f08-041-compact-Schwartz-native-L2-density-custody.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-original-source-custody:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      F08_RUN: '45550138898'
      F08_ARTIFACT: '14994340568'
      F08_ARTIFACT_SHA: 'dcf6260dbf269988d44d3e10eb33ba72f4049e2f942ec059cd01c175efbcc79c'
      F08_HEAD: '28d3baa4fc3ba676008430ad11fdf8a08280bebe'
    steps:
      - name: Checkout independent F08-041 auditor
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout exact frozen original research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Independently pin source blobs, Lean version and adversarial verifier controls
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C candidate hash-object verification/f08/f08_037/F08CompactSchwartzNativeL2Dense.lean)" = f6d8bc01053ff811a2a9ebc6b83837f714e8d90f
          python3 -m py_compile candidate/verification/f08/f08_041/f08_041_independent_compact_schwartz_density_audit.py
          python3 candidate/verification/f08/f08_041/f08_041_independent_compact_schwartz_density_audit.py --selftest
      - name: Authenticate real successful producer run and immutable artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p f08-041-receipt
          python3 - <<'PY'
          import json,os,urllib.request
          root=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers=headers),timeout=30) as response:
                  return json.load(response)
          run_id=int(os.environ['F08_RUN'])
          artifact_id=int(os.environ['F08_ARTIFACT'])
          run=get('/actions/runs/'+str(run_id))
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==os.environ['F08_HEAD']
          assert run['head_repository']['full_name']=='monocap-tech/weil-lab'
          assert run['name']=='F08-037 original native complex L2 compact Schwartz density Lean kernel'
          jobs=get('/actions/runs/'+str(run_id)+'/jobs')
          assert any(j['conclusion']=='success' and
              any(s['name']=='Genuine native compact Schwartz dense image build and one strict axiom query'
                  and s['conclusion']=='success' for s in j['steps'])
              for j in jobs['jobs']), 'direct original Lean kernel step absent or failed'
          artifact=get('/actions/artifacts/'+str(artifact_id))
          assert artifact['workflow_run']['id']==run_id
          assert artifact['workflow_run']['head_sha']==os.environ['F08_HEAD']
          assert artifact['name']=='f08-037-compact-Schwartz-native-L2-density-compiler-evidence'
          assert artifact['digest']=='sha256:'+os.environ['F08_ARTIFACT_SHA']
          assert artifact['size_in_bytes']>0 and not artifact['expired']
          info={'producer_commit':os.environ['F08_HEAD'], 'producer_run':run_id,
                'artifact_id':artifact_id, 'sha256':os.environ['F08_ARTIFACT_SHA'],
                'producer_success':True, 'direct_compiler_and_axioms_success':True}
          with open('f08-041-receipt/producer-metadata.json','w') as f:
              json.dump(info,f,sort_keys=True,indent=2)
          print('F08-041 authenticated actual original direct F08-037 producer and immutable artifact')
          PY
      - name: Download and independently audit actual entire original compiler archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$F08_ARTIFACT/zip" -o f08-041-receipt/original-producer.zip
          echo "$F08_ARTIFACT_SHA  f08-041-receipt/original-producer.zip" | sha256sum -c -
          python3 candidate/verification/f08/f08_041/f08_041_independent_compact_schwartz_density_audit.py --archive f08-041-receipt/original-producer.zip --producer-metadata f08-041-receipt/producer-metadata.json --out f08-041-receipt/independent-compact-Schwartz-density.json
      - name: Archive independent source-only custody receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-041-independent-original-compact-Schwartz-L2-density-custody
          path: |
            f08-041-receipt/producer-metadata.json
            f08-041-receipt/independent-compact-Schwartz-density.json
          if-no-files-found: ignore
