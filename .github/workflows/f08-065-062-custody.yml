name: F08-065 independent F08-062 custody (2 named axioms)
on:
  pull_request:
    paths:
      - 'verification/f08/f08_065/**'
      - '.github/workflows/f08-065-062-custody.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-original-source-custody:
    if: github.repository == 'monocap-tech/weil-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      F08_RUN: '45576769401'
      F08_ARTIFACT: '15003819738'
      F08_ARTIFACT_SHA: '063b811236b18036eb441ab1a08e46cf58ec36f6b9554bf30bfa4265b9a2420e'
      F08_HEAD: '2510ccda070e793f02c98b5c6b3baa4a6a9d19af'
    steps:
      - name: Checkout independent F08-065 auditor
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout exact verified producer
        uses: actions/checkout@v4
        with:
          ref: 2510ccda070e793f02c98b5c6b3baa4a6a9d19af
          path: producer
      - name: Checkout exact frozen original research
        uses: actions/checkout@v4
        with:
          ref: 614ba879f7389fdb620c474adaee273b00eac71c
          path: research
      - name: Independently pin source blobs, Lean version and adversarial verifier controls
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 614ba879f7389fdb620c474adaee273b00eac71c
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(cat research/lean-toolchain)" = leanprover/lean4:v4.34.0
          test "$(git -C producer rev-parse HEAD)" = 2510ccda070e793f02c98b5c6b3baa4a6a9d19af
          test "$(git -C producer hash-object verification/f08/f08_027/F08NativeFrequencyScalingMeasure.lean)" = eecfe2a849fa79aa13810ede85e9ba625eba7777
          test "$(git -C producer hash-object verification/f08/f08_029/F08NativeL2PushforwardNorm.lean)" = 4da65f9b9df7cae6ea30a4a7f25d3e6c1606c294
          test "$(git -C producer hash-object verification/f08/f08_030/F08NativeFrequencyDilation.lean)" = 5c260b69f464f5793e095f9b5448c90f7984617f
          test "$(git -C producer hash-object verification/f08/f08_033/F08NativeFrequencyDilationIsometry.lean)" = 8b4055c065ab7987a01bf55143908d8cd77f0f23
          test "$(git -C producer hash-object verification/f08/f08_035/F08NativeDilationLinearIsometry.lean)" = 7038c5d23cecdef6cc3f6bca1d12548246e65bd7
          test "$(git -C producer hash-object verification/f08/f08_060/F08OriginalPhysicalDilationScaling.lean)" = fc488dea4d0fde809ece29e0fc863c6a35b2455b
          test "$(git -C producer hash-object verification/f08/f08_062/F08OriginalNativePhysicalFourierIdentity.lean)" = 11c535117029f3ecb9d72af56d1671e94e9ba130
          test "$(git -C research hash-object WeilDefect/Morphology/NeutralCanonicalFormDomain.lean)" = 2bf19165fce3a0cfa6e4d782d68caab268aaf82b
          test "$(git -C research hash-object WeilDefect/Arithmetic/ActualZetaCorrelationFourierAgreement.lean)" = 60453bd214c43feedb0fa64d74a15bd452e48998
          python3 -m py_compile candidate/verification/f08/f08_065/audit_062.py
          python3 candidate/verification/f08/f08_065/audit_062.py --selftest
      - name: Authenticate real successful producer run and immutable artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p f08-065-062-receipt
          python3 - <<'PY'
          import json,os,urllib.request
          root=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers=headers),timeout=30) as response:
                  return json.load(response)
          run_id=int(os.environ['F08_RUN'])
          artifact_id=int(os.environ['F08_ARTIFACT'])
          run=get('/actions/runs/'+str(run_id))
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==os.environ['F08_HEAD']
          assert run['head_repository']['full_name']=='monocap-tech/weil-lab'
          assert run['name']=="F08-062 original native physical Fourier identity kernel"
          jobs=get('/actions/runs/'+str(run_id)+'/jobs')
          assert any(j['conclusion']=='success' and
              any(s['name']=="Compile native normalized physical Fourier identity with strict named axioms"
                  and s['conclusion']=='success' for s in j['steps'])
              for j in jobs['jobs']), 'direct original Lean kernel step absent or failed'
          artifact=get('/actions/artifacts/'+str(artifact_id))
          assert artifact['workflow_run']['id']==run_id
          assert artifact['workflow_run']['head_sha']==os.environ['F08_HEAD']
          assert artifact['name']=="f08-062-original-native-physical-Fourier-identity-compiler-evidence"
          assert artifact['digest']=='sha256:'+os.environ['F08_ARTIFACT_SHA']
          assert artifact['size_in_bytes']>0 and not artifact['expired']
          info={'producer_commit':os.environ['F08_HEAD'], 'producer_run':run_id,
                'artifact_id':artifact_id, 'sha256':os.environ['F08_ARTIFACT_SHA'],
                'producer_success':True, 'direct_compiler_and_axioms_success':True}
          with open('f08-065-062-receipt/producer-metadata.json','w') as f:
              json.dump(info,f,sort_keys=True,indent=2)
          print('F08-065 authenticated actual original direct F08-062 producer and immutable artifact')
          PY
      - name: Download and independently audit actual entire original compiler archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$F08_ARTIFACT/zip" -o f08-065-062-receipt/original-producer.zip
          echo "$F08_ARTIFACT_SHA  f08-065-062-receipt/original-producer.zip" | sha256sum -c -
          python3 candidate/verification/f08/f08_065/audit_062.py --archive f08-065-062-receipt/original-producer.zip --producer-metadata f08-065-062-receipt/producer-metadata.json --out f08-065-062-receipt/independent-062-producer.json
      - name: Archive independent source-only custody receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-065-062-independent-original-062-producer-custody
          path: |
            f08-065-062-receipt/producer-metadata.json
            f08-065-062-receipt/independent-062-producer.json
          if-no-files-found: ignore
