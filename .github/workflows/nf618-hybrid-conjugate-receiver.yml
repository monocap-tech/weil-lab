name: NF618 hybrid conjugate receiver
on:
  push:
    branches:
      - research/nf618-hybrid-conjugate-receiver
    paths:
      - ".github/workflows/nf618-hybrid-conjugate-receiver.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Bind accepted parent sources and stage semantic cache module
        run: |
          set -euo pipefail
          test "$(git hash-object WeilDefect/Arithmetic/ActualZetaOriginalPhysicalMomentTableSound.lean)" = 876d56a4657e7853107411337eb7da9a27206fd2
          test "$(git hash-object WeilDefect/Arithmetic/ActualZetaOriginalPhysicalResidualReceipts.lean)" = 024546bd0bfb7ea0b034b5e0c373c85cd3f1c103
          test "$(git hash-object WeilDefect/Arithmetic/ActualZetaOriginalPhysicalMomentEnclosure.lean)" = 9a39d48ed5bda97ce8cb133dcc6546c84c032454
          test "$(git hash-object WeilDefect/Arithmetic/ActualZetaOriginalPhysicalShapedBank.lean)" = ca7406a4190ee15fcd6786e126fc490ef71ede79
          cat > WeilDefect/Arithmetic/ActualZetaOriginalPhysicalSemanticEndpointCache.lean <<'EOF'
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalMomentTableSound
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalShapedBank
          
          namespace WeilDefect
          noncomputable section
          
          /-! Semantic cache contract. Unlike NF648, no equality to a particular
          exponential evaluator is required. The actual frequency and two actual
          exponential endpoints must be enclosed, and every original moment row
          must pass the unchanged rational residual checker. -/
          
          def NF617MomentCache.SemanticSound (c : NF617MomentCache)
              (k : NF616Frequency) : Prop :=
            c.z.Contains k.value ∧
            c.pos.Contains (Complex.exp (k.value * ((11/10:ℝ):ℂ))) ∧
            c.neg.Contains (Complex.exp (k.value * ((-(11/10:ℝ)):ℂ)))
          
          theorem neutralNF618SemanticCache_boundary
              (c : NF617MomentCache) (k : NF616Frequency)
              (hs : c.SemanticSound k) (Q n : ℕ) (hQ : 0 < Q) :
              (c.boundary Q n).Contains
                (neutralNF614Boundary (-(11/10:ℝ)) (11/10:ℝ) k.value n) := by
            have hb := NF591Rect.contains_mulQ
              (NF591Rect.contains_realQ ((11/10:ℚ)^n) Q hQ) hs.2.1 Q hQ
            have ha := NF591Rect.contains_mulQ
              (NF591Rect.contains_realQ ((-11/10:ℚ)^n) Q hQ) hs.2.2 Q hQ
            unfold NF617MomentCache.boundary neutralNF614Boundary
            convert NF591Rect.contains_add hb (NF591Rect.contains_neg ha) using 1 <;>
              push_cast <;> ring
          
          theorem neutralNF618MomentRows_of_semantic_cache
              (c : NF617MomentCache) (k : NF616Frequency)
              (hs : c.SemanticSound k) (hd : 0 < k.lower)
              (Q : ℕ) (hQ : 0 < Q) (rows : Array NF617MomentRow)
              (hc : ∀ n < rows.size,
                neutralNF617MomentRowCheck c k.lower Q rows n = true)
              (n : ℕ) (hn : n < rows.size) :
              ‖neutralNF606ExpMoment (-(11/10:ℝ)) (11/10:ℝ) k.value n -
                (neutralNF617MomentRead rows n).value‖ ≤
                (neutralNF617MomentRead rows n).rad := by
            have hd' : (0:ℝ) < (k.lower:ℝ) := by exact_mod_cast hd
            have hz := k.lower_sound
            have hb (m : ℕ) := neutralNF618SemanticCache_boundary c k hs Q m hQ
            induction n with
            | zero =>
              let q := neutralNF617MomentRead rows 0
              have h0 := hc 0 hn
              simp only [neutralNF617MomentRowCheck,Bool.and_eq_true] at h0
              have hcheck := h0.2
              change neutralNF615RectBelow
                (neutralNF615BaseResidualRect (c.boundary Q 0) c.z (q.rect Q) Q)
                (k.lower*q.rad) = true at hcheck
              have hres := NF591Rect.contains_add (hb 0)
                (NF591Rect.contains_neg (NF591Rect.contains_mulQ hs.1 (q.rect_sound Q hQ) Q hQ))
              have hr := (show
                (neutralNF615BaseResidualRect (c.boundary Q 0) c.z (q.rect Q) Q).Contains
                  (neutralNF614Boundary (-(11/10:ℝ)) (11/10:ℝ) k.value 0 - k.value*q.value) by
                simpa only [neutralNF615BaseResidualRect,sub_eq_add_neg] using hres)
              have hbound := neutralNF615RectBelow_sound _ _ (k.lower*q.rad) hr hcheck
              apply neutralNF614Moment_zero_enclosure _ _ _ q.value (k.lower:ℝ) (q.rad:ℝ) hd' hz
              simpa only [Rat.cast_mul] using hbound
            | succ n ih =>
              let q := neutralNF617MomentRead rows (n+1)
              let prev := neutralNF617MomentRead rows n
              have h0 := hc (n+1) hn
              simp only [neutralNF617MomentRowCheck,Bool.and_eq_true] at h0
              have hcheck := h0.2
              let S : ℚ := k.lower*q.rad-(n+1:ℚ)*prev.rad
              change neutralNF615RectBelow
                (neutralNF615ResidualRect (c.boundary Q (n+1)) c.z (prev.rect Q) (q.rect Q) Q n) S = true at hcheck
              have hres := neutralNF615ResidualRect_sound _ _ _ _ _ _ _ _
                Q n hQ (hb (n+1)) hs.1 (prev.rect_sound Q hQ) (q.rect_sound Q hQ)
              have hbound := neutralNF615RectBelow_sound _ _ S hres hcheck
              exact neutralNF614Moment_succ_enclosure _ _ _ prev.value q.value n
                (k.lower:ℝ) (prev.rad:ℝ) (q.rad:ℝ) (S:ℝ) hd' hz
                (ih (by omega)) hbound (by dsimp [S]; push_cast; linarith)
          
          theorem neutralNF690TableSound_of_semantic_cache
              (c : NF617MomentCache) (t : NF624KeyTable)
              (hs : c.SemanticSound t.key) (hd : 0 < t.key.lower)
              (Q : ℕ) (hQ : 0 < Q)
              (hc : ∀ n < t.rows.size,
                neutralNF617MomentRowCheck c t.key.lower Q t.rows n = true) :
              neutralNF690TableSound t := by
            intro n hn
            exact neutralNF618MomentRows_of_semantic_cache c t.key hs hd Q hQ t.rows hc n hn
          
          end
          end WeilDefect
          EOF
          echo 'c28806932277661273bc6f48a34a4119fae242a9dbd88e296c7dfd83477e3d3f  WeilDefect/Arithmetic/ActualZetaOriginalPhysicalSemanticEndpointCache.lean' | sha256sum -c -
          sha256sum WeilDefect/Arithmetic/ActualZetaOriginalPhysicalHybridEndpoint.lean | tee nf618-hybrid-source.sha256
      - name: Install pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          # Pin installer asset independently of the repository's Lean toolchain.
          archive="$RUNNER_TEMP/nf703-elan.tar.gz"
          digest=0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
          fetch_verified() {
            rm -f "$archive"
            curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 180 "$@" -o "$archive" &&
              printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          }
          if ! fetch_verified https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz; then
            fetch_verified -H 'Accept: application/octet-stream' "https://api.github.com/repos/leanprover/elan/releases/assets/763468108?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          mkdir -p "$RUNNER_TEMP/nf703-elan"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nf703-elan"
          "$RUNNER_TEMP/nf703-elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan --version
          cat lean-toolchain
          retry() {
            local n
            for n in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$n" -lt 3 ]; then sleep "$((15*n))"; fi
            done
            return 1
          }
          retry elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          retry lake update
          retry lake exe cache get
      - name: Compile repaired generic conjugate receiver
        run: |
          set -euo pipefail
          lake build WeilDefect.Arithmetic.ActualZetaOriginalPhysicalHybridEndpoint 2>&1 | tee nf618-hybrid-build.log
      - name: Strict standard axiom audit
        run: |
          set -euo pipefail
          cat > nf618HybridAudit.lean <<'EOF'
          import WeilDefect.Arithmetic.ActualZetaOriginalPhysicalHybridEndpoint
          #print axioms WeilDefect.nf618HybridConj_sound
          #print axioms WeilDefect.nf618HybridPhase_neg
          #print axioms WeilDefect.nf618HybridEndpoint_sound
          #print axioms WeilDefect.nf618HybridCache_sound
          #print axioms WeilDefect.nf618HybridTable_sound
          EOF
          lake env lean nf618HybridAudit.lean 2>&1 | tee nf618-hybrid-axioms.log
          python - <<'PY'
          import json, hashlib, re
          from pathlib import Path
          expected=set(["nf618HybridConj_sound","nf618HybridPhase_neg","nf618HybridEndpoint_sound","nf618HybridCache_sound","nf618HybridTable_sound"])
          found={}
          log=Path('nf618-hybrid-axioms.log').read_text()
          for n,x in re.findall(r"'WeilDefect\.(\w+)' depends on axioms: \[([^\]]*)\]",log):
              if n in expected:
                  assert n not in found
                  found[n]=[v.strip() for v in x.split(',') if v.strip()]
          for n in re.findall(r"'WeilDefect\.(\w+)' does not depend on any axioms",log):
              if n in expected:
                  assert n not in found
                  found[n]=[]
          assert set(found)==expected and all(set(v)<={'propext','Classical.choice','Quot.sound'} for v in found.values())
          p=Path('WeilDefect/Arithmetic/ActualZetaOriginalPhysicalHybridEndpoint.lean')
          Path('nf618-hybrid-audit.json').write_text(json.dumps({'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'theorems':found,'scope':'Generic conditional semantic receiver; no concrete tables certified'},indent=2)+'\n')
          print('NF618 hybrid receiver LEAN PASS',len(found))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf618-hybrid-conjugate-receiver-evidence
          path: |
            WeilDefect/Arithmetic/ActualZetaOriginalPhysicalHybridEndpoint.lean
            WeilDefect/Arithmetic/ActualZetaOriginalPhysicalSemanticEndpointCache.lean
            nf618-hybrid-*.log
            nf618-hybrid-*.json
            nf618-hybrid-source.sha256
          if-no-files-found: warn
