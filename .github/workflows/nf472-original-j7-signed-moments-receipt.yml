name: NF472 J7 signed-moment exact rational custody witness
on:
  pull_request:
  workflow_dispatch:
jobs:
  exact-original-signed-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u -X int_max_str_digits=0 scripts/local_replay/verify_nf472_original_J7_signed_moments_exact.py
