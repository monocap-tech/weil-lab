name: RPB108 PS27 original positive-even-pole Woodbury source carrier

on:
  pull_request:
    paths:
      - "scripts/validate_rpb108_ps27_pole_preserving_woodbury.py"
      - "notes/RPB108_PS27_POLE_PRESERVING_WOODBURY_20261017.md"
      - "research/parallel_investigations/w_physical_shift.json"
      - ".github/workflows/rpb108-ps27-pole-preserving-woodbury.yml"
  workflow_dispatch:

jobs:
  ps27-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original source pole-preserving Schur and exact Fraction Woodbury replay
        run: |
          python3 -m py_compile scripts/validate_rpb108_ps27_pole_preserving_woodbury.py
          python3 scripts/validate_rpb108_ps27_pole_preserving_woodbury.py
      - name: Keep original signed parity gates and RH open
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("research/obligations.json"))
          p=json.load(open("research/parallel_investigations/w_physical_shift.json"))
          assert m["active_obligation"]=="W-ODD-NEG"
          assert m["objective"]["status"]=="open"
          assert p["id"]=="W-PHYSICAL-SHIFT"
          assert p["active_frontier_unchanged"]=="W-ODD-NEG"
          assert p["status"]=="open"
          assert all(v is False for v in p["closures"].values())
          PY
