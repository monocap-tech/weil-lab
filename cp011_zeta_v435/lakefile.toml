name = "cp011_zeta_v435"
version = "0.0.1"

# Isolated original upstream Zeta toolchain; Weil-Lab IV### stays v4.34.
[[require]]
name = "Zeta"
git = "https://github.com/smmercuri/zeta"
rev = "v1-1e6"

[[lean_lib]]
name = "CP011CanonicalRoster"

# CP012 additionally imports the CP011 source candidate and exposes the
# conditional exact source-index-to-kernel slot attachment interface.
[[lean_lib]]
name = "CP012RowReceipt"

# CP013 separate ORIGINAL RS-only source-source certificate reassembly:
# the missing first 52 Euler rows are not mixed into the RS root count.
[[lean_lib]]
name = "CP013RSOnly"

[[lean_lib]]
name = "CP013Seam"

# CP014: original Euler 52-root one-sided count; generic finite exact
# partition; conditional original zero-count to-source split interface.
[[lean_lib]]
name = "CP014EulerCutLower"

[[lean_lib]]
name = "CP014FiniteCut"

[[lean_lib]]
name = "CP014ZetaCut"

# Optional local root-rank route: genuine Hardy Z StrictMonoOn conditional.
[[lean_lib]]
name = "CP014HardyRank"
